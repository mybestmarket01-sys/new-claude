<style id="app-css">
*,*::before,*::after{box-sizing:border-box}
:root{
  --ground:#e9edeb; --surface:#ffffff; --surface-2:#f2f6f4; --line:#d2dbd7; --line-2:#e2e9e6;
  --ink:#111c1a; --ink-2:#3f524e; --ink-3:#6c7f7a;
  --brand:#304f4f; --brand-2:#6b8e80; --brand-3:#a9c5bb;
  --good:#1c7350; --warn:#8d530d; --bad:#96291f;
  --good-bg:#e2f0ea; --warn-bg:#f5eadb; --bad-bg:#f6e3e1;
  --shadow:0 1px 2px rgba(17,28,26,.06),0 8px 24px -16px rgba(17,28,26,.28);
  --font-ui:'IBM Plex Sans Arabic',system-ui,-apple-system,Segoe UI,sans-serif;
  --font-dis:'Bricolage Grotesque',Georgia,serif;
  --font-num:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --r:10px;
}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0e1615; --surface:#161f1d; --surface-2:#1c2724; --line:#2b3a36; --line-2:#232f2c;
    --ink:#e7ede9; --ink-2:#a7b9b3; --ink-3:#7b8f89;
    --brand:#7fb3a4; --brand-2:#5b8a7c; --brand-3:#33514a;
    --good:#59bd91; --warn:#d99a45; --bad:#e5827a;
    --good-bg:#15302a; --warn-bg:#332614; --bad-bg:#341f1d;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -16px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --ground:#0e1615; --surface:#161f1d; --surface-2:#1c2724; --line:#2b3a36; --line-2:#232f2c;
  --ink:#e7ede9; --ink-2:#a7b9b3; --ink-3:#7b8f89;
  --brand:#7fb3a4; --brand-2:#5b8a7c; --brand-3:#33514a;
  --good:#59bd91; --warn:#d99a45; --bad:#e5827a;
  --good-bg:#15302a; --warn-bg:#332614; --bad-bg:#341f1d;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -16px rgba(0,0,0,.8);
}
html,body{margin:0;padding:0}
body{background:var(--ground);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-family:var(--font-dis);font-weight:600;letter-spacing:-.01em;text-wrap:balance}
p{margin:0}
a{color:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--warn);outline-offset:2px;border-radius:4px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.ar{font-family:var(--font-ui);direction:rtl}

/* shell */
.shell{display:grid;grid-template-columns:1fr;min-height:100vh}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:10px 16px;background:color-mix(in srgb,var(--ground) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.wordmark{font-family:var(--font-dis);font-weight:700;font-size:18px;letter-spacing:-.02em;display:flex;align-items:center;gap:9px}
.wordmark .dot{width:9px;height:9px;border-radius:50%;background:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 22%,transparent)}
.wordmark small{font-family:var(--font-ui);font-weight:500;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.top .grow{flex:1}
.savebar{display:flex;align-items:center;gap:10px}
.savestate{font-size:12px;color:var(--ink-3)}
.savestate.dirty{color:var(--warn);font-weight:500}
.main{display:grid;grid-template-columns:1fr;gap:0}
.rail{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);scrollbar-width:thin}
.rail button{white-space:nowrap;background:transparent;border:1px solid transparent;border-radius:99px;padding:7px 13px;cursor:pointer;color:var(--ink-2);font-size:13.5px}
.rail button:hover{background:var(--surface);color:var(--ink)}
.rail button[aria-current="true"]{background:var(--brand);color:var(--surface);border-color:var(--brand)}
:root[data-theme="dark"] .rail button[aria-current="true"],
:root:not([data-theme="light"]) .rail button[aria-current="true"]{color:#0e1615}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .rail button[aria-current="true"]{color:#fff}}
.view{padding:22px 16px 72px;max-width:1180px;width:100%;margin:0 auto}
@media(min-width:960px){
  .main{grid-template-columns:216px 1fr}
  .rail{flex-direction:column;overflow:visible;border-bottom:none;border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:57px;align-self:start;height:calc(100vh - 57px)}
  .rail button{text-align:left;border-radius:8px}
  .view{padding:28px 32px 80px}
}
.railgroup{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);padding:14px 12px 5px;display:none}
@media(min-width:960px){.railgroup{display:block}}

/* type */
.viewhead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.viewhead h1{font-size:clamp(22px,3.4vw,29px)}
.viewhead p{color:var(--ink-2);font-size:13.5px;max-width:62ch;margin-top:5px}
.eyebrow{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
h2.sec{font-size:15px;margin:30px 0 12px;display:flex;align-items:center;gap:10px}
h2.sec::after{content:"";flex:1;height:1px;background:var(--line)}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:16px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,168px),1fr))}

/* stat tiles */
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;display:flex;flex-direction:column;gap:3px;box-shadow:var(--shadow)}
.tile .lab{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.tile .val{font-family:var(--font-num);font-size:26px;font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15}
.tile .sub{font-size:12px;color:var(--ink-2)}
.tile.hero .val{font-size:34px}
.tile .val.pos{color:var(--good)}.tile .val.neg{color:var(--bad)}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;padding:3px 9px;border-radius:99px;border:1px solid transparent;white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good);border-color:color-mix(in srgb,var(--good) 30%,transparent)}
.pill.warn{background:var(--warn-bg);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.pill.bad{background:var(--bad-bg);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 30%,transparent)}
.pill.mute{background:var(--surface-2);color:var(--ink-3);border-color:var(--line)}
.pill .ic{font-size:10px}

/* funnel */
.funnel{display:flex;flex-direction:column;gap:7px}
.frow{display:grid;grid-template-columns:110px 1fr;align-items:center;gap:12px}
.frow .fl{font-size:12.5px;color:var(--ink-2)}
.ftrack{background:var(--surface-2);border-radius:5px;height:26px;position:relative;overflow:hidden}
.fbar{height:100%;border-radius:5px;display:flex;align-items:center;padding:0 9px;color:#fff;font-family:var(--font-num);font-size:12.5px;min-width:2px;transition:width .4s ease}
:root[data-theme="dark"] .fbar,:root:not([data-theme="light"]) .fbar{color:#0e1615}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .fbar{color:#fff}}
.fbar.s1{background:var(--brand-3)}
.fbar.s2{background:var(--brand-2)}
.fbar.s3{background:var(--brand)}
.fbar.s1{color:var(--ink)}
.fnote{font-size:12px;color:var(--ink-3);margin-top:9px}

/* bars */
.bars{display:flex;align-items:flex-end;gap:2px;height:78px;padding-top:6px}
.bars .b{flex:1;background:var(--brand-2);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.bars .b.zero{background:var(--line);min-height:2px}
.barsx{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink-3);margin-top:5px}

/* tables */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:640px}
th{text-align:left;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:500;
  padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);position:sticky;top:0;z-index:1;white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--surface-2)}
td.r,th.r{text-align:right}
.tname{font-weight:500}
.tsub{font-size:11.5px;color:var(--ink-3)}

/* forms */
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 16%,transparent)}
textarea{font-family:var(--font-num);font-size:12.5px;min-height:120px;resize:vertical}
.formgrid{display:grid;gap:11px;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
.actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:14px}
.btn{background:var(--brand);color:var(--surface);border:1px solid var(--brand);border-radius:8px;padding:8px 15px;cursor:pointer;font-size:13.5px;font-weight:500}
:root[data-theme="dark"] .btn,:root:not([data-theme="light"]) .btn{color:#0e1615}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .btn{color:#fff}}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--ink-2);border-color:var(--line)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.danger{background:transparent;color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
select.inline{padding:4px 7px;font-size:12.5px;border-radius:6px;width:auto;min-width:118px}

/* misc */
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:26px 18px;text-align:center;color:var(--ink-2);background:var(--surface-2)}
.empty strong{display:block;color:var(--ink);font-weight:600;margin-bottom:5px}
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:flex;gap:11px;align-items:flex-start;padding:11px 13px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-size:13.5px}
.alert .ic{width:20px;text-align:center;flex:none;font-size:13px;line-height:1.4}
.alert.bad{border-color:color-mix(in srgb,var(--bad) 35%,transparent);background:var(--bad-bg)}
.alert.warn{border-color:color-mix(in srgb,var(--warn) 35%,transparent);background:var(--warn-bg)}
.alert.good{border-color:color-mix(in srgb,var(--good) 30%,transparent);background:var(--good-bg)}
.alert b{font-weight:600}
details.panel{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);margin-bottom:14px}
details.panel>summary{padding:11px 15px;cursor:pointer;font-size:13.5px;font-weight:500;list-style:none;display:flex;align-items:center;gap:8px}
details.panel>summary::after{content:"+";margin-left:auto;color:var(--ink-3);font-family:var(--font-num)}
details.panel[open]>summary::after{content:"–"}
details.panel .pad{border-top:1px solid var(--line-2)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--ground);
  padding:10px 18px;border-radius:99px;font-size:13.5px;z-index:60;box-shadow:var(--shadow);max-width:88vw;text-align:center}
.agent{display:flex;flex-direction:column;gap:9px;padding:15px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow)}
.agent code{font-family:var(--font-num);font-size:13px;color:var(--brand);font-weight:500}
.agent .role{font-size:13px;color:var(--ink-2)}
.agent .prompt{font-family:var(--font-num);font-size:11.5px;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line-2);border-radius:7px;padding:9px;white-space:pre-wrap}
.chain{font-family:var(--font-num);font-size:12px;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line-2);border-radius:9px;padding:14px;overflow-x:auto;white-space:pre;line-height:1.65}
.season{display:grid;grid-template-columns:64px 1fr auto;gap:13px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line-2)}
.season:last-child{border-bottom:none}
.season .cd{font-family:var(--font-num);font-size:19px;text-align:center;color:var(--brand);font-weight:500}
.season .cd small{display:block;font-size:9.5px;letter-spacing:.1em;color:var(--ink-3);text-transform:uppercase}
.season .nm{font-weight:500;font-size:14px}
.season .dt{font-size:12px;color:var(--ink-3)}
.tasklist{display:flex;flex-direction:column}
.task{display:flex;gap:11px;align-items:center;padding:9px 2px;border-bottom:1px solid var(--line-2)}
.task:last-child{border-bottom:none}
.task input[type=checkbox]{width:16px;height:16px;flex:none;accent-color:var(--brand)}
.task.done .tt{text-decoration:line-through;color:var(--ink-3)}
.task .td{font-family:var(--font-num);font-size:11.5px;color:var(--ink-3);flex:none}
.note{font-size:12.5px;color:var(--ink-3);line-height:1.6}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line-2);font-size:13.5px}
.kv:last-child{border-bottom:none}
.kv span:last-child{font-family:var(--font-num);font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

/* ---------- utilitaires ---------- */
function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function n0(x){return new Intl.NumberFormat('fr-FR',{maximumFractionDigits:0}).format(Math.round(x||0));}
function n1(x){return new Intl.NumberFormat('fr-FR',{minimumFractionDigits:1,maximumFractionDigits:1}).format(x||0);}
function mad(x){return n0(x)+' MAD';}
function pc(x){return (x==null||isNaN(x))?'—':n1(x*100)+' %';}
function today(){var d=new Date();return d.toISOString().slice(0,10);}
function daysTo(iso){var a=new Date(iso+'T00:00:00'),b=new Date(today()+'T00:00:00');return Math.round((a-b)/86400000);}
function frDate(iso){if(!iso)return '—';var p=iso.split('-');return p[2]+'/'+p[1]+'/'+p[0].slice(2);}
function num(v,d){var x=parseFloat(String(v).replace(',','.'));return isNaN(x)?(d||0):x;}
function prod(id){for(var i=0;i<state.produits.length;i++)if(state.produits[i].id===id)return state.produits[i];return null;}

/* ---------- économie COD ---------- */
/* CPA max par commande brute = L*(prix-coût-livraison) - (1-L)*(livraison+retour) */
function eco(p,L){
 var g=state.reglages;
 var M=num(p.prix)-num(p.cout)-num(g.livraison);
 var Pr=num(g.livraison)+num(g.retour);
 var cpaMax=L*M-(1-L)*Pr;
 return {M:M,Pr:Pr,L:L,cpaMax:cpaMax,cpaCible:cpaMax*0.7,
   roas:cpaMax>0?num(p.prix)/cpaMax:null,
   viable:cpaMax>=40,bande:num(p.prix)>=149&&num(p.prix)<=499};
}
function cmdsDe(pid,depuis){
 return state.commandes.filter(function(c){
  if(pid&&c.produitId!==pid)return false;
  if(depuis&&c.date<depuis)return false;
  return true;});
}
function taux(cmds){
 var recues=cmds.length,conf=0,livr=0,ref=0,ann=0,att=0;
 cmds.forEach(function(c){
  /* un colis refusé a bien été confirmé avant d'être expédié : il compte comme confirmé */
  if(c.statut==='confirmee'||c.statut==='expediee'||c.statut==='livree'||c.statut==='refusee')conf++;
  if(c.statut==='livree')livr++;
  if(c.statut==='refusee')ref++;
  if(c.statut==='annulee')ann++;
  if(c.statut==='nouvelle')att++;
 });
 var termine=livr+ref,traite=conf+ann;
 return {recues:recues,confirmees:conf,livrees:livr,refusees:ref,annulees:ann,attente:att,
  termine:termine,traite:traite,
  tConf:traite?conf/traite:null,
  tLivr:termine?livr/termine:null};
}
function LGlobal(pid){
 var t=taux(cmdsDe(pid,null));
 if(t.termine>=10&&t.tLivr!=null)return t.tLivr;
 var g=taux(cmdsDe(null,null));
 if(g.termine>=10&&g.tLivr!=null)return g.tLivr;
 return num(state.reglages.tauxDefaut,0.7);
}
function periodeDepuis(){
 if(ui.periode==='tout')return null;
 var d=new Date();d.setDate(d.getDate()-ui.periode);return d.toISOString().slice(0,10);
}
function bilan(depuis){
 var cmds=cmdsDe(null,depuis),t=taux(cmds);
 var ca=0,marge=0,perte=0;
 cmds.forEach(function(c){
  var p=prod(c.produitId);var g=state.reglages;
  var montant=num(c.montant,p?num(p.prix):0);
  if(c.statut==='livree'){ca+=montant;marge+=montant-(p?num(p.cout):0)-num(g.livraison);}
  else if(c.statut==='refusee'){perte+=num(g.livraison)+num(g.retour);}
 });
 var dep=0,cmdPub=0;
 state.campagnes.forEach(function(k){
  if(depuis&&(k.fin||k.debut)<depuis)return;
  dep+=num(k.depense);cmdPub+=num(k.commandes);
 });
 return {t:t,ca:ca,marge:marge,perte:perte,depense:dep,cmdPub:cmdPub,
   profit:marge-perte-dep,
   cpa:cmdPub?dep/cmdPub:null};
}
function verdictCampagne(k){
 var p=prod(k.produitId);if(!p)return {cls:'mute',txt:'Produit inconnu',cpa:null};
 var e=eco(p,LGlobal(k.produitId));
 var c=num(k.commandes);
 if(!c)return {cls:'mute',txt:'Sans commande',cpa:null,e:e};
 var cpa=num(k.depense)/c;
 if(cpa<=e.cpaCible)return {cls:'good',txt:'Rentable — scaler',cpa:cpa,e:e};
 if(cpa<=e.cpaMax)return {cls:'warn',txt:'À l\'équilibre — optimiser',cpa:cpa,e:e};
 return {cls:'bad',txt:'En perte — couper',cpa:cpa,e:e};
}

 h+='<div class="grid g4">'+
  tile('Commandes reçues',n0(t.recues),t.attente?n0(t.attente)+' encore à confirmer':'&nbsp;')+
  tile('Taux de confirmation',pc(t.tConf),t.traite?n0(t.confirmees)+' confirmées / '+n0(t.traite)+' traitées':'—')+
  tile('Taux de livraison',pc(t.tLivr),t.termine?n0(t.livrees)+' livrées / '+n0(t.termine)+' terminées':'aucune commande terminée')+

  '<div class="tile hero"><div class="lab">Chiffre d\'affaires encaissé</div><div class="val">'+mad(b.ca)+'</div>'+
   '<div class="sub">Seules les commandes livrées comptent. Le reste n\'a jamais été payé.</div></div>'+

function tile(lab,val,sub,cls){
 return '<div class="tile"><div class="lab">'+lab+'</div><div class="val '+(cls||'')+'">'+val+'</div><div class="sub">'+(sub||'&nbsp;')+'</div></div>';
}
function funnel(t){
 var max=Math.max(t.recues,1);
 function row(lab,v,cls){
  var w=Math.max((v/max)*100,v?3:0);
  return '<div class="frow"><div class="fl">'+lab+'</div><div class="ftrack">'+
   '<div class="fbar '+cls+'" style="width:'+w+'%">'+n0(v)+'</div></div></div>';
 }
 return '<div class="card pad"><div class="funnel">'+
  row('Reçues',t.recues,'s1')+row('Confirmées',t.confirmees,'s2')+row('Livrées',t.livrees,'s3')+
  '</div><p class="fnote">'+n0(t.refusees)+' refusées à la livraison, '+n0(t.annulees)+' annulées avant expédition, '+n0(t.attente)+' encore à confirmer. Chaque colis refusé coûte '+
  mad(num(state.reglages.livraison)+num(state.reglages.retour))+' de logistique, plus la publicité déjà dépensée.</p></div>';
}
function sparkbars(){
 var days=[],map={};
 for(var i=13;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);var k=d.toISOString().slice(0,10);days.push(k);map[k]=0;}
 state.commandes.forEach(function(c){if(map[c.date]!==undefined)map[c.date]++;});
 var max=1;days.forEach(function(k){if(map[k]>max)max=map[k];});
 var bars=days.map(function(k){
  var v=map[k],hp=Math.round((v/max)*100);
  return '<div class="b'+(v?'':' zero')+'" style="height:'+(v?Math.max(hp,4):2)+'%" title="'+frDate(k)+' — '+v+' commande'+(v>1?'s':'')+'"></div>';
 }).join('');
 return '<div class="card pad"><div class="bars">'+bars+'</div>'+
  '<div class="barsx"><span>'+frDate(days[0])+'</span><span class="num">pic '+max+'/jour</span><span>'+frDate(days[13])+'</span></div></div>';
}
function alertes(b){
 var out=[],g=state.reglages;
 function a(cls,ic,txt){out.push('<div class="alert '+cls+'"><span class="ic">'+ic+'</span><div>'+txt+'</div></div>');}
 state.produits.forEach(function(p){
  if(p.statut==='archive')return;
  var e=eco(p,LGlobal(p.id));
  if(e.cpaMax<40)a('bad','!','<b>'+esc(p.nom)+'</b> ne supporte pas la publicité payante : CPA max '+mad(e.cpaMax)+
   '. Monter le prix, faire un pack, ou baisser le coût d\'achat.');
  else if(!e.bande)a('warn','~','<b>'+esc(p.nom)+'</b> est hors de la zone qui convertit en COD (149–499 MAD) : prix '+mad(num(p.prix))+'.');
  if(p.statut==='actif'&&num(p.stock)<=0)a('warn','~','<b>'+esc(p.nom)+'</b> est actif avec un stock à zéro.');
 });
 state.campagnes.forEach(function(k){
  if(k.statut==='arretee')return;
  var v=verdictCampagne(k);
  if(v.cls==='bad')a('bad','!','Campagne <b>'+esc(k.nom)+'</b> : CPA réel '+mad(v.cpa)+' contre '+mad(v.e.cpaMax)+' au point mort. Couper ou changer d\'angle.');
 });
 if(b.t.traite>=10&&b.t.tConf!=null&&b.t.tConf<0.7)
  a('warn','~','Taux de confirmation à '+pc(b.t.tConf)+'. En dessous de 70 %, le problème est le délai de rappel : viser un contact sous 2 h.');
 var parVille={};
 state.commandes.forEach(function(c){
  if(c.statut!=='livree'&&c.statut!=='refusee')return;
  var v=c.ville||'Autre';parVille[v]=parVille[v]||{t:0,r:0};parVille[v].t++;if(c.statut==='refusee')parVille[v].r++;
 });
 Object.keys(parVille).forEach(function(v){
  var o=parVille[v];
  if(o.t>=8&&o.r/o.t>0.4)a('warn','~','<b>'+esc(v)+'</b> : '+pc(o.r/o.t)+' de refus sur '+o.t+' commandes terminées. Vérifier le transporteur et le délai sur cette ville.');
 });
 SAISONS.forEach(function(s){
  var j=daysTo(s.date);
  if(j>=0&&j<=s.prep+10){
   var aFaire=state.taches.filter(function(t){return !t.fait&&t.saison===s.nom;}).length;
   if(!aFaire)a(j<=s.prep?'warn':'good',j<=s.prep?'~':'i','<b>'+esc(s.nom)+'</b> dans '+j+' jours et aucune tâche ouverte. '+esc(s.quoi));
  }
 });
 if(!out.length&&b.profit>0)a('good','✓','Sur la période, la boutique dégage '+mad(b.profit)+' de profit net estimé.');
 return out;
}

function refusParVille(){

 state.commandes.forEach(function(c){

 });
 var ks=Object.keys(m).filter(function(k){return m[k].t>=3;}).sort(function(a,b){return (m[b].r/m[b].t)-(m[a].r/m[a].t);});
 if(!ks.length)return '';
 var rows=ks.map(function(k){
  var o=m[k],r=o.r/o.t;

   '<td class="r num">'+pc(r)+'</td><td><span class="pill '+cls+'">'+lab+'</span></td></tr>';
 }).join('');
 return '<h2 class="sec">Refus par ville</h2><div class="tablewrap"><table><thead><tr><th>Ville</th><th class="r">Terminées</th>'+
  '<th class="r">Refusées</th><th class="r">Taux de refus</th><th>Lecture</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
  '<p class="note" style="margin-top:10px">Sous 10 commandes terminées, un taux de refus ne veut rien dire : il est affiché mais pas interprété.</p>';
}

function importCSV(txt){
 if(!txt){toast('Colle d\'abord le CSV');return;}
 var lines=txt.split(/\r?\n/).filter(function(l){return l.trim();});
 if(lines.length<2){toast('Il faut une ligne d\'en-tête et au moins une commande');return;}
 var sep=(lines[0].split(';').length>lines[0].split(',').length)?';':',';
 function cells(l){
  var out=[],cur='',q=false;
  for(var i=0;i<l.length;i++){
   var ch=l[i];
   if(ch==='"'){q=!q;continue;}
   if(ch===sep&&!q){out.push(cur);cur='';continue;}
   cur+=ch;
  }
  out.push(cur);return out.map(function(s){return s.trim();});
 }
 var head=cells(lines[0]).map(function(s){return s.toLowerCase();});
 function col(){
  for(var i=0;i<arguments.length;i++){
   var name=arguments[i];
   for(var j=0;j<head.length;j++)if(head[j].indexOf(name)>=0)return j;
  }
  return -1;
 }
 var iDate=col('date','créé','cree'),iProd=col('produit','product','article'),iVille=col('ville','city'),
     iMont=col('montant','total','prix','price'),iStat=col('statut','status','état','etat'),iRef=col('ref','commande','order','#');
 if(iProd<0){toast('Colonne « produit » introuvable dans l\'en-tête');return;}
 var mapStat={livr:'livree',deliver:'livree',complet:'livree',refus:'refusee',retour:'refusee',return:'refusee',
  annul:'annulee',cancel:'annulee',confirm:'confirmee',expedi:'expediee',ship:'expediee',nouveau:'nouvelle',new:'nouvelle',pending:'nouvelle'};
 var ajout=0,inconnus={};
 for(var i=1;i<lines.length;i++){
  var c=cells(lines[i]);if(!c.length)continue;
  var nom=(c[iProd]||'').trim();if(!nom)continue;
  var p=null;
  state.produits.forEach(function(x){if(x.nom.toLowerCase()===nom.toLowerCase())p=x;});
  if(!p){inconnus[nom]=(inconnus[nom]||0)+1;continue;}
  var st='nouvelle',raw=(iStat>=0?(c[iStat]||''):'').toLowerCase();
  Object.keys(mapStat).forEach(function(k){if(raw.indexOf(k)>=0)st=mapStat[k];});
  var dt=(iDate>=0?(c[iDate]||''):'').slice(0,10);
  if(!/^\d{4}-\d{2}-\d{2}$/.test(dt)){
   var m=dt.match(/^(\d{2})[\/\-](\d{2})[\/\-](\d{4})$/);
   dt=m?(m[3]+'-'+m[2]+'-'+m[1]):today();
  }
  state.commandes.push({id:uid(),date:dt,produitId:p.id,ville:(iVille>=0?c[iVille]:'')||'Autre',
   montant:num(iMont>=0?c[iMont]:'',num(p.prix)),statut:st,ref:(iRef>=0?c[iRef]:'')||'',motif:''});
  ajout++;
 }
 var manquants=Object.keys(inconnus);
 touch();
 toast(ajout+' commande'+(ajout>1?'s':'')+' importée'+(ajout>1?'s':'')+
  (manquants.length?' — '+manquants.length+' produit(s) non reconnu(s) : '+manquants.slice(0,3).join(', '):''));
}

/* ---------- sauvegarde ---------- */
function buildDoc(st){
 var css=document.getElementById('app-css').textContent;
 var js=document.getElementById('app-code').textContent;
 var json=JSON.stringify(st).replace(/</g,'\\u003c');
 var o='<'+S,c='</'+S+'>';
 return '<!doctype html>\n<html lang="fr">\n<head>\n<meta charset="utf-8">\n'+
  '<meta name="viewport" content="width=device-width,initial-scale=1">\n<title>Pilote COD</title>\n'+
  '<link rel="preconnect" href="https://fonts.googleapis.com">\n'+
  '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n'+
  '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">\n'+
  '<style id="app-css">'+css+'</style>\n</head>\n<body>\n<div id="root"></div>\n'+
  o+' id="app-state" type="application/json">'+json+c+'\n'+
  o+' id="app-code">'+js+c+'\n</body>\n</html>';
}
function save(){
 state.localAt=Date.now();
 try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}
 var btn=document.querySelector('[data-act="save"]');
 if(btn){btn.disabled=true;btn.textContent='Enregistrement…';}
 var api=(typeof claude!=='undefined'&&claude&&claude.use)?claude.use('artifact'):Promise.resolve(null);
 Promise.resolve(api).then(function(a){
  if(!a){
   dirty=true;render();
   toast('Enregistré dans ce navigateur seulement — la page ne peut pas se réécrire ici.');
   return;
  }
  var snapshot=JSON.parse(JSON.stringify(state));
  snapshot.publishedAt=Date.now();snapshot.localAt=snapshot.publishedAt;
  return a.publish(buildDoc(snapshot)).then(function(){
   state.publishedAt=snapshot.publishedAt;state.localAt=snapshot.localAt;dirty=false;
   try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}
   render();toast('Enregistré');
  });
 }).catch(function(err){
  render();
  var code=err&&err.code?err.code:'';
  if(code==='conflict')toast('Une autre version a été enregistrée entre-temps. Recharge la page, puis ressaisis cette modification.');
  else if(code==='not_granted'||code==='not_writer')toast('Enregistrement impossible : cette page est en lecture seule pour ce compte.');
  else toast('Enregistrement impossible. Tes données restent dans ce navigateur.');
 });
}
function exportJSON(){
 var data=JSON.stringify(state,null,2);
 var name='pilote-cod-'+today()+'.json';
 var api=(typeof claude!=='undefined'&&claude&&claude.use)?claude.use('downloads'):Promise.resolve(null);
 Promise.resolve(api).then(function(d){
  if(!d)throw new Error('no downloads');
  return d.save({filename:name,data:data}).then(function(){toast('Sauvegarde enregistrée');});
 }).catch(function(){
  var ta=document.querySelector('[data-form="import"] textarea');
  if(ta){ta.value=data;ta.select();toast('Téléchargement indisponible — le JSON est dans le champ ci-dessous, copie-le.');}
  else toast('Téléchargement indisponible.');
 });
}
window.addEventListener('beforeunload',function(e){
 if(dirty){e.preventDefault();e.returnValue='';}
});
render();
if(pendingLocal)setTimeout(function(){toast('Modifications non enregistrées récupérées depuis ce navigateur.');},600);
})();
</script>
