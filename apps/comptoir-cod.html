:root{

    color-scheme:dark;
  }

:root[data-theme="dark"]{

  --muted:#8B9791; --line:#26332E; --line-2:#1E2A26;
  --accent:#43C2A0; --accent-soft:#12302A; --accent-ink:#8FE3CB;
  --brass:#D3A73F; --brass-soft:#2C2413;

}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:var(--fs-base);line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:"Bricolage Grotesque","Public Sans",sans-serif;margin:0;text-wrap:balance;letter-spacing:-.01em}
a{color:var(--accent-ink);text-decoration-thickness:1px;text-underline-offset:2px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.lbl{font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}

/* ---- chrome ---- */
.top{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:9px;margin-right:auto}
.brand b{font-family:"Bricolage Grotesque",sans-serif;font-size:1.12rem;font-weight:800;letter-spacing:-.02em}
.brand span{font-size:var(--fs-xs);color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.tabs{display:flex;gap:2px;flex-wrap:wrap}
.tab{background:none;border:1px solid transparent;padding:6px 11px;border-radius:var(--r);cursor:pointer;font-size:var(--fs-sm);font-weight:500;color:var(--muted)}
.tab:hover{color:var(--ink);background:var(--surface-2)}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .tab[aria-selected="true"],:root:not([data-theme="light"]) .tab[aria-selected="true"]{color:#0B1512}
.icon-btn{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);width:32px;height:32px;cursor:pointer;color:var(--muted);display:grid;place-items:center}
.icon-btn:hover{color:var(--ink);border-color:var(--muted)}
.wrap{max-width:1180px;margin:0 auto;padding:22px 18px 90px}

/* ---- console de recherche ---- */
.console{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.console-head{padding:14px 18px 0;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.console-head h1{font-size:var(--fs-lg);font-weight:700}
.console-head p{margin:0;color:var(--muted);font-size:var(--fs-sm)}
.console-body{padding:14px 18px 18px;background:
  repeating-linear-gradient(to bottom,transparent 0 31px,var(--line-2) 31px 32px);
  background-position:0 8px}
.row-q{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap}
.q-field{flex:1 1 320px;display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--ink);border-radius:var(--r);padding:0 12px}
.q-field input{flex:1;border:0;background:none;padding:13px 0;font-size:var(--fs-md);min-width:0}
.q-field input:focus{outline:none}
.q-field svg{flex:none;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:9px 14px;cursor:pointer;font-size:var(--fs-sm);font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary,:root:not([data-theme="light"]) .btn.primary{color:#0B1512}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:none}
.btn.sm{padding:5px 9px;font-size:var(--fs-xs);font-weight:600}
.btn:disabled{opacity:.5;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.seg button{background:none;border:0;border-right:1px solid var(--line);padding:9px 13px;cursor:pointer;font-size:var(--fs-sm);font-weight:500;color:var(--muted)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.row-opts{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;margin-top:14px}
.field{display:flex;flex-direction:column;gap:4px}
.field select,.field input{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px 10px;font-size:var(--fs-sm)}
.hint{font-size:var(--fs-xs);color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:100px;padding:4px 11px;font-size:var(--fs-xs);cursor:pointer;color:var(--muted);font-weight:500}
.chip:hover{border-color:var(--muted);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}

/* ---- layout resultats ---- */
.split{display:grid;grid-template-columns:232px 1fr;gap:22px;margin-top:22px;align-items:start}
@media (max-width:860px){.split{grid-template-columns:1fr}}
.rail{position:sticky;top:70px;display:flex;flex-direction:column;gap:18px}
@media (max-width:860px){.rail{position:static}}
.rail h3{font-size:var(--fs-sm);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700;padding-bottom:6px;border-bottom:1px solid var(--line)}
.check{display:flex;align-items:center;gap:8px;font-size:var(--fs-sm);padding:3px 0;cursor:pointer;color:var(--ink-2)}
.check input{accent-color:var(--accent);width:15px;height:15px}
.result-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.result-head strong{font-family:"Bricolage Grotesque",sans-serif;font-size:var(--fs-md)}
.list{display:flex;flex-direction:column;gap:9px}
.sep{display:flex;align-items:center;gap:10px;margin:16px 0 3px}
.sep:first-child{margin-top:0}
.sep span{font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700;white-space:nowrap}
.sep b{color:var(--accent-ink);font-weight:700}
.sep::after{content:"";flex:1;height:1px;background:var(--line)}

/* ---- carte source ---- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:grid;grid-template-columns:46px 1fr;overflow:hidden}
.card:hover{border-color:var(--muted)}
.card.best{border-color:var(--brass);box-shadow:inset 3px 0 0 var(--brass)}
.rank{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:12px 0;border-right:1px solid var(--line-2);background:var(--surface-2)}
.rank b{font-family:"Bricolage Grotesque",sans-serif;font-size:1.15rem;font-weight:700;line-height:1;color:var(--muted)}
.card.best .rank b{color:var(--brass)}
.card-body{padding:12px 14px 13px;min-width:0}
.card-top{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.card-top h4{font-size:var(--fs-md);font-weight:700}
.tag{font-size:var(--fs-xs);border:1px solid var(--line);border-radius:2px;padding:1px 6px;color:var(--muted);font-weight:600;letter-spacing:.03em;text-transform:uppercase}
.tag.ma{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft)}
.tag.intl{border-color:var(--brass);color:var(--brass);background:var(--brass-soft)}
.card-desc{color:var(--ink-2);font-size:var(--fs-sm);margin:6px 0 0}
.metrics{display:flex;gap:18px;flex-wrap:wrap;margin-top:11px;padding-top:10px;border-top:1px dotted var(--line)}
.metric{min-width:78px}
.metric .lbl{display:block;margin-bottom:2px}
.metric .val{font-size:var(--fs-sm);font-weight:600;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.gauge{display:flex;gap:2px;margin-top:3px}
.gauge i{width:11px;height:7px;background:var(--line);border-radius:1px;display:block}
.gauge i.on{background:var(--accent)}
.gauge.price i.on{background:var(--brass)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
.est{font-family:"IBM Plex Mono",monospace;font-weight:600;color:var(--brass)}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:34px 20px;text-align:center;color:var(--muted)}

/* ---- panneaux / tableaux ---- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:18px}
.panel > h2{font-size:var(--fs-md);font-weight:700;padding-bottom:9px;margin-bottom:14px;border-bottom:1px solid var(--ink);position:relative}
.panel > h2::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:1px;background:var(--line)}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:var(--fs-sm);min-width:620px}
th{text-align:left;font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;padding:0 10px 7px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line-2);vertical-align:top}
tr.best td{background:var(--brass-soft)}
td.num{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.pill{display:inline-block;font-size:var(--fs-xs);font-weight:600;padding:1px 7px;border-radius:100px;border:1px solid var(--line);color:var(--muted)}
.pill.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.pill.warn{background:var(--brass-soft);border-color:var(--brass);color:var(--brass)}
.pill.bad{border-color:var(--bad);color:var(--bad)}
.stars{color:var(--brass);letter-spacing:1px;font-size:var(--fs-sm)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.stat{border:1px solid var(--line);border-radius:var(--r);padding:11px 13px;background:var(--surface-2)}
.stat .v{font-family:"Bricolage Grotesque",sans-serif;font-size:var(--fs-lg);font-weight:700;line-height:1.1;margin-top:3px}
.stat .v.good{color:var(--good)} .stat .v.bad{color:var(--bad)}
.note{border-left:2px solid var(--accent);background:var(--surface-2);padding:10px 13px;font-size:var(--fs-sm);color:var(--ink-2);border-radius:0 var(--r) var(--r) 0}
.note.warn{border-color:var(--brass)}
ul.ticks{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:6px}
ul.ticks li{padding-left:18px;position:relative;font-size:var(--fs-sm);color:var(--ink-2)}
ul.ticks li::before{content:"";position:absolute;left:0;top:.55em;width:7px;height:7px;border:1.5px solid var(--accent);border-radius:1px}
ul.ticks.warn li::before{border-color:var(--brass);border-radius:100px}
.acc{border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px;background:var(--surface)}
.acc summary{cursor:pointer;padding:11px 14px;font-weight:600;font-size:var(--fs-sm);list-style:none;display:flex;justify-content:space-between;gap:10px}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"+";color:var(--muted);font-family:"IBM Plex Mono",monospace}
.acc[open] summary::after{content:"–"}
.acc .acc-in{padding:0 14px 14px;font-size:var(--fs-sm);color:var(--ink-2)}

/* ---- modal ---- */
.scrim{position:fixed;inset:0;background:rgba(10,16,14,.55);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:24px 14px;overflow-y:auto}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);width:100%;max-width:640px;box-shadow:0 24px 60px -20px rgba(0,0,0,.5)}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal-head h3{font-size:var(--fs-md)}
.modal-body{padding:18px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.form-grid .full{grid-column:1/-1}
.form-grid label{display:flex;flex-direction:column;gap:4px;font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.form-grid input,.form-grid select,.form-grid textarea{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px 10px;font-size:var(--fs-sm);text-transform:none;letter-spacing:0;color:var(--ink);font-weight:400}
.form-grid textarea{min-height:64px;resize:vertical}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;padding:14px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:100px;font-size:var(--fs-sm);z-index:80;box-shadow:var(--shadow)}
@media (prefers-reduced-motion:no-preference){.toast{animation:pop .22s ease-out}}
@keyframes pop{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
.savebar{position:fixed;right:18px;bottom:18px;z-index:50;display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:100px;padding:6px 8px 6px 14px;box-shadow:var(--shadow)}
.savebar span{font-size:var(--fs-xs);color:var(--muted)}
</style>

function load(){
  var a=null,b=null;
  try{ var el=document.getElementById("app-state"); if(el) a=JSON.parse(el.textContent||"{}"); }catch(e){}
  try{ var s=localStorage.getItem("comptoir-cod-v1"); if(s) b=JSON.parse(s); }catch(e){}
  var pick = a && a.savedAt ? a : null;
  if(b && b.savedAt && (!pick || b.savedAt > pick.savedAt)) pick = b;
  if(!pick || !pick.v) return JSON.parse(JSON.stringify(DEF));
  var out = JSON.parse(JSON.stringify(DEF));
  Object.keys(pick).forEach(function(k){
    if(k==="reglages"){ Object.keys(pick.reglages||{}).forEach(function(r){ out.reglages[r]=pick.reglages[r]; }); }
    else out[k]=pick[k];
  });
  return out;
}

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function norm(s){ return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,""); }
function clamp5(v){ return Math.max(0,Math.min(5,Math.round(num(v)))); }
function useCap(n){
  try{ if(window.claude && typeof window.claude.use==="function") return window.claude.use(n); }catch(e){}
  return Promise.resolve(null);
}
function num(v){ var n=parseFloat(String(v).replace(",",".")); return isFinite(n)?n:0; }
function fmt(n,d){ if(n==null||!isFinite(n)) return "—";
  return n.toLocaleString("fr-FR",{minimumFractionDigits:d==null?0:d,maximumFractionDigits:d==null?0:d}); }
function uid(){ return "f"+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function toast(msg){ ui.toast=msg; render(); setTimeout(function(){ if(ui.toast===msg){ui.toast=null;render();} },2600); }

function detectCat(q){
  var n=norm(q); if(!n.trim()) return null;
  var toks=n.split(/[^a-z0-9]+/).filter(Boolean);
  var best=null, sc=0;
  CATS.forEach(function(c){
    var s=0;
    c.kw.forEach(function(k){
      if(k.length>=4){ if(n.indexOf(k)>-1) s+=k.length; }
      else if(toks.indexOf(k)>-1) s+=k.length+1;
    });
    if(s>sc){ sc=s; best=c.id; }
  });
  return sc>0?best:null;
}
function catName(id){ for(var i=0;i<CATS.length;i++) if(CATS[i].id===id) return CATS[i].n; return null; }
function typeName(id){ for(var i=0;i<TYPES.length;i++) if(TYPES[i].id===id) return TYPES[i].n; return id; }

function motCle(src){
  var q=state.q.trim(); if(!q) return "";
  var t=state.trad[norm(q)];
  if(t && src.lang && t[src.lang]) return t[src.lang];
  return q;
}
function lienRecherche(src){
  var q=motCle(src);
  if(!q) return src.s ? src.s.replace(/\{q\}/g,"") : (src.dom?("https://"+src.dom):"#");
  if(src.s) return src.s.replace(/\{q\}/g, encodeURIComponent(q));
  if(src.dom) return "https://www.google.com/search?q="+encodeURIComponent("site:"+src.dom+" "+q);
  return "https://www.google.com/search?q="+encodeURIComponent(q);
}
function lienGoogle(src){
  var q=motCle(src)||state.q;
  var base = src.dom ? ("site:"+src.dom+" "+q) : (q+" "+src.n+" fournisseur gros");
  return "https://www.google.com/search?q="+encodeURIComponent(base);
}

/* estimation du coût rendu au Maroc à partir d'un prix usine de référence */
function estimation(src){
  var p=num(state.ref.prix); if(!p||src.idx==null) return null;
  var fx = state.reglages.fx[state.ref.devise]||1;
  var mad = p*fx*src.idx;
  if(src.m==="intl") mad = mad*(1+num(state.reglages.uplift)/100);
  return mad;
}

var SECTIONS = ["Grossistes — achat en gros",
                "Fabricants, ateliers et coopératives",
                "Autres pistes — annonces, foires, annuaires, repères"];
function rangType(t){
  if(t==="hub"||t==="b2b") return 0;
  if(t==="usine") return 1;
  return 2;
}
function estGrossiste(s){ return rangType(s.t)===0; }

function resultats(){
  var cat = state.cat==="detect" ? detectCat(state.q) : (state.cat==="tous"?null:state.cat);
  var out = SRC.filter(function(s){
    if(state.marche==="ma" && s.m!=="ma") return false;
    if(state.marche==="intl" && s.m!=="intl") return false;
    if(state.sansImport && s.m==="intl") return false;
    if(state.grosOnly && !estGrossiste(s)) return false;
    if(state.types.length && state.types.indexOf(s.t)<0) return false;
    if(cat && s.cats.indexOf("tous")<0 && s.cats.indexOf(cat)<0) return false;
    return true;
  });
  var tri=state.tri;
  out.sort(function(a,b){
    var ra=rangType(a.t), rb=rangType(b.t);
    if(ra!==rb) return ra-rb;
    if(tri==="prix"){
      var ai=a.idx==null?99:a.idx, bi=b.idx==null?99:b.idx;
      if(ai!==bi) return ai-bi; return a.n.localeCompare(b.n);
    }
    if(tri==="qualite"){ if(b.qual!==a.qual) return b.qual-a.qual; return (a.idx||9)-(b.idx||9); }
    if(tri==="rapide"){
      var av=a.m==="ma"?0:1, bv=b.m==="ma"?0:1;
      if(av!==bv) return av-bv; return (a.idx||9)-(b.idx||9);
    }
    return 0;
  });
  return {liste:out, cat:cat};
}

/* ============================ CARNET ============================ */

function coutRendu(f){
  var fx = state.reglages.fx[f.devise]||1;
  var base = num(f.prix)*fx;
  var douane = base*(num(f.douane)/100);
  return base + douane + num(f.fret);
}
function margeCOD(f){
  var pv=num(f.pv); if(!pv) return null;
  var c=coutRendu(f), L=num(state.reglages.tauxLiv)/100, liv=num(state.reglages.fraisLiv), ret=num(state.reglages.coutRetour);
  var margeLivree = pv - c - liv;
  var parRecue = L*margeLivree - (1-L)*ret;
  return {c:c, margeLivree:margeLivree, parRecue:parRecue, plancher:c*num(state.reglages.marge)};
}
function carnetTrie(){
  var l = state.carnet.slice();
  l.sort(function(a,b){
    if((a.produit||"")!==(b.produit||"")) return (a.produit||"").localeCompare(b.produit||"");
    return coutRendu(a)-coutRendu(b);
  });
  return l;
}
function meilleurParProduit(){
  var m={};
  state.carnet.forEach(function(f){
    var k=norm(f.produit||"");
    if(!m[k] || coutRendu(f)<coutRendu(m[k])) m[k]=f;
  });
  return m;
}

function render(){

    key = a.id ? ("#"+a.id)

    try{ pos=a.selectionStart; }catch(e){}
  }
  var r=document.getElementById("root");
  r.innerHTML = topbar() + '<div class="wrap">' + vue() + '</div>' + savebar()
    + (ui.toast?('<div class="toast">'+esc(ui.toast)+'</div>'):"")
    + (ui.modal||"");
  if(state.reglages.theme==="auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", state.reglages.theme);
  if(key){
    var el2 = key.charAt(0)==="#" ? document.getElementById(key.slice(1)) : document.querySelector(key);
    if(el2){ el2.focus(); if(pos!=null){ try{ el2.setSelectionRange(pos,pos); }catch(e){} } }
  }
}

function listeHTML(res){

}
function enTeteResultats(res){
  var g=0; res.liste.forEach(function(s){ if(estGrossiste(s)) g++; });

   + '<span class="hint"><b style="color:var(--accent-ink)">'+g+' grossiste'+(g>1?"s":"")+' en tête</b>'
   + (res.cat&&state.cat==="detect"?(" · catégorie détectée : "+esc(catName(res.cat))):"")+'</span>';

function carte(s,i){

   +   '<div class="metric"><span class="lbl">Quantité mini</span><div class="val">'+esc(s.moq)+'</div></div>'

   + '</div></div></article>';
}

      +   (f.site?('<div class="hint"><a href="'+esc(/^https?:/.test(f.site)?f.site:"https://"+f.site)+'" target="_blank" rel="noopener">site</a></div>'):"")

        + (f.avisUrl?(' · <a href="'+esc(f.avisUrl)+'" target="_blank" rel="noopener">avis / références</a>'):"")+'</div></td></tr>';

/* ---------- onglet coût rendu ---------- */
function vueMarge(){
  var c=state.calc||{prix:"3.20",devise:"USD",qte:"100",fret:"1800",douane:"25",divers:"300",pv:"249"};
  state.calc=c;
  var fx=state.reglages.fx[c.devise]||1;
  var achat=num(c.prix)*fx*num(c.qte);
  var douane=achat*(num(c.douane)/100);
  var total=achat+douane+num(c.fret)+num(c.divers);
  var unit=num(c.qte)?total/num(c.qte):0;
  var L=num(state.reglages.tauxLiv)/100, liv=num(state.reglages.fraisLiv), ret=num(state.reglages.coutRetour);
  var margeLivree=num(c.pv)-unit-liv;
  var parRecue=L*margeLivree-(1-L)*ret;
  var plancher=unit*num(state.reglages.marge)+liv;

  function f(lbl,key,unit2,step){
    return '<label>'+lbl+'<input type="number" step="'+(step||"1")+'" data-act="calc" data-k="'+key+'" value="'+esc(c[key])+'">'
      +(unit2?('<span class="hint" style="text-transform:none;letter-spacing:0">'+unit2+'</span>'):"")+'</label>';
  }
  return '<section class="panel"><h2>Coût rendu &amp; prix plancher</h2>'
   + '<p class="hint" style="margin:-8px 0 14px">Un prix fournisseur ne veut rien dire tant que le fret, la douane et le taux de refus ne sont pas dedans. Ce calcul rend deux devis comparables, l\'un de Derb Omar et l\'autre de Chine.</p>'
   + '<div class="form-grid">'
   + '<label>Prix unitaire<input type="number" step="0.01" data-act="calc" data-k="prix" value="'+esc(c.prix)+'"></label>'
   + '<label>Devise<select data-act="calc" data-k="devise">'+["USD","CNY","EUR","MAD","AED","TRY"].map(function(d){return '<option'+(c.devise===d?" selected":"")+'>'+d+'</option>';}).join("")+'</select></label>'
   + f("Quantité","qte")
   + f("Fret total (MAD)","fret")
   + f("Droits de douane (%)","douane")
   + f("Frais divers (MAD)","divers")
   + f("Prix de vente COD (MAD)","pv")
   + '</div>'
   + '<div class="grid2" style="margin-top:18px">'
   +   '<div class="stat"><span class="lbl">Marchandise</span><div class="v">'+fmt(achat,0)+' MAD</div></div>'
   +   '<div class="stat"><span class="lbl">Douane estimée</span><div class="v">'+fmt(douane,0)+' MAD</div></div>'
   +   '<div class="stat"><span class="lbl">Total posé au Maroc</span><div class="v">'+fmt(total,0)+' MAD</div></div>'
   +   '<div class="stat"><span class="lbl">Coût rendu unitaire</span><div class="v" style="color:var(--brass)">'+fmt(unit,2)+' MAD</div></div>'
   + '</div>'
   + '<div class="grid2" style="margin-top:14px">'
   +   '<div class="stat"><span class="lbl">Marge sur colis livré</span><div class="v '+(margeLivree>0?"good":"bad")+'">'+fmt(margeLivree,0)+' MAD</div>'
   +     '<div class="hint">prix de vente − coût rendu − '+fmt(liv,0)+' MAD de livraison</div></div>'
   +   '<div class="stat"><span class="lbl">Reste par commande reçue</span><div class="v '+(parRecue>0?"good":"bad")+'">'+fmt(parRecue,0)+' MAD</div>'
   +     '<div class="hint">à '+fmt(L*100,0)+' % de livraison, refus compté à '+fmt(ret,0)+' MAD. C\'est le plafond de votre coût publicitaire par commande.</div></div>'
   +   '<div class="stat"><span class="lbl">Prix de vente plancher</span><div class="v">'+fmt(plancher,0)+' MAD</div>'
   +     '<div class="hint">coût rendu × '+state.reglages.marge+' + livraison</div></div>'
   +   '<div class="stat"><span class="lbl">Trésorerie à sortir</span><div class="v">'+fmt(total,0)+' MAD</div>'
   +     '<div class="hint">immobilisée jusqu\'à écoulement des '+fmt(num(c.qte),0)+' pièces</div></div>'
   + '</div>'
   + '<div class="note warn" style="margin-top:16px">Les droits de douane dépendent du code SH du produit et peuvent aller de 2,5 % à plus de 30 %, hors TVA à l\'import. Faites confirmer le taux par votre transitaire avant d\'engager une commande : c\'est l\'erreur qui coûte le plus cher sur une première importation.</div>'
   + '</section>';
}

   + '<p style="margin-top:0">'+esc(s.d)+'</p>'
   + '<h4 class="lbl" style="margin-bottom:8px">Ce qui joue pour</h4><ul class="ticks">'+s.f.map(function(x){return '<li>'+esc(x)+'</li>';}).join("")+'</ul>'
   + '<h4 class="lbl" style="margin:16px 0 8px">À surveiller</h4><ul class="ticks warn">'+s.a.map(function(x){return '<li>'+esc(x)+'</li>';}).join("")+'</ul>'
   + '<div class="note" style="margin-top:16px">Avis et réputation : <a href="'+esc(s.av.u)+'" target="_blank" rel="noopener">'+esc(s.av.t)+'</a></div>'

   + '</div></div>';
}

function modalEdit(f){

  function inp(lbl,k,type,ph,cls){

  }
  return '<div class="scrim" data-act="close"><div class="modal" data-stop="1">'
   + '<div class="modal-head"><h3>'+(f.id?"Modifier":"Nouveau fournisseur")+'</h3><button class="icon-btn" data-act="close">✕</button></div>'
   + '<div class="modal-body"><div class="form-grid">'
   + inp("Produit","produit","text","veilleuse lune 3D","full")
   + inp("Nom du fournisseur","nom","text","Bazar El Andalous")
   + '<label>Type<select data-act="f" data-k="type">'+["Grossiste","Importateur","Fabricant","Atelier","Coopérative","Dropshipper","Marketplace"].map(function(o){return '<option'+(f.type===o?" selected":"")+'>'+o+'</option>';}).join("")+'</select></label>'
   + inp("Ville","ville","text","Casablanca")
   + inp("Pays","pays","text","Maroc")
   + inp("Téléphone / WhatsApp","tel","text","2126…")
   + inp("Email","email","text","")
   + inp("Site web","site","text","")
   + inp("Adresse","adresse","text","Rue 12, Derb Omar","full")
   + inp("Prix unitaire","prix","number","")
   + '<label>Devise<select data-act="f" data-k="devise">'+["MAD","USD","CNY","EUR","AED","TRY"].map(function(o){return '<option'+((f.devise||"MAD")===o?" selected":"")+'>'+o+'</option>';}).join("")+'</select></label>'
   + inp("Quantité minimum","moq","text","50 pcs")
   + inp("Fret par pièce (MAD)","fret","number","")
   + inp("Douane (%)","douane","number","")
   + inp("Délai annoncé","delai","text","7 jours")
   + inp("Prix de vente visé (MAD)","pv","number","249")
   + '<label>Qualité (0-5)<input type="number" min="0" max="5" data-act="f" data-k="qualite" value="'+esc(f.qualite||0)+'"></label>'
   + '<label>Fiabilité (0-5)<input type="number" min="0" max="5" data-act="f" data-k="fiabilite" value="'+esc(f.fiabilite||0)+'"></label>'
   + '<label>Statut<select data-act="f" data-k="statut">'+st.map(function(o){return '<option'+((f.statut||"À contacter")===o?" selected":"")+'>'+o+'</option>';}).join("")+'</select></label>'
   + inp("Lien avis / références","avisUrl","text","","full")
   + '<label class="full">Notes<textarea data-act="f" data-k="notes" placeholder="Qui vous l\'a recommandé, ce qu\'il a promis, ce qu\'il a livré.">'+esc(f.notes||"")+'</textarea></label>'
   + '</div></div>'
   + '<div class="modal-foot">'
   + (f.id?'<button class="btn ghost" data-act="del" style="margin-right:auto;color:var(--bad)">Supprimer</button>':"")
   + '<button class="btn" data-act="close">Annuler</button><button class="btn primary" data-act="savef">Enregistrer</button></div>'
   + '</div></div>';

function modalDevis(){
  var p=state.q||"[produit]";
  var fr="Bonjour, je suis e-commerçant au Maroc et je cherche un fournisseur régulier pour : "+p+".\n\n"
   +"Pouvez-vous me confirmer :\n1. Le prix unitaire pour 50, 200 et 500 pièces\n2. La quantité minimum de commande\n"
   +"3. Le délai de livraison à Casablanca\n4. Si vous fournissez une facture avec ICE\n5. Le prix d'un échantillon, que je paie\n\n"
   +"Merci de m'envoyer une photo ou une vidéo réelle du stock disponible. Cordialement.";
  var en="Hello, I run an e-commerce store in Morocco and I am sourcing a regular supplier for: "+p+".\n\n"
   +"Could you please confirm:\n1. Unit price for 100 / 500 / 1000 pcs\n2. MOQ\n3. Sample cost and lead time\n"
   +"4. Production lead time and shipping options to Casablanca, Morocco\n5. Certifications available (CE, RoHS, test report)\n\n"
   +"Please send real photos or a short video of the product. Thank you.";
  var ar="السلام عليكم، عندي متجر إلكتروني في المغرب وكنقلب على مورد دائم لـ: "+p+".\n\n"
   +"بغيت نعرف:\n1. الثمن بالوحدة ل 50 و 200 و 500 قطعة\n2. أقل كمية للطلب\n3. مدة التوصيل للدار البيضاء\n"
   +"4. واش كتعطيو فاتورة ب ICE\n5. ثمن العينة\n\nعافاك صيفط تصويرة ولا فيديو حقيقي للسلعة. شكرا.";

/* ============================ ACTIONS ============================ */

document.addEventListener("click", function(ev){
  var el=ev.target.closest("[data-act]"); if(!el) return;
  var act=el.getAttribute("data-act"), v=el.getAttribute("data-v");
  if(act==="close"){ if(ev.target.closest("[data-stop]") && ev.target!==el && el.classList.contains("scrim")) return;
    ui.modal=null; ui.edit=null; render(); return; }
  if(el.tagName==="A") return;

  switch(act){
    case "tab": state.tab=v; ui.modal=null; render(); break;
    case "theme":
      state.reglages.theme = state.reglages.theme==="dark" ? "light" : (state.reglages.theme==="light" ? "auto" : "dark");
      persist(); render(); break;
    case "marche": state.marche=v; render(); break;
    case "type":
      var i=state.types.indexOf(v); if(i>-1) state.types.splice(i,1); else state.types.push(v); render(); break;
    case "sansimport": state.sansImport=!state.sansImport; render(); break;
    case "grosonly": state.grosOnly=!state.grosOnly; render(); break;
    case "detail": ui.modal=modalDetail(v); render(); break;
    case "devis": ui.modal=modalDevis(); render(); break;
    case "copy":
      var ta=document.getElementById(v);
      if(ta){
        ta.select();
        if(navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(ta.value).then(function(){ toast("Texte copié"); },
            function(){ toast("Sélectionnez le texte puis copiez-le"); });
        } else {
          try{ document.execCommand("copy"); toast("Texte copié"); }
          catch(e){ toast("Sélectionnez le texte puis copiez-le"); }
        }
      }
      break;
    case "ajouter":
      var s=null; SRC.forEach(function(x){ if(x.id===v) s=x; });
      ui.edit={produit:state.q, nom:"", type:(s&&s.t==="usine"?"Fabricant":(s&&s.t==="hub"?"Grossiste":"Marketplace")),
        ville:s?s.ville:"", pays:s?s.pays:"Maroc", devise:s&&s.m==="intl"?"USD":"MAD",
        douane:s&&s.m==="intl"?25:0, statut:"À contacter", notes:s?("Repéré via "+s.n):"", avisUrl:s?s.av.u:"",
        qualite:0, fiabilite:0};
      ui.modal=modalEdit(ui.edit); render(); break;
    case "new": ui.edit={produit:state.q,devise:"MAD",pays:"Maroc",statut:"À contacter",qualite:0,fiabilite:0,douane:0}; ui.modal=modalEdit(ui.edit); render(); break;
    case "edit":
      state.carnet.forEach(function(f){ if(f.id===v) ui.edit=JSON.parse(JSON.stringify(f)); });
      ui.modal=modalEdit(ui.edit); render(); break;
    case "savef":
      if(!ui.edit) break;
      if(!ui.edit.nom){ toast("Donnez au moins un nom au fournisseur"); break; }
      ui.edit.maj=new Date().toISOString();
      if(ui.edit.id){ state.carnet=state.carnet.map(function(f){ return f.id===ui.edit.id?ui.edit:f; }); }
      else { ui.edit.id=uid(); state.carnet.push(ui.edit); }
      ui.modal=null; ui.edit=null; state.tab="carnet"; persist(); render(); toast("Fournisseur enregistré"); break;
    case "del":
      if(ui.edit&&ui.edit.id){ state.carnet=state.carnet.filter(function(f){ return f.id!==ui.edit.id; }); }
      ui.modal=null; ui.edit=null; persist(); render(); toast("Supprimé"); break;
    case "reset":
      if(state.carnet.length && window.confirm("Vider le carnet ? "+state.carnet.length+" fournisseur(s) seront supprimés.")){
        state.carnet=[]; persist(); render(); toast("Carnet vidé"); }
      break;
    case "csv": exportCSV(); break;
    case "import": var fi=document.getElementById("imp"); if(fi) fi.click(); break;
    case "json": exportJSON(); break;
    case "traduire": traduire(); break;
    case "save": sauver(); break;
  }
});

document.addEventListener("input", function(ev){
  if(ev.target.id==="q"){
    state.q=ev.target.value;
    clearTimeout(window.__t); window.__t=setTimeout(rerenderResults,220);
    return;
  }
  var el=ev.target.closest("[data-act]"); if(!el) return;
  var act=el.getAttribute("data-act"), k=el.getAttribute("data-k");
  if(act==="refprix"){ state.ref.prix=el.value; rerenderResults(); return; }
  if(act==="f" && ui.edit){ ui.edit[k]=el.value; return; }
  if(act==="calc"){ state.calc[k]=el.value; render(); return; }
  if(act==="fx"){ state.reglages.fx[k]=num(el.value); persist(); return; }
  if(act==="reg"){ state.reglages[k]=num(el.value); persist(); return; }
});

document.addEventListener("change", function(ev){
  if(ev.target.id==="imp"){ importer(ev.target.files && ev.target.files[0]); ev.target.value=""; return; }
  var el=ev.target.closest("[data-act]"); if(!el) return;
  var act=el.getAttribute("data-act"), k=el.getAttribute("data-k");
  if(act==="cat"){ state.cat=el.value; render(); }
  else if(act==="tri"){ state.tri=el.value; render(); }
  else if(act==="refdev"){ state.ref.devise=el.value; render(); }
  else if(act==="f" && ui.edit){ ui.edit[k]=el.value; }
  else if(act==="calc"){ state.calc[k]=el.value; render(); }
});

/* rerendu partiel pour ne pas perdre le focus du champ de recherche */
function rerenderResults(){
  if(state.tab!=="recherche") return;
  var res=resultats();
  var sel=document.querySelector('select[data-act="cat"]');
  if(sel && state.cat==="detect" && sel.options.length){
    sel.options[0].textContent = "Détection automatique" + (res.cat ? (" — "+catName(res.cat)) : "");
  }
  var head=document.querySelector(".result-head");
  var list=document.querySelector(".list")||document.querySelector(".empty");
  if(head) head.innerHTML=enTeteResultats(res);
  if(list){
    if(!res.liste.length){ list.outerHTML='<div class="empty">Aucune source avec ces filtres. Élargissez la catégorie ou décochez un type.</div>'; }
    else { list.outerHTML=listeHTML(res); }
  }
}

/* ---------- traduction du mot-clé (capacité sample) ---------- */
function traduire(){
  var q=state.q.trim();
  if(!q){ toast("Tapez d'abord un produit"); return; }
  if(state.trad[norm(q)]){ toast("Mot-clé déjà traduit"); render(); return; }
  toast("Traduction en cours…");
  useCap("sample").then(function(sample){
    if(!sample){ toast(ui.local===true ? "Traduction disponible seulement dans la version en ligne" : "Traduction indisponible dans cette vue"); return; }
    return sample.json([{role:"user",content:
      'Tu aides un e-commerçant marocain à chercher un fournisseur pour le produit : "'+q+'".\n'
      +'Réponds UNIQUEMENT par un objet JSON, sans texte autour, avec exactement ces clés :\n'
      +'{"fr":"terme de recherche en français","ar":"terme en arabe","en":"terme de recherche commercial en anglais tel qu\'utilisé sur Alibaba",'
      +'"zh":"terme en chinois simplifié tel qu\'utilisé sur 1688","es":"terme en espagnol","tr":"terme en turc",'
      +'"conseil":"une phrase de 15 mots maximum sur le point de vigilance qualité de ce produit"}\n'
      +"N'invente aucun nom d'entreprise, aucun prix, aucun numéro de téléphone."}],
      {modelTier:"quick"});
  }).then(function(r){
    if(!r) return;
    state.trad[norm(q)]=r; persist(); render(); toast("Mot-clé traduit en 6 langues");
  }).catch(function(e){
    toast(e && e.code==="not_granted" ? "Traduction non autorisée ici" : "Traduction impossible pour le moment");
  });
}

/* ---------- exports ---------- */
function csvCarnet(){
  var cols=["produit","nom","type","ville","pays","tel","email","site","adresse","prix","devise","fret","douane","moq","delai","pv","qualite","fiabilite","statut","avisUrl","notes"];
  var head=["Produit","Fournisseur","Type","Ville","Pays","Telephone","Email","Site","Adresse","Prix","Devise","Fret/piece","Douane %","Qte mini","Delai","Prix vente","Qualite","Fiabilite","Statut","Avis","Notes","Cout rendu MAD"];
  var lines=[head.join(";")];
  carnetTrie().forEach(function(f){
    var row=cols.map(function(c){ return '"'+String(f[c]==null?"":f[c]).replace(/"/g,'""')+'"'; });
    row.push('"'+coutRendu(f).toFixed(2)+'"');
    lines.push(row.join(";"));
  });
  return "\uFEFF"+lines.join("\r\n");
}
function telecharger(nom,data,mime){
  useCap("downloads").then(function(d){
    if(d) return d.save({filename:nom,data:data}).then(function(){ toast("Fichier proposé au téléchargement"); });
    var b=new Blob([data],{type:mime||"text/plain;charset=utf-8"});
    var a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download=nom;
    document.body.appendChild(a); a.click(); a.remove(); toast("Fichier généré");
  }).catch(function(){ toast("Téléchargement refusé"); });
}
function exportCSV(){
  if(!state.carnet.length){ toast("Le carnet est vide"); return; }
  telecharger("carnet-fournisseurs.csv", csvCarnet(), "text/csv;charset=utf-8");
}
function exportJSON(){ telecharger("comptoir-cod-sauvegarde.json", JSON.stringify(state,null,2), "application/json"); }
function importer(file){
  if(!file) return;
  var r=new FileReader();
  r.onload=function(){
    var d=null;
    try{ d=JSON.parse(String(r.result)); }catch(e){}
    if(!d || !d.v){ toast("Fichier illisible : attendu un export JSON de cette app"); return; }
    var n=(d.carnet||[]).length;
    if(state.carnet.length && !window.confirm("Remplacer le carnet actuel ("+state.carnet.length+") par celui du fichier ("+n+") ?")) return;
    state.carnet = d.carnet || [];
    if(d.reglages) Object.keys(d.reglages).forEach(function(k){ state.reglages[k]=d.reglages[k]; });
    if(d.trad) state.trad=d.trad;
    if(d.calc) state.calc=d.calc;
    persist(); render();
    toast(n+" fournisseur"+(n>1?"s":"")+" import"+(n>1?"és":"é"));
  };
  r.onerror=function(){ toast("Lecture du fichier impossible"); };
  r.readAsText(file);
}

/* ---------- publication ---------- */
function buildDoc(){
  var css=document.getElementById("app-css").textContent;
  var code=document.getElementById("app-code").textContent;
  var json=JSON.stringify(state).replace(/</g,"\\u003c");
  return '<!doctype html>\n<html lang="fr">\n<head>\n<meta charset="utf-8">\n'
   + '<meta name="viewport" content="width=device-width,initial-scale=1">\n'
   + '<title>Comptoir COD</title>\n'
   + '<link rel="preconnect" href="https://fonts.googleapis.com">\n'
   + '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n'
   + '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">\n'
   + '<style id="app-css">'+css+'</style>\n</head>\n<body>\n<div id="root"></div>\n'
   + '<script id="app-state" type="application/json">'+json+'<'+'/script>\n'
   + '<script id="app-code">'+code+'<'+'/script>\n</body>\n</html>';
}
function sauver(){
  persist(); render();
  useCap("artifact").then(function(a){
    if(!a){
      toast(ui.store===false
        ? "Ce navigateur refuse d" + Q + "enregistrer : exportez la sauvegarde JSON"
        : "Enregistré dans ce navigateur");
      return;
    }
    return a.publish(buildDoc()).then(function(){ toast("Enregistré dans la page"); });
  }).catch(function(e){
    toast(e && e.code==="conflict" ? "Une version plus récente existe" : "Enregistré dans ce navigateur seulement");
  });
}

/* ============================ DÉMARRAGE ============================ */
document.addEventListener("keydown", function(e){
  if(e.key==="Escape" && ui.modal){ ui.modal=null; ui.edit=null; render(); }
});
ui.store = storageOK();
render();
useCap("artifact").then(function(a){ ui.local = !a; render(); });
})();
</script>
