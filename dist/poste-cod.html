 label: \"Messages\", f: \"num\", w: 10 },\n      { label: \"% des messages\", f: \"num\", w: 14 }, { label: \"Mots\", f: \"num\", w: 10 },\n      { label: \"Mots / message\", f: \"num\", w: 14 }, { label: \"Médias\", f: \"num\", w: 9 },\n      { label: \"Liens\", f: \"num\", w: 8 }, { label: \"Premier message\", f: \"date\", w: 15 },\n      { label: \"Dernier message\", f: \"date\", w: 15 }, { label: \"Jours actifs\", f: \"num\", w: 12 }\n    ],\n    rows: rows\n  };\n}\n\nfunction topAuthors(msgs, limit){\n  var by = {}, i;\n  for(i = 0; i \u003c msgs.length; i++){\n    if(msgs[i].type === \"système\") continue;\n    var a = msgs[i].author || \"—\";\n    by[a] = (by[a] || 0) + 1;\n  }\n  return Object.keys(by).sort(function(x, y){ return by[y] - by[x]; }).slice(0, limit);\n}\n\nfunction buildByDay(msgs){\n  var authors = topAuthors(msgs, 10), map = {}, i, m, key;\n  for(i = 0; i \u003c msgs.length; i++){\n    m = msgs[i];\n    key = dayKey(m.date);\n    if(!map[key]) map[key] = { date: new Date(m.date.getFullYear(), m.date.getMonth(), m.date.getDate()), total: 0, by: {}, autres: 0 };\n    map[key].total++;\n    if(m.type === \"système\") continue;\n    var a = m.author || \"—\";\n    if(authors.indexOf(a) >= 0) map[key].by[a] = (map[key].by[a] || 0) + 1;\n    else map[key].autres++;\n  }\n  var keys = Object.keys(map).sort();\n  var cols = [\n    { label: \"Date\", f: \"date\", w: 11 }, { label: \"Jour\", f: \"text\", w: 10 },\n    { label: \"Messages\", f: \"num\", w: 10 }\n  ];\n  authors.forEach(function(a){ cols.push({ label: a, f: \"num\", w: Math.min(18, Math.max(9, a.length + 2)) }); });\n  var hasOther = keys.some(function(k){ return map[k].autres > 0; });\n  if(hasOther) cols.push({ label: \"Autres\", f: \"num\", w: 9 });\n  var rows = keys.map(function(k){\n    var d = map[k], row = [d.date, DAYS[d.date.getDay()], d.total];\n    authors.forEach(function(a){ row.push(d.by[a] || 0); });\n    if(hasOther) row.push(d.autres);\n    return row;\n  });\n  return { cols: cols, rows: rows };\n}\n\nfunction buildByHour(msgs){\n  var counts = new Array(24).fill(0), i;\n  for(i = 0; i \u003c msgs.length; i++) counts[msgs[i].date.getHours()]++;\n  var total = msgs.length || 1;\n  return {\n    cols: [{ label: \"Heure\", f: \"text\", w: 8 }, { label: \"Messages\", f: \"num\", w: 10 }, { label: \"Part (%)\", f: \"num\", w: 10 }],\n    rows: counts.map(function(c, h){ return [pad(h) + \" h\", c, Math.round(c / total * 1000) / 10]; })\n  };\n}\n\nfunction buildSummary(msgs, orders){\n  var media = 0, deleted = 0, sys = 0, w = 0, links = 0, phones = {}, amount = 0, i;\n  for(i = 0; i \u003c msgs.length; i++){\n    var m = msgs[i];\n    if(m.type === \"média\") media++;\n    else if(m.type === \"supprimé\") deleted++;\n    else if(m.type === \"système\") sys++;\n    w += words(m.text);\n    links += m.links.length;\n    m.phones.forEach(function(p){ phones[p] = 1; });\n  }\n  for(i = 0; i \u003c orders.length; i++) amount += orders[i].amount;\n\n  var authors = topAuthors(msgs, 999);\n  var day = buildByDay(msgs).rows, hour = buildByHour(msgs).rows;\n  var bestDay = day.slice().sort(function(a, b){ return b[2] - a[2]; })[0];\n  var bestHour = hour.slice().sort(function(a, b){ return b[1] - a[1]; })[0];\n  var first = msgs.length ? msgs[0].date : null;\n  var last = msgs.length ? msgs[msgs.length - 1].date : null;\n  var f = state.filters, fdesc = [];\n  if(f.author) fdesc.push(\"auteur = \" + f.author);\n  if(f.q) fdesc.push(\"recherche = \" + f.q);\n  if(f.from) fdesc.push(\"à partir du \" + f.from);\n  if(f.to) fdesc.push(\"jusqu'au \" + f.to);\n\n  var rows = [\n    [\"Fichier source\", state.fileName],\n    [\"Discussion\", state.chatName],\n    [\"Période\", first ? fmtDate(first) + \" → \" + fmtDate(last) : \"—\"],\n    [\"Jours couverts\", day.length],\n    [\"Participants\", authors.length],\n    [\"Messages\", msgs.length],\n    [\"dont médias\", media],\n    [\"dont messages supprimés\", deleted],\n    [\"dont messages système\", sys],\n    [\"Mots écrits\", w],\n    [\"Liens partagés\", links],\n    [\"Numéros de téléphone distincts\", Object.keys(phones).length],\n    [\"Commandes détectées\", orders.length],\n    [\"Montant total détecté (MAD)\", Math.round(amount * 100) / 100],\n    [\"Auteur le plus actif\", authors[0] || \"—\"],\n    [\"Jour le plus actif\", bestDay ? fmtDate(bestDay[0]) + \" (\" + bestDay[2] + \" messages)\" : \"—\"],\n    [\"Heure la plus active\", bestHour ? bestHour[0] + \" (\" + bestHour[1] + \" messages)\" : \"—\"],\n    [\"Fichiers médias dans l'archive\", state.mediaFiles.length],\n    [\"Filtres appliqués\", fdesc.length ? fdesc.join(\" · \") : \"aucun\"],\n    [\"Classeur généré le\", fmtDate(new Date()) + \" à \" + fmtTime(new Date())]\n  ];\n  return {\n    cols: [{ label: \"Indicateur\", f: \"text\", w: 32 }, { label: \"Valeur\", f: \"text\", w: 46 }],\n    rows: rows,\n    stats: { media: media, links: links, phones: Object.keys(phones).length, amount: amount,\n             days: day.length, authors: authors.length, first: first, last: last }\n  };\n}\n\n/* ============================================================\n   7. Assemblage\n   ============================================================ */\n\nvar built = null;\n\n/* Une entrée déjà présente dans le classeur ne doit pas être réécrite. */\nfunction existingKeys(sheet){\n  var keys = {}, iL = -1, iM = -1, iD = -1, i;\n  sheet.headers.forEach(function(h, idx){\n    if(h.kind === \"libelle\" && iL \u003c 0) iL = idx;\n    if(h.kind === \"montant\" && iM \u003c 0) iM = idx;\n    if(h.kind === \"date\" && iD \u003c 0) iD = idx;\n  });\n  for(i = 0; i \u003c sheet.existing.length; i++){\n    var r = sheet.existing[i];\n    var lab = iL >= 0 ? deaccent(String(r[iL] || \"\")).replace(/\\s+/g, \" \").trim() : \"\";\n    var mnt = iM >= 0 ? r[iM] : \"\";\n    var dt = \"\";\n    if(iD >= 0 && typeof r[iD] === \"number\") dt = String(Math.round(r[iD]));\n    keys[lab + \"|\" + mnt + \"|\" + dt] = true;\n  }\n  return keys;\n}\n\nfunction entryKeyIn(sheet, e){\n  var dt = String(excelSerial(e.date));\n  return deaccent(e.libelle).replace(/\\s+/g, \" \").trim() + \"|\" + e.montant + \"|\" + dt;\n}\n\nfunction buildModelView(msgs){\n  var model = state.model;\n  var entries = detectEntries(msgs, state.routes, model.sheets);\n  var bySheet = {}, dupes = 0;\n  model.sheets.forEach(function(s){\n    bySheet[s.name] = { sheet: s, add: [], known: existingKeys(s) };\n  });\n  entries.forEach(function(e){\n    var bucket = bySheet[e.sheet];\n    if(!bucket) return;\n    if(bucket.known[entryKeyIn(bucket.sheet, e)]){ e.duplicate = true; dupes++; return; }\n    e.included = !state.excluded[e.key];\n    bucket.add.push(e);\n  });\n  var total = 0;\n  Object.keys(bySheet).forEach(function(k){\n    total += bySheet[k].add.filter(function(e){ return e.included; }).length;\n  });\n  return { entries: entries, bySheet: bySheet, total: total, dupes: dupes };\n}\n\nfunction buildAll(){\n  var msgs = filtered();\n  var ord = buildOrders(msgs);\n  var out = {\n    msgs: msgs,\n    messages: buildMessages(msgs),\n    commandes: ord,\n    participants: buildParticipants(msgs),\n    jour: buildByDay(msgs),\n    heure: buildByHour(msgs),\n    resume: buildSummary(msgs, ord.orders)\n  };\n  out.model = state.model ? buildModelView(msgs) : null;\n  return out;\n}\n\n/* ============================================================\n   8. Rendu\n   ============================================================ */\n\nfunction render(){\n  if(!state.parsed) return;\n  built = buildAll();\n  renderTiles();\n  renderRouting();\n  renderTabs();\n  renderPreview();\n  renderPicks();\n  renderExportBar();\n}\n\nfunction tile(k, v, s, flag, small){\n  return '\u003cdiv class=\"card tile' + (flag ? \" flag\" : \"\") + (small ? \" small\" : \"\") + '\">\u003cspan class=\"k\">' + esc(k) + '\u003c/span>' +\n         '\u003cspan class=\"v\">' + esc(v) + '\u003c/span>' + (s ? '\u003cspan class=\"s\">' + esc(s) + '\u003c/span>' : \"\") + \"\u003c/div>\";\n}\n\nfunction renderTiles(){\n  var st = built.resume.stats, msgs = built.msgs;\n  var period = st.first ? fmtDate(st.first) + \" → \" + fmtDate(st.last) : \"—\";\n  var html = tile(\"Messages\", msgs.length.toLocaleString(\"fr-FR\"), st.days + \" jours\") +\n             tile(\"Participants\", String(st.authors), built.participants.rows.length ? built.participants.rows[0][0] : \"\") +\n             tile(\"Période\", period, \"\", false, true);\n  if(built.model){\n    var m = built.model;\n    var sheetsWith = Object.keys(m.bySheet).filter(function(k){ return m.bySheet[k].add.length; }).length;\n    html += tile(\"Lignes à ajouter\", String(m.total), sheetsWith + (sheetsWith > 1 ? \" feuilles\" : \" feuille\"), true) +\n            tile(\"Déjà dans le classeur\", String(m.dupes), \"ignorées\") +\n            tile(\"Feuilles du modèle\", String(state.model.sheets.length), state.model.sheets.map(function(s){ return s.name; }).join(\", \"), false, true);\n  } else {\n    html += tile(\"Commandes détectées\", String(built.commandes.orders.length),\n                 built.commandes.orders.length ? nfmt(st.amount) + \" DH repérés\" : \"aucun montant repéré\", true) +\n            tile(\"Numéros repérés\", String(st.phones), st.media + (st.media > 1 ? \" médias\" : \" média\")) +\n            tile(\"Liens partagés\", String(st.links), \"\");\n  }\n  $(\"tiles\").innerHTML = html;\n}\n\nfunction renderRouting(){\n  var box = $(\"routing\");\n  if(!state.model){ box.hidden = true; return; }\n  box.hidden = false;\n  var authors = topAuthors(state.parsed.messages, 999);\n  var counts = {};\n  if(built && built.model){\n    built.model.entries.forEach(function(e){ counts[e.auteur] = (counts[e.auteur] || 0) + 1; });\n  }\n  var options = state.model.sheets.map(function(s){\n    return { v: s.name, l: s.name + (s.kind === \"transferts\" ? \" (opérations)\" : \"\") };\n  });\n  $(\"routes\").innerHTML = authors.map(function(a){\n    var cur = state.routes[a] || \"__ignore__\";\n    var opts = '\u003coption value=\"__ignore__\"' + (cur === \"__ignore__\" ? \" selected\" : \"\") + \">Ignorer\u003c/option>\";\n    opts += options.map(function(o){\n      return '\u003coption value=\"' + esc(o.v) + '\"' + (cur === o.v ? \" selected\" : \"\") + \">\" + esc(o.l) + \"\u003c/option>\";\n    }).join(\"\");\n    return '\u003cdiv class=\"route\">\u003cspan class=\"who\">' + esc(a) + '\u003c/span>' +\n           '\u003cspan class=\"cnt\">' + (counts[a] || 0) + '\u003c/span>' +\n           '\u003cselect data-author=\"' + esc(a) + '\">' + opts + \"\u003c/select>\u003c/div>\";\n  }).join(\"\");\n  Array.prototype.forEach.call($(\"routes\").querySelectorAll(\"select\"), function(sel){\n    sel.onchange = function(){ state.routes[sel.dataset.author] = sel.value; render(); };\n  });\n}\n\nfunction renderTabs(){\n  var t = $(\"tabs\"), html = \"\";\n  if(state.model){\n    state.model.sheets.forEach(function(s){\n      var b = built.model.bySheet[s.name];\n      var add = b ? b.add.filter(function(e){ return e.included; }).length : 0;\n      html += '\u003cbutton class=\"tab\" role=\"tab\" data-tab=\"m:' + esc(s.name) + '\" aria-selected=\"' + (state.tab === \"m:\" + s.name) + '\">' +\n              esc(s.name) + '\u003cspan class=\"cnt\">' + s.existing.length + \"\u003c/span>\" +\n              (add ? '\u003cspan class=\"add\">+' + add + \"\u003c/span>\" : \"\") + \"\u003c/button>\";\n    });\n  } else {\n    SHEETS.forEach(function(s){\n      var n = built[s.id].rows.length;\n      html += '\u003cbutton class=\"tab\" role=\"tab\" data-tab=\"' + s.id + '\" aria-selected=\"' + (state.tab === s.id) + '\">' +\n              esc(s.label) + '\u003cspan class=\"cnt\">' + n + \"\u003c/span>\u003c/button>\";\n    });\n  }\n  t.innerHTML = html;\n  var found = false;\n  Array.prototype.forEach.call(t.querySelectorAll(\".tab\"), function(b){\n    if(b.dataset.tab === state.tab) found = true;\n    b.onclick = function(){ state.tab = b.dataset.tab; renderTabs(); renderPreview(); };\n  });\n  if(!found){\n    var first = t.querySelector(\".tab\");\n    if(first){ state.tab = first.dataset.tab; first.setAttribute(\"aria-selected\", \"true\"); }\n  }\n}\n\nvar MAX_PREVIEW = 150;\n\nfunction cellHtml(v, f){\n  if(v === \"\" || v === null || v === undefined) return \"\u003ctd>\u003c/td>\";\n  if(f === \"date\") return '\u003ctd class=\"mono\">' + fmtDate(v) + \"\u003c/td>\";\n  if(f === \"num\") return '\u003ctd class=\"num\">' + (typeof v === \"number\" ? nfmt(v) : esc(v)) + \"\u003c/td>\";\n  if(f === \"mono\") return '\u003ctd class=\"mono\">' + esc(v) + \"\u003c/td>\";\n  if(f === \"score\") return '\u003ctd class=\"num\">\u003cspan class=\"score\">' + v + \"\u003c/span>\u003c/td>\";\n  if(f === \"tag\"){\n    var cls = v === \"média\" ? \"media\" : v === \"système\" ? \"sys\" : v === \"supprimé\" ? \"del\" : v === \"Envoyé\" ? \"sent\" : \"\";\n    return '\u003ctd>\u003cspan class=\"pill ' + cls + '\">' + esc(v) + \"\u003c/span>\u003c/td>\";\n  }\n  if(f === \"msg\"){\n    var s = String(v), cut = s.length > 150 ? s.slice(0, 150) + \"…\" : s;\n    return '\u003ctd class=\"msg\" title=\"' + esc(s.slice(0, 500)) + '\">' + esc(cut) + \"\u003c/td>\";\n  }\n  return \"\u003ctd>\" + esc(v) + \"\u003c/td>\";\n}\n\nfunction renderPreview(){\n  if(state.model && state.tab.indexOf(\"m:\") === 0){ renderModelPreview(state.tab.slice(2)); return; }\n  var sheet = built[state.tab];\n  var host = $(\"preview\"), foot = $(\"previewFoot\");\n  if(!sheet){ host.innerHTML = \"\"; foot.textContent = \"\"; return; }\n  if(!sheet.rows.length){\n    host.innerHTML = '\u003cdiv class=\"empty\">\u003cstrong>Rien à afficher ici.\u003c/strong>' +\n      (state.tab === \"commandes\"\n        ? \"Aucune commande repérée avec les filtres actuels. Ajoute tes mots-clés produits ci-dessus.\"\n        : \"Élargis les filtres pour retrouver des lignes.\") + \"\u003c/div>\";\n    foot.textContent = \"\";\n    return;\n  }\n  var html = \"\u003ctable>\u003cthead>\u003ctr>\";\n  sheet.cols.forEach(function(c){\n    html += '\u003cth class=\"' + (c.f === \"num\" || c.f === \"score\" ? \"num\" : \"\") + '\">' + esc(c.label) + \"\u003c/th>\";\n  });\n  html += \"\u003c/tr>\u003c/thead>\u003ctbody>\";\n  var shown = sheet.rows.slice(0, MAX_PREVIEW), i, j;\n  for(i = 0; i \u003c shown.length; i++){\n    html += \"\u003ctr>\";\n    for(j = 0; j \u003c sheet.cols.length; j++) html += cellHtml(shown[i][j], sheet.cols[j].f);\n    html += \"\u003c/tr>\";\n  }\n  html += \"\u003c/tbody>\u003c/table>\";\n  host.innerHTML = html;\n  foot.textContent = sheet.rows.length > MAX_PREVIEW\n    ? \"Aperçu des \" + MAX_PREVIEW + \" premières lignes · \" + sheet.rows.length.toLocaleString(\"fr-FR\") + \" lignes seront exportées.\"\n    : sheet.rows.length.toLocaleString(\"fr-FR\") + \" ligne\" + (sheet.rows.length > 1 ? \"s\" : \"\") + \" · toutes exportées.\";\n}\n\nfunction modelCell(v, kind){\n  if(v === \"\" || v === null || v === undefined) return \"\u003ctd>\u003c/td>\";\n  if(kind === \"date\"){\n    if(typeof v === \"number\") return '\u003ctd class=\"mono\">' + fmtDate(fromSerial(v)) + \"\u003c/td>\";\n    if(v instanceof Date) return '\u003ctd class=\"mono\">' + fmtDate(v) + \"\u003c/td>\";\n    return '\u003ctd class=\"mono\">' + esc(v) + \"\u003c/td>\";\n  }\n  if(kind === \"montant\") return '\u003ctd class=\"num\">' + (typeof v === \"number\" ? nfmt(v) : esc(v)) + \"\u003c/td>\";\n  if(kind === \"libelle\"){\n    var s = String(v), cut = s.length > 120 ? s.slice(0, 120) + \"…\" : s;\n    return '\u003ctd class=\"msg\" title=\"' + esc(s.slice(0, 400)) + '\">' + esc(cut) + \"\u003c/td>\";\n  }\n  return \"\u003ctd>\" + esc(v) + \"\u003c/td>\";\n}\n\nfunction renderModelPreview(name){\n  var bucket = built.model.bySheet[name];\n  var host = $(\"preview\"), foot = $(\"previewFoot\");\n  if(!bucket){ host.innerHTML = \"\"; foot.textContent = \"\"; return; }\n  var sheet = bucket.sheet;\n  var html = '\u003ctable>\u003cthead>\u003ctr>\u003cth>\u003c/th>\u003cth class=\"num\">Ligne\u003c/th>';\n  sheet.headers.forEach(function(h){\n    html += '\u003cth class=\"' + (h.kind === \"montant\" ? \"num\" : \"\") + '\">' + esc(h.label) + \"\u003c/th>\";\n  });\n  html += \"\u003c/tr>\u003c/thead>\u003ctbody>\";\n\n  sheet.existing.forEach(function(r, i){\n    html += '\u003ctr class=\"old\">\u003ctd class=\"pick\">\u003c/td>\u003ctd class=\"rowref\">' + (i + 2) + \"\u003c/td>\";\n    sheet.headers.forEach(function(h, j){ html += modelCell(r[j], h.kind); });\n    html += \"\u003c/tr>\";\n  });\n\n  var at = sheet.lastRow + 1;\n  bucket.add.forEach(function(e){\n    var cls = \"new\" + (e.included ? \"\" : \" off\");\n    html += '\u003ctr class=\"' + cls + '\">\u003ctd class=\"pick\">\u003cinput type=\"checkbox\" data-key=\"' + esc(e.key) + '\"' + (e.included ? \" checked\" : \"\") + \">\u003c/td>\";\n    html += '\u003ctd class=\"rowref\">' + (e.included ? at++ : \"—\") + \"\u003c/td>\";\n    sheet.headers.forEach(function(h){\n      var v = valueFor(e, h.kind);\n      html += modelCell(v === \"\" ? \"\" : v, h.kind);\n    });\n    html += \"\u003c/tr>\";\n  });\n  html += \"\u003c/tbody>\u003c/table>\";\n\n  if(!sheet.existing.length && !bucket.add.length){\n    host.innerHTML = '\u003cdiv class=\"empty\">\u003cstrong>Aucune ligne pour cette feuille.\u003c/strong>' +\n      \"Vérifie l'affectation des auteurs juste au-dessus : chaque personne doit pointer vers sa feuille.\u003c/div>\";\n    foot.textContent = \"\";\n    return;\n  }\n  host.innerHTML = html;\n  Array.prototype.forEach.call(host.querySelectorAll(\"input[type=checkbox]\"), function(cb){\n    cb.onchange = function(){\n      if(cb.checked) delete state.excluded[cb.dataset.key];\n      else state.excluded[cb.dataset.key] = true;\n      render();\n    };\n  });\n  var add = bucket.add.filter(function(e){ return e.included; }).length;\n  foot.textContent = sheet.existing.length + \" ligne\" + (sheet.existing.length > 1 ? \"s\" : \"\") + \" déjà dans le classeur · \" +\n    add + \" à ajouter à partir de la ligne \" + (sheet.lastRow + 1) + \".\";\n}\n\nfunction renderPicks(){\n  var host = $(\"sheetpicks\");\n  if(state.model){\n    host.innerHTML = '\u003cspan class=\"note\">Les lignes cochées sont écrites dans une copie de \u003cb>' + esc(state.model.fileName) + \"\u003c/b>.\u003c/span>\";\n    return;\n  }\n  var html = \"\";\n  SHEETS.forEach(function(s){\n    html += '\u003clabel>\u003cinput type=\"checkbox\" data-sheet=\"' + s.id + '\"' + (state.picks[s.id] ? \" checked\" : \"\") + \"> \" + esc(s.label) + \"\u003c/label>\";\n  });\n  host.innerHTML = html;\n  Array.prototype.forEach.call(host.querySelectorAll(\"input\"), function(cb){\n    cb.onchange = function(){ state.picks[cb.dataset.sheet] = cb.checked; };\n  });\n}\n\nfunction renderExportBar(){\n  var btn = $(\"xlsx\"), note = $(\"exportNote\"), csv = $(\"csv\");\n  if(state.model){\n    var n = built.model.total;\n    btn.textContent = n ? \"Remplir le classeur (\" + n + \" ligne\" + (n > 1 ? \"s\" : \"\") + \")\" : \"Remplir le classeur\";\n    btn.disabled = !n;\n    csv.hidden = true;\n    note.textContent = n ? \"\" : \"Aucune ligne à ajouter — vérifie les affectations.\";\n  } else {\n    btn.textContent = \"Télécharger le classeur Excel\";\n    btn.disabled = false;\n    csv.hidden = false;\n    note.textContent = built.msgs.length > 40000 ? \"Gros classeur : la génération peut prendre quelques secondes.\" : \"\";\n  }\n}\n\nfunction renderControls(){\n  var authors = topAuthors(state.parsed.messages, 999);\n  var me = $(\"me\"), fa = $(\"fAuthor\");\n  me.innerHTML = authors.map(function(a){\n    return '\u003coption value=\"' + esc(a) + '\"' + (a === state.me ? \" selected\" : \"\") + \">\" + esc(a) + \"\u003c/option>\";\n  }).join(\"\");\n  fa.innerHTML = '\u003coption value=\"\">Tous les auteurs\u003c/option>' + authors.map(function(a){\n    return '\u003coption value=\"' + esc(a) + '\">' + esc(a) + \"\u003c/option>\";\n  }).join(\"\");\n  var d = state.parsed.detected;\n  var label = d === \"dmy\" ? \"JJ/MM/AAAA\" : d === \"mdy\" ? \"MM/JJ/AAAA\" : \"AAAA/MM/JJ\";\n  $(\"fileMeta\").textContent = state.parsed.messages.length.toLocaleString(\"fr-FR\") + \" messages lus · format de date détecté : \" + label +\n    (state.mediaFiles.length ? \" · \" + state.mediaFiles.length + \" fichiers médias dans l'archive\" : \"\");\n}\n\n/* ============================================================\n   9. Export\n   ============================================================ */\n\nfunction sheetToAoa(sheet){\n  var aoa = [sheet.cols.map(function(c){ return c.label; })];\n  sheet.rows.forEach(function(r){ aoa.push(r.slice()); });\n  return aoa;\n}\n\nfunction makeWorksheet(sheet){\n  var ws = XLSX.utils.aoa_to_sheet(sheetToAoa(sheet), { cellDates: true, dateNF: \"dd/mm/yyyy\" });\n  ws[\"!cols\"] = sheet.cols.map(function(c){ return { wch: c.w || 14 }; });\n  if(sheet.rows.length){\n    ws[\"!autofilter\"] = { ref: XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: sheet.rows.length, c: sheet.cols.length - 1 } }) };\n  }\n  return ws;\n}\n\nfunction safeName(s){ return String(s).replace(/[\\\\\\/?*\\[\\]:]/g, \" \").trim().slice(0, 31) || \"Feuille\"; }\n\nfunction buildWorkbook(){\n  var wb = XLSX.utils.book_new();\n  wb.Props = { Title: \"Discussion WhatsApp — \" + state.chatName, Author: \"Registre WhatsApp\", CreatedDate: new Date() };\n  var any = false;\n  SHEETS.forEach(function(s){\n    if(!state.picks[s.id]) return;\n    var sheet = built[s.id];\n    if(!sheet.rows.length && s.id !== \"resume\") return;\n    XLSX.utils.book_append_sheet(wb, makeWorksheet(sheet), safeName(s.label));\n    any = true;\n  });\n  return any ? wb : null;\n}\n\nfunction outName(ext){\n  var base = (state.chatName || \"discussion\").replace(/[^\\p{L}\\p{N} _.\\-]/gu, \"\").trim().slice(0, 48) || \"discussion\";\n  var d = new Date();\n  return \"WhatsApp-\" + base.replace(/\\s+/g, \"-\") + \"-\" + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + \".\" + ext;\n}\n\nvar toastTimer = null;\nfunction toast(msg){\n  var t = $(\"toast\");\n  t.textContent = msg;\n  t.classList.add(\"on\");\n  clearTimeout(toastTimer);\n  toastTimer = setTimeout(function(){ t.classList.remove(\"on\"); }, 4200);\n}\n\nvar DOWNLOAD_ERRORS = {\n  declined: \"Téléchargement annulé.\",\n  too_large: \"Le classeur dépasse 16 Mo. Restreins la période ou décoche des feuilles.\",\n  rate_limited: \"Une autre demande d'enregistrement est déjà ouverte. Réessaie dans un instant.\",\n  rejected_extension: \"Ce format de fichier n'est pas accepté ici.\",\n  unavailable: \"L'enregistrement de fichiers n'est pas disponible dans cette vue.\"\n};\n\nfunction saveFile(filename, data, mime){\n  var claudeApi = window.claude;\n  if(claudeApi && typeof claudeApi.use === \"function\"){\n    claudeApi.use(\"downloads\").then(function(dl){\n      if(!dl){ toast(DOWNLOAD_ERRORS.unavailable); return; }\n      return dl.save({ filename: filename, data: data }).then(function(res){\n        if(res && res.status === \"saved\") toast(\"Classeur enregistré : \" + filename);\n      });\n    }).catch(function(err){\n      toast(DOWNLOAD_ERRORS[err && err.code] || \"L'enregistrement n'a pas abouti.\");\n    });\n    return;\n  }\n  var blob = data instanceof Blob ? data : new Blob([data], { type: mime || \"application/octet-stream\" });\n  var url = URL.createObjectURL(blob);\n  var a = document.createElement(\"a\");\n  a.href = url; a.download = filename;\n  document.body.appendChild(a); a.click(); a.remove();\n  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);\n  toast(\"Fichier téléchargé : \" + filename);\n}\n\nfunction exportModel(){\n  var m = built.model, bySheet = {}, any = false;\n  state.model.sheets.forEach(function(s){\n    var b = m.bySheet[s.name];\n    var list = b ? b.add.filter(function(e){ return e.included; }) : [];\n    if(list.length){ bySheet[s.name] = list; any = true; }\n  });\n  if(!any){ toast(\"Aucune ligne à ajouter.\"); return; }\n  $(\"xlsx\").disabled = true;\n  writeModel(state.model.buffer, state.model.sheets, bySheet).then(function(buf){\n    var base = state.model.fileName.replace(/\\.xlsx$/i, \"\");\n    saveFile(base + \" - rempli.xlsx\", buf, \"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet\");\n  }).catch(function(e){\n    toast(\"Le remplissage a échoué : \" + e.message);\n  }).then(function(){\n    $(\"xlsx\").disabled = false;\n  });\n}\n\nfunction exportXlsx(){\n  if(!built) return;\n  if(state.model){ exportModel(); return; }\n  var wb = buildWorkbook();\n  if(!wb){ toast(\"Coche au moins une feuille à exporter.\"); return; }\n  $(\"xlsx\").disabled = true;\n  setTimeout(function(){\n    try{\n      var buf = XLSX.write(wb, { bookType: \"xlsx\", type: \"array\", cellDates: true });\n      saveFile(outName(\"xlsx\"), buf, \"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet\");\n    } catch(e){\n      toast(\"La génération du classeur a échoué : \" + e.message);\n    } finally {\n      $(\"xlsx\").disabled = false;\n    }\n  }, 30);\n}\n\nfunction exportCsv(){\n  if(!built || state.model) return;\n  var sheet = built[state.tab];\n  if(!sheet) return;\n  var aoa = sheetToAoa(sheet).map(function(row){\n    return row.map(function(v){\n      if(v instanceof Date) return fmtDate(v);\n      if(typeof v === \"number\") return String(v).replace(\".\", \",\");\n      var s = String(v === null || v === undefined ? \"\" : v);\n      return /[\";\\n]/.test(s) ? '\"' + s.replace(/\"/g, '\"\"') + '\"' : s;\n    }).join(\";\");\n  }).join(\"\\n\");\n  var label = SHEETS.filter(function(s){ return s.id === state.tab; })[0].label;\n  saveFile(outName(\"csv\").replace(\".csv\", \"-\" + deaccent(label).replace(/\\s+/g, \"-\") + \".csv\"),\n           \"\\uFEFF\" + aoa, \"text/csv;charset=utf-8\");\n}\n\n/* ============================================================\n   10. Chargement des fichiers\n   ============================================================ */\n\nfunction guessChatName(fileName, msgs){\n  var n = fileName.replace(/\\.(txt|zip)$/i, \"\");\n  var m = /(?:chat with|discussion avec|conversation avec|دردشة مع)\\s+(.+)$/i.exec(n);\n  if(m) return m[1].trim();\n  if(/^(_?chat|whatsapp.*)$/i.test(n)) return topAuthors(msgs, 3).join(\" & \") || n;\n  return n;\n}\n\nfunction autoRoutes(){\n  if(!state.model || !state.parsed) return;\n  var sheets = state.model.sheets;\n  topAuthors(state.parsed.messages, 999).forEach(function(a){\n    if(state.routes[a]) return;\n    var da = deaccent(a), match = \"\";\n    sheets.forEach(function(s){\n      if(s.kind === \"transferts\" || match) return;\n      var ds = deaccent(s.name);\n      if(da.indexOf(ds) >= 0 || ds.indexOf(da) >= 0) match = s.name;\n    });\n    state.routes[a] = match || \"__ignore__\";\n  });\n}\n\nfunction loadText(text, fileName, mediaFiles){\n  var parsed = parseChat(text, $(\"dateOrder\") ? $(\"dateOrder\").value : \"auto\");\n  if(!parsed.messages.length){\n    toast(\"Aucun message reconnu dans ce fichier. Est-ce bien l'export d'une discussion WhatsApp ?\");\n    return;\n  }\n  state.rawText = text;\n  state.fileName = fileName;\n  state.mediaFiles = mediaFiles || [];\n  state.parsed = parsed;\n  state.chatName = guessChatName(fileName, parsed.messages);\n  state.me = topAuthors(parsed.messages, 1)[0] || \"\";\n  state.filters = { author: \"\", q: \"\", from: \"\", to: \"\" };\n  state.excluded = {};\n  state.routes = {};\n  state.tab = state.model ? \"\" : \"messages\";\n\n  $(\"fileName\").textContent = fileName;\n  $(\"intake\").hidden = true;\n  $(\"steps\").hidden = true;\n  $(\"workspace\").hidden = false;\n  $(\"fQuery\").value = \"\"; $(\"fFrom\").value = \"\"; $(\"fTo\").value = \"\";\n  autoRoutes();\n  renderControls();\n  render();\n  window.scrollTo({ top: 0, behavior: \"smooth\" });\n}\n\nfunction decode(buffer){\n  var bytes = new Uint8Array(buffer);\n  if(bytes.length > 1 && bytes[0] === 0xFF && bytes[1] === 0xFE) return new TextDecoder(\"utf-16le\").decode(buffer);\n  if(bytes.length > 1 && bytes[0] === 0xFE && bytes[1] === 0xFF) return new TextDecoder(\"utf-16be\").decode(buffer);\n  return new TextDecoder(\"utf-8\").decode(buffer);\n}\n\nfunction handleChatFile(file){\n  if(!file) return;\n  var isZip = /\\.zip$/i.test(file.name);\n  var reader = new FileReader();\n  reader.onload = function(){\n    if(isZip){\n      if(typeof JSZip === \"undefined\"){ toast(\"Le lecteur d'archives n'a pas pu être chargé. Dépose le fichier .txt à la place.\"); return; }\n      JSZip.loadAsync(reader.result).then(function(zip){\n        var txt = null, media = [];\n        zip.forEach(function(path, entry){\n          if(entry.dir) return;\n          if(/\\.txt$/i.test(path) && !txt) txt = entry;\n          else media.push(path.split(\"/\").pop());\n        });\n        if(!txt){ toast(\"Aucun fichier .txt trouvé dans l'archive.\"); return; }\n        var name = file.name.replace(/\\.zip$/i, \"\");\n        txt.async(\"arraybuffer\").then(function(buf){ loadText(decode(buf), name, media); });\n      }).catch(function(){ toast(\"Archive illisible. Dépose le fichier .txt directement.\"); });\n    } else {\n      loadText(decode(reader.result), file.name, []);\n    }\n  };\n  reader.onerror = function(){ toast(\"Impossible de lire ce fichier.\"); };\n  reader.readAsArrayBuffer(file);\n}\n\nfunction handleModelFile(file){\n  if(!file) return;\n  if(!/\\.xlsx$/i.test(file.name)){\n    toast(\"Le classeur doit être au format .xlsx (pas .xls ni .csv).\");\n    return;\n  }\n  var reader = new FileReader();\n  reader.onload = function(){\n    var buffer = reader.result;\n    readModel(buffer).then(function(model){\n      if(!model.sheets.length){\n        toast(\"Aucune feuille avec des en-têtes en ligne 1 n'a été trouvée dans ce classeur.\");\n        return;\n      }\n      state.model = { fileName: file.name, buffer: buffer, sheets: model.sheets };\n      state.excluded = {};\n      state.routes = {};\n      var chip = $(\"modelChip\");\n      chip.hidden = false;\n      chip.textContent = file.name + \" · \" + model.sheets.length + \" feuilles\";\n      var slot = $(\"dropModel\");\n      slot.classList.add(\"done\");\n      if(state.parsed){\n        state.tab = \"\";\n        autoRoutes();\n        render();\n        toast(\"Classeur lu : \" + model.sheets.map(function(s){ return s.name; }).join(\", \"));\n      } else {\n        toast(\"Classeur prêt. Dépose maintenant la discussion WhatsApp.\");\n      }\n    }).catch(function(e){\n      toast(\"Ce classeur n'a pas pu être lu : \" + e.message);\n    });\n  };\n  reader.onerror = function(){ toast(\"Impossible de lire ce fichier.\"); };\n  reader.readAsArrayBuffer(file);\n}\n\n/* ============================================================\n   11. Exemple de démonstration (données fictives)\n   ============================================================ */\n\nvar DEMO = [\n  \"24/08/2026, 09:04 - Les messages sont chiffrés de bout en bout.\",\n  \"24/08/2026, 09:30 - Driss: 💵49920dhs de driss à hafid par at to hd\",\n  \"24/08/2026, 09:31 - Hafid: Reçu, merci\",\n  \"27/08/2026, 11:12 - Hafid: 70dh frais ghazala récupération BBU\",\n  \"27/08/2026, 14:05 - Hafid: 250dhs taxi + livraison matériel site Ain Sebaa\",\n  \"28/08/2026, 08:40 - Driss: 1200 dhs avance équipe fibre\",\n  \"28/08/2026, 09:02 - Hafid: \u003cMédias omis>\",\n  \"29/08/2026, 17:22 - Hafid: 340dh carburant tournée Casa - Berrechid\",\n  \"01/09/2026, 10:15 - Driss: 15000dhs versement à hafid pour achat câbles\",\n  \"02/09/2026, 12:48 - Driss: 900dhs reste electricien\",\n  \"02/09/2026, 19:03 - Hafid: ok noté\",\n  \"03/09/2026, 08:20 - Driss: 480 dh location nacelle demi-journée\"\n].join(\"\\n\");\n\n/* ============================================================\n   12. Câblage\n   ============================================================ */\n\n$(\"pickChat\").onclick = function(){ $(\"fileChat\").click(); };\n$(\"fileChat\").onchange = function(e){ handleChatFile(e.target.files[0]); e.target.value = \"\"; };\n$(\"pickModel\").onclick = function(){ $(\"fileModel\").click(); };\n$(\"changeModel\").onclick = function(){ $(\"fileModel\").click(); };\n$(\"fileModel\").onchange = function(e){ handleModelFile(e.target.files[0]); e.target.value = \"\"; };\n$(\"demo\").onclick = function(){\n  loadText(DEMO, \"Discussion Telecom (exemple).txt\", []);\n  toast(\"Exemple fictif chargé — remplace-le par ton propre export.\");\n};\n$(\"change\").onclick = function(){\n  $(\"workspace\").hidden = true;\n  $(\"intake\").hidden = false;\n  $(\"steps\").hidden = false;\n  state.parsed = null;\n  built = null;\n};\n\nfunction wireDrop(el, handler){\n  [\"dragenter\", \"dragover\"].forEach(function(ev){\n    el.addEventListener(ev, function(e){ e.preventDefault(); el.classList.add(\"over\"); });\n  });\n  [\"dragleave\", \"drop\"].forEach(function(ev){\n    el.addEventListener(ev, function(e){ e.preventDefault(); el.classList.remove(\"over\"); });\n  });\n  el.addEventListener(\"drop\", function(e){\n    if(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) handler(e.dataTransfer.files[0]);\n  });\n}\nwireDrop($(\"dropChat\"), handleChatFile);\nwireDrop($(\"dropModel\"), handleModelFile);\n\n$(\"dateOrder\").onchange = function(){\n  if(!state.rawText) return;\n  state.parsed = parseChat(state.rawText, this.value);\n  render();\n};\n$(\"me\").onchange = function(){ state.me = this.value; render(); };\n$(\"keywords\").oninput = debounce(function(){\n  state.keywords = this.value.split(\",\").map(function(s){ return s.trim(); }).filter(Boolean);\n  render();\n}, 350);\n$(\"fAuthor\").onchange = function(){ state.filters.author = this.value; render(); };\n$(\"fQuery\").oninput = debounce(function(){ state.filters.q = this.value.trim(); render(); }, 300);\n$(\"fFrom\").onchange = function(){ state.filters.from = this.value; render(); };\n$(\"fTo\").onchange = function(){ state.filters.to = this.value; render(); };\n$(\"xlsx\").onclick = exportXlsx;\n$(\"csv\").onclick = exportCsv;\n\nfunction debounce(fn, ms){\n  var t = null;\n  return function(){\n    var self = this, args = arguments;\n    clearTimeout(t);\n    t = setTimeout(function(){ fn.apply(self, args); }, ms);\n  };\n}\n\n})();\n\u003c/script>\n\n\u003c/body>\u003c/html>"},{"id":"lancement","nom":"Lancement COD","emoji":"🚀","quoi":"Le dossier de campagne de septembre — cinq produits, cinq packs.","pont":false,"html":"\u003c!doctype html>\u003chtml>\u003chead>\u003cmeta charset=utf8>\u003cmeta name=viewport content=\"width=device-width,initial-scale=1\">\u003cstyle>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found]){display:none!important}\u003c/style>\u003c/head>\u003cbody>\n\u003ctitle>Lancement COD Septembre\u003c/title>\r\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\r\n\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\r\n\u003clink rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Cairo:wght@400;600;700&display=swap\">\r\n\u003cstyle>\r\n:root{\r\n --ground:#f6f3ec; --surface:#fffdf8; --surface2:#efeae0;\r\n --ink:#16211f; --ink2:#4a5754; --ink3:#7b8785;\r\n --line:#ded7c9; --line2:#eae4d8;\r\n --teal:#304f4f; --ochre:#8d530d; --sage:#6b8e80; --panel:#304f4f;\r\n --good:#4a7c59; --warn:#a8761b; --weak:#8a8578;\r\n --shadow:0 1px 2px rgba(22,33,31,.05),0 8px 28px rgba(22,33,31,.06);\r\n --f-disp:'Fraunces',Georgia,serif;\r\n --f-body:'Archivo','Segoe UI',system-ui,sans-serif;\r\n --f-mono:'JetBrains Mono',ui-monospace,monospace;\r\n --f-ar:'Cairo','Segoe UI',Tahoma,sans-serif;\r\n}\r\n@media (prefers-color-scheme:dark){\r\n :root:not([data-theme=\"light\"]){\r\n  --ground:#121a19; --surface:#1a2423; --surface2:#222d2c;\r\n  --ink:#eae5db; --ink2:#a8b2af; --ink3:#7d8785;\r\n  --line:#2c3937; --line2:#243130;\r\n  --teal:#7fa8a0; --ochre:#d0973f; --sage:#8fae9f; --panel:#24393a;\r\n  --good:#6fa87c; --warn:#d8a94a; --weak:#8a8578;\r\n  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.34);\r\n }\r\n}\r\n:root[data-theme=\"dark\"]{\r\n --ground:#121a19; --surface:#1a2423; --surface2:#222d2c;\r\n --ink:#eae5db; --ink2:#a8b2af; --ink3:#7d8785;\r\n --line:#2c3937; --line2:#243130;\r\n --teal:#7fa8a0; --ochre:#d0973f; --sage:#8fae9f; --panel:#24393a;\r\n --good:#6fa87c; --warn:#d8a94a; --weak:#8a8578;\r\n --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.34);\r\n}\r\n*{box-sizing:border-box}\r\na{color:var(--ochre)}\r\na:focus-visible{outline:2px solid var(--ochre);outline-offset:2px}\r\nbody{margin:0;background:var(--ground);color:var(--ink);\r\n font-family:var(--f-body);font-size:15px;line-height:1.6;\r\n -webkit-font-smoothing:antialiased}\r\n.wrap{max-width:1080px;margin:0 auto;padding:0 22px 90px}\r\n.ar-t,.ar-b{font-family:var(--f-ar);direction:rtl;text-align:right}\r\n\r\n/* ---- entete ---- */\r\n.masthead{padding:56px 0 34px;border-bottom:2px solid var(--ink);margin-bottom:34px}\r\n.kick{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.17em;text-transform:uppercase;\r\n color:var(--ochre);margin:0 0 16px;font-weight:600}\r\nh1{font-family:var(--f-disp);font-size:clamp(38px,6.4vw,66px);line-height:1.02;margin:0 0 18px;\r\n font-weight:600;letter-spacing:-.022em;text-wrap:balance;font-variation-settings:'SOFT' 0,'WONK' 1}\r\n.lede{font-size:17.5px;color:var(--ink2);max-width:60ch;margin:0}\r\n.srcbar{display:flex;flex-wrap:wrap;gap:0;margin-top:30px;border:1px solid var(--line);\r\n border-radius:9px;overflow:hidden;background:var(--surface)}\r\n.srcbar div{flex:1 1 150px;padding:15px 17px;border-right:1px solid var(--line2)}\r\n.srcbar div:last-child{border-right:0}\r\n.srcbar span{display:block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.13em;\r\n text-transform:uppercase;color:var(--ink3);margin-bottom:5px}\r\n.srcbar b{font-family:var(--f-disp);font-size:25px;font-weight:600;\r\n font-variant-numeric:tabular-nums;letter-spacing:-.01em}\r\n\r\n/* ---- hypotheses ---- */\r\n.hyp{background:var(--panel);color:#fff;border-radius:11px;padding:24px 26px;margin-bottom:44px}\r\n.hyp h2{font-family:var(--f-disp);font-size:20px;margin:0 0 6px;font-weight:600;color:#fff}\r\n.hyp p{margin:0 0 16px;opacity:.8;font-size:14px;max-width:64ch}\r\n.hypg{display:flex;flex-wrap:wrap;gap:10px}\r\n.hypg div{background:rgba(255,255,255,.11);border:1px solid rgba(255,255,255,.16);\r\n border-radius:7px;padding:9px 14px;font-size:13.5px}\r\n.hypg b{font-family:var(--f-mono);font-weight:600}\r\n\r\n/* ---- sections ---- */\r\n.corr{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--ochre);\r\n border-radius:0 12px 12px 0;padding:24px 28px;margin-bottom:20px;box-shadow:var(--shadow)}\r\n.corr h2{font-family:var(--f-disp);font-size:20px;margin:0 0 10px;font-weight:600}\r\n.corr p{margin:0 0 10px;color:var(--ink2);max-width:68ch;font-size:14.5px}\r\n.corr p:last-child{margin-bottom:0} .corr b{color:var(--ink)}\r\n.metrics i{display:block;font-style:normal;font-family:var(--f-mono);font-size:9.5px;\r\n color:var(--ink3);margin-top:4px;line-height:1.4}\r\n.sect{margin:0 0 26px;padding-top:14px}\r\n.sect h2{font-family:var(--f-disp);font-size:31px;font-weight:600;margin:0 0 6px;\r\n letter-spacing:-.018em;font-variation-settings:'WONK' 1}\r\n.sect p.sub{color:var(--ink2);margin:0 0 26px;font-size:15.5px;max-width:66ch}\r\n\r\n/* ---- carte item ---- */\r\n.item{background:var(--surface);border:1px solid var(--line);border-radius:13px;\r\n padding:26px 28px;margin-bottom:20px;box-shadow:var(--shadow)}\r\n.ih{display:flex;gap:26px;align-items:flex-start;flex-wrap:wrap}\r\n.ihl{flex:1 1 340px;min-width:0}\r\n.eyebrow{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;\r\n color:var(--ochre);margin:0 0 8px;font-weight:600}\r\n.ih h3{font-family:var(--f-disp);font-size:24px;font-weight:600;margin:0 0 5px;\r\n line-height:1.2;letter-spacing:-.014em;text-wrap:balance}\r\n.ar-t{font-size:17px;color:var(--ink2);margin:0 0 11px}\r\n.angle{font-size:14.5px;color:var(--ink2);margin:0}\r\n.angle b{color:var(--ink);font-weight:600}\r\n.ihr{text-align:right;flex:0 0 auto}\r\n.pxbig{font-family:var(--f-disp);font-size:44px;font-weight:700;line-height:1;\r\n letter-spacing:-.028em;font-variant-numeric:tabular-nums}\r\n.pxbig small{font-size:17px;font-weight:600;margin-left:4px;color:var(--ink2)}\r\n.ihr s{color:var(--ink3);font-size:15px;font-family:var(--f-mono)}\r\n.score{display:flex;align-items:center;gap:8px;justify-content:flex-end;margin-top:10px}\r\n.sbar{width:78px;height:6px;background:var(--surface2);border-radius:99px;overflow:hidden}\r\n.sbar i{display:block;height:100%;background:var(--sage);border-radius:99px}\r\n.score span{font-family:var(--f-mono);font-size:13px;font-weight:600}\r\n.score small{color:var(--ink3);font-weight:400}\r\n\r\n.ev{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin:18px 0 0;padding:10px 14px;\r\n border-radius:8px;background:var(--surface2);font-size:13px;font-weight:600}\r\n.ev em{font-style:normal;font-weight:400;color:var(--ink2)}\r\n.ev .dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px}\r\n.ev-forte .dot{background:var(--good)} .ev-forte{color:var(--good)}\r\n.ev-correcte .dot{background:var(--sage)} .ev-correcte{color:var(--sage)}\r\n.ev-moyenne .dot{background:var(--warn)} .ev-moyenne{color:var(--warn)}\r\n.ev-faible .dot{background:var(--weak)} .ev-faible{color:var(--weak)}\r\n\r\n.compo{list-style:none;padding:0;margin:18px 0 0;border:1px solid var(--line2);border-radius:9px;\r\n overflow:hidden}\r\n.compo li{display:flex;justify-content:space-between;gap:14px;padding:11px 15px;\r\n border-bottom:1px solid var(--line2);font-size:14.5px;background:var(--surface)}\r\n.compo li:last-child{border-bottom:0}\r\n.compo li b{font-family:var(--f-mono);font-weight:600;white-space:nowrap}\r\n.compo .tot{background:var(--surface2);color:var(--ink2)}\r\n\r\n.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:1px;\r\n background:var(--line2);border:1px solid var(--line2);border-radius:9px;overflow:hidden;margin:18px 0 22px}\r\n.metrics div{background:var(--surface);padding:13px 15px}\r\n.metrics span{display:block;font-family:var(--f-mono);font-size:10px;letter-spacing:.11em;\r\n text-transform:uppercase;color:var(--ink3);margin-bottom:4px}\r\n.metrics b{font-family:var(--f-disp);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;\r\n letter-spacing:-.014em}\r\n.metrics .hi{background:var(--panel)}\r\n.metrics .hi span{color:rgba(255,255,255,.66)}\r\n.metrics .hi b{color:#fff}\r\n\r\n/* ---- onglets ---- */\r\n.tabs nav{display:flex;gap:3px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:18px}\r\n.tabs button[role=tab]{font-family:var(--f-body);font-size:13.5px;font-weight:600;\r\n background:none;border:0;border-bottom:2px solid transparent;color:var(--ink3);\r\n padding:9px 14px;cursor:pointer;margin-bottom:-1px;border-radius:5px 5px 0 0}\r\n.tabs button[role=tab]:hover{color:var(--ink)}\r\n.tabs button[aria-selected=true]{color:var(--ochre);border-bottom-color:var(--ochre)}\r\n.tabs button:focus-visible{outline:2px solid var(--ochre);outline-offset:2px}\r\n\r\n.fieldrow{display:flex;justify-content:space-between;align-items:center;margin:16px 0 7px}\r\n.fieldrow:first-child{margin-top:0}\r\nlabel{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;\r\n color:var(--ink3);font-weight:600}\r\n.cp{font-family:var(--f-body);font-size:11.5px;font-weight:600;background:var(--surface2);\r\n border:1px solid var(--line);color:var(--ink2);padding:4px 11px;border-radius:6px;cursor:pointer}\r\n.cp:hover{border-color:var(--ochre);color:var(--ochre)}\r\n.cp:focus-visible{outline:2px solid var(--ochre);outline-offset:2px}\r\n.cp.ok{background:var(--good);border-color:var(--good);color:#fff}\r\npre{white-space:pre-wrap;word-wrap:break-word;background:var(--surface2);border:1px solid var(--line2);\r\n border-radius:9px;padding:16px 18px;margin:0;font-size:15px;line-height:1.85;font-family:var(--f-ar)}\r\n.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}\r\n.mono{font-family:var(--f-mono);font-size:13.5px;background:var(--surface2);\r\n border:1px solid var(--line2);border-radius:7px;padding:10px 13px;margin:0}\r\n.hookline{margin-top:18px;padding:14px 17px;border-left:3px solid var(--ochre);\r\n background:var(--surface2);border-radius:0 8px 8px 0}\r\n.hookline span{display:block;font-family:var(--f-mono);font-size:10px;letter-spacing:.13em;\r\n text-transform:uppercase;color:var(--ochre);margin-bottom:6px;font-weight:600}\r\n.hookline p{margin:0;font-size:18px;font-weight:600}\r\n\r\ntable{width:100%;border-collapse:collapse;font-size:14px}\r\n.sct th{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;\r\n color:var(--ink3);text-align:left;padding:8px 12px;border-bottom:1px solid var(--line)}\r\n.sct td{padding:11px 12px;border-bottom:1px solid var(--line2);vertical-align:top}\r\n.sct td.t{font-family:var(--f-mono);font-size:12.5px;white-space:nowrap;color:var(--ochre);font-weight:600}\r\n.sct td.b{font-weight:600;white-space:nowrap;font-size:12.5px;letter-spacing:.03em}\r\n.spec td{padding:9px 12px;border-bottom:1px solid var(--line2)}\r\n.spec td:first-child{font-weight:600;width:38%}\r\n\r\nh4{font-family:var(--f-disp);font-size:17px;font-weight:600;margin:22px 0 10px}\r\n.promesse{font-size:16.5px;color:var(--ink2);margin:0;font-style:italic}\r\nul.ben{padding-left:19px;margin:0}\r\nul.ben li{margin-bottom:7px}\r\n.obj{border-left:3px solid var(--sage);padding:2px 0 2px 14px;margin-bottom:13px}\r\n.obj .q,.qa .q{font-weight:600;margin:0 0 3px;color:var(--ochre)}\r\n.obj p,.qa p{margin:0;font-size:14.5px;color:var(--ink2)}\r\n.qa{margin-bottom:12px}\r\n.lpnote{margin-top:20px;padding-top:14px;border-top:1px solid var(--line2);\r\n font-size:13px;color:var(--ink3)}\r\ncode{font-family:var(--f-mono);font-size:12.5px;background:var(--surface2);\r\n padding:2px 6px;border-radius:4px;color:var(--ink2)}\r\n\r\n/* ---- plan / limites ---- */\r\n.plan{background:var(--surface);border:1px solid var(--line);border-radius:13px;\r\n padding:28px 30px;box-shadow:var(--shadow);margin-bottom:20px}\r\n.plan ol{margin:0;padding-left:20px}\r\n.plan li{margin-bottom:13px}\r\n.plan li b{font-weight:600}\r\n.warn{border-left:3px solid var(--ochre);background:var(--surface);border:1px solid var(--line);\r\n border-left:3px solid var(--ochre);border-radius:0 11px 11px 0;padding:24px 28px}\r\n.warn h3{font-family:var(--f-disp);font-size:19px;margin:0 0 12px;font-weight:600}\r\n.warn ul{margin:0;padding-left:19px}\r\n.warn li{margin-bottom:9px;font-size:14.5px;color:var(--ink2)}\r\n.warn li b{color:var(--ink)}\r\nfooter{margin-top:40px;padding-top:22px;border-top:1px solid var(--line);\r\n font-size:13px;color:var(--ink3)}\r\n@media(max-width:700px){\r\n .two{grid-template-columns:1fr}\r\n .ihr{text-align:left} .score{justify-content:flex-start}\r\n .item{padding:22px 19px}\r\n}\r\n@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}\r\n\u003c/style>\r\n\r\n\u003cdiv class=\"wrap\">\r\n\u003cheader class=\"masthead\">\r\n \u003cp class=\"kick\">Espion COD + Radar Produit Gagnant · 4 septembre 2026\u003c/p>\r\n \u003ch1>Cinq produits, cinq packs, prêts à lancer\u003c/h1>\r\n \u003cp class=\"lede\">Sélection tirée de la base réelle d'Espion COD et des captures de l'extension Radar,\r\n  chiffrée sur les hypothèses COD de la boutique. Chaque fiche porte son annonce Meta, sa légende\r\n  TikTok, son script vidéo et sa landing page.\u003c/p>\r\n \u003cdiv class=\"srcbar\">\r\n  \u003cdiv>\u003cspan>Produits scannés\u003c/span>\u003cb>58 400\u003c/b>\u003c/div>\r\n  \u003cdiv>\u003cspan>Boutiques suivies\u003c/span>\u003cb>77\u003c/b>\u003c/div>\r\n  \u003cdiv>\u003cspan>Estimations de ventes\u003c/span>\u003cb>100 429\u003c/b>\u003c/div>\r\n  \u003cdiv>\u003cspan>Gagnants potentiels\u003c/span>\u003cb>44\u003c/b>\u003c/div>\r\n  \u003cdiv>\u003cspan>Retenus\u003c/span>\u003cb>10\u003c/b>\u003c/div>\r\n \u003c/div>\r\n\u003c/header>\r\n\r\n\u003cdiv class=\"corr\">\r\n \u003ch2>Coûts corrigés le 4 septembre\u003c/h2>\r\n \u003cp>Les coûts d'achat de cette page ne sont plus des estimations : ce sont les prix de gros\r\n  relevés sur eGRO. Deux conséquences. \u003cb>Le set de pots à épices tombe à 6 DH de CPA maximum\r\n  et n'est plus lançable à 199 DH.\u003c/b> Les bocaux et le Pack Cuisine passent sous les 55 DH —\r\n  jouables, mais sans confort. \u003cb>Seul l'appareil photo enfant reste une estimation\u003c/b> :\r\n  aucune source de gros marocaine ne le référence.\u003c/p>\r\n \u003cp>\u003ca href=\"https://claude.ai/code/artifact/f1db90f0-731e-4727-99f5-9821906425aa\">Voir le dossier de sourcing\u003c/a> — prix relevés, routes d'achat et carnet d'adresses.\u003c/p>\r\n\u003c/div>\r\n\u003cdiv class=\"hyp\">\r\n \u003ch2>Le modèle économique appliqué\u003c/h2>\r\n \u003cp>Tous les CPA maximum ci-dessous sortent du même calcul, sur une base de 100 commandes.\r\n  Le CPA maximum est le coût d'acquisition au-delà duquel le produit perd de l'argent — pas un objectif,\r\n  un plafond.\u003c/p>\r\n \u003cdiv class=\"hypg\">\r\n  \u003cdiv>Confirmées \u003cb>85 %\u003c/b>\u003c/div>\r\n  \u003cdiv>Livrées \u003cb>70 %\u003c/b>\u003c/div>\r\n  \u003cdiv>Livraison \u003cb>35 DH\u003c/b>\u003c/div>\r\n  \u003cdiv>Refus \u003cb>25 DH\u003c/b>\u003c/div>\r\n  \u003cdiv>Fenêtre COD \u003cb>149–499 DH\u003c/b>\u003c/div>\r\n  \u003cdiv>CPA moyen produits \u003cb>63 DH\u003c/b>\u003c/div>\r\n  \u003cdiv>CPA moyen packs \u003cb>93 DH\u003c/b>\u003c/div>\r\n \u003c/div>\r\n\u003c/div>\r\n\r\n\u003csection class=\"sect\">\r\n \u003ch2>Les cinq produits\u003c/h2>\r\n \u003cp class=\"sub\">Classés par force de la preuve, pas par score. Un score élevé sur une boutique sans\r\n  trafic ne vaut pas une série de ventes observée sur onze jours.\u003c/p>\r\n\u003c/section>\r\n\r\n\u003carticle class=\"item\" id=\"bocaux\">\r\n \u003cheader class=\"ih\">\r\n  \u003cdiv class=\"ihl\">\r\n   \u003cp class=\"eyebrow\">Espion COD · justyol.com\u003c/p>\r\n   \u003ch3>Set 12 Bocaux Carrés 1700 ml — Cuisine Rangée en 10 Minutes\u003c/h3>\r\n   \u003cp class=\"ar-t\">طقم 12 بوكال مربع 1700 مل — كوزينة مرتبة ف 10 دقايق\u003c/p>\r\n   \u003cp class=\"angle\">\u003cb>Angle —\u003c/b> La honte du placard ouvert devant les invités → placard de magazine\u003c/p>\r\n  \u003c/div>\r\n  \u003cdiv class=\"ihr\">\r\n   \u003cdiv class=\"pxbig\">249\u003csmall>DH\u003c/small>\u003c/div>\r\n   \r\n   \u003cdiv class=\"score\">\u003cdiv class=\"sbar\">\u003ci style=\"width:85%\">\u003c/i>\u003c/div>\u003cspan>85\u003csmall>/100\u003c/small>\u003c/span>\u003c/div>\r\n  \u003c/div>\r\n \u003c/header>\r\n \u003cdiv class=\"ev ev-forte\">\u003cspan class=\"dot\">\u003c/span>Preuve forte\u003cem>20.88 ventes/jour estimées sur 11 jours de suivi\u003c/em>\u003c/div>\r\n \r\n \u003cdiv class=\"metrics\">\r\n  \u003cdiv>\u003cspan>Coût réel\u003c/span>\u003cb>135 DH\u003c/b>\u003ci>eGRO : lot 7 boîtes hermétiques 80 MAD → ≈135 pour 12\u003c/i>\u003c/div>\r\n  \u003cdiv>\u003cspan>Marge unitaire\u003c/span>\u003cb>114 DH\u003c/b>\u003c/div>\r\n  \u003cdiv>\u003cspan>Multiple\u003c/span>\u003cb>×1.84\u003c/b>\u003c/div>\r\n  \u003cdiv class=\"hi\">\u003cspan>CPA maximum\u003c/span>\u003cb>51.5 DH\u003c/b>\u003c/div>\r\n  \u003cdiv>\u003cspan>Net / livrée\u003c/span>\u003cb>73.6 DH\u003c/b>\u003c/div>\r\n \u003c/div>\r\n\r\n \u003cdiv class=\"tabs\" data-tabs>\r\n  \u003cnav role=\"tablist\">\r\n   \u003cbutton role=\"tab\" aria-selected=\"true\" data-p=\"meta\">Annonce Meta\u003c/button>\r\n   \u003cbutton role=\"tab\" aria-selected=\"false\" data-p=\"tk\">TikTok\u003c/button>\r\n   \u003cbutton role=\"tab\" aria-selected=\"false\" data-p=\"sc\">Script vidéo\u003c/button>\r\n   \u003cbutton role=\"tab\" aria-selected=\"false\" data-p=\"fp\">Fiche produit\u003c/button>\r\n  \u003c/nav>\r\n\r\n  \u003csection role=\"tabpanel\" data-p=\"meta\">\r\n   \u003cdiv class=\"fieldrow\">\u003clabel>Texte principal\u003c/label>\r\n    \u003cbutton class=\"cp\" type=\"button\" data-copy=\"m-bocaux\">Copier\u003c/button>\u003c/div>\r\n   \u003cpre class=\"ar-b\" id=\"m-bocaux\">الكوزينة ديالك عامرة بالساشي المحلولين والعطريات مخلطين؟ 😩\r\n\r\nطقم 12 بوكال مربع 1700 مل — مربعين ماشي مدورين، يعني كيتراكبو فوق بعضياتهم بلا ما يضيع ولو سنتيمتر.\r\n\r\n✅ 12 بوكال بحجم كبير (1.7 لتر لكل واحد)\r\n✅ غطا محكم — الزيت والسكر والدقيق ما كيدخلهم لا هواء لا رطوبة\r\n✅ مربعين = تربح ثلث البلاصة ف البلاكار\r\n✅ شفافين — كتشوف شنو باقي عندك بلا ما تحل\r\n✅ صالحين للغسيل ف الماكينة\r\n\r\nالثمن: 249 درهم بدل 448 درهم\r\n🚚 الدفع عند الاستلام — كتخلص منين توصلك\r\n📦 التوصيل ل جميع المدن\r\n\r\nالكمية محدودة — سير دابا 👇\u003c/pre>\r\n   \u003cdiv class=\"two\">\r\n    \u003cdiv>\u003cdiv class=\"fieldrow\">\u003clabel>Titre\u003c/label>\r\n      \u003cbutton class=\"cp\" type=\"button\" data-copy=\"mh-bocaux\">Copier\u003c/button>\u003c/div>\r\n     \u003cp class=\"mono\" id=\"mh-bocaux\">12 Bocaux 1700 ml — 249 DH au lieu de 448\u003c/p>\u003c/div>\r\n    \u003cdiv>\u003cdiv class=\"fieldrow\">\u003clabel>Description\u003c/label>\r\n      \u003cbutton class=\"cp\" type=\"button\" data-copy=\"md-bocaux\">Copier\u003c/button>\u003c/div>\r\n     \u003cp class=\"mono\" id=\"md-bocaux\">Paiement à la livraison · Livraison partout au Maroc\u003c/p>\u003c/div>\r\n   \u003c/div>\r\n   \u003cdiv class=\"hookline\">\u003cspan>Hook\u003c/span>\u003cp class=\"ar-b\">واش كتحشم تحل البلاكار ديالك قدام الضياف؟\u003c/p>\u003c/div>\r\n  \u003c/section>\r\n\r\n  \u003csection role=\"tabpanel\" data-p=\"tk\" hidden>\r\n   \u003cdiv class=\"fieldrow\">\u003clabel>Légende\u003c/label>\r\n    \u003cbutton class=\"cp\" type=\"button\" data-copy=\"tk-bocaux\">Copier\u003c/button>\u003c/div>\r\n   \u003cpre class=\"ar-b\" id=\"tk-bocaux\">الكوزينة ديالي تبدلات ف 10 دقايق 😳 12 بوكال ب 249 درهم فقط #المغرب #كوزينة #ترتيب #تنظيم #cod #maroc\u003c/pre>\r\n   \u003cdiv class=\"fieldrow\">\u003clabel>Hashtags\u003c/label>\r\n    \u003cbutton class=\"cp\" type=\"button\" data-copy=\"hs-bocaux\">Copier\u003c/button>\u003c/div>\r\n   \u003cpre class=\"ar-b\" id=\"hs-bocaux\">#المغرب #كوزينة #ترتيب_الكوزينة #تنظيم #دارنا #maroc #casablanca #rabat #marrakech #codmaroc\u003c/pre>\r\n  \u003c/section>\r\n\r\n  \u003csection role=\"tabpanel\" data-p=\"sc\" hidden>\r\n   \u003ctable class=\"sct\">\u003cthead>\u003ctr>\u003cth>Temps\u003c/th>\u003cth>Beat\u003c/th>\u003cth>Ce qu'on filme\u003c/th>\u003c/tr>\u003c/thead>\r\n   \u003ctbody>\u003ctr>\u003ctd class=\"t\">0-3 s\u003c/td>\u003ctd class=\"b\">PLAN CHOC\u003c/td>\u003ctd>On ouvre un placard bordélique : sachets ouverts, riz qui coule. Voix : « واش هادي هي الكوزينة ديالك؟ »\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"t\">3-7 s\u003c/td>\u003ctd class=\"b\">AGITATION\u003c/td>\u003ctd>Gros plan sur du sucre renversé, une main qui cherche. « كل نهار كتقلب و ما كتلقى والو »\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"t\">7-14 s\u003c/td>\u003ctd class=\"b\">TRANSFORMATION\u003c/td>\u003ctd>Time-lapse : on remplit les 12 bocaux, on les empile. Son satisfaisant du clip. « 12 بوكال مربع، كيتراكبو فوق بعضياتهم »\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"t\">14-20 s\u003c/td>\u003ctd class=\"b\">PREUVE\u003c/td>\u003ctd>Split-screen avant/après du même placard. « ثلث البلاصة ربحتيها »\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"t\">20-26 s\u003c/td>\u003ctd class=\"b\">LEVÉE D&#x27;OBJECTION\u003c/td>\u003ctd>Main qui retourne un bocal fermé rempli d&#x27;eau : rien ne coule. « غطا محكم 100% »\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"t\">26-30 s\u003c/td>\u003ctd class=\"b\">CTA\u003c/td>\u003ctd>Carton prix 249 DH barré 448. « الدفع عند الاستلام — دق على اللينك »\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\r\n  \u003c/section>\r\n\r\n  \u003csection role=\"tabpanel\" data-p=\"fp\" hidden>\r\n   \u003cp class=\"promesse\">Douze bocaux carrés identiques qui s&#x27;emboîtent : vous gagnez un tiers de place et vous voyez tout d&#x27;un coup d&#x27;œil.\u003c/p>\r\n   \u003ch4>Bénéfices\u003c/h4>\u003cul class=\"ben\">\u003cli>Gain d&#x27;un tiers de place grâce à la forme carrée (les bocaux ronds perdent les angles)\u003c/li>\u003cli>Couvercle à joint : plus de mites alimentaires ni d&#x27;humidité sur la semoule et la farine\u003c/li>\u003cli>Transparents : vous voyez ce qu&#x27;il reste sans ouvrir\u003c/li>\u003cli>Format 1,7 L, le bon volume pour 1 kg de riz, sucre ou légumes secs\u003c/li>\u003cli>Passent au lave-vaisselle et au congélateur\u003c/li>\u003c/ul>\r\n   \u003ch4>Objections traitées\u003c/h4>\u003cdiv class=\"obj\">\u003cp class=\"q\">« C&#x27;est du plastique fragile ? »\u003c/p>\u003cp>PP alimentaire épais, sans BPA. Le couvercle a un joint silicone et 4 clips.\u003c/p>\u003c/div>\u003cdiv class=\"obj\">\u003cp class=\"q\">« 249 DH c&#x27;est cher pour 12 »\u003c/p>\u003cp>Cela fait 20,75 DH le bocal. Un seul bocal en verre coûte plus cher, et un sac de semoule gâché en coûte 40.\u003c/p>\u003c/div>\u003cdiv class=\"obj\">\u003cp class=\"q\">« Et si ça ne me plaît pas ? »\u003c/p>\u003cp>Vous payez à la livraison. Vous ouvrez, vous vérifiez, et vous ne payez que si ça vous convient.\u003c/p>\u003c/div>\r\n   \u003ch4>Caractéristiques\u003c/h4>\u003ctable class=\"spec\">\u003ctr>\u003ctd>Contenance\u003c/td>\u003ctd>1700 ml × 12\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Matière\u003c/td>\u003ctd>Polypropylène alimentaire sans BPA\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Fermeture\u003c/td>\u003ctd>Couvercle à joint + 4 clips\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Lave-vaisselle\u003c/td>\u003ctd>Oui\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Étiquettes\u003c/td>\u003ctd>Incluses\u003c/td>\u003c/tr>\u003c/table>\r\n   \u003ch4>FAQ\u003c/h4>\u003cdiv class=\"qa\">\u003cp class=\"q\">Quelle taille exactement ?\u003c/p>\u003cp>1700 ml chacun, environ 11 × 11 × 18 cm. Les 12 rentrent dans un placard standard de 60 cm.\u003c/p>\u003c/div>\u003cdiv class=\"qa\">\u003cp class=\"q\">Ils vont au micro-ondes ?\u003c/p>\u003cp>Oui pour le contenant, non pour le couvercle fermé (retirez-le d&#x27;abord).\u003c/p>\u003c/div>\u003cdiv class=\"qa\">\u003cp class=\"q\">Je paie quand ?\u003c/p>\u003cp>À la livraison, en espèces, entre les mains du livreur.\u003c/p>\u003c/div>\u003cdiv class=\"qa\">\u003cp class=\"q\">Livraison en combien de temps ?\u003c/p>\u003cp>24 à 48 h à Casablanca et Rabat, 48 à 72 h ailleurs.\u003c/p>\u003c/div>\r\n   \u003cp class=\"lpnote\">Landing page complète générée : \u003ccode>landing/bocaux.html\u003c/code>\r\n    — créas : \u003ccode>creas/bocaux-feed.png\u003c/code>, \u003ccode>creas/bocaux-story.png\u003c/code>\u003c/p>\r\n  \u003c/section>\r\n \u003c/div>\r\n\u003c/article>\r\n\u003carticle class=\"item\" id=\"epices\">\r\n \u003cheader class=\"ih\">\r\n  \u003cdiv class=\"ihl\">\r\n   \u003cp class=\"eyebrow\">Espion COD · justyol.com\u003c/p>\r\n   \u003ch3>Set 12 Pots à Épices + Support Mural — Toutes vos Épices à Portée de Main\u003c/h3>\r\n   \u003cp class=\"ar-t\">طقم 12 بوكال ديال العطريات + ستاند — كل العطريات ف بلاصة وحدة\u003c/p>\r\n   \u003cp class=\"angle\">\u003cb>Angle —\u003c/b> Le tiroir à épices chaotique → mur d&#x27;épices de chef\u003c/p>\r\n  \u003c/div>\r\n  \u003cdiv class=\"ihr\">\r\n   \u003cdiv class=\"pxbig\">199\u003csmall>DH\u003c/small>\u003c/div>\r\n   \r\n   \u003cdiv class=\"score\">\u003cdiv class=\"sbar\">\u003ci style=\"width:84%\">\u003c/i>\u003c/div>\u003cspan>84\u003csmall>/100\u003c/small>\u003c/span>\u003c/div>\r\n  \u003c/div>\r\n \u003c/header>\r\n \u003cdiv class=\"ev ev-forte\">\u003cspan class=\"dot\">\u003c/span>Preuve forte\u003cem>8.67 ventes/jour estimées sur 11 jours de suivi\u003c/em>\u003c/div>\r\n \r\n \u003cdiv class=\"metrics\">\r\n  \u003cdiv>\u003cspan>Coût réel\u003c/span>\u003cb>150 DH\u003c/b>\u003ci>eGRO : étagère 12 bocaux 150 MAD (HAZAR GO)\u003c/i>\u003c/div>\r\n  \u003cdiv>\u003cspan>Marge unitaire\u003c/span>\u003cb>49 DH\u003c/b>\u003c/div>\r\n  \u003cdiv>\u003cspan>Multiple\u003c/span>\u003cb>×1.33\u003c/b>\u003c/div>\r\n  \u003cdiv class=\"hi\">\u003cspan>CPA maximum\u003c/span>\u003cb>6.0 DH\u003c/b>\u003c/div>\r\n  \u003cdiv>\u003cspan>Net / livrée\u003c/span>\u003cb>8.6 DH\u003c/b>\u003c/div>\r\n \u003c/div>\r\n\r\n \u003cdiv class=\"tabs\" data-tabs>\r\n  \u003cnav role=\"tablist\">\r\n   \u003cbutton role=\"tab\" aria-selected=\"true\" data-p=\"meta\">Annonce Meta\u003c/button>\r\n   \u003cbutton role=\"tab\" aria-selected=\"false\" data-p=\"tk\">TikTok\u003c/button>\r\n   \u003cbutton role=\"tab\" aria-selected=\"false\" data-p=\"sc\">Script vidéo\u003c/button>\r\n   \u003cbutton role=\"tab\" aria-selected=\"false\" data-p=\"fp\">Fiche produit\u003c/button>\r\n  \u003c/nav>\r\n\r\n  \u003csection role=\"tabpanel\" data-p=\"meta\">\r\n   \u003cdiv class=\"fieldrow\">\u003clabel>Texte principal\u003c/label>\r\n    \u003cbutton class=\"cp\" type=\"button\" data-copy=\"m-epices\">Copier\u003c/button>\u003c/div>\r\n   \u003cpre class=\"ar-b\" id=\"m-epices\">كل مرة كتطيب، كتقلب ف الطيروار على العطريات و ما كتلقاش 😤\r\n\r\nطقم 12 بوكال ديال العطريات بالستاند — كيتلصق ف الحيط أو داخل باب البلاكار، بلا مسامر بلا تقب.\r\n\r\n✅ 12 بوكال بنفس القياس + 12 معلقة صغيرة\r\n✅ ستاند بلاصق قوي — بلا ما تقب الحيط\r\n✅ إتيكيتات مكتوبين — الكمون، الكركم، راس الحانوت، الفلفل...\r\n✅ غطا محكم — الريحة ما كتخرجش و العطريات ما كتيبساش\r\n✅ كتشد ف الحيط، ف الباب، ولا فوق الطابلة\r\n\r\nالثمن: 199 درهم بدل 285 درهم\r\n🚚 الدفع عند الاستلام\r\n📦 توصيل لجميع المدن\r\n\r\nسير دابا قبل ما تسالي 👇\u003c/pre>\r\n   \u003cdiv class=\"two\">\r\n    \u003cdiv>\u003cdiv class=\"fieldrow\">\u003clabel>Titre\u003c/label>\r\n      \u003cbutton class=\"cp\" type=\"button\" data-copy=\"mh-epices\">Copier\u003c/button>\u003c/div>\r\n     \u003cp class=\"mono\" id=\"mh-epices\">12 Pots à Épices + Support — 199 DH\u003c/p>\u003c/div>\r\n    \u003cdiv>\u003cdiv class=\"fieldrow\">\u003clabel>Description\u003c/label>\r\n      \u003cbutton class=\"cp\" type=\"button\" data-copy=\"md-epices\">Copier\u003c/button>\u003c/div>\r\n     \u003cp class=\"mono\" id=\"md-epices\">Paiement à la livraison · Sans percer le mur\u003c/p>\u003c/div>\r\n   \u003c/div>\r\n   \u003cdiv class=\"hookline\">\u003cspan>Hook\u003c/span>\u003cp class=\"ar-b\">راس الحانوت فين؟ الكمون فين؟ كل نهار نفس القلبة 🤦\u003c/p>\u003c/div>\r\n  \u003c/section>\r\n\r\n  \u003csection role=\"tabpanel\" data-p=\"tk\" hidden>\r\n   \u003cdiv class=\"fieldrow\">\u003clabel>Légende\u003c/label>\r\n    \u003cbutton class=\"cp\" type=\"button\" data-copy=\"tk-epices\">Copier\u003c/button>\u003c/div>\r\n   \u003cpre class=\"ar-b\" id=\"tk-epices\">ما بقيتش نقلب على العطريات 🧂 الستاند هادا بدل ليا الكوزينة #كوزينة #عطريات #المغرب #ترتيب #cod\u003c/pre>\r\n   \u003cdiv class=\"fieldrow\">\u003clabel>Hashtags\u003c/label>\r\n    \u003cbutton class=\"cp\" type=\"button\" data-copy=\"hs-epices\">Copier\u003c/button>\u003c/div>\r\n   \u003cpre class=\"ar-b\" id=\"hs-epices\">#المغرب #كوزينة #عطريات #راس_الحانوت #ترتيب #دارنا #maroc #codmaroc #cuisinemarocaine\u003c/pre>\r\n  \u003c/section>\r\n\r\n  \u003csection role=\"tabpanel\" data-p=\"sc\" hidden>\r\n   \u003ctable class=\"sct\">\u003cthead>\u003ctr>\u003cth>Temps\u003c/th>\u003cth>Beat\u003c/th>\u003cth>Ce qu'on filme\u003c/th>\u003c/tr>\u003c/thead>\r\n   \u003ctbody>\u003ctr>\u003ctd class=\"t\">0-3 s\u003c/td>\u003ctd class=\"b\">HOOK\u003c/td>\u003ctd>Main qui fouille frénétiquement un tiroir d&#x27;épices en vrac. « الكمون فين؟ »\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"t\">3-8 s\u003c/td>\u003ctd class=\"b\">AGITATION\u003c/td>\u003ctd>Trois sachets d&#x27;épices s&#x27;ouvrent et se renversent. « كل نهار نفس المشكل »\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"t\">8-15 s\u003c/td>\u003ctd class=\"b\">SOLUTION\u003c/td>\u003ctd>On colle le support sur la porte du placard, on clipse les 12 pots un par un. Son satisfaisant.\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"t\">15-22 s\u003c/td>\u003ctd class=\"b\">DÉMO\u003c/td>\u003ctd>Main qui prend un pot, dose avec la petite cuillère intégrée, remet. Une seconde. « ثانية وحدة »\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"t\">22-27 s\u003c/td>\u003ctd class=\"b\">PREUVE\u003c/td>\u003ctd>On tire fort sur le support : il tient. « بلاصق قوي، بلا ما تقب »\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"t\">27-30 s\u003c/td>\u003ctd class=\"b\">CTA\u003c/td>\u003ctd>Prix 199 DH. « الدفع عند الاستلام »\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\r\n  \u003c/section>\r\n\r\n  \u003csection role=\"tabpanel\" data-p=\"fp\" hidden>\r\n   \u003cp class=\"promesse\">Douze pots identiques, étiquetés, avec leur support autocollant : vos épices passent du tiroir au mur, à hauteur de main.\u003c/p>\r\n   \u003ch4>Bénéfices\u003c/h4>\u003cul class=\"ben\">\u003cli>Support autocollant : pas de perceuse, pas de trou dans le carrelage\u003c/li>\u003cli>Les 12 pots sont identiques et étiquetés : vous trouvez en une seconde\u003c/li>\u003cli>Petite cuillère doseuse fournie avec chaque pot\u003c/li>\u003cli>Couvercle hermétique : le cumin garde son parfum, le paprika ne durcit pas\u003c/li>\u003cli>Se pose au mur, dans la porte du placard ou sur le plan de travail\u003c/li>\u003c/ul>\r\n   \u003ch4>Objections traitées\u003c/h4>\u003cdiv class=\"obj\">\u003cp class=\"q\">« L&#x27;adhésif va tomber avec le poids »\u003c/p>\u003cp>L&#x27;adhésif 3M supporte 5 kg sur surface lisse et sèche (carrelage, mélaminé, verre). Les 12 pots pleins pèsent 2,4 kg.\u003c/p>\u003c/div>\u003cdiv class=\"obj\">\u003cp class=\"q\">« Les pots sont trop petits »\u003c/p>\u003cp>110 ml chacun, soit l&#x27;équivalent d&#x27;un sachet d&#x27;épices du souk. C&#x27;est fait pour la rotation, pas pour le stock.\u003c/p>\u003c/div>\u003cdiv class=\"obj\">\u003cp class=\"q\">« Je paie avant ? »\u003c/p>\u003cp>Non. Vous payez au livreur, après avoir ouvert le colis.\u003c/p>\u003c/div>\r\n   \u003ch4>Caractéristiques\u003c/h4>\u003ctable class=\"spec\">\u003ctr>\u003ctd>Contenance\u003c/td>\u003ctd>110 ml × 12\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Support\u003c/td>\u003ctd>Adhésif 3M, capacité 5 kg\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Accessoires\u003c/td>\u003ctd>12 cuillères doseuses + étiquettes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Matière\u003c/td>\u003ctd>PET alimentaire + ABS\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Montage\u003c/td>\u003ctd>Sans perçage\u003c/td>\u003c/tr>\u003c/table>\r\n   \u003ch4>FAQ\u003c/h4>\u003cdiv class=\"qa\">\u003cp class=\"q\">Ça tient sur du carrelage gras ?\u003c/p>\u003cp>Nettoyez à l&#x27;alcool avant de coller. Sur une surface propre, ça tient des années.\u003c/p>\u003c/div>\u003cdiv class=\"qa\">\u003cp class=\"q\">On peut les mettre au lave-vaisselle ?\u003c/p>\u003cp>Oui, les pots et les cuillères. Le support se nettoie à l&#x27;éponge.\u003c/p>\u003c/div>\u003cdiv class=\"qa\">\u003cp class=\"q\">Les étiquettes sont en arabe ou en français ?\u003c/p>\u003cp>Les deux sont fournies, plus des étiquettes vierges.\u003c/p>\u003c/div>\u003cdiv class=\"qa\">\u003cp class=\"q\">Livraison ?\u003c/p>\u003cp>24-48 h grandes villes, 48-72 h ailleurs. Paiement à la réception.\u003c/p>\u003c/div>\r\n   \u003cp class=\"lpnote\">Landing page complète générée : \u003ccode>landing/epices.html\u003c/code>\r\n    — créas : \u003ccode>creas/epices-feed.png\u003c/code>, \u003ccode>creas/epices-story.png\u003c/code>\u003c/p>\r\n  \u003c/section>\r\n \u003c/div>\r\n\u003c/article>\r\n\u003carticle class=\"item\" id=\"massage\">\r\n \u003cheader class=\"ih\">\r\n  \u003cdiv class=\"ihl\">\r\n   \u003cp class=\"eyebrow\">Espion COD · gula.ma\u003c/p>\r\n   \u003ch3>Pistolet de Massage Chaud &amp; Froid — La Séance de Détente à la Maison\u003c/h3>\r\n   \u003cp class=\"ar-t\">بيستوليه المساج بالسخون والبارد — جلسة استرخاء ف دارك\u003c/p>\r\n   \u003cp class=\"angle\">\u003cb>Angle —\u003c/b> Le dos qui tire après 8 h assis ou debout — sans rendez-vous, sans 300 DH la séance\u003c/p>\r\n  \u003c/div>\r\n  \u003cdiv class=\"ihr\">\r\n   \u003cdiv class=\"pxbig\">349\u003csmall>DH\u003c/small>\u003c/div>\r\n   \r\n   \u003cdiv class=\"score\">\u003cdiv class=\"sbar\">\u003ci style=\"width:86%\">\u003c/i>\u003c/div>\u003cspan>86\u003csmall>/100\u003c/small>\u003c/span>\u003c/div>\r\n  \u003c/div>\r\n \u003c/header>\r\n \u003cdiv class=\"ev ev-faible\">\u003cspan class=\"dot\">\u003c/span>Preuve faible\u003cem>0.8 ventes/jour — signal de vente ténu, le score porte le dossier\u003c/em>\u003c/div>\r\n \r\n \u003cdiv class=\"metrics\">\r\n  \u003cdiv>\u003cspan>Coût réel\u003c/span>\u003cb>180 DH\u003c/b>\u003ci>eGRO : Massage Gun 6/12 têtes 180 MAD\u003c/i>\u003c/div>\r\n  \u003cdiv>\u003cspan>Marge unitaire\u003c/span>\u003cb>169 DH\u003c/b>\u003c/div>\r\n  \u003cdiv>\u003cspan>Multiple\u003c/span>\u003cb>×1.94\u003c/b>\u003c/div>\r\n  \u003cdiv class=\"hi\">\u003cspan>CPA maximum\u003c/span>\u003cb>90.0 DH\u003c/b>\u003c/div>\r\n  \u003cdiv>\u003cspan>Net / livrée\u003c/span>\u003cb>128.6 DH\u003c/b>\u003c/div>\r\n \u003c/div>\r\n\r\n \u003cdiv class=\"tabs\" data-tabs>\r\n  \u003cnav role=\"tablist\">\r\n   \u003cbutton role=\"tab\" aria-selected=\"true\" data-p=\"meta\">Annonce Meta\u003c/button>\r\n   \u003cbutton role=\"tab\" aria-selected=\"false\" data-p=\"tk\">TikTok\u003c/button>\r\n   \u003cbutton role=\"tab\" aria-selected=\"false\" data-p=\"sc\">Script vidéo\u003c/button>\r\n   \u003cbutton role=\"tab\" aria-selected=\"false\" data-p=\"fp\">Fiche produit\u003c/button>\r\n  \u003c/nav>\r\n\r\n  \u003csection role=\"tabpanel\" data-p=\"meta\">\r\n   \u003cdiv class=\"fieldrow\">\u003clabel>Texte principal\u003c/label>\r\n    \u003cbutton class=\"cp\" type=\"button\" data-copy=\"m-massage\">Copier\u003c/button>\u003c/div>\r\n   \u003cpre class=\"ar-b\" id=\"m-massage\">نهار كامل واقف ولا كالس قدام الordinateur… و ف الليل الظهر و الكتاف مشدودين 😣\r\n\r\nبيستوليه المساج بالراس السخون والبارد — كيرخي العضلات ف 10 دقايق ف دارك.\r\n\r\n🔥 راس سخون — كيسخن العضلة و كيرخيها\r\n❄️ راس بارد — كيهدن من بعد المجهود\r\n💪 6 سرعات + 4 روس مختالفين (الظهر، الكتاف، الرجلين، الرقبة)\r\n🔋 بطارية كتدوم 6 ساعات — بلا فيل\r\n🔇 هادي بزاف — تقدر تستعملو و الدراري نعسين\r\n\r\nبدل 300 درهم ف كل جلسة — 349 درهم مرة وحدة و هو ديالك\r\n\r\n🚚 الدفع عند الاستلام\r\n📦 توصيل لجميع المدن 👇\r\n\r\nملاحظة: هاد الجهاز ديال الاسترخاء و راحة العضلات. إلا عندك مشكل صحي، شاور الطبيب ديالك.\u003c/pre>\r\n   \u003cdiv class=\"two\">\r\n    \u003cdiv>\u003cdiv class=\"fieldrow\">\u003clabel>Titre\u003c/label>\r\n      \u003cbutton class=\"cp\" type=\"button\" data-copy=\"mh-massage\">Copier\u003c/button>\u003c/div>\r\n     \u003cp class=\"mono\" id=\"mh-massage\">Pistolet Massage Chaud/Froid — 349 DH\u003c/p>\u003c/div>\r\n    \u003cdiv>\u003cdiv class=\"fieldrow\">\u003clabel>Description\u003c/label>\r\n      \u003cbutton class=\"cp\" type=\"button\" data-copy=\"md-massage\">Copier\u003c/button>\u003c/div>\r\n     \u003cp class=\"mono\" id=\"md-massage\">6 vitesses · 4 têtes · Paiement à la livraison\u003c/p>\u003c/div>\r\n   \u003c/div>\r\n   \u003cdiv class=\"hookline\">\u003cspan>Hook\u003c/span>\u003cp class=\"ar-b\">الظهر كيوجعك من بعد الخدمة؟ ما بقاش خاصك تمشي بعيد\u003c/p>\u003c/div>\r\n  \u003c/section>\r\n\r\n  \u003csection role=\"tabpanel\" data-p=\"tk\" hidden>\r\n   \u003cdiv class=\"fieldrow\">\u003clabel>Légende\u003c/label>\r\n    \u003cbutton class=\"cp\" type=\"button\" data-copy=\"tk-massage\">Copier\u003c/button>\u003c/div>\r\n   \u003cpre class=\"ar-b\" id=\"tk-massage\">10 دقايق و الكتاف ترخاو 😮‍💨 #مساج #استرخاء #المغرب #ظهر #cod #relax\u003c/pre>\r\n   \u003cdiv class=\"fieldrow\">\u003clabel>Hashtags\u003c/label>\r\n    \u003cbutton class=\"cp\" type=\"button\" data-copy=\"hs-massage\">Copier\u003c/button>\u003c/div>\r\n   \u003cpre class=\"ar-b\" id=\"hs-massage\">#المغرب #مساج #استرخاء #الظهر #رياضة #صحة #maroc #codmaroc #massage #relax\u003c/pre>\r\n  \u003c/section>\r\n\r\n  \u003csection role=\"tabpanel\" data-p=\"sc\" hidden>\r\n   \u003ctable class=\"sct\">\u003cthead>\u003ctr>\u003cth>Temps\u003c/th>\u003cth>Beat\u003c/th>\u003cth>Ce qu'on filme\u003c/th>\u003c/tr>\u003c/thead>\r\n   \u003ctbody>\u003ctr>\u003ctd class=\"t\">0-3 s\u003c/td>\u003ctd class=\"b\">HOOK VISUEL\u003c/td>\u003ctd>Personne qui se lève d&#x27;un bureau et porte la main aux lombaires en grimaçant. Voix : « نهار كامل قدام الordinateur »\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"t\">3-8 s\u003c/td>\u003ctd class=\"b\">AGITATION\u003c/td>\u003ctd>Calendrier avec 3 rendez-vous barrés, billets de 300 DH qui s&#x27;envolent. « 300 درهم ف كل جلسة »\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"t\">8-16 s\u003c/td>\u003ctd class=\"b\">DEMO PRODUIT\u003c/td>\u003ctd>Gros plan : on visse la tête chauffante, LED rouge, application sur le trapèze. Vibration visible. « الراس السخون كيرخي العضلة »\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"t\">16-22 s\u003c/td>\u003ctd class=\"b\">SECOND BENEFICE\u003c/td>\u003ctd>Changement de tête, LED bleue, application sur le mollet. « و الراس البارد كيهدن »\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"t\">22-26 s\u003c/td>\u003ctd class=\"b\">PREUVE SILENCE\u003c/td>\u003ctd>On pose le pistolet en marche à côté d&#x27;un enfant qui dort. Icône décibels. « هادي بزاف »\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"t\">26-30 s\u003c/td>\u003ctd class=\"b\">CTA\u003c/td>\u003ctd>Prix 349 DH + badge « الدفع عند الاستلام ».\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\r\n  \u003c/section>\r\n\r\n  \u003csection role=\"tabpanel\" data-p=\"fp\" hidden>\r\n   \u003cp class=\"promesse\">Un pistolet percussif avec tête chauffante et tête froide : on chauffe le muscle, on le travaille, on l&#x27;apaise. Dix minutes, chez vous.\u003c/p>\r\n   \u003ch4>Bénéfices\u003c/h4>\u003cul class=\"ben\">\u003cli>Tête chauffante puis tête froide : on relâche le muscle, puis on apaise\u003c/li>\u003cli>6 vitesses, de la détente légère au travail profond des lombaires\u003c/li>\u003cli>4 têtes interchangeables selon la zone : dos, épaules, cuisses, nuque\u003c/li>\u003cli>Batterie 6 h : plusieurs semaines d&#x27;utilisation sans recharge\u003c/li>\u003cli>Silencieux (moins de 45 dB) : utilisable devant la télé ou le soir\u003c/li>\u003c/ul>\r\n   \u003ch4>Objections traitées\u003c/h4>\u003cdiv class=\"obj\">\u003cp class=\"q\">« C&#x27;est un appareil médical ? »\u003c/p>\u003cp>Non. C&#x27;est un appareil de bien-être et de relaxation musculaire. Pour une douleur persistante, consultez un médecin.\u003c/p>\u003c/div>\u003cdiv class=\"obj\">\u003cp class=\"q\">« Ça va être trop fort et faire mal ? »\u003c/p>\u003cp>Six niveaux. On commence au niveau 1 et on monte selon le ressenti. Les têtes en mousse sont douces.\u003c/p>\u003c/div>\u003cdiv class=\"obj\">\u003cp class=\"q\">« La batterie va lâcher au bout d&#x27;un mois »\u003c/p>\u003cp>Batterie lithium 2500 mAh rechargeable en USB-C. À raison de 10 min par jour, une charge tient environ trois semaines.\u003c/p>\u003c/div>\u003cdiv class=\"obj\">\u003cp class=\"q\">« Je paie d&#x27;avance ? »\u003c/p>\u003cp>Non, paiement en espèces au livreur, après ouverture du colis.\u003c/p>\u003c/div>\r\n   \u003ch4>Caractéristiques\u003c/h4>\u003ctable class=\"spec\">\u003ctr>\u003ctd>Vitesses\u003c/td>\u003ctd>6 niveaux\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Têtes\u003c/td>\u003ctd>4 dont 1 chauffante et 1 froide\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Batterie\u003c/td>\u003ctd>2500 mAh, ~6 h\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Charge\u003c/td>\u003ctd>USB-C\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Bruit\u003c/td>\u003ctd>moins de 45 dB\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Livré avec\u003c/td>\u003ctd>Mallette de transport\u003c/td>\u003c/tr>\u003c/table>\r\n   \u003ch4>FAQ\u003c/h4>\u003cdiv class=\"qa\">\u003cp class=\"q\">Combien de temps par séance ?\u003c/p>\u003cp>5 à 10 minutes par zone, pas plus. C&#x27;est suffisant.\u003c/p>\u003c/div>\u003cdiv class=\"qa\">\u003cp class=\"q\">On peut l&#x27;utiliser tous les jours ?\u003c/p>\u003cp>Oui, en usage de détente. Évitez les os, la colonne vertébrale et les zones enflammées.\u003c/p>\u003c/div>\u003cdiv class=\"qa\">\u003cp class=\"q\">Il chauffe à combien ?\u003c/p>\u003cp>La tête chauffante monte à environ 45 °C, une chaleur confortable, jamais brûlante.\u003c/p>\u003c/div>\u003cdiv class=\"qa\">\u003cp class=\"q\">Que contient la boîte ?\u003c/p>\u003cp>Le pistolet, 4 têtes, le chargeur USB-C, la mallette de rangement et la notice.\u003c/p>\u003c/div>\r\n   \u003cp class=\"lpnote\">Landing page complète générée : \u003ccode>landing/massage.html\u003c/code>\r\n    — créas : \u003ccode>creas/massage-feed.png\u003c/code>, \u003ccode>creas/massage-story.png\u003c/code>\u003c/p>\r\n  \u003c/section>\r\n \u003c/div>\r\n\u003c/article>\r\n\u003carticle class=\"item\" id=\"photo\">\r\n \u003cheader class=\"ih\">\r\n  \u003cdiv class=\"ihl\">\r\n   \u003cp class=\"eyebrow\">Espion COD · mariotoys.ma\u003c/p>\r\n   \u003ch3>Appareil Photo Numérique pour Enfant — Il Lâche Enfin Votre Téléphone\u003c/h3>\r\n   \u003cp class=\"ar-t\">أباري فوطو ديال الدراري — باش يخلي ليك التيليفون ديالك\u003c/p>\r\n   \u003cp class=\"angle\">\u003cb>Angle —\u003c/b> Rentrée : rendre l&#x27;écran actif au lieu de passif — l&#x27;enfant crée au lieu de scroller\u003c/p>\r\n  \u003c/div>\r\n  \u003cdiv class=\"ihr\">\r\n   \u003cdiv class=\"pxbig\">329\u003csmall>DH\u003c/small>\u003c/div>\r\n   \r\n   \u003cdiv class=\"score\">\u003cdiv class=\"sbar\">\u003ci s يخرج يصور و يخلق.\r\n\r\nالثمن: 329 درهم\r\n🎒 هدية الدخول المدرسي\r\n🚚 الدفع عند الاستلام\r\n📦 توصيل لجميع المدن 👇\u003c/pre>\r\n   \u003cdiv class=\"two\">\r\n    \u003cdiv>\u003cdiv class=\"fieldrow\">\u003clabel>Titre\u003c/label>\r\n      \u003cbutton class=\"cp\" type=\"button\" data-copy=\"mh-photo\">Copier\u003c/button>\u003c/div>\r\n     \u003cp class=\"mono\" id=\"mh-photo\">Appareil Photo Enfant — 329 DH\u003c/p>\u003c/div>\r\n    \u003cdiv>\u003cdiv class=\"fieldrow\">\u003clabel>Description\u003c/label>\r\n      \u003cbutton class=\"cp\" type=\"button\" data-copy=\"md-photo\">Copier\u003c/button>\u003c/div>\r\n     \u003cp class=\"mono\" id=\"md-photo\">Photo + vidéo + jeux · Paiement à la livraison\u003c/p>\u003c/div>\r\n   \u003c/div>\r\n   \u003cdiv class=\"hookline\">\u003cspan>Hook\u003c/span>\u003cp class=\"ar-b\">الدراري ما بغاوش يخليو ليك التيليفون؟ عطيهم واحد ديالهم 📸\u003c/p>\u003c/div>\r\n  \u003c/section>\r\n\r\n  \u003csection role=\"tabpanel\" data-p=\"tk\" hidden>\r\n   \u003cdiv class=\"fieldrow\">\u003clabel>Légende\u003c/label>\r\n    \u003cbutton class=\"cp\" type=\"button\" data-copy=\"tk-photo\">Copier\u003c/button>\u003c/div>\r\n   \u003cpre class=\"ar-b\" id=\"tk-photo\">عطيتو ليه و ما بقاش كيطلب التيليفون 😅📸 #الدراري #هدية #الدخول_المدرسي #المغرب #cod\u003c/pre>\r\n   \u003cdiv class=\"fieldrow\">\u003clabel>Hashtags\u003c/label>\r\n    \u003cbutton class=\"cp\" type=\"button\" data-copy=\"hs-photo\">Copier\u003c/button>\u003c/div>\r\n   \u003cpre class=\"ar-b\" id=\"hs-photo\">#المغرب #الدراري #هدية #الدخول_المدرسي #أطفال #maroc #codmaroc #cadeauenfant #rentree\u003c/pre>\r\n  \u003c/section>\r\n\r\n  \u003csection role=\"tabpanel\" data-p=\"sc\" hidden>\r\n   \u003ctable class=\"sct\">\u003cthead>\u003ctr>\u003cth>Temps\u003c/th>\u003cth>Beat\u003c/th>\u003cth>Ce qu'on filme\u003c/th>\u003c/tr>\u003c/thead>\r\n   \u003ctbody>\u003ctr>\u003ctd class=\"t\">0-3 s\u003c/td>\u003ctd class=\"b\">HOOK\u003c/td>\u003ctd>Enfant qui tire
