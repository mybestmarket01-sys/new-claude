function taux(cmds){\n var recues=cmds.length,conf=0,livr=0,ref=0,ann=0,att=0;\n cmds.forEach(function(c){\n  /* un colis refusé a bien été confirmé avant d'être expédié : il compte comme confirmé */\n  if(c.statut==='confirmee'||c.statut==='expediee'||c.statut==='livree'||c.statut==='refusee')conf++;\n  if(c.statut==='livree')livr++;\n  if(c.statut==='refusee')ref++;\n  if(c.statut==='annulee')ann++;\n  if(c.statut==='nouvelle')att++;\n });\n var termine=livr+ref,traite=conf+ann;\n return {recues:recues,confirmees:conf,livrees:livr,refusees:ref,annulees:ann,attente:att,\n  termine:termine,traite:traite,\n  tConf:traite?conf/traite:null,\n  tLivr:termine?livr/termine:null};\n}\nfunction LGlobal(pid){\n var t=taux(cmdsDe(pid,null));\n if(t.termine>=10&&t.tLivr!=null)return t.tLivr;\n var g=taux(cmdsDe(null,null));\n if(g.termine>=10&&g.tLivr!=null)return g.tLivr;\n return num(state.reglages.tauxDefaut,0.7);\n}\nfunction periodeDepuis(){\n if(ui.periode==='tout')return null;\n var d=new Date();d.setDate(d.getDate()-ui.periode);return d.toISOString().slice(0,10);\n}\nfunction bilan(depuis){\n var cmds=cmdsDe(null,depuis),t=taux(cmds);\n var ca=0,marge=0,perte=0;\n cmds.forEach(function(c){\n  var p=prod(c.produitId);var g=state.reglages;\n  var montant=num(c.montant,p?num(p.prix):0);\n  if(c.statut==='livree'){ca+=montant;marge+=montant-(p?num(p.cout):0)-num(g.livraison);}\n  else if(c.statut==='refusee'){perte+=num(g.livraison)+num(g.retour);}\n });\n var dep=0,cmdPub=0;\n state.campagnes.forEach(function(k){\n  if(depuis&&(k.fin||k.debut)\u003cdepuis)return;\n  dep+=num(k.depense);cmdPub+=num(k.commandes);\n });\n return {t:t,ca:ca,marge:marge,perte:perte,depense:dep,cmdPub:cmdPub,\n   profit:marge-perte-dep,\n   cpa:cmdPub?dep/cmdPub:null};\n}\nfunction verdictCampagne(k){\n var p=prod(k.produitId);if(!p)return {cls:'mute',txt:'Produit inconnu',cpa:null};\n var e=eco(p,LGlobal(k.produitId));\n var c=num(k.commandes);\n if(!c)return {cls:'mute',txt:'Sans commande',cpa:null,e:e};\n var cpa=num(k.depense)/c;\n if(cpa\u003c=e.cpaCible)return {cls:'good',txt:'Rentable — scaler',cpa:cpa,e:e};\n if(cpa\u003c=e.cpaMax)return {cls:'warn',txt:'À l\\'équilibre — optimiser',cpa:cpa,e:e};\n return {cls:'bad',txt:'En perte — couper',cpa:cpa,e:e};\n}\n\n/* ---------- rendu ---------- */\nvar VIEWS=[\n {id:'bord',lab:'Tableau de bord',g:'Piloter'},\n {id:'commandes',lab:'Commandes',g:'Piloter'},\n {id:'produits',lab:'Produits & marges',g:'Vendre'},\n {id:'campagnes',lab:'Campagnes pub',g:'Vendre'},\n {id:'calendrier',lab:'Calendrier',g:'Vendre'},\n {id:'agents',lab:'Mes agents',g:'Outils'},\n {id:'donnees',lab:'Données & réglages',g:'Outils'}\n];\n\nfunction render(){\n var r=document.getElementById('root');\n r.innerHTML=shell(viewHTML());\n var sc=document.querySelector('.view');if(sc)sc.scrollTop=0;\n}\nfunction shell(inner){\n var rail='',lastG='';\n VIEWS.forEach(function(v){\n  if(v.g!==lastG){rail+='\u003cdiv class=\"railgroup\">'+v.g+'\u003c/div>';lastG=v.g;}\n  rail+='\u003cbutton data-go=\"'+v.id+'\" aria-current=\"'+(ui.view===v.id)+'\">'+v.lab+'\u003c/button>';\n });\n var save=dirty?'\u003cspan class=\"savestate dirty\">Modifications non enregistrées\u003c/span>':'\u003cspan class=\"savestate\">À jour\u003c/span>';\n return '\u003cdiv class=\"shell\">'+\n  '\u003cheader class=\"top\">\u003cdiv class=\"wordmark\">\u003cspan class=\"dot\">\u003c/span>Pilote COD \u003csmall>'+esc(state.reglages.boutique)+'\u003c/small>\u003c/div>'+\n  '\u003cdiv class=\"grow\">\u003c/div>\u003cdiv class=\"savebar\">'+save+\n  '\u003cbutton class=\"btn\" data-act=\"save\">Enregistrer\u003c/button>\u003c/div>\u003c/header>'+\n  '\u003cdiv class=\"main\">\u003cnav class=\"rail\">'+rail+'\u003c/nav>\u003cmain class=\"view\">'+inner+'\u003c/main>\u003c/div>\u003c/div>';\n}\nfunction viewHTML(){\n switch(ui.view){\n  case 'commandes':return vCommandes();\n  case 'produits':return vProduits();\n  case 'campagnes':return vCampagnes();\n  case 'calendrier':return vCalendrier();\n  case 'agents':return vAgents();\n  case 'donnees':return vDonnees();\n  default:return vBord();\n }\n}\nfunction head(t,d,extra){\n return '\u003cdiv class=\"viewhead\">\u003cdiv>\u003ch1>'+t+'\u003c/h1>\u003cp>'+d+'\u003c/p>\u003c/div>'+(extra||'')+'\u003c/div>';\n}\n\n/* ---------- tableau de bord ---------- */\nfunction vBord(){\n var vide=!state.produits.length&&!state.commandes.length;\n if(vide)return head('Tableau de bord','Rien à afficher tant que la boutique n\\'a pas de données. Trois étapes, dans cet ordre.')+onboarding();\n var d=periodeDepuis(),b=bilan(d),t=b.t;\n var sel='\u003cselect class=\"inline\" data-act=\"periode\">'+\n  [[30,'30 derniers jours'],[90,'90 derniers jours'],['tout','Tout l\\'historique']].map(function(o){\n   return '\u003coption value=\"'+o[0]+'\"'+(String(ui.periode)===String(o[0])?' selected':'')+'>'+o[1]+'\u003c/option>';}).join('')+'\u003c/select>';\n var h=head('Tableau de bord','Ce que la boutique a réellement encaissé, refus et dépense publicitaire déduits.',sel);\n\n h+='\u003cdiv class=\"grid g4\">'+\n  tile('Commandes reçues',n0(t.recues),t.attente?n0(t.attente)+' encore à confirmer':'&nbsp;')+\n  tile('Taux de confirmation',pc(t.tConf),t.traite?n0(t.confirmees)+' confirmées / '+n0(t.traite)+' traitées':'—')+\n  tile('Taux de livraison',pc(t.tLivr),t.termine?n0(t.livrees)+' livrées / '+n0(t.termine)+' terminées':'aucune commande terminée')+\n  tile('Dépense publicitaire',mad(b.depense),b.cpa!=null?'CPA réel '+mad(b.cpa):'—')+\n  '\u003c/div>';\n h+='\u003cdiv class=\"grid g2\" style=\"margin-top:12px\">'+\n  '\u003cdiv class=\"tile hero\">\u003cdiv class=\"lab\">Profit net estimé\u003c/div>\u003cdiv class=\"val '+(b.profit>=0?'pos':'neg')+'\">'+mad(b.profit)+'\u003c/div>'+\n   '\u003cdiv class=\"sub\">Marge livrée '+mad(b.marge)+' − pertes sur refus '+mad(b.perte)+' − pub '+mad(b.depense)+'\u003c/div>\u003c/div>'+\n  '\u003cdiv class=\"tile hero\">\u003cdiv class=\"lab\">Chiffre d\\'affaires encaissé\u003c/div>\u003cdiv class=\"val\">'+mad(b.ca)+'\u003c/div>'+\n   '\u003cdiv class=\"sub\">Seules les commandes livrées comptent. Le reste n\\'a jamais été payé.\u003c/div>\u003c/div>'+\n  '\u003c/div>';\n\n h+='\u003ch2 class=\"sec\">Où partent les commandes\u003c/h2>'+funnel(t);\n h+='\u003ch2 class=\"sec\">Commandes des 14 derniers jours\u003c/h2>'+sparkbars();\n var al=alertes(b);\n h+='\u003ch2 class=\"sec\">À traiter\u003c/h2>'+(al.length?'\u003cdiv class=\"alerts\">'+al.join('')+'\u003c/div>':'\u003cdiv class=\"empty\">Rien d\\'anormal détecté sur la période.\u003c/div>');\n return h;\n}\nfunction tile(lab,val,sub,cls){\n return '\u003cdiv class=\"tile\">\u003cdiv class=\"lab\">'+lab+'\u003c/div>\u003cdiv class=\"val '+(cls||'')+'\">'+val+'\u003c/div>\u003cdiv class=\"sub\">'+(sub||'&nbsp;')+'\u003c/div>\u003c/div>';\n}\nfunction funnel(t){\n var max=Math.max(t.recues,1);\n function row(lab,v,cls){\n  var w=Math.max((v/max)*100,v?3:0);\n  return '\u003cdiv class=\"frow\">\u003cdiv class=\"fl\">'+lab+'\u003c/div>\u003cdiv class=\"ftrack\">'+\n   '\u003cdiv class=\"fbar '+cls+'\" style=\"width:'+w+'%\">'+n0(v)+'\u003c/div>\u003c/div>\u003c/div>';\n }\n return '\u003cdiv class=\"card pad\">\u003cdiv class=\"funnel\">'+\n  row('Reçues',t.recues,'s1')+row('Confirmées',t.confirmees,'s2')+row('Livrées',t.livrees,'s3')+\n  '\u003c/div>\u003cp class=\"fnote\">'+n0(t.refusees)+' refusées à la livraison, '+n0(t.annulees)+' annulées avant expédition, '+n0(t.attente)+' encore à confirmer. Chaque colis refusé coûte '+\n  mad(num(state.reglages.livraison)+num(state.reglages.retour))+' de logistique, plus la publicité déjà dépensée.\u003c/p>\u003c/div>';\n}\nfunction sparkbars(){\n var days=[],map={};\n for(var i=13;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);var k=d.toISOString().slice(0,10);days.push(k);map[k]=0;}\n state.commandes.forEach(function(c){if(map[c.date]!==undefined)map[c.date]++;});\n var max=1;days.forEach(function(k){if(map[k]>max)max=map[k];});\n var bars=days.map(function(k){\n  var v=map[k],hp=Math.round((v/max)*100);\n  return '\u003cdiv class=\"b'+(v?'':' zero')+'\" style=\"height:'+(v?Math.max(hp,4):2)+'%\" title=\"'+frDate(k)+' — '+v+' commande'+(v>1?'s':'')+'\">\u003c/div>';\n }).join('');\n return '\u003cdiv class=\"card pad\">\u003cdiv class=\"bars\">'+bars+'\u003c/div>'+\n  '\u003cdiv class=\"barsx\">\u003cspan>'+frDate(days[0])+'\u003c/span>\u003cspan class=\"num\">pic '+max+'/jour\u003c/span>\u003cspan>'+frDate(days[13])+'\u003c/span>\u003c/div>\u003c/div>';\n}\nfunction alertes(b){\n var out=[],g=state.reglages;\n function a(cls,ic,txt){out.push('\u003cdiv class=\"alert '+cls+'\">\u003cspan class=\"ic\">'+ic+'\u003c/span>\u003cdiv>'+txt+'\u003c/div>\u003c/div>');}\n state.produits.forEach(function(p){\n  if(p.statut==='archive')return;\n  var e=eco(p,LGlobal(p.id));\n  if(e.cpaMax\u003c40)a('bad','!','\u003cb>'+esc(p.nom)+'\u003c/b> ne supporte pas la publicité payante : CPA max '+mad(e.cpaMax)+\n   '. Monter le prix, faire un pack, ou baisser le coût d\\'achat.');\n  else if(!e.bande)a('warn','~','\u003cb>'+esc(p.nom)+'\u003c/b> est hors de la zone qui convertit en COD (149–499 MAD) : prix '+mad(num(p.prix))+'.');\n  if(p.statut==='actif'&&num(p.stock)\u003c=0)a('warn','~','\u003cb>'+esc(p.nom)+'\u003c/b> est actif avec un stock à zéro.');\n });\n state.campagnes.forEach(function(k){\n  if(k.statut==='arretee')return;\n  var v=verdictCampagne(k);\n  if(v.cls==='bad')a('bad','!','Campagne \u003cb>'+esc(k.nom)+'\u003c/b> : CPA réel '+mad(v.cpa)+' contre '+mad(v.e.cpaMax)+' au point mort. Couper ou changer d\\'angle.');\n });\n if(b.t.traite>=10&&b.t.tConf!=null&&b.t.tConf\u003c0.7)\n  a('warn','~','Taux de confirmation à '+pc(b.t.tConf)+'. En dessous de 70 %, le problème est le délai de rappel : viser un contact sous 2 h.');\n var parVille={};\n state.commandes.forEach(function(c){\n  if(c.statut!=='livree'&&c.statut!=='refusee')return;\n  var v=c.ville||'Autre';parVille[v]=parVille[v]||{t:0,r:0};parVille[v].t++;if(c.statut==='refusee')parVille[v].r++;\n });\n Object.keys(parVille).forEach(function(v){\n  var o=parVille[v];\n  if(o.t>=8&&o.r/o.t>0.4)a('warn','~','\u003cb>'+esc(v)+'\u003c/b> : '+pc(o.r/o.t)+' de refus sur '+o.t+' commandes terminées. Vérifier le transporteur et le délai sur cette ville.');\n });\n SAISONS.forEach(function(s){\n  var j=daysTo(s.date);\n  if(j>=0&&j\u003c=s.prep+10){\n   var aFaire=state.taches.filter(function(t){return !t.fait&&t.saison===s.nom;}).length;\n   if(!aFaire)a(j\u003c=s.prep?'warn':'good',j\u003c=s.prep?'~':'i','\u003cb>'+esc(s.nom)+'\u003c/b> dans '+j+' jours et aucune tâche ouverte. '+esc(s.quoi));\n  }\n });\n if(!out.length&&b.profit>0)a('good','✓','Sur la période, la boutique dégage '+mad(b.profit)+' de profit net estimé.');\n return out;\n}\nfunction onboarding(){\n return '\u003cdiv class=\"grid g2\">'+\n  '\u003cdiv class=\"card pad\">\u003cdiv class=\"eyebrow\">Étape 1\u003c/div>\u003ch3 style=\"margin:6px 0 8px\">Tes produits\u003c/h3>'+\n   '\u003cp class=\"note\">Prix de vente et coût d\\'achat réel. L\\'app en déduit la marge par colis livré, le CPA maximum et le ROAS au point mort.\u003c/p>'+\n   '\u003cdiv class=\"actions\">\u003cbutton class=\"btn\" data-go=\"produits\">Ajouter un produit\u003c/button>\u003c/div>\u003c/div>'+\n  '\u003cdiv class=\"card pad\">\u003cdiv class=\"eyebrow\">Étape 2\u003c/div>\u003ch3 style=\"margin:6px 0 8px\">Tes commandes\u003c/h3>'+\n   '\u003cp class=\"note\">Saisie à la main ou collage du CSV YouCan. C\\'est ce qui donne le vrai taux de confirmation et de livraison — pas une estimation.\u003c/p>'+\n   '\u003cdiv class=\"actions\">\u003cbutton class=\"btn ghost\" data-go=\"commandes\">Ouvrir les commandes\u003c/button>\u003c/div>\u003c/div>'+\n  '\u003cdiv class=\"card pad\">\u003cdiv class=\"eyebrow\">Étape 3\u003c/div>\u003ch3 style=\"margin:6px 0 8px\">Tes campagnes\u003c/h3>'+\n   '\u003cp class=\"note\">Dépense et commandes attribuées par campagne. L\\'app com ction(a){\n  if(!a){\n   dirty=true;render();\n   toast('Enregistré dans ce navigateur seulement — la page ne peut pas se réécrire ici.');\n   return;\n  }\n  var snapshot=JSON.parse(JSON.stringify(state));\n  snapshot.publishedAt=Date.now();snapshot.localAt=snapshot.publishedAt;\n  return a.publish(buildDoc(snapshot)).then(function(){\n   state.publishedAt=snapshot.publishedAt;state.localAt=snapshot.localAt;dirty=false;\n   try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}\n   render();toast('Enregistré');\n  });\n }).catch(function(err){\n  render();\n  var code=err&&err.code?err.code:'';\n  if(code==='conflict')toast('Une autre version a été enregistrée entre-temps. Recharge la page, puis ressaisis cette modification.');\n  else if(code==='not_granted'||code==='not_writer')toast('Enregistrement impossible : cette page est en lecture seule pour ce compte.');\n  else toast('Enregistrement impossible. Tes données restent dans ce navigateur.');\n });\n}\nfunction exportJSON(){\n var data=JSON.stringify(state,null,2);\n var name='pilote-cod-'+today()+'.json';\n var api=(typeof claude!=='undefined'&&claude&&claude.use)?claude.use('downloads'):Promise.resolve(null);\n Promise.resolve(api).then(function(d){\n  if(!d)throw new Error('no downloads');\n  return d.save({filename:name,data:data}).then(function(){toast('Sauvegarde enregistrée');});\n }).catch(function(){\n  var ta=document.querySelector('[data-form=\"import\"] textarea');\n  if(ta){ta.value=data;ta.select();toast('Téléchargement indisponible — le JSON est dans le champ ci-dessous, copie-le.');}\n  else toast('Téléchargement indisponible.');\n });\n}\nwindow.addEventListener('beforeunload',function(e){\n if(dirty){e.preventDefault();e.returnValue='';}\n});\nrender();\nif(pendingLocal)setTimeout(function(){toast('Modifications non enregistrées récupérées depuis ce navigateur.');},600);\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>"},{"id":"rayon","nom":"Rayon COD","emoji":"📦","quoi":"Stock, entrées, sorties, alertes de réapprovisionnement.","pont":true,"html":"\u003c!doctype html>\u003chtml>\u003chead>\u003cmeta charset=utf8>\u003cmeta name=viewport content=\"width=device-width,initial-scale=1\">\u003cstyle>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}\u003c/style>\u003c/head>\u003cbody>\n\u003ctitle>Rayon COD\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n\u003clink rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap\">\n\n\u003cstyle>\n:root{\n  --ground:#F6F5F1; --surface:#FFFFFF; --surface-2:#EFEEE9;\n  --ink:#151A21; --ink-2:#4A5563; --ink-3:#7A8492;\n  --line:#E3E1DB; --line-2:#CFCCC4;\n  --accent:#2B3FA0; --accent-ink:#FFFFFF; --accent-soft:#E7EAF7;\n  --crit:#B3261E; --crit-soft:#FAE6E3; --crit-line:#E9BDB7;\n  --warn:#8A5B00; --warn-soft:#F9EFD8; --warn-line:#E5D2A4;\n  --good:#0F7050; --good-soft:#E1F1E9; --good-line:#B4DBC8;\n  --shadow:0 1px 2px rgba(20,26,34,.05), 0 10px 28px -16px rgba(20,26,34,.28);\n  --r:12px;\n  --fd:'Archivo', 'Segoe UI', system-ui, sans-serif;\n  --fb:'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;\n  --fm:'IBM Plex Mono', ui-monospace, 'Cascadia Mono', monospace;\n}\n@media (prefers-color-scheme: dark){\n  :root:not([data-theme=\"light\"]){\n    --ground:#0F1218; --surface:#171B23; --surface-2:#202632;\n    --ink:#E9EBEF; --ink-2:#A9B2BF; --ink-3:#7C8695;\n    --line:#282E39; --line-2:#39414F;\n    --accent:#93A2FF; --accent-ink:#0E1119; --accent-soft:#1D2442;\n    --crit:#FF9086; --crit-soft:#341D1B; --crit-line:#5A2E29;\n    --warn:#E8B75C; --warn-soft:#2E2614; --warn-line:#4E4021;\n    --good:#5FD0A2; --good-soft:#132A22; --good-line:#22483A;\n    --shadow:0 1px px;\n  font-family:var(--fm); font-size:11px; font-weight:600;\n  display:grid; place-items:center; border:2px solid var(--surface);\n}\n.synchro{\n  font-family:var(--fm); font-size:10px; letter-spacing:.04em; text-transform:uppercase;\n  color:var(--ink-3); display:flex; align-items:center; gap:5px; flex:none;\n}\n.synchro i{width:7px; height:7px; border-radius:50%; background:var(--good); display:block}\n.synchro[data-etat=\"cours\"] i{background:var(--warn)}\n.synchro[data-etat=\"local\"] i{background:var(--ink-3)}\n.synchro .txt{display:none}\n@media(min-width:560px){.synchro .txt{display:inline}}\n\nmain{padding:16px 16px 96px; max-width:1120px; margin:0 auto}\n@media(min-width:900px){\n  body{display:grid; grid-template-columns:236px 1fr}\n  .topbar{grid-column:1/-1}\n  main{grid-column:2; padding:24px 32px 48px}\n}\n.vue[hidden]{display:none}\n\n/* ---------- navigation ---------- */\n.nav{\n  position:fixed; bottom:0; left:0; right:0; z-index:30;\n  display:grid; grid-template-columns:repeat(5,1fr);\n  background:var(--surface); border-top:1px solid var(--line);\n  padding-bottom:env(safe-area-inset-bottom);\n}\n.nav button{\n  background:none; border:0; cursor:pointer; padding:9px 4px 10px;\n  display:flex; flex-direction:column; align-items:center; gap:3px;\n  color:var(--ink-3); font-size:10.5px; font-weight:500; letter-spacing:.01em;\n  border-top:2px solid transparent; margin-top:-1px;\n}\n.nav button svg{width:21px; height:21px; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}\n.nav button[aria-current=\"true\"]{color:var(--accent); border-top-color:var(--accent)}\n.nav .pastille{position:absolute; transform:translate(14px,-4px); width:7px; height:7px; border-radius:50%; background:var(--crit)}\n@media(min-width:900px){\n  .nav{\n    position:sticky; top:0; align-self:start; height:calc(100vh - 63px);\n    grid-column:1; grid-template-columns:1fr; grid-auto-rows:max-content;\n    border-top:0; border-right:1px solid var(--line); padding:14px 12px; gap:2px;\n  }\n  .nav button{\n    flex-direction:row; justify-content:flex-start; gap:11px; font-size:14px;\n    padding:10px 12px; border-radius:9px; border-top:0; margin:0;\n  }\n  .nav button[aria-current=\"true\"]{background:var(--accent-soft); color:var(--accent)}\n  .nav .pastille{position:static; transform:none; margin-left:auto}\n}\n\n/* ---------- blocs ---------- */\n.bandeau{\n  display:flex; gap:12px; align-items:flex-start;\n  padding:14px 16px; border-radius:var(--r); margin-bottom:18px;\n  border:1px solid var(--crit-line); background:var(--crit-soft); color:var(--crit);\n}\n.bandeau.ok{border-color:var(--good-line); background:var(--good-soft); color:var(--good)}\n.bandeau .ico{font-size:19px; line-height:1.2; flex:none}\n.bandeau b{display:block; font-family:var(--fd); font-size:15px; margin-bottom:2px}\n.bandeau p{margin:0; font-size:13px; color:var(--ink-2)}\n.bandeau.ok p{color:var(--ink-2)}\n\n.titre-section{\n  display:flex; align-items:baseline; justify-content:space-between; gap:12px;\n  margin:26px 0 10px;\n}\n.titre-section h2{font-size:13px; font-weight:600; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-3)}\n.titre-section .lien{background:none; border:0; color:var(--accent); font-size:13px; font-weight:500; cursor:pointer; padding:0}\n\n.kpis{display:grid; grid-template-columns:repeat(2,1fr); gap:10px}\n@media(min-width:700px){.kpis{grid-template-columns:repeat(4,1fr)}}\n.kpi{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:13px 14px}\n.kpi .lab{font-size:11px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-3)}\n.kpi .val{\n  font-family:var(--fd); font-weight:700; font-size:26px; line-height:1.15;\n  letter-spacing:-.03em; font-variant-numeric:tabular-nums; margin-top:5px;\n}\n.kpi .sub{font-size:11.5px; color:var(--ink-3); margin-top:2px}\n.kpi.crit .val{color:var(--crit)} .kpi.warn .val{color:var(--war
