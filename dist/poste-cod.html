<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Poste COD — l'atelier</title>
<meta name="description" content="Atelier COD autonome : de la validation d'un produit à la campagne complète, sans installation.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Cairo:wght@400;600;700&display=swap">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">
<style>
/* =============================================================================
   Poste COD — l'atelier.
   Même langage visuel que les applications réunies : papier chaud, Fraunces
   pour les titres, Archivo pour le corps, JetBrains Mono pour les chiffres.
   ========================================================================== */

:root{
  --fond:#f6f3ec; --surface:#fffdf8; --surface2:#efeae0; --surface3:#e6e0d3;
  --encre:#16211f; --encre2:#4a5754; --encre3:#7b8785;
  --trait:#ded7c9; --trait2:#eae4d8;
  --ocre:#8d530d; --ocre-clair:#f3e7c6;
  --sauge:#6b8e80; --panneau:#304f4f;
  --bien:#4a7c59; --bien-clair:#e2f0ea;
  --alerte:#a8761b; --alerte-clair:#f6ecd8;
  --mal:#9d3b2f; --mal-clair:#f7e4e0;
  --ombre:0 1px 2px rgba(22,33,31,.05),0 8px 28px rgba(22,33,31,.06);
  --f-titre:'Fraunces',Georgia,'Times New Roman',serif;
  --f-corps:'Archivo','Segoe UI',system-ui,-apple-system,sans-serif;
  --f-num:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --f-ar:'Cairo','IBM Plex Sans Arabic','Noto Naskh Arabic',Tahoma,sans-serif;
  --r:12px;
  --rail:236px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --fond:#121a19; --surface:#1a2423; --surface2:#222d2c; --surface3:#2a3635;
  --encre:#eae5db; --encre2:#a8b2af; --encre3:#7d8785;
  --trait:#2c3937; --trait2:#243130;
  --ocre:#d0973f; --ocre-clair:#2c2413;
  --sauge:#8fae9f; --panneau:#24393a;
  --bien:#6fa87c; --bien-clair:#15302a;
  --alerte:#d8a94a; --alerte-clair:#332614;
  --mal:#d97a68; --mal-clair:#341f1d;
  --ombre:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.34);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --fond:#121a19; --surface:#1a2423; --surface2:#222d2c; --surface3:#2a3635;
  --encre:#eae5db; --encre2:#a8b2af; --encre3:#7d8785;
  --trait:#2c3937; --trait2:#243130;
  --ocre:#d0973f; --ocre-clair:#2c2413;
  --sauge:#8fae9f; --panneau:#24393a;
  --bien:#6fa87c; --bien-clair:#15302a;
  --alerte:#d8a94a; --alerte-clair:#332614;
  --mal:#d97a68; --mal-clair:#341f1d;
  --ombre:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.34);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--fond);color:var(--encre);font-family:var(--f-corps);
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-titre);font-weight:600;margin:0;letter-spacing:-.018em;text-wrap:balance}
a{color:var(--ocre);text-underline-offset:2px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ocre);outline-offset:2px;border-radius:5px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.ar{font-family:var(--f-ar);direction:rtl;text-align:right;unicode-bidi:plaintext}
[hidden]{display:none!important}

/* ---------- ossature ---------- */
.app{display:grid;grid-template-columns:var(--rail) 1fr;grid-template-rows:auto 1fr;
  min-height:100vh}
.entete{grid-column:1/-1;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:11px 20px;background:var(--surface);border-bottom:1px solid var(--trait);
  position:sticky;top:0;z-index:40}
.marque{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.marque b{font-family:var(--f-titre);font-size:19px;font-weight:700;letter-spacing:-.024em}
.marque span{font-family:var(--f-num);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--encre3)}
.mode{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;
  padding:5px 12px;border-radius:99px;white-space:nowrap}
.mode i{width:7px;height:7px;border-radius:50%;display:block;flex:none}
.mode.live{background:var(--bien-clair);color:var(--bien)}
.mode.live i{background:var(--bien)}
.mode.hors{background:var(--alerte-clair);color:var(--alerte)}
.mode.hors i{background:var(--alerte)}

nav.rail{background:var(--surface);border-right:1px solid var(--trait);padding:16px 12px 40px;
  overflow-y:auto;position:sticky;top:53px;height:calc(100vh - 53px)}
.rail .groupe{font-family:var(--f-num);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--encre3);padding:14px 12px 6px;font-weight:600}
.rail button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;
  border:1px solid transparent;border-radius:9px;padding:9px 12px;cursor:pointer;
  color:var(--encre2);font-size:14px;font-weight:500;margin-bottom:2px}
.rail button:hover{background:var(--surface2);color:var(--encre)}
.rail button[aria-current="true"]{background:var(--panneau);border-color:var(--panneau);color:#fff;font-weight:600}
:root[data-theme="dark"] .rail button[aria-current="true"],
:root:not([data-theme="light"]) .rail button[aria-current="true"]{color:#eae5db}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .rail button[aria-current="true"]{color:#fff}}
.rail .ico{flex:none;font-size:16px;line-height:1;width:20px;text-align:center}
.rail .pt{font-family:var(--f-num);font-size:10.5px;color:var(--encre3);margin-left:auto}
.rail button[aria-current="true"] .pt{color:rgba(255,255,255,.7)}

main.vue{padding:26px 30px 70px;max-width:1180px;width:100%;min-width:0}
main.vue.plein{padding:0;max-width:none}

@media(max-width:900px){
  .app{grid-template-columns:1fr}
  nav.rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--trait);
    display:flex;gap:4px;overflow-x:auto;padding:10px 12px}
  nav.rail .groupe{display:none}
  nav.rail button{width:auto;white-space:nowrap;margin:0}
  main.vue{padding:20px 16px 60px}
}

/* ---------- titres de vue ---------- */
.tete{margin-bottom:24px}
.kick{font-family:var(--f-num);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ocre);margin:0 0 11px;font-weight:600}
.tete h1{font-size:clamp(26px,3.8vw,40px);line-height:1.06;margin-bottom:10px}
.tete p{color:var(--encre2);max-width:66ch;margin:0;font-size:16px}

/* ---------- cartes ---------- */
.carte{background:var(--surface);border:1px solid var(--trait);border-radius:var(--r);
  box-shadow:var(--ombre);margin-bottom:18px}
.carte .pad{padding:22px 24px}
.carte h2{font-size:21px;margin-bottom:5px}
.carte h3{font-size:17px;margin-bottom:5px}
.sous{color:var(--encre2);font-size:14px;margin:0 0 18px;max-width:66ch}

/* ---------- tuiles ---------- */
.tuiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;
  background:var(--trait);border:1px solid var(--trait);border-radius:var(--r);
  overflow:hidden;margin-bottom:20px}
.tuile{background:var(--surface);padding:14px 16px}
.tuile .k{font-family:var(--f-num);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--encre3);margin-bottom:5px}
.tuile .v{font-family:var(--f-titre);font-size:27px;font-weight:600;line-height:1.1;
  letter-spacing:-.024em;font-variant-numeric:tabular-nums}
.tuile .s{font-size:11.5px;color:var(--encre3);font-family:var(--f-num);margin-top:2px}
.tuile .v.bien{color:var(--bien)} .tuile .v.mal{color:var(--mal)} .tuile .v.alerte{color:var(--alerte)}
.tuile.fort{background:var(--panneau)}
.tuile.fort .k{color:rgba(255,255,255,.6)} .tuile.fort .v,.tuile.fort .s{color:#fff}

/* ---------- formulaires ---------- */
.champs{display:grid;gap:13px;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr))}
.champ{display:flex;flex-direction:column;gap:5px;min-width:0}
.champ.large{grid-column:1/-1}
.champ label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--encre3);font-weight:600}
.champ .aide{font-size:11.5px;color:var(--encre3);line-height:1.4}
input,select,textarea{background:var(--fond);border:1px solid var(--trait);border-radius:9px;
  padding:10px 12px;font-size:15px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ocre);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--ocre) 16%,transparent)}
textarea{font-family:var(--f-num);font-size:13px;min-height:110px;resize:vertical}
.gros{font-size:19px;padding:15px 16px}

.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:18px}
.btn{background:var(--surface);border:1px solid var(--trait);border-radius:9px;padding:10px 17px;
  cursor:pointer;font-weight:600;font-size:14.5px;white-space:nowrap;width:auto;
  display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--encre)}
.btn:hover{border-color:var(--encre3)}
.btn.pri{background:var(--panneau);border-color:var(--panneau);color:#fff}
:root[data-theme="dark"] .btn.pri,:root:not([data-theme="light"]) .btn.pri{color:#eae5db}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .btn.pri{color:#fff}}
.btn.pri:hover{filter:brightness(1.12)}
.btn.gros{padding:15px 28px;font-size:17px}
.btn.sm{padding:6px 12px;font-size:12.5px;font-weight:600}
.btn.dgr{color:var(--mal);border-color:color-mix(in srgb,var(--mal) 40%,transparent)}
.btn:disabled{opacity:.45;cursor:not-allowed}

.puces{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.puce{border:1px solid var(--trait);background:var(--surface);border-radius:99px;padding:5px 13px;
  font-size:12.5px;cursor:pointer;color:var(--encre2);font-weight:500;width:auto}
.puce:hover{border-color:var(--ocre);color:var(--ocre)}

/* ---------- progression de l'orchestrateur ---------- */
.chaine{display:flex;flex-direction:column;gap:1px;background:var(--trait);
  border:1px solid var(--trait);border-radius:var(--r);overflow:hidden}
.etape{background:var(--surface);padding:13px 18px;display:grid;
  grid-template-columns:30px 1fr auto;gap:14px;align-items:center}
.etape .pastille{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
  font-family:var(--f-num);font-size:12px;font-weight:600;flex:none;
  background:var(--surface2);color:var(--encre3);border:1px solid var(--trait)}
.etape .nom{font-weight:600;font-size:15px}
.etape .note{font-size:12.5px;color:var(--encre3);font-family:var(--f-num);margin-top:2px;
  /* remet à plat le .note global, qui porte un fond et un filet */
  background:none;border:0;padding:0;border-radius:0;line-height:1.45}
.etape .duree{font-family:var(--f-num);font-size:12px;color:var(--encre3);white-space:nowrap}
.etape[data-statut="en-cours"]{background:var(--ocre-clair)}
.etape[data-statut="en-cours"] .pastille{background:var(--ocre);color:#fff;border-color:var(--ocre)}
.etape[data-statut="fait"] .pastille{background:var(--bien);color:#fff;border-color:var(--bien)}
.etape[data-statut="echec"] .pastille{background:var(--mal);color:#fff;border-color:var(--mal)}
.etape[data-statut="echec"] .note{color:var(--mal)}
.etape[data-statut="sautee"]{opacity:.5}
@media (prefers-reduced-motion:no-preference){
  .etape[data-statut="en-cours"] .pastille{animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
}

/* ---------- onglets de résultats ---------- */
.onglets{display:flex;gap:3px;border-bottom:1px solid var(--trait);margin:26px 0 20px;
  overflow-x:auto;flex-wrap:wrap}
.onglets button{background:none;border:0;border-bottom:2px solid transparent;color:var(--encre3);
  padding:10px 15px;cursor:pointer;font-weight:600;font-size:14px;margin-bottom:-1px;
  white-space:nowrap;border-radius:5px 5px 0 0;width:auto}
.onglets button:hover{color:var(--encre)}
.onglets button[aria-selected="true"]{color:var(--ocre);border-bottom-color:var(--ocre)}

/* ---------- tableaux ---------- */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:700px}
th{font-family:var(--f-num);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--encre3);text-align:left;padding:9px 12px;border-bottom:1px solid var(--trait);
  white-space:nowrap;font-weight:600}
th.r,td.r{text-align:right}
td{padding:11px 12px;border-bottom:1px solid var(--trait2);vertical-align:top}
tbody tr:hover{background:var(--surface2)}
tr:last-child td{border-bottom:0}
td .nom{font-weight:600;display:block}
td .meta{display:block;font-family:var(--f-num);font-size:10.5px;color:var(--encre3);margin-top:3px}

/* ---------- pilules ---------- */
.pilule{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:99px;
  white-space:nowrap;border:1px solid transparent}
.pilule.good{background:var(--bien);color:#fff}
.pilule.accent{background:var(--sauge);color:#fff}
.pilule.warn{background:var(--alerte);color:#fff}
.pilule.bad{background:var(--mal);color:#fff}
.pilule.creuse{background:transparent;border-color:var(--trait);color:var(--encre3);font-weight:500}

/* ---------- alertes ---------- */
.alerte{display:flex;gap:12px;align-items:flex-start;padding:13px 16px;border-radius:10px;
  border:1px solid var(--trait);background:var(--surface);font-size:14px;margin-bottom:9px}
.alerte .ic{flex:none;font-size:15px;line-height:1.3}
.alerte.bad{border-color:color-mix(in srgb,var(--mal) 35%,transparent);background:var(--mal-clair)}
.alerte.warn{border-color:color-mix(in srgb,var(--alerte) 35%,transparent);background:var(--alerte-clair)}
.alerte.good{border-color:color-mix(in srgb,var(--bien) 32%,transparent);background:var(--bien-clair)}
.alerte b{font-weight:700}

.note{background:var(--surface2);border-left:3px solid var(--ocre);border-radius:0 9px 9px 0;
  padding:13px 17px;font-size:13.5px;color:var(--encre2);margin:16px 0;line-height:1.6}
.note b{color:var(--encre)}

.vide{padding:40px 22px;text-align:center;color:var(--encre3);font-size:14.5px;
  border:1px dashed var(--trait);border-radius:var(--r)}
.vide strong{display:block;color:var(--encre);font-weight:600;margin-bottom:6px;font-size:16px}

/* ---------- créas ---------- */
.creas{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.crea{border:1px solid var(--trait);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.crea .apercu{background:var(--surface2);display:grid;place-items:center;padding:0}
.crea .apercu img{width:100%;height:auto;display:block}
.crea .bas{padding:11px 13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.crea .bas .t{font-size:12.5px;font-weight:600;flex:1;min-width:0}
.crea .bas .d{font-family:var(--f-num);font-size:10.5px;color:var(--encre3);display:block}

/* ---------- blocs de texte copiables ---------- */
.bloc{background:var(--surface2);border:1px solid var(--trait2);border-radius:10px;
  padding:15px 17px;margin:0;white-space:pre-wrap;word-wrap:break-word;font-size:15px;line-height:1.75}
.bloc.ar{font-family:var(--f-ar);direction:rtl;text-align:right;font-size:16.5px;line-height:1.9}
.ligne-champ{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:18px 0 7px}
.ligne-champ label{font-family:var(--f-num);font-size:10px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--encre3);font-weight:600}
.cp{background:var(--surface);border:1px solid var(--trait);color:var(--encre2);
  padding:4px 11px;border-radius:7px;cursor:pointer;font-size:11.5px;font-weight:600;width:auto}
.cp:hover{border-color:var(--ocre);color:var(--ocre)}
.cp.ok{background:var(--bien);border-color:var(--bien);color:#fff}

/* ---------- scripts vidéo ---------- */
table.beats td.t{font-family:var(--f-num);font-size:12.5px;white-space:nowrap;color:var(--ocre);
  font-weight:600;width:70px}
table.beats td.b{font-weight:700;white-space:nowrap;font-size:12px;letter-spacing:.04em;width:150px}

/* ---------- iframe des applications ---------- */
.cadre{width:100%;height:calc(100vh - 53px);border:0;display:block;background:var(--fond)}

/* ---------- barre d'app ---------- */
.barre-app{display:flex;align-items:center;gap:12px;padding:9px 18px;background:var(--surface2);
  border-bottom:1px solid var(--trait);flex-wrap:wrap}
.barre-app b{font-family:var(--f-titre);font-size:15px}
.barre-app .q{color:var(--encre3);font-size:13px;flex:1;min-width:140px}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--encre);
  color:var(--fond);padding:11px 20px;border-radius:99px;font-size:14px;z-index:90;
  box-shadow:var(--ombre);max-width:88vw;text-align:center}
@media (prefers-reduced-motion:no-preference){
  .toast{animation:monte .22s ease-out}
  @keyframes monte{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

</style>
</head>

  <nav class="rail" id="rail"></nav>

  <main class="vue" id="vue">

</div>

/* Hypothèses par défaut du marché marocain, reprises de Lancement COD :

ion:reduce){*{transition:none!important;animation:none!important}}\n@media(max-width:640px){.wrap{padding:0 14px 90px}.carte .pad{padding:16px 15px}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"wrap\">\n\n\u003cheader class=\"mast\">\n  \u003cp class=\"kick\">Poste COD · veille concurrentielle\u003c/p>\n  \u003ch1>Ce qui se vend vraiment chez les autres\u003c/h1>\n  \u003cp class=\"lede\">Les boutiques COD marocaines sous surveillance, les produits qu'elles poussent,\n    et la seule mesure qui vaut quelque chose : combien d'unités bougent par jour, mesuré sur\n    plusieurs relevés. Un score élevé sur une boutique sans trafic ne vaut pas une série de ventes\n    observée sur onze jours.\u003c/p>\n  \u003cdiv class=\"barre\" id=\"barre\">\u003c/div>\n\u003c/header>\n\n\u003cnav class=\"onglets\" id=\"onglets\" role=\"tablist\">\u003c/nav>\n\n\u003csection id=\"vue\">\u003c/section>\n\n\u003c/div>\n\u003cdiv class=\"toast\" id=\"toast\" hidden>\u003c/div>\n\n\u003cscript>\n(function(){\n\"use strict\";\n\n/* =====================================================================\n   1. ÉTAT\n   Deux sources : le localStorage (partagé avec les autres applications\n   servies depuis la même origine) et, quand le serveur de l'atelier\n   répond, l'API partagée — c'est elle qui relie Espion à l'orchestrateur.\n   ================================================================== */\n\nvar CLE = \"espion-cod-v1\";\nvar API = \"/api\";\nvar enLigne = false;\n\nvar E = { boutiques: [], produits: [], releves: [] };\n\nfunction charger(){\n  try{\n    var brut = localStorage.getItem(CLE);\n    if(brut){\n      var o = JSON.parse(brut);\n      if(o && typeof o === \"object\"){\n        E.boutiques = o.boutiques || [];\n        E.produits  = o.produits  || [];\n        E.releves   = o.releves   || [];\n      }\n    }\n  }catch(err){ /* stockage indisponible : on démarre à vide */ }\n}\nfunction sauver(){\n  try{ localStorage.setItem(CLE, JSON.stringify(E)); }catch(err){}\n  if(enLigne) pousserServeur();\n}\n\nvar minuteurPush = null;\nfunction pousserServeur(){\n  clearTimeout(minuteurPush);\n  minuteurPush = setTimeout(function(){\n    fetch(API + \"/boutiques\", {\n      method:\"POST\", headers:{\"Content-Type\":\"application/json\"},\n      body: JSON.stringify(E.boutiques)\n    }).catch(function(){});\n    fetch(API + \"/captures\", {\n      method:\"POST\", headers:{\"Content-Type\":\"application/json\"},\n      body: JSON.stringify(E.produits)\n    }).catch(function(){});\n  }, 900);\n}\n\nfunction uid(p){ return (p||\"x\") + \"-\" + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }\n\n/* =====================================================================\n   2. MESURE DES VENTES\n\n   La méthode : on relève un compteur public (nombre d'avis, compteur de\n   commandes, stock affiché) à deux dates au moins. La pente donne les\n   ventes par jour. Un seul relevé ne dit rien — l'application le dit\n   plutôt que d'afficher un chiffre inventé.\n   ================================================================== */\n\nvar JOUR = 86400000;\n\nfunction relevesDe(produitId){\n  return E.releves.filter(function(r){ return r.produit === produitId; })\n                  .sort(function(a,b){ return a.date \u003c b.date ? -1 : 1; });\n}\n\nfunction mesure(produitId){\n  var rs = relevesDe(produitId);\n  if(rs.length \u003c 2) return { assez:false, releves:rs.length, parJour:null, jours:0, total:0 };\n\n  var premier = rs[0], dernier = rs[rs.length - 1];\n  var jours = (new Date(dernier.date) - new Date(premier.date)) / JOUR;\n  if(jours \u003c= 0) return { assez:false, releves:rs.length, parJour:null, jours:0, total:0 };\n\n  var delta = Number(dernier.compteur) - Number(premier.compteur);\n  /* Un compteur qui recule veut dire remise à zéro ou suppression d'avis :\n     la série n'est pas exploitable, on ne l'interprète pas. */\n  if(delta \u003c 0) return { assez:false, releves:rs.length, parJour:null, jours:Math.round(jours), total:0, incoherent:true };\n\n  return {\n    assez: true,\n    releves: rs.length,\n    jours: Math.round(jours * 10) / 10,\n    total: delta,\n    parJour: Math.round((delta / jours) * 100) / 100,\n    serie: rs\n  };\n}\n\n/* La force de la preuve dépend du volume ET de la durée d'observation.\n   Onze jours à 20 ventes/jour, c'est une preuve. Deux jours à 40, non. */\nfunction forcePreuve(m){\n  if(!m.assez) return { cle:\"faible\", texte:\"Pas de mesure\", detail: m.incoherent\n    ? \"Compteur en baisse entre deux relevés — série inexploitable\"\n    : (m.releves ? \"Un seul relevé : il en faut deux, espacés\" : \"Aucun relevé\") };\n  if(m.jours >= 7 && m.parJour >= 5)  return { cle:\"forte\",    texte:\"Preuve forte\",    detail: m.parJour + \" ventes/jour sur \" + m.jours + \" jours\" };\n  if(m.jours >= 5 && m.parJour >= 2)  return { cle:\"correcte\", texte:\"Preuve correcte\", detail: m.parJour + \" ventes/jour sur \" + m.jours + \" jours\" };\n  if(m.jours >= 3)                    return { cle:\"moyenne\",  texte:\"Preuve moyenne\",  detail: m.parJour + \" ventes/jour sur \" + m.jours + \" jours\" };\n  return { cle:\"faible\", texte:\"Preuve faible\", detail: \"Seulement \" + m.jours + \" jours d'observation\" };\n}\n\nfunction caEstime(p){\n  var m = mesure(p.id);\n  if(!m.assez || !p.prix) return null;\n  return Math.round(m.parJour * Number(p.prix) * 30);\n}\n\n/* =====================================================================\n   3. RENDU\n   ================================================================== */\n\nvar VUES = [\n  { id:\"produits\",  nom:\"Produits repérés\" },\n  { id:\"boutiques\", nom:\"Boutiques suivies\" },\n  { id:\"releves\",   nom:\"Relevés\" },\n  { id:\"import\",    nom:\"Import / export\" }\n];\nvar vue = \"produits\";\nvar recherche = \"\";\n\nfunction $(id){ return document.getElementById(id); }\nfunction ech(s){ return String(s==null?\"\":s).replace(/[&\u003c>\"']/g,function(c){\n  return {\"&\":\"&amp;\",\"\u003c\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\",\"'\":\"&#39;\"}[c]; }); }\nfunction nb(v){ return Number(v||0).toLocaleString(\"fr-FR\"); }\nfunction dh(v){ return nb(Math.round(v||0)) + \" DH\"; }\nfunction auj(){ return new Date().toISOString().slice(0,10); }\nfunction frDate(iso){ if(!iso) return \"—\"; var p=String(iso).slice(0,10).split(\"-\"); return p[2]+\"/\"+p[1]+\"/\"+p[0].slice(2); }\n\nfunction toast(msg){\n  var t = $(\"toast\");\n  t.textContent = msg; t.hidden = false;\n  clearTimeout(toast._t);\n  toast._t = setTimeout(function(){ t.hidden = true; }, 3200);\n}\n\nfunction rendre(){\n  rendreBarre();\n  rendreOnglets();\n  $(\"vue\").innerHTML = vueHtml();\n  brancher();\n}\n\nfunction rendreBarre(){\n  var avecMesure = E.produits.filter(function(p){ return mesure(p.id).assez; });\n  var fortes = avecMesure.filter(function(p){ return forcePreuve(mesure(p.id)).cle === \"forte\"; });\n  var ventesJour = avecMesure.reduce(function(a,p){ return a + (mesure(p.id).parJour || 0); }, 0);\n  var caMois = E.produits.reduce(function(a,p){ return a + (caEstime(p) || 0); }, 0);\n\n  $(\"barre\").innerHTML =\n    tuile(\"Boutiques suivies\", nb(E.boutiques.length), E.boutiques.length ? \"\" : \"aucune pour l'instant\") +\n    tuile(\"Produits repérés\", nb(E.produits.length), avecMesure.length + \" mesurés\") +\n    tuile(\"Preuves fortes\", nb(fortes.length), fortes.length ? \"à lancer en priorité\" : \"aucune\") +\n    tuile(\"Ventes / jour\", nb(Math.round(ventesJour)), \"cumul mesuré\") +\n    tuile(\"CA concurrent / mois\", caMois ? dh(caMois) : \"—\", \"estimé sur les mesures\");\n}\nfunction tuile(l, v, s){\n  return '\u003cdiv>\u003cspan>' + ech(l) + '\u003c/span>\u003cb>' + ech(v) + '\u003c/b>' + (s ? '\u003ci>' + ech(s) + '\u003c/i>' : '') + '\u003c/div>';\n}\n\nfunction rendreOnglets(){\n  var cpt = { produits: E.produits.length, boutiques: E.boutiques.length, releves: E.releves.length, import: null };\n  $(\"onglets\").innerHTML = VUES.map(function(v){\n    return '\u003cbutton role=\"tab\" data-vue=\"' + v.id + '\" aria-selected=\"' + (vue === v.id) + '\">' +\n      ech(v.nom) + (cpt[v.id] != null ? '\u003cspan class=\"cpt\">' + cpt[v.id] + '\u003c/span>' : '') + '\u003c/button>';\n  }).join(\"\");\n}\n\nfunction vueHtml(){\n  if(vue === \"boutiques\") return vueBoutiques();\n  if(vue === \"releves\")   return vueReleves();\n  if(vue === \"import\")    return vueImport();\n  return vueProduits();\n}\n\n/* ---------- produits ---------- */\nfunction vueProduits(){\n  var h = '\u003cdiv class=\"carte\">\u003cdiv class=\"pad\">' +\n    '\u003ch2>Ajouter un produit repéré\u003c/h2>' +\n    '\u003cp class=\"sous\">Ce que vous avez vu chez un concurrent. Le compteur est le chiffre public ' +\n    'qui monte quand une vente se fait : nombre d\\'avis, compteur de commandes, « X vendus ». ' +\n    'Relevez-le une deuxième fois quelques jours plus tard — c\\'est l\\'écart qui mesure les ventes.\u003c/p>' +\n    '\u003cform id=\"f-produit\">\u003cdiv class=\"champs\">' +\n    ch(\"nom\", \"Produit\", \"text\", \"\", \"large\") +\n    chSelect(\"boutique\", \"Boutique\", E.boutiques.map(function(b){ return { v:b.id, t:b.nom }; })) +\n    ch(\"prix\", \"Prix affiché (DH)\", \"number\") +\n    ch(\"url\", \"Lien de la fiche\", \"url\", \"\", \"large\") +\n    ch(\"compteur\", \"Compteur aujourd'hui\", \"number\", \"\", \"\", \"Avis, commandes, « X vendus »\") +\n    '\u003c/div>\u003cdiv class=\"outils\" style=\"margin:16px 0 0\">' +\n    '\u003cbutton class=\"btn pri\" type=\"submit\">Ajouter\u003c/button>' +\n    '\u003c/div>\u003c/form>\u003c/div>\u003c/div>';\n\n  h += '\u003cdiv class=\"carte\">\u003cdiv class=\"pad\">' +\n    '\u003cdiv class=\"outils\">' +\n    '\u003cinput type=\"search\" id=\"q\" placeholder=\"Chercher un produit, une boutique…\" value=\"' + ech(recherche) + '\">' +\n    '\u003c/div>';\n\n  var liste = E.produits.filter(function(p){\n    if(!recherche) return true;\n    var b = boutiqueDe(p);\n    return (p.nom + \" \" + (b ? b.nom : \"\")).toLowerCase().indexOf(recherche.toLowerCase()) > -1;\n  }).sort(function(a,b){\n    var ma = mesure(a.id), mb = mesure(b.id);\n    return (mb.parJour || -1) - (ma.parJour || -1);\n  });\n\n  if(!liste.length){\n    h += '\u003cdiv class=\"vide\">\u003cstrong>Aucun produit repéré\u003c/strong>' +\n      'Ajoutez ce que vous voyez tourner chez les concurrents, puis relevez leur compteur ' +\n      'quelques jours plus tard.\u003c/div>';\n  }else{\n    h += '\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>' +\n      '\u003cth>Produit\u003c/th>\u003cth>Boutique\u003c/th>\u003cth class=\"r\">Prix\u003c/th>' +\n      '\u003cth class=\"r\">Ventes / jour\u003c/th>\u003cth class=\"r\">CA / mois\u003c/th>\u003cth>Preuve\u003c/th>\u003cth>\u003c/th>' +\n      '\u003c/tr>\u003c/thead>\u003ctbody>' +\n      liste.map(ligneProduit).join(\"\") +\n      '\u003c/tbody>\u003c/table>\u003c/div>' +\n      '\u003cdiv class=\"note\">\u003cb>Comment lire.\u003c/b> « Ventes / jour » est la pente entre le premier et le ' +\n      'dernier relevé du compteur public. « CA / mois » multiplie cette pente par le prix affiché : ' +\n      'c\\'est le chiffre d\\'affaires du concurrent, pas votre marge. Une preuve faible ne veut pas dire ' +\n      'mauvais produit — elle veut dire qu\\'on ne sait pas encore.\u003c/div>';\n  }\n  return h + '\u003c/div>\u003c/div>';\n}\n\nfunction ligneProduit(p){\n  var b = boutiqueDe(p);\n  var m = mesure(p.id);\n  var f = forcePreuve(m);\n  var ca = caEstime(p);\n  return '\u003ctr>' +\n    '\u003ctd>\u003cspan class=\"nom\">' + ech(p.nom) + '\u003c/span>' +\n      (p.url ? '\u003cspan class=\"meta\">\u003ca href=\"' + ech(p.url) + '\" target=\"_blank\" rel=\"noopener\">ouvrir la fiche ↗\u003c/a>\u003c/span>' : '') +\n      (m.assez ? sparkline(m) : '') +\n    '\u003c/td>' +\n    '\u003ctd>' + (b ? ech(b.nom) : '\u003cspan class=\"pilule creuse\">non rattaché\u003c/span>') +\n      (b && b.domaine ? '\u003cspan class=\"meta\">' + ech(b.domaine) + '\u003c/span>' : '') + '\u003c/td>' +\n    '\u003ctd class=\"r num\">' + (p.prix ? nb(p.prix) : \"—\") + '\u003c/td>' +\n    '\u003ctd class=\"r num\">' + (m.assez ? m.parJour : \"—\") + '\u003c/td>' +\n    '\u003ctd class=\"r num\">' + (ca ? nb(ca) : \"—\") + '\u003c/td>' +\n    '\u003ctd>\u003cspan class=\"pilule ' + f.cle + '\">' + ech(f.texte) + '\u003c/span>' +\n      '\u003cspan class=\"meta\">' + ech(f.detail) + '\u003c/span>\u003c/td>' +\n    '\u003ctd class=\"r\" style=\"white-space:nowrap\">' +\n      '\u003cbutton class=\"btn sm\" data-relever=\"' + p.id + '\">Relever\u003c/button> ' +\n      '\u003cbutton class=\"btn sm pri\" data-lancer=\"' + p.id + '\">Lancer\u003c/button> ' +\n      '\u003cbutton class=\"btn sm dgr\" data-suppr-p=\"' + p.id + '\">×\u003c/button>' +\n    '\u003c/td>\u003c/tr>';\n}\n\nfunction sparkline(m){\n  var vals = m.serie.map(function(r){ return Number(r.compteur); });\n  var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);\n  var etendue = max - min || 1;\n  return '\u003cspan class=\"suivi\" title=\"Progression du compteur\">' + vals.map(function(v){\n    var pct = Math.max(6, Math.round(((v - min) / etendue) * 100));\n    return '\u003ci style=\"height:' + pct + '%\">\u003c/i>';\n  }).join(\"\") + '\u003c/span>';\n}\n\nfunction boutiqueDe(p){\n  for(var i=0;i\u003cE.boutiques.length;i++) if(E.boutiques[i].id === p.boutique) return E.boutiques[i];\n  return null;\n}\n\n/* ---------- boutiques ---------- */\nfunction vueBoutiques(){\n  var h = '\u003cdiv class=\"carte\">\u003cdiv class=\"pad\">' +\n    '\u003ch2>Suivre une boutique\u003c/h2>' +\n    '\u003cp class=\"sous\">Le domaine suffit. Tout ce qui vient de cette boutique se retrouvera rattaché ici.\u003c/p>' +\n    '\u003cform id=\"f-boutique\">\u003cdiv class=\"champs\">' +\n    ch(\"nom\", \"Nom\", \"text\") +\n    ch(\"domaine\", \"Domaine\", \"text\", \"\", \"\", \"ex. justyol.com\") +\n    chSelect(\"plateforme\", \"Plateforme\", [\n      {v:\"YouCan\",t:\"YouCan\"},{v:\"Shopify\",t:\"Shopify\"},{v:\"WooCommerce\",t:\"WooCommerce\"},\n      {v:\"Instagram\",t:\"Instagram\"},{v:\"Facebook\",t:\"Facebook\"},{v:\"Autre\",t:\"Autre\"}]) +\n    ch(\"ville\", \"Ville\", \"text\") +\n    ch(\"note\", \"Ce qu'on en sait\", \"text\", \"\", \"large\") +\n    '\u003c/div>\u003cdiv class=\"outils\" style=\"margin:16px 0 0\">' +\n    '\u003cbutton class=\"btn pri\" type=\"submit\">Suivre\u003c/button>\u003c/div>\u003c/form>\u003c/div>\u003c/div>';\n\n  if(!E.boutiques.length){\n    return h + '\u003cdiv class=\"carte\">\u003cdiv class=\"vide\">\u003cstrong>Aucune boutique suivie\u003c/strong>' +\n      'Commencez par les trois ou quatre qui vendent déjà ce que vous voulez vendre.\u003c/div>\u003c/div>';\n  }\n\n  h += '\u003cdiv class=\"carte\">\u003cdiv class=\"pad\">\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>' +\n    '\u003cth>Boutique\u003c/th>\u003cth>Plateforme\u003c/th>\u003cth>Ville\u003c/th>\u003cth class=\"r\">Produits\u003c/th>' +\n    '\u003cth class=\"r\">Ventes / jour\u003c/th>\u003cth>Ce qu\\'on en sait\u003c/th>\u003cth>\u003c/th>' +\n    '\u003c/tr>\u003c/thead>\u003ctbody>' +\n    E.boutiques.map(function(b){\n      var prods = E.produits.filter(function(p){ return p.boutique === b.id; });\n      var vj = prods.reduce(function(a,p){ var m = mesure(p.id); return a + (m.parJour || 0); }, 0);\n      return '\u003ctr>' +\n        '\u003ctd>\u003cspan class=\"nom\">' + ech(b.nom) + '\u003c/span>' +\n          (b.domaine ? '\u003cspan class=\"meta\">\u003ca href=\"https://' + ech(b.domaine) + '\" target=\"_blank\" rel=\"noopener\">' + ech(b.domaine) + ' ↗\u003c/a>\u003c/span>' : '') + '\u003c/td>' +\n        '\u003ctd>' + ech(b.plateforme || \"—\") + '\u003c/td>' +\n        '\u003ctd>' + ech(b.ville || \"—\") + '\u003c/td>' +\n        '\u003ctd class=\"r num\">' + prods.length + '\u003c/td>' +\n        '\u003ctd class=\"r num\">' + (vj ? Math.round(vj * 10) / 10 : \"—\") + '\u003c/td>' +\n        '\u003ctd style=\"color:var(--encre2);font-size:13.5px\">' + ech(b.note || \"\") + '\u003c/td>' +\n        '\u003ctd class=\"r\">\u003cbutton class=\"btn sm dgr\" data-suppr-b=\"' + b.id + '\">×\u003c/button>\u003c/td>' +\n        '\u003c/tr>';\n    }).join(\"\") +\n    '\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\u003c/div>';\n  return h;\n}\n\n/* ---------- relevés ---------- */\nfunction vueReleves(){\n  var rs = E.releves.slice().sort(function(a,b){ return a.date \u003c b.date ? 1 : -1; });\n  var h = '\u003cdiv class=\"carte\">\u003cdiv class=\"pad\">' +\n    '\u003ch2>Journal des relevés\u003c/h2>' +\n    '\u003cp class=\"sous\">Chaque ligne est une observation datée d\\'un compteur public. Deux relevés ' +\n    'espacés de plusieurs jours suffisent à mesurer une pente ; plus il y en a, plus elle est fiable.\u003c/p>';\n\n  if(!rs.length){\n    h += '\u003cdiv class=\"vide\">\u003cstrong>Aucun relevé\u003c/strong>Utilisez le bouton « Relever » sur un produit.\u003c/div>';\n  }else{\n    h += '\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Date\u003c/th>\u003cth>Produit\u003c/th>\u003cth class=\"r\">Compteur\u003c/th>' +\n      '\u003cth>Note\u003c/th>\u003cth>\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>' +\n      rs.map(function(r){\n        var p = E.produits.filter(function(x){ return x.id === r.produit; })[0];\n        return '\u003ctr>\u003ctd class=\"num\">' + frDate(r.date) + '\u003c/td>' +\n          '\u003ctd>' + ech(p ? p.nom : \"produit supprimé\") + '\u003c/td>' +\n          '\u003ctd class=\"r num\">' + nb(r.compteur) + '\u003c/td>' +\n          '\u003ctd style=\"color:var(--encre2);font-size:13.5px\">' + ech(r.note || \"\") + '\u003c/td>' +\n          '\u003ctd class=\"r\">\u003cbutton class=\"btn sm dgr\" data-suppr-r=\"' + r.id + '\">×\u003c/button>\u003c/td>\u003c/tr>';\n      }).join(\"\") + '\u003c/tbody>\u003c/table>\u003c/div>';\n  }\n  return h + '\u003c/div>\u003c/div>';\n}\n\n/* ---------- import / export ---------- */\nfunction vueImport(){\n  return '\u003cdiv class=\"carte\">\u003cdiv class=\"pad\">' +\n    '\u003ch2>Importer votre base\u003c/h2>' +\n    '\u003cp class=\"sous\">Si vous avez déjà une base Espion COD ou des captures de l\\'extension Radar, ' +\n    'collez-les ici. Le CSV est reconnu avec ces colonnes, dans n\\'importe quel ordre : ' +\n    '\u003cspan class=\"num\">produit, boutique, domaine, prix, url, compteur, date\u003c/span>. ' +\n    'Le JSON exporté par cette page est réimportable tel quel.\u003c/p>' +\n    '\u003cform id=\"f-import\">' +\n    '\u003ctextarea name=\"donnees\" placeholder=\"produit;boutique;domaine;prix;url;compteur;date&#10;' +\n    'Set 12 bocaux carrés;Justyol;justyol.com;249;https://justyol.com/p/bocaux;312;2026-08-24\">\u003c/textarea>' +\n    '\u003cdiv class=\"outils\" style=\"margin-top:14px\">' +\n    '\u003cbutton class=\"btn pri\" type=\"submit\">Importer\u003c/button>' +\n    '\u003cbutton class=\"btn\" type=\"button\" id=\"b-export\">Exporter en JSON\u003c/button>' +\n    '\u003cbutton class=\"btn dgr\" type=\"button\" id=\"b-vider\">Tout effacer\u003c/button>' +\n    '\u003c/div>\u003c/form>' +\n    '\u003cdiv class=\"note\">\u003cb>Une même ligne importée deux fois ne crée pas de doublon.\u003c/b> ' +\n    'Le produit est reconnu par son nom et sa boutique ; si un compteur et une date sont fournis, ' +\n    'ils s\\'ajoutent comme un relevé de plus — c\\'est comme cela qu\\'on construit la mesure ' +\n    'sans ressaisir le produit.\u003c/div>' +\n    '\u003c/div>\u003c/div>';\n}\n\n/* ---------- fabriques de champs ---------- */\nfunction ch(nom, label, type, val, cls, aide){\n  return '\u003cdiv class=\"champ ' + (cls||\"\") + '\">\u003clabel for=\"c-' + nom + '\">' + ech(label) + '\u003c/label>' +\n    '\u003cinput id=\"c-' + nom + '\" name=\"' + nom + '\" type=\"' + type + '\"' +\n    (type === \"number\" ? ' step=\"any\" inputmode=\"decimal\"' : '') +\n    ' value=\"' + ech(val||\"\") + '\">' +\n    (aide ? '\u003cspan class=\"aide\">' + ech(aide) + '\u003c/span>' : '') + '\u003c/div>';\n}\nfunction chSelect(nom, label, options){\n  return '\u003cdiv class=\"champ\">\u003clabel for=\"c-' + nom + '\">' + ech(label) + '\u003c/label>' +\n    '\u003cselect id=\"c-' + nom + '\" name=\"' + nom + '\">\u003coption value=\"\">— aucune —\u003c/option>' +\n    options.map(function(o){ return '\u003coption value=\"' + ech(o.v) + '\">' + ech(o.t) + '\u003c/option>'; }).join(\"\") +\n    '\u003c/select>\u003c/div>';\n}\n\n/* =====================================================================\n   4. ÉVÉNEMENTS\n   ================================================================== */\n\nfunction brancher(){\n  document.querySelectorAll(\"[data-vue]\").forEach(function(b){\n    b.onclick = function(){ vue = b.dataset.vue; rendre(); };\n  });\n\n  var q = $(\"q\");\n  if(q) q.oninput = function(){\n    recherche = q.value;\n    /* on ne redessine que la liste pour ne pas perdre le focus du champ */\n    var carte = q.closest(\".carte\");\n    var suivant = document.createElement(\"div\");\n    suivant.innerHTML = vueProduits();\n    var neuf = suivant.querySelectorAll(\".carte\")[1];\n    if(neuf && carte) { carte.replaceWith(neuf); brancher(); $(\"q\").focus();\n      $(\"q\").setSelectionRange(recherche.length, recherche.length); }\n  };\n\n  var fp = $(\"f-produit\");\n  if(fp) fp.onsubmit = function(ev){\n    ev.preventDefault();\n    var d = Object.fromEntries(new FormData(fp).entries());\n    if(!d.nom || !d.nom.trim()) return toast(\"Le nom du produit est obligatoire.\");\n    var p = { id: uid(\"prd\"), nom: d.nom.trim(), boutique: d.boutique || null,\n      prix: d.prix ? Number(d.prix) : null, url: d.url || null, vuLe: auj() };\n    E.produits.push(p);\n    if(d.compteur !== \"\" && d.compteur != null){\n      E.releves.push({ id: uid(\"rel\"), produit: p.id, date: auj(), compteur: Number(d.compteur), note: \"premier relevé\" });\n    }\n    sauver(); rendre();\n    toast(\"Produit ajouté. Revenez dans quelques jours relever le compteur.\");\n  };\n\n  var fb = $(\"f-boutique\");\n  if(fb) fb.onsubmit = function(ev){\n    ev.preventDefault();\n    var d = Object.fromEntries(new FormData(fb).entries());\n    if(!d.nom || !d.nom.trim()) return toast(\"Le nom de la boutique est obligatoire.\");\n    E.boutiques.push({ id: uid(\"btq\"), nom: d.nom.trim(),\n      domaine: (d.domaine||\"\").replace(/^https?:\\/\\//,\"\").replace(/\\/$/,\"\") || null,\n      plateforme: d.plateforme || null, ville: d.ville || null, note: d.note || null, depuis: auj() });\n    sauver(); rendre(); toast(\"Boutique suivie.\");\n  };\n\n  document.querySelectorAll(\"[data-relever]\").forEach(function(b){\n    b.onclick = function(){\n      var p = E.produits.filter(function(x){ return x.id === b.dataset.relever; })[0];\n      if(!p) return;\n      var v = prompt(\"Compteur relevé aujourd'hui pour « \" + p.nom + \" »\\n\\n\" +\n        \"(nombre d'avis, compteur de commandes, « X vendus »)\");\n      if(v === null) return;\n      var n = Number(String(v).replace(/[^\\d.]/g, \"\"));\n      if(!isFinite(n)) return toast(\"Il faut un nombre.\");\n      /* Un deuxième relevé le même jour remplace le premier : deux valeurs\n         à la même date ne mesurent rien. */\n      var deja = E.releves.filter(function(r){ return r.produit === p.id && r.date === auj(); })[0];\n      if(deja) deja.compteur = n;\n      else E.releves.push({ id: uid(\"rel\"), produit: p.id, date: auj(), compteur: n, note: \"\" });\n      sauver(); rendre();\n      var m = mesure(p.id);\n      toast(m.assez ? \"Mesure : \" + m.parJour + \" ventes/jour sur \" + m.jours + \" jours.\"\n                    : \"Relevé enregistré. Il en faut un second, quelques jours plus tard.\");\n    };\n  });\n\n  document.querySelectorAll(\"[data-lancer]\").forEach(function(b){\n    b.onclick = function(){\n      var p = E.produits.filter(function(x){ return x.id === b.dataset.lancer; })[0];\n      if(!p) return;\n      /* La passerelle de l'atelier écoute ce message et ouvre l'orchestrateur\n         avec le produit pré-rempli. Hors atelier, on recopie dans le presse-papier. */\n      var charge = { source:\"espion\", nom: p.nom, prix: p.prix, url: p.url };\n      if(window.parent !== window){\n        window.parent.postMessage({ type:\"poste-cod:lancer\", produit: charge }, \"*\");\n        toast(\"Envoyé à l'orchestrateur.\");\n      }else{\n        try{ navigator.clipboard.writeText(p.nom); toast(\"Nom copié — collez-le dans l'orchestrateur.\"); }\n        catch(e){ toast(\"Ouvrez cette page depuis l'atelier pour lancer directement.\"); }\n      }\n    };\n  });\n\n  document.querySelectorAll(\"[data-suppr-p]\").forEach(function(b){\n    b.onclick = function(){\n      var id = b.dataset.supprP;\n      E.produits = E.produits.filter(function(x){ return x.id !== id; });\n      E.releves = E.releves.filter(function(r){ return r.produit !== id; });\n      sauver(); rendre();\n    };\n  });\n  document.querySelectorAll(\"[data-suppr-b]\").forEach(function(b){\n    b.onclick = function(){\n      var id = b.dataset.supprB;\n      E.boutiques = E.boutiques.filter(function(x){ return x.id !== id; });\n      E.produits.forEach(function(p){ if(p.boutique === id) p.boutique = null; });\n      sauver(); rendre();\n    };\n  });\n  document.querySelectorAll(\"[data-suppr-r]\").forEach(function(b){\n    b.onclick = function(){\n      E.releves = E.releves.filter(function(x){ return x.id !== b.dataset.supprR; });\n      sauver(); rendre();\n    };\n  });\n\n  var fi = $(\"f-import\");\n  if(fi) fi.onsubmit = function(ev){\n    ev.preventDefault();\n    var txt = fi.elements.donnees.value.trim();\n    if(!txt) return toast(\"Collez des données d'abord.\");\n    try{\n      var res = importer(txt);\n      sauver(); rendre();\n      toast(res.produits + \" produits, \" + res.boutiques + \" boutiques, \" + res.releves + \" relevés.\");\n    }catch(err){\n      toast(\"Import impossible : \" + err.message);\n    }\n  };\n\n  var be = $(\"b-export\");\n  if(be) be.onclick = function(){\n    var blob = new Blob([JSON.stringify(E, null, 1)], { type:\"application/json\" });\n    var a = document.createElement(\"a\");\n    a.href = URL.createObjectURL(blob);\n    a.download = \"espion-cod-\" + auj() + \".json\";\n    a.click();\n    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);\n  };\n  var bv = $(\"b-vider\");\n  if(bv) bv.onclick = function(){\n    if(!confirm(\"Effacer toutes les boutiques, produits et relevés ? C'est irréversible.\")) return;\n    E = { boutiques:[], produits:[], releves:[] };\n    sauver(); rendre(); toast(\"Base vidée.\");\n  };\n}\n\n/* =====================================================================\n   5. IMPORT\n   ================================================================== */\n\nfunction importer(texte){\n  var t = texte.trim();\n  if(t.charAt(0) === \"{\" || t.charAt(0) === \"[\"){\n    var o = JSON.parse(t);\n    if(Array.isArray(o)) return importerLignes(o);\n    var n = { produits:0, boutiques:0, releves:0 };\n    (o.boutiques || []).forEach(function(b){ if(fusionnerBoutique(b)) n.boutiques++; });\n    (o.produits  || []).forEach(function(p){ if(fusionnerProduit(p))  n.produits++; });\n    (o.releves   || []).forEach(function(r){ if(fusionnerReleve(r))   n.releves++; });\n    return n;\n  }\n  return importerLignes(csv(t));\n}\n\nfunction csv(texte){\n  var lignes = texte.split(/\\r?\\n/).filter(function(l){ return l.trim(); });\n  if(lignes.length \u003c 2) throw new Error(\"il faut une ligne d'en-tête et au moins une ligne de données\");\n  var sep = (lignes[0].split(\";\").length > lignes[0].split(\",\").length) ? \";\" : \",\";\n  var entetes = lignes[0].split(sep).map(function(h){\n    return h.trim().toLowerCase().replace(/^[\"']|[\"']$/g,\"\");\n  });\n  return lignes.slice(1).map(function(l){\n    var cells = l.split(sep);\n    var o = {};\n    entetes.forEach(function(h,i){ o[h] = (cells[i]||\"\").trim().replace(/^[\"']|[\"']$/g,\"\"); });\n    return o;\n  });\n}\n\nfunction importerLignes(lignes){\n  var n = { produits:0, boutiques:0, releves:0 };\n  lignes.forEach(function(l){\n    var nomBtq = l.boutique || l.magasin || l.shop || \"\";\n    var domaine = l.domaine || l.domain || l.site || \"\";\n    var btq = null;\n    if(nomBtq || domaine){\n      btq = trouverBoutique(nomBtq, domaine);\n      if(!btq){\n        btq = { id: uid(\"btq\"), nom: nomBtq || domaine,\n          domaine: (domaine||\"\").replace(/^https?:\\/\\//,\"\").replace(/\\/$/,\"\") || null,\n          plateforme: l.plateforme || null, ville: l.ville || null, depuis: auj() };\n        E.boutiques.push(btq); n.boutiques++;\n      }\n    }\n\n    var nomProd = l.produit || l.product || l.nom || l.titre || \"\";\n    if(!nomProd) return;\n    var prod = E.produits.filter(function(p){\n      return p.nom.toLowerCase() === nomProd.toLowerCase() && p.boutique === (btq ? btq.id : null);\n    })[0];\n    if(!prod){\n      prod = { id: uid(\"prd\"), nom: nomProd, boutique: btq ? btq.id : null,\n        prix: l.prix ? Number(String(l.prix).replace(/[^\\d.]/g,\"\")) : null,\n        url: l.url || l.lien || null, vuLe: auj() };\n      E.produits.push(prod); n.produits++;\n    }else if(l.prix && !prod.prix){\n      prod.prix = Number(String(l.prix).replace(/[^\\d.]/g,\"\"));\n    }\n\n    var compteur = l.compteur || l.avis || l.ventes || l.commandes || \"\";\n    if(compteur !== \"\"){\n      var date = (l.date || auj()).slice(0,10);\n      var c = Number(String(compteur).replace(/[^\\d.]/g,\"\"));\n      if(isFinite(c)){\n        var deja = E.releves.filter(function(r){ return r.produit === prod.id && r.date === date; })[0];\n        if(deja) deja.compteur = c;\n        else { E.releves.push({ id: uid(\"rel\"), produit: prod.id, date: date, compteur: c, note: \"importé\" }); n.releves++; }\n      }\n    }\n  });\n  return n;\n}\n\nfunction trouverBoutique(nom, domaine){\n  var d = (domaine||\"\").replace(/^https?:\\/\\//,\"\").replace(/\\/$/,\"\").toLowerCase();\n  for(var i=0;i\u003cE.boutiques.length;i++){\n    var b = E.boutiques[i];\n    if(d && b.domaine && b.domaine.toLowerCase() === d) return b;\n    if(nom && b.nom.toLowerCase() === nom.toLowerCase()) return b;\n  }\n  return null;\n}\nfunction fusionnerBoutique(b){\n  if(!b || !b.nom) return false;\n  if(trouverBoutique(b.nom, b.domaine)) return false;\n  E.boutiques.push(Object.assign({ id: uid(\"btq\"), depuis: auj() }, b));\n  return true;\n}\nfunction fusionnerProduit(p){\n  if(!p || !p.nom) return false;\n  if(E.produits.some(function(x){ return x.id === p.id || (x.nom === p.nom && x.boutique === p.boutique); })) return false;\n  E.produits.push(Object.assign({ id: uid(\"prd\"), vuLe: auj() }, p));\n  return true;\n}\nfunction fusionnerReleve(r){\n  if(!r || !r.produit) return false;\n  if(E.releves.some(function(x){ return x.produit === r.produit && x.date === r.date; })) return false;\n  E.releves.push(Object.assign({ id: uid(\"rel\") }, r));\n  return true;\n}\n\n/* =====================================================================\n   6. DÉMARRAGE\n   ================================================================== */\n\ncharger();\nrendre();\n\n/* L'API de l'atelier n'est là que si la page est servie par le serveur local.\n   Sinon la page fonctionne quand même, en pur localStorage. */\nfetch(API + \"/etat\").then(function(r){ return r.ok ? r.json() : null; }).then(function(d){\n  if(d) enLigne = true;\n}).catch(function(){});\n\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"},{"id":"radar","nom":"Radar Produit COD","emoji":"🎯","quoi":"45 candidats notés sur huit critères, chiffrés sur neuf marchés.","pont":true,"html":"\u003c!doctype html>\u003chtml>\u003chead>\u003cmeta charset=utf8>\u003cmeta name=viewport content=\"width=device-width,initial-scale=1\">\u003cstyle>:root{color-scheme:light}body{margin:0;padding:0;font:14px -ap n.sm{padding:5px 10px;font-size:12.5px}\n\n.intro{padding:26px 0 4px;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:30px;align-items:end}\n.intro p{margin:0;color:var(--ink-2);max-width:62ch}\n.intro h2{font-size:clamp(25px,3.3vw,37px);font-weight:700;letter-spacing:-.026em;line-height:1.08;margin-bottom:10px}\n.intro h2 em{font-style:normal;color:var(--accent)}\n.disclaimer{border-left:3px solid var(--warn);background:var(--warn-soft);color:var(--ink);padding:11px 14px;border-radius:0 8px 8px 0;font-size:12.5px;line-height:1.5}\n.disclaimer b{font-weight:600}\n\n.mktsel{width:auto;flex:0 0 auto;background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600;padding:6px 9px;border-radius:8px}\n.mktcard{margin-top:20px;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:0 var(--radius) var(--radius) 0;background:var(--surface);padding:13px 16px;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px;align-items:start}\n@media (max-width:760px){.mktcard{grid-template-columns:1fr;gap:12px}}\n.mktcard .zone{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--accent);font-weight:700}\n.mktcard h3{font-size:17px;font-weight:700;letter-spacing:-.015em;margin:2px 0 5px}\n.mktcard p{margin:0;font-size:12.5px;color:var(--ink-2);line-height:1.5;max-width:60ch}\n.mktfacts{display:flex;flex-wrap:wrap;gap:6px 20px}\n.mktfacts div{min-width:104px}\n.mktfacts .k{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:700}\n.mktfacts .v{font-family:\"IBM Plex Mono\",monospace;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}\n.mktwarn{margin-top:8px;font-size:11.5px;color:var(--warn);line-height:1.45}\n\n.cmp{margin-top:16px;padding-top:14px;border-top:1px solid var(--line-strong);grid-column:1/-1}\n.cmp table{min-width:640px;width:100%}\n.cmp th{position:static;background:transparent;border-bottom:1px solid var(- irst-child,thead th:nth-child(2){text-align:left}\nthead th button{background:none;border:none;font:inherit;color:inherit;padding:0}\nthead th button:hover{color:var(--accent)}\ntbody td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;vertical-align:middle;font-size:13.5px}\ntbody td:first-child,tbody td:nth-child(2){text-align:left}\ntbody tr.row{cursor:pointer}\ntbody tr.row:hover{background:var(--surface-2)}\ntbody tr.row.open{background:var(--accent-soft)}\n.rank{font-family:\"IBM Plex Mono\",monospace;font-size:12px;color:var(--ink-3);width:34px}\n.rank.top{color:var(--gold);font-weight:700}\n.pname{font-weight:600;letter-spacing:-.005em;line-height:1.25}\n.pmeta{font-size:11.5px;color:var(--ink-3);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}\n.tag{border:1px solid var(--line-strong);border-radius:4px;padding:0 5px;font-size:10.5px;letter-spacing:.03em;color:var(--ink-2)}\n.tag.season{border-color:var(--accent);color:var(--accent)}\n.tag.mine{border-color:var(--gold);color:var(--gold)}\n.ring circle{fill:none;stroke-width:4}\n.ring .bg{stroke:var(--surface-3)}\n.scorecell{display:flex;align-items:center;justify-content:flex-end;gap:8px}\n.scorenum{font-family:\"IBM Plex Mono\",monospace;font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}\n.verdict{display:inline-block;border-radius:5px;padding:2px 8px;font-size:11.5px;font-weight:600;white-space:nowrap}\n.v-lancer{background:var(--good-soft);color:var(--good)}\n.v-tester{background:var(--accent-soft);color:var(--accent)}\n.v-surveiller{background:var(--warn-soft);color:var(--warn)}\n.v-ecarter{background:var(--bad-soft);color:var(--bad)}\n.pos{color:var(--good);font-weight:600}\n.neg{color:var(--bad);font-weight:600}\ntd.n{font-family:\"IBM Plex Mono\",monospace;font-variant-numeric:tabular-nums;font-size:12.5px}\n\ntr.detail td{padding:0;border-bottom:1px solid var(--line-strong);background:var(--surface-2)}\n.detail-in{padding:16px 18px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.15fr);gap:24px}\n@media (max-width:900px){.detail-in{grid-template-columns:1fr}}\n.detail-in h4{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);font-weight:700;margin:0 0 10px}\n.crit{display:flex;flex-direction:column;gap:7px}\n.crit-row{display:grid;grid-template-columns:1fr 62px 34px;align-items:center;gap:8px;font-size:12.5px}\n.bar{height:5px;background:var(--surface-3);border-radius:3px;overflow:hidden}\n.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}\n.crit-row .n{font-family:\"IBM Plex Mono\",monospace;font-size:11.5px;color:var(--ink-2);text-align:right;font-variant-numeric:tabular-nums}\n.econ-l{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:12.5px}\n.econ-l b{font-family:\"IBM Plex Mono\",monospace;font-weight:600;font-variant-numeric:tabular-nums}\n.econ-l.tot{border-top:1px solid var(--line-strong);border-bottom:none;margin-top:5px;padding-top:8px;font-weight:600}\n.srcgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(124px,1fr));gap:6px}\n.src{display:flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);border-radius:7px;padding:6px 9px;font-size:12px;text-decoration:none;color:var(--ink-2)}\n.src:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}\n.src .d{width:6px;height:6px;border-radius:50%;background:var(--ink-3);flex:0 0 auto}\n.src:hover .d{background:var(--accent)}\n.note{font-size:12.5px;color:var(--ink-2);line-height:1.5;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}\n.detail-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}\n\n.modal{position:fixed;inset:0;background:rgba(8,18,17,.62);display:flex;align-items:flex-start;justify-content:center;padding:36px 18px;z-index:80;overflow-y:auto}\n.modal[hidden]{display:none}\n.sheet{background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;max-width:640px;width:100%;box-shadow:0 24px 60px -20px rgba(0,0,0,.5)}\n.sheet-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}\n.sheet-h h3{font-size:16px;font-weight:700;margin-right:auto}\n.sheet-b{padding:18px;display:flex;flex-direction:column;gap:13px}\n.sheet-f{padding:13px 18px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap}\ntextarea{min-height:230px;font-family:\"IBM Plex Mono\",monospace;font-size:11px;line-height:1.45;resize:vertical;white-space:pre}\n.empty{padding:44px 20px;text-align:center;color:var(--ink-3);font-size:14px}\nfooter{margin-top:32px;padding-top:18px;border-top:1px solid var(--line);color:var(--ink-3);font-size:12.5px;line-height:1.65}\nfooter a{color:var(--ink-2)}\n.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:10px 18px;border-radius:8px;font-size:13.5px;z-index:90;box-shadow:0 10px 30px -10px rgba(0,0,0,.5)}\n.toast[hidden]{display:none}\n@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}\n\u003c/style>\n\n\u003cheader class=\"top\">\n  \u003cdiv class=\"top-in\">\n    \u003cdiv class=\"brand\">\n      \u003cspan class=\"dot\">\u003c/span>\n      \u003ch1>Radar Produit COD\u003c/h1>\n      \u003csmall id=\"brandCur\">Maroc &middot; MAD\u003c/small>\n    \u003c/div>\n    \u003cselect id=\"market\" aria-label=\"Marché\" class=\"mktsel\">\u003c/select>\n    \u003cbutton class=\"btn sm\" id=\"btnAdd\">+ Ajouter un produit\u003c/button>\n    \u003cbutton class=\"btn sm\" id=\"btnImport\">Importer CSV\u003c/button>\n    \u003cbutton class=\"btn primary sm\" id=\"btnExport\">Exporter\u003c/button>\n  \u003c/div>\n\u003c/header>\n\n\u003cdiv class=\"wrap\">\n  \u003csection class=\"intro\">\n    \u003cdiv>\n      \u003ch2>Quels produits méritent \u003cem>ton budget pub\u003c/em> ce mois-ci&nbsp;?\u003c/h2>\n      \u003cp>Chaque candidat est noté sur huit critères de produit gagnant COD, puis passé au modèle\n      économique du marché choisi&nbsp;: taux de confirmation, refus à la livraison, frais de retour, coût par lead.\n      Neuf marchés couverts, du Maroc au Nigeria en passant par le Golfe et l'Europe de l'Est —\n      un même produit ne vaut pas le même effort partout. Le score bouge quand tu changes tes hypothèses, c'est le but.\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"disclaimer\">\n      \u003cb>Lis ceci avant de commander du stock.\u003c/b> Les prix d'achat et de vente sont des\n      \u003cb>estimations de cadrage\u003c/b> issues de la recherche de marché, pas des devis fournisseurs.\n      Les notes de critères sont un jugement éditorial. Les liens sources ouvrent la recherche\n      live sur chaque plateforme — vérifie prix, MOQ et concurrence toi-même avant d'engager.\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"mktcard\" id=\"mktcard\">\u003c/section>\n\n  \u003cdiv class=\"kpis\" id=\"kpis\">\u003c/div>\n\n  \u003cdiv class=\"cols\">\n    \u003caside class=\"panel rail\">\n      \u003cdiv class=\"panel-h\">\u003ch3>Modèle économique\u003c/h3>\u003cbutton class=\"reset\" id=\"resetEcon\">défaut\u003c/button>\u003c/div>\n      \u003cdiv class=\"panel-b\" id=\"econBox\">\u003c/div>\n      \u003cdiv class=\"panel-h\">\u003ch3>Poids des critères\u003c/h3>\u003cbutton class=\"reset\" id=\"resetW\">défaut\u003c/button>\u003c/div>\n      \u003cdiv class=\"panel-b\" id=\"wBox\">\u003c/div>\n    \u003c/aside>\n\n    \u003cmain>\n      \u003cdiv class=\"toolbar\">\n        \u003cinput type=\"text\" id=\"q\" placeholder=\"Chercher un produit…\" aria-label=\"Chercher un produit\">\n        \u003cselect id=\"fCat\" aria-label=\"Catégorie\">\u003c/select>\n        \u003cselect id=\"fSeason\" aria-label=\"Saison\">\u003c/select>\n        \u003cselect id=\"sort\" aria-label=\"Trier\">\n          \u003coption value=\"score\">Trier : score\u003c/option>\n          \u003coption value=\"marge\">Trier : marge / livraison\u003c/option>\n          \u003coption value=\"margePct\">Trier : marge %\u003c/option>\n          \u003coption value=\"prix\">Trier : prix de vente\u003c/option>\n          \u003coption value=\"cplMax\">Trier : CPL max\u003c/option>\n          \u003coption value=\"nom\">Trier : nom\u003c/option>\n        \u003c/select>\n      \u003c/div>\n      \u003cdiv class=\"chipbar\" id=\"chips\">\u003c/div>\n      \u003cdiv class=\"tablewrap\">\n        \u003ctable>\n          \u003cthead>\u003ctr>\n            \u003cth>\u003c/th>\u003cth>Produit\u003c/th>\u003cth>Score\u003c/th>\u003cth>Verdict\u003c/th>\n            \u003cth>Prix\u003c/th>\u003cth>Coût\u003c/th>\u003cth>Markup\u003c/th>\n            \u003cth>Marge / livr.\u003c/th>\u003cth>Marge&nbsp;%\u003c/th>\u003cth>CPL max\u003c/th>\u003cth>Net / 100 leads\u003c/th>\n          \u003c/tr>\u003c/thead>\n          \u003ctbody id=\"tbody\">\u003c/tbody>\n        \u003c/table>\n      \u003c/div>\n      \u003cdiv class=\"empty\" id=\"empty\" hidden>Aucun produit ne correspond à ces filtres.\u003c/div>\n      \u003cfooter>\n        \u003cp>\u003cb>Comment lire les colonnes.\u003c/b>\n        \u003cb>Marge&nbsp;/&nbsp;livr.\u003c/b> = bénéfice net par commande \u003ci>effectivement livrée et encaissée\u003c/i>, après produit, livraison, retours et publicité.\n        \u003cb>CPL max\u003c/b> = le coût par lead au-delà duquel le produit passe en perte — c'est ton plafond d'enchère.\n        \u003cb>Net&nbsp;/&nbsp;100&nbsp;leads\u003c/b> = résultat d'un test de 100 commandes brutes aux hypothèses du panneau de gauche.\n        Ouvre une ligne pour voir le même produit chiffré sur les neuf marchés, comparé en USD.\u003c/p>\n        \u003cp>\u003cb>Taux de change au 25 août 2026\u003c/b>, figés dans la page&nbsp;: 1 USD = 9,16 MAD · 3,6725 AED · 3,75 SAR · 0,858 EUR ·\n        4,5397 RON · 3,6927 PLN · 562,8 XOF · 1 347,2 NGN. Le franc CFA est arrimé à l'euro à 655,957 XOF.\n        Recalcule tes marges si le change bouge, en particulier sur le naira.\u003c/p>\n        \u003cp>\u003cb>Sources de la recherche&nbsp;:\u003c/b>\n        \u003ca href=\"https://www.overviewdata.io/en/top-selling-products/top-selling-products-in-morocco\" target=\"_blank\" rel=\"noopener\">OverviewData Maroc\u003c/a> ·\n        \u003ca href=\"https://www.overviewdata.io/en/ecommerce-how-to/cod-product-research\" target=\"_blank\" rel=\"noopener\">Critères COD\u003c/a> ·\n        \u003ca href=\"https://www.sellthetrend.com/blog/trending-products-for-dropshipping\" target=\"_blank\" rel=\"noopener\">Sell The Trend\u003c/a> ·\n        \u003ca href=\"https://alidropship.com/top-aliexpress-best-sellers/\" target=\"_blank\" rel=\"noopener\">AliDropship\u003c/a> ·\n        \u003ca href=\"https://fr.accio.com/business/best-selling-products-in-morocco-2026\" target=\"_blank\" rel=\"noopener\">Accio Maroc\u003c/a> ·\n        \u003ca href=\"https://codrocket.com/fr/blog/how-to-start-cod-ecommerce-business\" target=\"_blank\" rel=\"noopener\">CODRocket\u003c/a> ·\n        \u003ca href=\"https://www.egrow.com/en/blog/trending-products-cod-morocco-2026\" target=\"_blank\" rel=\"noopener\">eGrow COD Maroc\u003c/a>\u003c/p>\n        \u003cp>\u003cb>Marchés internationaux&nbsp;:\u003c/b>\n        \u003ca href=\"https://www.swftbox.com/swftblogger/uae-ecommerce-reality-2026\" target=\"_blank\" rel=\"noopener\">Swftbox Émirats\u003c/a> ·\n        \u003ca href=\"https://www.egrow.com/en/blog/saudi-arabia-ecommerce-cod-guide-2026\" target=\"_blank\" rel=\"noopener\">eGrow Arabie saoudite\u003c/a> ·\n        \u003ca href=\"https://www.codrocket.com/blog/cod-ecommerce-saudi-arabia-uae\" target=\"_blank\" rel=\"noopener\">CODRocket Golfe\u003c/a> ·\n        \u003ca href=\"https://inventoryflow.co/mena-courier-rates-uae-saudi-arabia/\" target=\"_blank\" rel=\"noopener\">Tarifs transporteurs MENA\u003c/a> ·\n        \u003 ation sur les solutions de rangement. Marge constatée jusqu'à 60%.\"),\n  P(\"au2\",\"Coussin masseur cervical chauffant\",\"Auto\",\"Hiver\",349,95,780,[8,9,8,6,7,6],\n    \"masseur cervical chauffant voiture\",\"neck massager heated shiatsu\",\n    \"Déjà listé sur Jumia MA — donc demande prouvée, mais vérifie le prix plancher local avant de te positionner.\"),\n  P(\"au3\",\"Déflecteur de climatiseur\",\"Auto\",\"Été\",129,22,180,[5,8,7,3,10,7],\n    \"deflecteur climatiseur\",\"air conditioner deflector\",\n    \"106 annonces actives détectées sur le Maroc avec faible saturation. Produit ultra-léger : logistique COD idéale.\"),\n  P(\"au4\",\"Essuie-glace arrière universel\",\"Auto\",\"Hiver\",99,18,150,[3,8,6,4,10,3],\n    \"essuie glace arriere universel\",\"universal rear wiper blade\",\n    \"2,1 M de ventes mensuelles côté sourcing. Prix bas : à vendre en pack de 2 pour tenir la marge COD.\"),\n  P(\"au5\",\"Kit anti-rayures et polissage\",\"Auto\",\"Toute l'année\",189,35,420,[7,9,7,4,9,6],\n    \"kit polissage rayures voiture\",\"car scratch repair polishing kit\",\n    \"Effet avant/après très démontrable en vidéo — le format qui convertit le mieux en COD.\"),\n  P(\"au6\",\"Aspirateur de voiture sans fil\",\"Auto\",\"Toute l'année\",259,70,650,[7,8,7,6,8,5],\n    \"aspirateur voiture sans fil\",\"cordless car vacuum cleaner\",\n    \"Démo satisfaisante à filmer. Attention au SAV batterie : privilégie un fournisseur avec garantie.\"),\n  P(\"au7\",\"Support téléphone magnétique voiture\",\"Auto\",\"Toute l'année\",129,22,120,[5,7,7,8,10,3],\n    \"support telephone magnetique voiture\",\"magnetic car phone holder\",\n    \"Marché saturé : n'y va que sur un angle bundle (support + chargeur) ou passe ton tour.\"),\n  P(\"au8\",\"Décoration LED cœur pour voiture\",\"Auto\",\"Toute l'année\",149,25,200,[9,3,7,4,10,8],\n    \"lumiere led coeur voiture\",\"LED car heart light\",\n    \"250 M+ de vues TikTok sur le format déco LED auto. Achat 100% impulsion, zé tps://www.ebay.com/sch/i.html?_nkw=${E_(q)}`),\n  S(\"Etsy\",       q => `https://www.etsy.com/search?q=${E_(q)}`),\n  S(\"Temu\",       q => `https://www.temu.com/search_result.html?search_key=${E_(q)}`),\n  S(\"TikTok\",     q => `https://www.tiktok.com/search?q=${E_(q)}`)\n];\n\nconst MARKETS = [\n  {id:\"MA\", nom:\"Maroc\", zone:\"Afrique du Nord\", cur:\"MAD\", sym:\"DH\", rate:9.16, dec:0,\n   unit:10, charm:1, priceMult:1.00, landed:1.00, lang:\"fr\", geo:\"MA\",\n   cod:\"80–90 %\", refusTxt:\"~30 %\",\n   note:\"Le marché de référence de ce radar : les notes de demande publicitaire ont été relevées ici. COD sur 80 à 90 % des transactions en ligne, livraison Amana ou Aramex, stockage local recommandé face au dropshipping direct.\",\n   econ:{conf:60, refus:30, livr:35, retour:18, cpl:40, pmin:149, pmax:499},\n   plats:[S(\"Jumia MA\", q => `https://www.jumia.ma/catalog/?q=${E_(q)}`),\n          S(\"Avito MA\", q => `https://www.avito.ma/fr/maroc?q=${E_(q)}`)]},\n\n  {id:\"AE\", nom:\"Émirats arabes unis\", zone:\"Golfe\", cur:\"AED\", sym:\"AED\", rate:3.6725, dec:0,\n   unit:10, charm:1, priceMult:1.35, landed:0.92, lang:\"en\", geo:\"AE\",\n   cod:\"25–30 %\", refusTxt:\"15–25 %\",\n   note:\"Le COD recule vite : 25 à 30 % des transactions en 2026 contre 40 % en 2022. Marché de 12,3 Md$ qui croît de 11 % par an. Un refus coûte 25 à 50 AED en aller-retour et manutention — prévois le prépaiement en option.\",\n   econ:{conf:70, refus:20, livr:18, retour:35, cpl:12, pmin:79, pmax:299},\n   plats:[S(\"Noon AE\",   q => `https://www.noon.com/uae-en/search/?q=${E_(q)}`),\n          S(\"Amazon AE\", q => `https://www.amazon.ae/s?k=${E_(q)}`),\n          S(\"Dubizzle\",  q => `https://uae.dubizzle.com/search/?q=${E_(q)}`)]},\n\n  {id:\"SA\", nom:\"Arabie saoudite\", zone:\"Golfe\", cur:\"SAR\", sym:\"SAR\", rate:3.75, dec:0,\n   unit:10, charm:1, priceMult:1.25, landed:0.95, lang:\"en\", geo:\"SA\",\n   cod:\"60–70 %\", refusTxt:\"20–30 %\",\n   note:\"Le plus gr
