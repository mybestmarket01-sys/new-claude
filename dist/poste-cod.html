 === \"local\" ? \"Local\" : \"Enregistré\";\n  el.title = s === \"local\"\n    ? \"Enregistrement dans ce navigateur uniquement — la synchronisation cloud n'est pas disponible ici.\"\n    : s === \"cours\" ? \"Enregistrement en cours…\" : \"Données enregistrées dans le cloud.\";\n}\n\nfunction encoder(o){\n  return JSON.stringify(o).replace(/\u003c/g, \"\\\\u003c\").replace(/\\u2028/g, \"\\\\u2028\").replace(/\\u2029/g, \"\\\\u2029\");\n}\n\nfunction modifier(){\n  E.rev = (E.rev || 0) + 1;\n  E.maj = new Date().toISOString();\n  ecrireLocal();\n  rendre();\n  planifier();\n}\n\nfunction planifier(){\n  if(modeLocal) return;\n  etatSynchro(\"cours\");\n  clearTimeout(minuteur);\n  minuteur = setTimeout(publier, 2200);\n}\n\nasync function publier(){\n  if(modeLocal || !API || !SOURCE) return;\n  var av = SOURCE.split(M1)[0];\n  var ap = SOURCE.split(M2)[1];\n  if(av === undefined || ap === undefined){ modeLocal = true; etatSynchro(\"local\"); return; }\n  var doc = av + M1 + '\u003cscript id=\"etat\" type=\"application\\/json\">' + encoder(E) + '\u003c\\/script>' + M2 + ap;\n  try{\n    sessionStorage.setItem(\"rayon-onglet\", onglet);\n    await API.publish(doc);\n  }catch(err){\n    var c = err && err.code;\n    if(c === \"conflict\") return;                 // la vue se recharge sur la version gagnante\n    if(c === \"rate_limited\"){ setTimeout(publier, 6000); return; }\n    if(c === \"upstream_error\"){ setTimeout(publier, 3000 + Math.random()*2000); return; }\n    modeLocal = true; etatSynchro(\"local\");\n    toast(\"crit\", \"Synchronisation indisponible\",\n      \"Vos données restent enregistrées sur cet appareil. Exportez une sauvegarde depuis Réglages.\");\n  }\n}\n\n/* la source de la page sert de gabarit pour la republication */\nfetch(location.href.split(\"#\")[0], {cache:\"no-store\"}).then(function(r){ return r.text(); }).then(function(t){\n  if(!/^\\s*\u003c!doctype/i.test(t)) t = \"\u003c!doctype html>\\n\" + t;\n  if(t.indexOf(M1) > -1 && t.indexOf(M2) > -1) SOURCE = t;\n  else { modeLocal = true; etatSynchro(\"local\"); }\n}).catch(function(){ modeLocal = true; etatSynchro(\"local\"); });\n\nif(window.claude && window.claude.use){\n  window.claude.use(\"artifact\").then(function(a){\n    if(a){ API = a; if(!modeLocal) etatSynchro(\"ok\"); }\n    else { modeLocal = true; etatSynchro(\"local\"); }\n  }).catch(function(){ modeLocal = true; etatSynchro(\"local\"); });\n  window.claude.use(\"downloads\").then(function(d){ DL = d; rendre(); }).catch(function(){});\n}else{\n  modeLocal = true; etatSynchro(\"local\");\n}\n\n/* =======================================================================\n   2. CALCULS MÉTIER\n   ===================================================================== */\nfunction n(v){ return isFinite(+v) ? +v : 0; }\n\nfunction mouvementsDe(id){\n  return E.mouvements.filter(function(m){ return m.art === id; });\n}\nfunction stock(a){\n  var s = n(a.initial);\n  E.mouvements.forEach(function(m){\n    if(m.art !== a.id) return;\n    if(m.type === \"entree\") s += n(m.qte);\n    else if(m.type === \"sortie\") s -= n(m.qte);\n    else s += n(m.qte);\n  });\n  return s;\n}\nfunction seuilDe(a){ return a.seuil === \"\" || a.seuil == null ? n(E.seuil) : n(a.seuil); }\nfunction vendus(a){\n  return E.mouvements.reduce(function(t, m){\n    return t + (m.art === a.id && m.type === \"sortie\" && m.motif === \"Vente\" ? n(m.qte) : 0);\n  }, 0);\n}\nfunction chiffre(a){ return vendus(a) * n(a.vente); }\nfunction margeReelle(a){ return vendus(a) * (n(a.vente) - n(a.achat)); }\n\nfunction statut(a){\n  var s = stock(a), q = seuilDe(a);\n  if(s \u003c= 0) return \"rupture\";\n  if(s \u003c q) return \"alerte\";\n  if(s \u003c q * 2) return \"surveiller\";\n  return \"ok\";\n}\nvar LIB = {rupture:\"Rupture\", alerte:\"Sous le seuil\", surveiller:\"À surveiller\", ok:\"OK\"};\nvar TON = {rupture:\"crit\", alerte:\"crit\", surveiller:\"warn\", ok:\"good\"};\n\nfunction articlesAlerte(){\n  return E.articles.filter(function(a){\n    var s = statut(a); return s === \"rupture\" || s === \"alerte\";\n  }).sort(function(x, y){ return stock(x) - stock(y); });\n}\nfunction art(id){\n  for(var i = 0; i \u003c E.articles.length; i++) if(E.articles[i].id === id) return E.articles[i];\n  return null;\n}\nfunction nomComplet(a){ return a ? a.nom + (a.variante && a.variante !== \"-\" ? \" · \" + a.variante : \"\") : \"Article supprimé\"; }\n\n/* =======================================================================\n   3. FORMATAGE\n   ===================================================================== */\nfunction num(v){ return n(v).toLocaleString(\"fr-FR\"); }\nfunction mad(v){ return n(v).toLocaleString(\"fr-FR\", {maximumFractionDigits:0}) + \" \" + (E.devise || \"MAD\"); }\nfunction madp(v){ return n(v).toLocaleString(\"fr-FR\", {minimumFractionDigits:2, maximumFractionDigits:2}) + \" \" + (E.devise || \"MAD\"); }\nfunction jour(iso){\n  if(!iso) return \"\";\n  var d = new Date(iso + (iso.length === 10 ? \"T12:00:00\" : \"\"));\n  if(isNaN(d)) return iso;\n  return d.toLocaleDateString(\"fr-FR\", {day:\"2-digit\", month:\"2-digit\", year:\"numeric\"});\n}\nfunction aujourdhui(){\n  var d = new Date(), p = function(x){ return String(x).padStart(2, \"0\"); };\n  return d.getFullYear() + \"-\" + p(d.getMonth() + 1) + \"-\" + p(d.getDate());\n}\nfunction ech(s){\n  return String(s == null ? \"\" : s).replace(/[&\u003c>\"']/g, function(c){\n    return {\"&\":\"&amp;\",\"\u003c\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\",\"'\":\"&#39;\"}[c];\n  });\n}\nfunction uid(){\n  return (crypto && crypto.randomUUID) ? crypto.randomUUID()\n    : \"id\" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);\n}\n\n/* =======================================================================\n   4. NAVIGATION\n   ===================================================================== */\nvar ONGLETS = [\n  {id:\"bord\",     lab:\"Bord\",     ico:'\u003cpath d=\"M3 12h4l3 8 4-16 3 8h4\"/>'},\n  {id:\"stock\",    lab:\"Stock\",    ico:'\u003cpath d=\"M3 7l9-4 9 4v10l-9 4-9-4z\"/>\u003cpath d=\"M3 7l9 4 9-4M12 11v10\"/>'},\n  {id:\"flux\",     lab:\"Flux\",     ico:'\u003cpath d=\"M4 8h13M13 4l4 4-4 4\"/>\u003cpath d=\"M20 16H7M11 12l-4 4 4 4\"/>'},\n  {id:\"analyse\",  lab:\"Analyse\",  ico:'\u003cpath d=\"M5 20V10M12 20V4M19 20v-7\"/>'},\n  {id:\"reglages\", lab:\"Réglages\", ico:'\u003ccircle cx=\"12\" cy=\"12\" r=\"3\"/>\u003cpath d=\"M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1\"/>'}\n];\nvar onglet = \"bord\";\ntry{ var o = sessionStorage.getItem(\"rayon-onglet\"); if(o) onglet = o; }catch(err){}\n\nfunction construireNav(){\n  document.getElementById(\"nav\").innerHTML = ONGLETS.map(function(t){\n    return '\u003cbutton data-onglet=\"' + t.id + '\" aria-current=\"' + (t.id === onglet) + '\">' +\n      '\u003csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\">' + t.ico + '\u003c/svg>' +\n      '\u003cspan>' + t.lab + '\u003c/span>' +\n      (t.id === \"stock\" ? '\u003cspan class=\"pastille\" id=\"pastille\" hidden>\u003c/span>' : '') +\n      '\u003c/button>';\n  }).join(\"\");\n}\nfunction aller(id){\n  onglet = id;\n  try{ sessionStorage.setItem(\"rayon-onglet\", id); }catch(err){}\n  ONGLETS.forEach(function(t){\n    document.getElementById(\"v-\" + t.id).hidden = t.id !== id;\n  });\n  document.querySelectorAll(\"#nav button\").forEach(function(b){\n    b.setAttribute(\"aria-current\", String(b.dataset.onglet === id));\n  });\n  window.scrollTo(0, 0);\n  rendre();\n}\ndocument.getElementById(\"nav\").addEventListener(\"click\", function(e){\n  var b = e.target.closest(\"button[data-onglet]\");\n  if(b) aller(b.dataset.onglet);\n});\ndocument.getElementById(\"cloche\").addEventListener(\"click\", function(){\n  aller(\"stock\"); filtreStatut = \"alerte\"; rendre();\n});\n\n/* =======================================================================\n   5. NOTIFICATIONS\n   ===================================================================== */\nfunction toast(ton, titre, texte){\n  var d = document.createElement(\"div\");\n  d.className = \"toast \" + ton;\n  d.innerHTML = \"\u003cb>\" + ech(titre) + \"\u003c/b>\u003cspan>\" + ech(texte) + \"\u003c/span>\";\n  document.getElementById(\"toasts\").appendChild(d);\n  setTimeout(function(){ d.remove(); }, 6500);\n}\nfunction verifierSeuil(a, avant){\n  var apres = stock(a), q = seuilDe(a);\n  if(apres \u003c q && avant >= q){\n    toast(\"crit\", apres \u003c= 0 ? \"Rupture de stock\" : \"Seuil d'alerte franchi\",\n      nomComplet(a) + \" : \" + apres + \" unité(s) restante(s), seuil fixé à \" + q + \".\");\n  }\n}\n\n/* =======================================================================\n   6. VUE — TABLEAU DE BORD\n   ===================================================================== */\nfunction fluxParJour(nbJours){\n  var out = [], base = new Date(); base.setHours(12, 0, 0, 0);\n  for(var i = nbJours - 1; i >= 0; i--){\n    var d = new Date(base.getTime() - i * 86400000);\n    var p = function(x){ return String(x).padStart(2, \"0\"); };\n    var cle = d.getFullYear() + \"-\" + p(d.getMonth() + 1) + \"-\" + p(d.getDate());\n    var e = 0, s = 0;\n    E.mouvements.forEach(function(m){\n      if(m.date !== cle) return;\n      if(m.type === \"entree\") e += n(m.qte);\n      else if(m.type === \"sortie\") s += n(m.qte);\n    });\n    out.push({cle:cle, e:e, s:s, d:d});\n  }\n  return out;\n}\n\nfunction vueBord(){\n  var alertes = articlesAlerte();\n  var ruptures = alertes.filter(function(a){ return stock(a) \u003c= 0; });\n  var unites = E.articles.reduce(function(t, a){ return t + stock(a); }, 0);\n  var valAchat = E.articles.reduce(function(t, a){ return t + stock(a) * n(a.achat); }, 0);\n  var valVente = E.articles.reduce(function(t, a){ return t + stock(a) * n(a.vente); }, 0);\n  var uv = E.articles.reduce(function(t, a){ return t + vendus(a); }, 0);\n  var ca = E.articles.reduce(function(t, a){ return t + chiffre(a); }, 0);\n  var marge = E.articles.reduce(function(t, a){ return t + margeReelle(a); }, 0);\n\n  var jours = fluxParJour(14);\n  var maxJ = Math.max(1, Math.max.apply(null, jours.map(function(j){ return Math.max(j.e, j.s); })));\n  var totE = jours.reduce(function(t, j){ return t + j.e; }, 0);\n  var totS = jours.reduce(function(t, j){ return t + j.s; }, 0);\n\n  var classes = E.articles.slice().sort(function(x, y){ return vendus(y) - vendus(x); });\n  var top = classes.slice(0, 5).filter(function(a){ return vendus(a) > 0; });\n  var flop = classes.slice().reverse().slice(0, 5);\n  var maxV = Math.max(1, vendus(classes[0] || {id:\"\"}));\n\n  var h = \"\";\n\n  h += '\u003cdiv class=\"entete-vue\">\u003ch1>Tableau de bord\u003c/h1>' +\n       '\u003cp>' + ech(E.boutique) + ' · ' + E.articles.length + ' référence(s) suivie(s) · mis à jour le ' +\n       (E.maj ? jour(E.maj.slice(0, 10)) : \"—\") + '\u003c/p>\u003c/div>';\n\n  if(alertes.length){\n    h += '\u003cdiv class=\"bandeau\">\u003cspan class=\"ico\">⚠\u003c/span>\u003cdiv>' +\n      '\u003cb>' + alertes.length + ' article' + (alertes.length > 1 ? \"s\" : \"\") + ' à réapprovisionner\u003c/b>' +\n      '\u003cp>Dont ' + ruptures.length + ' en rupture totale. Seuil d\\'alerte : moins de ' + n(E.seuil) +\n      ' unité' + (n(E.seuil) > 1 ? \"s\" : \"\") + ' en stock.\u003c/p>\u003c/div>\u003c/div>';\n  }else{\n    h += '\u003cdiv class=\"bandeau ok\">\u003cspan class=\"ico\">✓\u003c/span>\u003cdiv>\u003cb>Stock sain\u003c/b>' +\n      '\u003cp>Aucun article sous son seuil d\\'alerte.\u003c/p>\u003c/div>\u003c/div>';\n  }\n\n  h += '\u003cdiv class=\"kpis\">' +\n    kpi(\"Unités en stock\", num(unites), E.articles.length + \" références\") +\n    kpiArgent(\"Valeur au coût\", valAchat, \"prix d'achat\") +\n    kpiArgent(\"Valeur à la vente\", valVente, \"marge potentielle \" + mad(valVente - valAchat)) +\n    kpi(\"Articles en rupture\", num(ruptures.length), \"à commander en priorité\", ruptures.length ? \"crit\" : \"good\") +\n    '\u003c/div>';\n\n  h += '\u003cdiv class=\"kpis\" style=\"margin-top:10px\">' +\n    kpi(\"Sous le seuil\", num(alertes.length - ruptures.length), \"moins de \" + n(E.seuil) + \" unités\",\n        (alertes.length - ruptures.length) ? \"warn\" : \"good\") +\n    kpi(\"Unités vendues\", num(uv), \"depuis le début du suivi\") +\n    kpiArgent(\"Chiffre d'affaires\", ca, \"ventes enregistrées\") +\n    kpiArgent(\"Marge réalisée\", marge, ca ? Math.round(marge / ca * 100) + \" % du CA\" : \"—\", \"good\") +\n    '\u003c/div>';\n\n  /* alertes détaillées */\n  h += '\u003cdiv class=\"titre-section\">\u003ch2>Réapprovisionnement\u003c/h2>' +\n       '\u003cbutton class=\"lien\" data-va=\"stock-alerte\">Tout voir\u003c/button>\u003c/div>\u003cdiv class=\"carte\">';\n  if(alertes.length){\n    h += '\u003cul class=\"liste\">' + alertes.slice(0, 6).map(function(a){\n      var s = stock(a);\n      return '\u003cli>\u003cspan class=\"stripe ' + (s \u003c= 0 ? \"crit\" : \"warn\") + '\">\u003c/span>' +\n        '\u003cspan class=\"principal\">\u003cspan class=\"nom\">' + ech(nomComplet(a)) + '\u003c/span>' +\n        '\u003cspan class=\"meta\">' + ech(a.sku) + ' · seuil ' + seuilDe(a) + ' · ' + ech(a.fournisseur || \"sans fournisseur\") + '\u003c/span>\u003c/span>' +\n        '\u003cspan class=\"pill ' + (s \u003c= 0 ? \"crit\" : \"warn\") + '\">' + s + ' rest.\u003c/span>' +\n        '\u003cspan class=\"pill neutre\">cmd ' + Math.max(0, seuilDe(a) * 4 - s) + '\u003c/span>\u003c/li>';\n    }).join(\"\") + '\u003c/ul>';\n  }else{\n    h += '\u003cp class=\"vide\">Rien à commander pour le moment.\u003c/p>';\n  }\n  h += '\u003c/div>';\n\n  /* flux */\n  h += '\u003cdiv class=\"titre-section\">\u003ch2>Flux des 14 derniers jours\u003c/h2>' +\n       '\u003cbutton class=\"lien\" data-va=\"flux\">Saisir un mouvement\u003c/button>\u003c/div>' +\n       '\u003cdiv class=\"carte\">\u003cdiv class=\"flux-graph\">' +\n    jours.map(function(j){\n      return '\u003cdiv class=\"flux-jour\" title=\"' + jour(j.cle) + ' — ' + j.e + ' entrée(s), ' + j.s + ' sortie(s)\">' +\n        '\u003cdiv class=\"paire\">' +\n        '\u003cdiv class=\"b e\" style=\"height:' + (j.e / maxJ * 100).toFixed(1) + '%\">\u003c/div>' +\n        '\u003cdiv class=\"b s\" style=\"height:' + (j.s / maxJ * 100).toFixed(1) + '%\">\u003c/div>' +\n        '\u003c/div>\u003c/div>';\n    }).join(\"\") +\n    '\u003c/div>\u003cdiv class=\"flux-legende\">' +\n    '\u003cspan>\u003ci style=\"background:var(--good)\">\u003c/i>Entrées · ' + num(totE) + ' unités\u003c/span>' +\n    '\u003cspan>\u003ci style=\"background:var(--accent)\">\u003c/i>Sorties · ' + num(totS) + ' unités\u003c/span>' +\n    '\u003c/div>\u003c/div>';\n\n  /* top / flop */\n  h += '\u003cdiv class=\"titre-section\">\u003ch2>Meilleures ventes\u003c/h2>' +\n       '\u003cbutton class=\"lien\" data-va=\"analyse\">Analyse complète\u003c/button>\u003c/div>\u003cdiv class=\"carte\">';\n  h += top.length ? top.map(function(a){ return rangHTML(a, maxV, false); }).join(\"\")\n                  : '\u003cp class=\"vide\">Aucune vente enregistrée.\u003c/p>';\n  h += '\u003c/div>';\n\n  h += '\u003cdiv class=\"titre-section\">\u003ch2>Ventes les plus faibles\u003c/h2>\u003c/div>\u003cdiv class=\"carte\">';\n  h += flop.length ? flop.map(function(a){ return rangHTML(a, maxV, true); }).join(\"\")\n                   : '\u003cp class=\"vide\">Ajoutez des articles pour voir le classement.\u003c/p>';\n  h += '\u003c/div>';\n\n  return h;\n}\nfunction kpi(lab, val, sub, ton){\n  return '\u003cdiv class=\"kpi' + (ton ? \" \" + ton : \"\") + '\">\u003cdiv class=\"lab\">' + ech(lab) + '\u003c/div>' +\n    '\u003cdiv class=\"val\">' + ech(val) + '\u003c/div>\u003cdiv class=\"sub\">' + ech(sub) + '\u003c/div>\u003c/div>';\n}\n/* montants : le chiffre reste seul sur sa ligne, la devise passe en légende */\nfunction kpiArgent(lab, v, sub, ton){\n  return kpi(lab, n(v).toLocaleString(\"fr-FR\", {maximumFractionDigits:0}),\n             (E.devise || \"MAD\") + \" · \" + sub, ton);\n}\nfunction rangHTML(a, maxV, flop){\n  var v = vendus(a), s = stock(a), st = statut(a);\n  return '\u003cdiv class=\"rang' + (flop ? \" flop\" : \"\") + '\">' +\n    '\u003cdiv class=\"haut\">\u003cspan class=\"nom\">' + ech(nomComplet(a)) + '\u003c/span>' +\n    '\u003cspan class=\"chiffre\">' + v + ' u.\u003c/span>\u003c/div>' +\n    '\u003cdiv class=\"piste\">\u003cdiv class=\"barre\" style=\"width:' + (maxV ? (v / maxV * 100).toFixed(1) : 0) + '%\">\u003c/div>\u003c/div>' +\n    '\u003cdiv class=\"sous\">' + mad(chiffre(a)) + ' de CA · marge ' + mad(margeReelle(a)) +\n    ' · reste ' + s + ' \u003cspan class=\"pill ' + TON[st] + '\" style=\"font-size:10.5px;padding:1px 7px\">' + LIB[st] + '\u003c/span>\u003c/div>\u003c/div>';\n}\n\n/* =======================================================================\n   7. VUE — STOCK\n   ===================================================================== */\nvar recherche = \"\", filtreStatut = \"tous\", filtreCat = \"\";\n\nfunction listeFiltree(){\n  var q = recherche.trim().toLowerCase();\n  return E.articles.filter(function(a){\n    if(filtreCat && a.cat !== filtreCat) return false;\n    var st = statut(a);\n    if(filtreStatut === \"alerte\" && st !== \"alerte\" && st !== \"rupture\") return false;\n    if(filtreStatut === \"rupture\" && st !== \"rupture\") return false;\n    if(filtreStatut === \"ok\" && (st === \"alerte\" || st === \"rupture\")) return false;\n    if(!q) return true;\n    return (a.nom + \" \" + a.sku + \" \" + (a.variante || \"\") + \" \" + (a.cat || \"\") + \" \" +\n            (a.fournisseur || \"\") + \" \" + (a.emplacement || \"\")).toLowerCase().indexOf(q) > -1;\n  }).sort(function(x, y){\n    var o = {rupture:0, alerte:1, surveiller:2, ok:3};\n    var d = o[statut(x)] - o[statut(y)];\n    return d !== 0 ? d : x.nom.localeCompare(y.nom, \"fr\");\n  });\n}\n\nfunction resumeStock(){\n  var liste = listeFiltree();\n  var unites = liste.reduce(function(t, a){ return t + stock(a); }, 0);\n  var valeur = liste.reduce(function(t, a){ return t + stock(a) * n(a.achat); }, 0);\n  return liste.length + ' référence(s) affichée(s) · ' + num(unites) + ' unités · ' + mad(valeur) + ' au coût';\n}\n\nfunction vueStock(){\n  var h = '\u003cdiv class=\"entete-vue\">\u003ch1>Inventaire\u003c/h1>' +\n    '\u003cp id=\"stock-resume\">' + resumeStock() + '\u003c/p>' +\n    '\u003cdiv class=\"actions-vue\">\u003cbutton class=\"btn pri\" data-act=\"nouvel-article\">+ Nouvel article\u003c/button>' +\n    '\u003cbutton class=\"btn\" data-act=\"export-articles\">Exporter l\\'inventaire\u003c/button>\u003c/div>\u003c/div>';\n\n  h += '\u003cdiv class=\"barre-outils\">\u003cdiv class=\"recherche\">' +\n    '\u003cinput id=\"q\" type=\"search\" placeholder=\"Rechercher un article, un SKU, un fournisseur…\" value=\"' + ech(recherche) + '\">\u003c/div>\u003c/div>';\n\n  h += '\u003cdiv class=\"barre-outils\">\u003cdiv class=\"filtres\">' +\n    [\"tous\", \"alerte\", \"rupture\", \"ok\"].map(function(f){\n      var lab = {tous:\"Tous\", alerte:\"À réappro\", rupture:\"Ruptures\", ok:\"Stock sain\"}[f];\n      return '\u003cbutton data-filtre=\"' + f + '\" aria-pressed=\"' + (filtreStatut === f) + '\">' + lab + '\u003c/button>';\n    }).join(\"\") + '\u003c/div>';\n  if(E.categories.length){\n    h += '\u003cdiv class=\"filtres\">\u003cbutton data-cat=\"\" aria-pressed=\"' + (filtreCat === \"\") + '\">Toutes catégories\u003c/button>' +\n      E.categories.map(function(c){\n        return '\u003cbutton data-cat=\"' + ech(c) + '\" aria-pressed=\"' + (filtreCat === c) + '\">' + ech(c) + '\u003c/button>';\n      }).join(\"\") + '\u003c/div>';\n  }\n  h += '\u003c/div>';\n\n  h += '\u003cdiv id=\"liste-stock\">' + listeStockHTML() + '\u003c/div>' +\n    '\u003cp class=\"note\">Touchez le nom d\\'un article pour voir sa fiche, son historique et le modifier. ' +\n    'Les boutons − et + enregistrent une sortie ou une entrée d\\'une unité.\u003c/p>';\n  return h;\n}\n\nfunction listeStockHTML(){\n  var liste = listeFiltree();\n  var h = '\u003cdiv class=\"carte\">';\n  if(!liste.length){\n    h += '\u003cp class=\"vide\">Aucun article ne correspond. Modifiez la recherche ou créez une référence.\u003c/p>';\n  }else{\n    h += '\u003cul class=\"liste\">' + liste.map(function(a){\n      var s = stock(a), st = statut(a);\n      return '\u003cli data-art=\"' + a.id + '\">' +\n        '\u003cspan class=\"stripe ' + TON[st] + '\">\u003c/span>' +\n        '\u003cspan class=\"principal\" data-ouvrir=\"' + a.id + '\" style=\"cursor:pointer\">' +\n          '\u003cspan class=\"nom\">' + ech(nomComplet(a)) + '\u003c/span>' +\n          '\u003cspan class=\"meta\">' + ech(a.sku) + ' · ' + ech(a.cat || \"sans catégorie\") +\n          ' · ' + madp(a.vente) + ' · ' + ech(a.emplacement || \"—\") + '\u003c/span>' +\n        '\u003c/span>' +\n        '\u003cspan class=\"pill ' + TON[st] + '\">' + s + '\u003c/span>' +\n        '\u003cspan class=\"rapide\">' +\n          '\u003cbutton class=\"moins\" data-rapide=\"sortie\" data-id=\"' + a.id + '\" title=\"Sortie d\\'une unité\">−\u003c/button>' +\n          '\u003cbutton class=\"plus\" data-rapide=\"entree\" data-id=\"' + a.id + '\" title=\"Entrée d\\'une unité\">+\u003c/button>' +\n        '\u003c/span>\u003c/li>';\n    }).join(\"\") + '\u003c/ul>';\n  }\n  return h + '\u003c/div>';\n}\n\n/* =======================================================================\n   8. VUE — FLUX\n   ===================================================================== */\nvar MOTIFS_E = [\"Achat fournisseur\", \"Retour client\", \"Retour colis refusé\", \"Transfert entrant\", \"Correction\"];\nvar MOTIFS_S = [\"Vente\", \"Casse\", \"Perte / vol\", \"Retour fournisseur\", \"Cadeau / échantillon\", \"Transfert sortant\"];\nvar filtreFlux = \"tous\";\n\nfunction optionsArticles(sel){\n  var parCat = {};\n  E.articles.forEach(function(a){\n    var c = a.cat || \"Sans catégorie\";\n    (parCat[c] = parCat[c] || []).push(a);\n  });\n  return Object.keys(parCat).sort().map(function(c){\n    return '\u003coptgroup label=\"' + ech(c) + '\">' + parCat[c].map(function(a){\n      return '\u003coption value=\"' + a.id + '\"' + (sel === a.id ? \" selected\" : \"\") + '>' +\n        ech(nomComplet(a)) + \" — \" + ech(a.sku) + \" (\" + stock(a) + \")\u003c/option>\";\n    }).join(\"\") + '\u003c/optgroup>';\n  }).join(\"\");\n}\n\nfunction vueFlux(){\n  var journal = E.mouvements.filter(function(m){\n    return filtreFlux === \"tous\" || m.type === filtreFlux;\n  }).slice().sort(function(x, y){\n    return (y.date || \"\").localeCompare(x.date || \"\") || (y.cree || \"\").localeCompare(x.cree || \"\");\n  });\n\n  var h = '\u003cdiv class=\"entete-vue\">\u003ch1>Entrées et sorties\u003c/h1>' +\n    '\u003cp>Chaque ligne met à jour le stock, les alertes et les classements de vente.\u003c/p>\u003c/div>';\n\n  h += '\u003cdiv class=\"carte\" style=\"padding:16px\">\u003cform id=\"f-mouv\">\u003cdiv class=\"champs\">' +\n    '\u003cdiv class=\"champ\">\u003clabel for=\"m-type\">Type\u003c/label>\u003cselect id=\"m-type\" required>' +\n      '\u003coption value=\"sortie\">Sortie\u003c/option>\u003coption value=\"entree\">Entrée\u003c/option>' +\n      '\u003coption value=\"ajustement\">Ajustement d\\'inventaire\u003c/option>\u003c/select>\u003c/div>' +\n    '\u003cdiv class=\"champ\">\u003clabel for=\"m-date\">Date\u003c/label>\u003cinput id=\"m-date\" type=\"date\" value=\"' + aujourdhui() + '\" required>\u003c/div>' +\n    '\u003cdiv class=\"champ large\">\u003clabel for=\"m-art\">Article\u003c/label>\u003cselect id=\"m-art\" required>' +\n      '\u003coption value=\"\">— choisir —\u003c/option>' + optionsArticles(\"\") + '\u003c/select>\u003c/div>' +\n    '\u003cdiv class=\"champ\">\u003clabel for=\"m-qte\">Quantité\u003c/label>\u003cinput id=\"m-qte\" type=\"number\" step=\"1\" value=\"1\" required>' +\n      '\u003cspan class=\"aide\" id=\"aide-qte\">Nombre d\\'unités sorties.\u003c/span>\u003c/div>' +\n    '\u003cdiv class=\"champ\">\u003clabel for=\"m-motif\">Motif\u003c/label>\u003cselect id=\"m-motif\">\u003c/select>\u003c/div>' +\n    '\u003cdiv class=\"champ\">\u003clabel for=\"m-piece\">N° de pièce\u003c/label>\u003cinput id=\"m-piece\" placeholder=\"CMD-3255\">\u003c/div>' +\n    '\u003cdiv class=\"champ\">\u003clabel for=\"m-tiers\">Client / fournisseur\u003c/label>\u003cinput id=\"m-tiers\" placeholder=\"Clients COD\">\u003c/div>' +\n    '\u003cdiv class=\"champ\">\u003clabel for=\"m-ville\">Ville\u003c/label>\u003cinput id=\"m-ville\" placeholder=\"Casablanca\">\u003c/div>' +\n    '\u003cdiv class=\"champ\">\u003clabel for=\"m-note\">Note\u003c/label>\u003cinput id=\"m-note\" placeholder=\"Facultatif\">\u003c/div>' +\n    '\u003c/div>\u003cdiv class=\"actions-vue\">\u003cbutton class=\"btn pri\" type=\"submit\">Enregistrer le mouvement\u003c/button>' +\n    '\u003cbutton class=\"btn\" type=\"button\" data-act=\"export-mouvements\">Exporter le journal\u003c/button>\u003c/div>\u003c/form>\u003c/div>';\n\n  h += '\u003cdiv class=\"titre-section\">\u003ch2>Journal · ' + journal.length + ' mouvement(s)\u003c/h2>\u003c/div>';\n  h += '\u003cdiv class=\"barre-outils\">\u003cdiv class=\"filtres\">' +\n    [[\"tous\", \"Tous\"], [\"entree\", \"Entrées\"], [\"sortie\", \"Sorties\"], [\"ajustement\", \"Ajustements\"]].map(function(f){\n      return '\u003cbutton data-flux=\"' + f[0] + '\" aria-pressed=\"' + (filtreFlux === f[0]) + '\">' + f[1] + '\u003c/button>';\n    }).join(\"\") + '\u003c/div>\u003c/div>';\n\n  h += '\u003cdiv class=\"carte defile\">';\n  if(!journal.length){\n    h += '\u003cp class=\"vide\">Aucun mouvement enregistré pour ce filtre.\u003c/p>';\n  }else{\n    h += '\u003ctable class=\"journal\">\u003cthead>\u003ctr>\u003cth>Date\u003c/th>\u003cth>Type\u003c/th>\u003cth>Article\u003c/th>' +\n      '\u003cth style=\"text-align:right\">Qté\u003c/th>\u003cth>Motif\u003c/th>\u003cth>Pièce\u003c/th>\u003cth>Valeur\u003c/th>\u003cth>\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>' +\n      journal.slice(0, 200).map(function(m){\n        var a = art(m.art);\n        var pu = a ? (m.type === \"entree\" ? n(a.achat) : n(a.vente)) : 0;\n        var ton = m.type === \"entree\" ? \"good\" : m.type === \"sortie\" ? \"acc\" : \"warn\";\n        var lab = m.type === \"entree\" ? \"Entrée\" : m.type === \"sortie\" ? \"Sortie\" : \"Ajust.\";\n        return '\u003ctr>\u003ctd class=\"num\">' + jour(m.date) + '\u003c/td>' +\n          '\u003ctd>\u003cspan class=\"pill ' + ton + '\">' + lab + '\u003c/span>\u003c/td>' +\n          '\u003ctd>' + ech(nomComplet(a)) + '\u003cbr>\u003cspan class=\"meta\" style=\"font-family:var(--fm);font-size:11px;color:var(--ink-3)\">' +\n            ech(a ? a.sku : \"\") + '\u003c/span>\u003c/td>' +\n          '\u003ctd style=\"text-align:right\" class=\"qte\">' + (m.type === \"sortie\" ? \"−\" : m.type === \"entree\" ? \"+\" : \"\") + n(m.qte) + '\u003c/td>' +\n          '\u003ctd>' + ech(m.motif || \"—\") + '\u003c/td>' +\n          '\u003ctd class=\"qte\" style=\"font-size:12px\">' + ech(m.piece || \"—\") + '\u003c/td>' +\n          '\u003ctd class=\"num\">' + mad(Math.abs(n(m.qte)) * pu) + '\u003c/td>' +\n          '\u003ctd>\u003cbutton class=\"btn sm dgr\" data-suppr-mouv=\"' + m.id + '\">Suppr.\u003c/button>\u003c/td>\u003c/tr>';\n      }).join(\"\") + '\u003c/tbody>\u003c/table>';\n  }\n  h += '\u003c/div>';\n  if(journal.length > 200) h += '\u003cp class=\"note\">Les 200 mouvements les plus récents sont affichés. Exportez le journal pour l\\'historique complet.\u003c/p>';\n  return h;\n}\n\nfunction majMotifs(){\n  var t = document.getElementById(\"m-type\");\n  var s = document.getElementById(\"m-motif\");\n  var aide = document.getElementById(\"aide-qte\");\n  if(!t || !s) return;\n  var l = t.value === \"entree\" ? MOTIFS_E : t.value === \"sortie\" ? MOTIFS_S : [\"Inventaire\", \"Correction\"];\n  s.innerHTML = l.map(function(m){ return '\u003coption>' + ech(m) + \"\u003c/option>\"; }).join(\"\");\n  if(aide) aide.textContent = t.value === \"ajustement\"\n    ? \"Écart signé : positif si vous avez trouvé plus d'unités, négatif si vous en avez trouvé moins.\"\n    : t.value === \"entree\" ? \"Nombre d'unités qui entrent en stock.\" : \"Nombre d'unités qui sortent du stock.\";\n}\n\n/* =======================================================================\n   9. VUE — ANALYSE\n   ===================================================================== */\nfunction vueAnalyse(){\n  var classes = E.articles.slice().sort(function(x, y){ return vendus(y) - vendus(x); });\n  var maxV = Math.max(1, vendus(classes[0] || {id:\"\"}));\n  var top = classes.filter(function(a){ return vendus(a) > 0; });\n  var jamais = classes.filter(function(a){ return vendus(a) === 0; });\n\n  var parCat = {};\n  E.articles.forEach(function(a){\n    var c = a.cat || \"Sans catégorie\";\n    parCat[c] = parCat[c] || {u:0, val:0, v:0, ca:0, nb:0};\n    parCat[c].u += stock(a); parCat[c].val += stock(a) * n(a.achat);\n    parCat[c].v += vendus(a); parCat[c].ca += chiffre(a); parCat[c].nb++;\n  });\n  var cats = Object.keys(parCat).sort(function(x, y){ return parCat[y].ca - parCat[x].ca; });\n  var maxCA = Math.max(1, cats.length ? parCat[cats[0]].ca : 1);\n\n  var caTot = E.articles.reduce(function(t, a){ return t + chiffre(a); }, 0);\n  var margeTot = E.articles.reduce(function(t, a){ return t + margeReelle(a); }, 0);\n  var immo = E.articles.reduce(function(t, a){ return t + stock(a) * n(a.achat); }, 0);\n  var dormant = E.articles.filter(function(a){ return vendus(a) === 0 && stock(a) > 0; });\n  var immoDormant = dormant.reduce(function(t, a){ return t + stock(a) * n(a.achat); }, 0);\n\n  var h = '\u003cdiv class=\"entete-vue\">\u003ch1>Analyse des ventes\u003c/h1>' +\n    '\u003cp>Ce qui tourne, ce qui dort, et ce que votre stock immobilise.\u003c/p>\u003c/div>';\n\n  h += '\u003cdiv class=\"kpis\">' +\n    kpiArgent(\"Chiffre d'affaires\", caTot, \"toutes ventes\") +\n    kpiArgent(\"Marge réalisée\", margeTot, caTot ? Math.round(margeTot / caTot * 100) + \" % du CA\" : \"—\", \"good\") +\n    kpiArgent(\"Capital immobilisé\", immo, \"stock au prix d'achat\") +\n    kpiArgent(\"Stock dormant\", immoDormant, dormant.length + \" réf. jamais vendues\",\n        immoDormant > immo * 0.25 ? \"warn\" : \"\") +\n    '\u003c/div>';\n\n  h += '\u003cdiv class=\"titre-section\">\u003ch2>Classement des ventes\u003c/h2>\u003c/div>\u003cdiv class=\"carte\">';\n  h += top.length ? top.slice(0, 15).map(function(a){ return rangHTML(a, maxV, false); }).join(\"\")\n                  : '\u003cp class=\"vide\">Enregistrez des sorties avec le motif « Vente » pour alimenter le classement.\u003c/p>';\n  h += '\u003c/div>';\n\n  if(jamais.length){\n    h += '\u003cdiv class=\"titre-section\">\u003ch2>Jamais vendus · ' + jamais.length + '\u003c/h2>\u003c/div>\u003cdiv class=\"carte\">\u003cul class=\"liste\">' +\n      jamais.slice(0, 12).map(function(a){\n        return '\u003cli>\u003cspan class=\"stripe neutre\">\u003c/span>\u003cspan class=\"principal\">' +\n          '\u003cspan class=\"nom\">' + ech(nomComplet(a)) + '\u003c/span>' +\n          '\u003cspan class=\"meta\">' + ech(a.sku) + ' · ' + stock(a) + ' en stock · ' + mad(stock(a) * n(a.achat)) + ' immobilisés\u003c/span>' +\n          '\u003c/span>\u003cspan class=\"pill neutre\">0 vendu\u003c/span>\u003c/li>';\n      }).join(\"\") + '\u003c/ul>\u003c/div>';\n  }\n\n  h += '\u003cdiv class=\"titre-section\">\u003ch2>Par catégorie\u003c/h2>\u003c/div>\u003cdiv class=\"carte\">';\n  h += cats.length ? cats.map(function(c){\n    var d = parCat[c];\n    return '\u003cdiv class=\"rang\">\u003cdiv class=\"haut\">\u003cspan class=\"nom\">' + ech(c) + '\u003c/span>' +\n      '\u003cspan class=\"chiffre\">' + mad(d.ca) + '\u003c/span>\u003c/div>' +\n      '\u003cdiv class=\"piste\">\u003cdiv class=\"barre\" style=\"width:' + (d.ca / maxCA * 100).toFixed(1) + '%\">\u003c/div>\u003c/div>' +\n      '\u003cdiv class=\"sous\">' + d.nb + ' référence(s) · ' + num(d.u) + ' unités en stock · ' +\n      mad(d.val) + ' immobilisés · ' + num(d.v) + ' vendues\u003c/div>\u003c/div>';\n  }).join(\"\") : '\u003cp class=\"vide\">Aucune catégorie renseignée.\u003c/p>';\n  h += '\u003c/div>';\n\n  return h;\n}\n\n/* =======================================================================\n   10. VUE — RÉGLAGES\n   ===================================================================== */\nfunction vueReglages(){\n  var h = '\u003cdiv class=\"entete-vue\">\u003ch1>Réglages\u003c/h1>\u003cp>Seuil d\\'alerte, sauvegardes et remise à zéro.\u003c/p>\u003c/div>';\n\n  h += '\u003cdiv class=\"carte\" style=\"padding:16px\">\u003cform id=\"f-reglages\">\u003cdiv class=\"champs\">' +\n    '\u003cdiv class=\"champ\">\u003clabel for=\"r-boutique\">Nom de la boutique\u003c/label>' +\n      '\u003cinput id=\"r-boutique\" value=\"' + ech(E.boutique) + '\">\u003c/div>' +\n    '\u003cdiv class=\"champ\">\u003clabel for=\"r-devise\">Devise\u003c/label>\u003cinput id=\"r-devise\" value=\"' + ech(E.devise) + '\">\u003c/div>' +\n    '\u003cdiv class=\"champ\">\u003clabel for=\"r-seuil\">Seuil d\\'alerte par défaut\u003c/label>' +\n      '\u003cinput id=\"r-seuil\" type=\"number\" min=\"1\" step=\"1\" value=\"' + n(E.seuil) + '\">' +\n      '\u003cspan class=\"aide\">Une alerte se déclenche dès qu\\'un article passe sous ce nombre d\\'unités. ' +\n      'Un article peut avoir son propre seuil dans sa fiche.\u003c/span>\u003c/div>' +\n    '\u003c/div>\u003cdiv class=\"actions-vue\">\u003cbutton class=\"btn pri\" type=\"submit\">Enregistrer\u003c/button>\u003c/div>\u003c/form>\u003c/div>';\n\n  h += '\u003cdiv class=\"titre-section\">\u003ch2>Sauvegardes et exports\u003c/h2>\u003c/div>' +\n    '\u003cdiv class=\"carte\" style=\"padding:16px\">\u003cdiv class=\"actions-vue\">' +\n    '\u003cbutton class=\"btn\" data-act=\"export-articles\">Inventaire (CSV)\u003c/button>' +\n    '\u003cbutton class=\"btn\" data-act=\"export-mouvements\">Journal des flux (CSV)\u003c/button>' +\n    '\u003cbutton class=\"btn\" data-act=\"export-alertes\">Liste de réappro (CSV)\u003c/button>' +\n    '\u003cbutton class=\"btn\" data-act=\"export-json\">Sauvegarde complète (JSON)\u003c/button>' +\n    '\u003cbutton class=\"btn\" data-act=\"import-json\">Restaurer une sauvegarde\u003c/button>' +\n    '\u003c/div>\u003cp class=\"note\">Les fichiers CSV s\\'ouvrent directement dans Excel ou Google Sheets. ' +\n    'La sauvegarde JSON restaure l\\'intégralité des articles et des mouvements.\u003c/p>\u003c/div>';\n\n  h += '\u003cdiv class=\"titre-section\">\u003ch2>État de l\\'application\u003c/h2>\u003c/div>\u003cdiv class=\"carte\">\u003cul class=\"liste\">' +\n    ligneInfo(\"Enregistrement\", modeLocal ? \"Cet appareil uniquement\" : \"Cloud + cet appareil\") +\n    ligneInfo(\"Dernière modification\", E.maj ? new Date(E.maj).toLocaleString(\"fr-FR\") : \"—\") +\n    ligneInfo(\"Version des données\", \"n° \" + n(E.rev)) +\n    ligneInfo(\"Articles / mouvements\", E.articles.length + \" / \" + E.mouvements.length) +\n    '\u003c/ul>\u003c/div>';\n  if(modeLocal){\n    h += '\u003cp class=\"note\">La synchronisation cloud n\\'est pas disponible dans cette vue : vos données sont ' +\n      'enregistrées dans ce navigateur. Exportez régulièrement une sauvegarde JSON.\u003c/p>';\n  }\n\n  h += '\u003cdiv class=\"titre-section\">\u003ch2>Zone sensible\u003c/h2>\u003c/div>\u003cdiv class=\"carte\" style=\"padding:16px\">' +\n    '\u003cdiv class=\"actions-vue\">' +\n    '\u003cbutton class=\"btn dgr\" data-act=\"vider-mouvements\">Effacer tous les mouvements\u003c/button>' +\n    '\u003cbutton class=\"btn dgr\" data-act=\"tout-effacer\">Repartir de zéro\u003c/button>' +\n    '\u003c/div>\u003cp class=\"note\">« Repartir de zéro » supprime les articles de démonstration et le journal. ' +\n    'Exportez une sauvegarde avant.\u003c/p>\u003c/div>';\n\n  return h;\n}\nfunction ligneInfo(k, v){\n  return '\u003cli>\u003cspan class=\"principal\">\u003cspan class=\"nom\">' + ech(k) + '\u003c/span>\u003c/span>' +\n    '\u003cspan class=\"pill neutre\">' + ech(v) + '\u003c/span>\u003c/li>';\n}\n\n/* =======================================================================\n   11. RENDU\n   ===================================================================== */\nfunction rendre(){\n  var alertes = articlesAlerte();\n  var badge = document.getElementById(\"badge\");\n  badge.textContent = alertes.length;\n  badge.hidden = alertes.length === 0;\n  var past = document.getElementById(\"pastille\");\n  if(past) past.hidden = alertes.length === 0;\n  document.getElementById(\"soustitre\").textContent =\n    E.boutique + \" · \" + E.articles.length + \" réf.\";\n\n  if(onglet === \"bord\") document.getElementById(\"v-bord\").innerHTML = vueBord();\n  if(onglet === \"stock\") document.getElementById(\"v-stock\").innerHTML = vueStock();\n  if(onglet === \"flux\"){ document.getElementById(\"v-flux\").innerHTML = vueFlux(); majMotifs(); }\n  if(onglet === \"analyse\") document.getElementById(\"v-analyse\").innerHTML = vueAnalyse();\n  if(onglet === \"reglages\") document.getElementById(\"v-reglages\").innerHTML = vueReglages();\n}\n\n/* =======================================================================\n   12. FICHE ARTICLE\n   ===================================================================== */\nvar dlg = document.getElementById(\"dlg\");\n\nfunction ouvrirArticle(id){\n  var a = id ? art(id) : null;\n  var neuf = !a;\n  if(neuf) a = {id:\"\", sku:\"\", nom:\"\", cat:\"\", variante:\"\", fournisseur:\"\", emplacement:\"\",\n                achat:0, vente:0, seuil:\"\", initial:0};\n  var hist = id ? mouvementsDe(id).slice().sort(function(x, y){ return (y.date || \"\").localeCompare(x.date || \"\"); }) : [];\n  var st = id ? statut(a) : \"ok\";\n\n  dlg.innerHTML =\n    '\u003cdiv class=\"tete\">\u003ch3>' + (neuf ? \"Nouvel article\" : ech(nomComplet(a))) + '\u003c/h3>' +\n    (neuf ? \"\" : '\u003cspan class=\"pill ' + TON[st] + '\">' + stock(a) + \" en stock\u003c/span>\") +\n    '\u003cbutton class=\"btn sm\" data-fermer>Fermer\u003c/button>\u003c/div>' +\n    '\u003cdiv class=\"corps\">\u003cform id=\"f-article\">\u003cdiv class=\"champs\">' +\n    ch(\"a-nom\", \"Désignation\", a.nom, \"large\", \"text\", \"Robe caftan brodée\") +\n    ch(\"a-sku\", \"SKU\", a.sku, \"\", \"text\", \"ROB-001\") +\n    ch(\"a-variante\", \"Variante\", a.variante, \"\", \"text\", \"M / Bleu nuit\") +\n    chSelect(\"a-cat\", \"Catégorie\", a.cat, E.categories) +\n    chSelect(\"a-fournisseur\", \"Fournisseur\", a.fournisseur, E.fournisseurs) +\n    ch(\"a-emplacement\", \"Emplacement\", a.emplacement, \"\", \"text\", \"A1-01\") +\n    ch(\"a-seuil\", \"Seuil d'alerte\", a.seuil, \"\", \"number\", String(n(E.seuil))) +\n    ch(\"a-achat\", \"Prix d'achat (\" + ech(E.devise) + \")\", a.achat, \"\", \"number\") +\n    ch(\"a-vente\", \"Prix de vente (\" + ech(E.devise) + \")\", a.vente, \"\", \"number\") +\n    ch(\"a-initial\", \"Stock de départ\", a.initial, \"large\", \"number\") +\n    '\u003c/div>\u003c/form>' +\n    (neuf ? \"\" : ficheChiffres(a) + ficheHistorique(hist)) +\n    '\u003c/div>' +\n    '\u003cdiv class=\"pied\">' +\n    (neuf ? \"\" : '\u003cbutton class=\"btn sm dgr gauche\" data-suppr-art=\"' + a.id + '\">Supprimer l\\'article\u003c/button>') +\n    '\u003cbutton class=\"btn\" data-fermer>Annuler\u003c/button>' +\n    '\u003cbutton class=\"btn pri\" data-enr-art=\"' + (a.id || \"\") + '\">' + (neuf ? \"Créer l'article\" : \"Enregistrer\") + '\u003c/button>' +\n    '\u003c/div>';\n  dlg.showModal();\n}\nfunction ch(id, lab, val, cls, type, ph){\n  return '\u003cdiv class=\"champ ' + (cls || \"\") + '\">\u003clabel for=\"' + id + '\">' + ech(lab) + '\u003c/label>' +\n    '\u003cinput id=\"' + id + '\" type=\"' + (type || \"text\") + '\"' + (type === \"number\" ? ' step=\"any\"' : \"\") +\n    ' value=\"' + ech(val) + '\" placeholder=\"' + ech(ph || \"\") + '\">\u003c/div>';\n}\nfunction chSelect(id, lab, val, options){\n  var liste = options.slice();\n  if(val && liste.indexOf(val) === -1) liste.push(val);\n  return '\u003cdiv class=\"champ\">\u003clabel for=\"' + id + '\">' + ech(lab) + '\u003c/label>' +\n    '\u003cinput id=\"' + id + '\" list=\"l-' + id + '\" value=\"' + ech(val) + '\">' +\n    '\u003cdatalist id=\"l-' + id + '\">' + liste.map(function(o){ return '\u003coption value=\"' + ech(o) + '\">'; }).join(\"\") + '\u003c/datalist>\u003c/div>';\n}\nfunction ficheChiffres(a){\n  var s = stock(a), v = vendus(a);\n  var e = mouvementsDe(a.id).filter(function(m){ return m.type === \"entree\"; }).reduce(function(t, m){ return t + n(m.qte); }, 0);\n  var so = mouvementsDe(a.id).filter(function(m){ return m.type === \"sortie\"; }).reduce(function(t, m){ return t + n(m.qte); }, 0);\n  return '\u003cdiv class=\"titre-section\">\u003ch2>Chiffres\u003c/h2>\u003c/div>\u003cdiv class=\"kpis\">' +\n    kpi(\"Stock actuel\", num(s), \"seuil \" + seuilDe(a)) +\n    kpi(\"Entrées / Sorties\", e + \" / \" + so, \"depuis le départ\") +\n    kpi(\"Unités vendues\", num(v), mad(chiffre(a)) + \" de CA\") +\n    kpiArgent(\"Marge unitaire\", n(a.vente) - n(a.achat), \"réalisée \" + mad(margeReelle(a)), \"good\") +\n    '\u003c/div>';\n}\nfunction ficheHistorique(hist){\n  if(!hist.length) return '\u003cdiv class=\"titre-section\">\u003ch2>Historique\u003c/h2>\u003c/div>\u003cp class=\"vide\">Aucun mouvement.\u003c/p>';\n  return '\u003cdiv class=\"titre-section\">\u003ch2>Historique · ' + hist.length + '\u003c/h2>\u003c/div>\u003cdiv class=\"carte\">\u003cul class=\"liste\">' +\n    hist.slice(0, 25).map(function(m){\n      var ton = m.type === \"entree\" ? \"good\" : m.type === \"sortie\" ? \"acc\" : \"warn\";\n      var sg = m.type === \"sortie\" ? \"−\" : m.type === \"entree\" ? \"+\" : \"\";\n      return '\u003cli>\u003cspan class=\"principal\">\u003cspan class=\"nom\">' + ech(m.motif || m.type) + '\u003c/span>' +\n        '\u003cspan class=\"meta\">' + jour(m.date) + (m.piece ? \" · \" + ech(m.piece) : \"\") +\n        (m.ville ? \" · \" + ech(m.ville) : \"\") + '\u003c/span>\u003c/span>' +\n        '\u003cspan class=\"pill ' + ton + '\">' + sg + n(m.qte) + '\u003c/span>\u003c/li>';\n    }).join(\"\") + '\u003c/ul>\u003c/div>';\n}\n\nfunction enregistrerArticle(id){\n  var g = function(x){ var el = document.getElementById(x); return el ? el.value.trim() : \"\"; };\n  var nom = g(\"a-nom\");\n  if(!nom){ toast(\"crit\", \"Désignation manquante\", \"Donnez un nom à l'article avant d'enregistrer.\"); return; }\n  var a = id ? art(id) : null;\n  var neuf = !a;\n  if(neuf){ a = {id:uid()}; E.articles.push(a); }\n  a.nom = nom;\n  a.sku = g(\"a-sku\") || (\"REF-\" + String(E.articles.length).padStart(3, \"0\"));\n  a.variante = g(\"a-variante\");\n  a.cat = g(\"a-cat\");\n  a.fournisseur = g(\"a-fournisseur\");\n  a.emplacement = g(\"a-emplacement\");\n  a.seuil = g(\"a-seuil\") === \"\" ? \"\" : n(g(\"a-seuil\"));\n  a.achat = n(g(\"a-achat\"));\n  a.vente = n(g(\"a-vente\"));\n  a.initial = n(g(\"a-initial\"));\n  if(a.cat && E.categories.indexOf(a.cat) === -1){ E.categories.push(a.cat); E.categories.sort(); }\n  if(a.fournisseur && E.fournisseurs.indexOf(a.fournisseur) === -1){ E.fournisseurs.push(a.fournisseur); E.fournisseurs.sort(); }\n  dlg.close();\n  modifier();\n  toast(\"good\", neuf ? \"Article créé\" : \"Article enregistré\", nomComplet(a));\n}\n\n/* =======================================================================\n   13. MOUVEMENTS\n   ===================================================================== */\nfunction ajouterMouvement(o){\n  var a = art(o.art);\n  if(!a){ toast(\"crit\", \"Article introuvable\", \"Choisissez un article dans la liste.\"); return; }\n  var avant = stock(a);\n  E.mouvements.push({\n    id:uid(), cree:new Date().toISOString(), date:o.date || aujourdhui(),\n    type:o.type, art:o.art, qte:n(o.qte), motif:o.motif || \"\",\n    piece:o.piece || \"\", tiers:o.tiers || \"\", ville:o.ville || \"\", note:o.note || \"\"\n  });\n  modifier();\n  verifierSeuil(a, avant);\n  return true;\n}\n\n/* =======================================================================\n   14. EXPORTS\n   ===================================================================== */\nfunction csv(lignes){\n  return \"﻿\" + lignes.map(function(l){\n    return l.map(function(c){\n      var s = c == null ? \"\" : String(c);\n      return /[\";\\n]/.test(s) ? '\"' + s.replace(/\"/g, '\"\"') + '\"' : s;\n    }).join(\";\");\n  }).join(\"\\r\\n\");\n}\nasync function telecharger(nom, contenu){\n  if(DL){\n    try{ await DL.save({filename:nom, data:contenu}); toast(\"good\", \"Fichier enregistré\", nom); return; }\n    catch(err){\n      if(err && err.code === \"declined\") return;\n      toast(\"crit\", \"Téléchargement impossible\", \"Copiez les données depuis la sauvegarde JSON.\");\n      return;\n    }\n  }\n  try{\n    var b = new Blob([contenu], {type:\"text/plain;charset=utf-8\"});\n    var u = URL.createObjectURL(b);\n    var a = document.createElement(\"a\");\n    a.href = u; a.download = nom; document.body.appendChild(a); a.click();\n    a.remove(); setTimeout(function(){ URL.revokeObjectURL(u); }, 1000);\n  }catch(err){\n    toast(\"crit\", \"Téléchargement indisponible\", \"Ce mode d'affichage bloque l'enregistrement de fichiers.\");\n  }\n}\nfunction exportArticles(){\n  var l = [[\"SKU\", \"Designation\", \"Variante\", \"Categorie\", \"Fournisseur\", \"Emplacement\",\n            \"Prix achat\", \"Prix vente\", \"Seuil\", \"Stock initial\", \"Entrees\", \"Sorties\",\n            \"Stock actuel\", \"Unites vendues\", \"CA\", \"Valeur au cout\", \"Statut\"]];\n  E.articles.forEach(function(a){\n    var e = mouvementsDe(a.id).filter(function(m){ return m.type === \"entree\"; }).reduce(function(t, m){ return t + n(m.qte); }, 0);\n    var s = mouvementsDe(a.id).filter(function(m){ return m.type === \"sortie\"; }).reduce(function(t, m){ return t + n(m.qte); }, 0);\n    l.push([a.sku, a.nom, a.variante, a.cat, a.fournisseur, a.emplacement, a.achat, a.vente,\n            seuilDe(a), a.initial, e, s, stock(a), vendus(a), chiffre(a), stock(a) * n(a.achat), LIB[statut(a)]]);\n  });\n  telecharger(\"inventaire-\" + aujourdhui() + \".csv\", csv(l));\n}\nfunction exportMouvements(){\n  var l = [[\"Date\", \"Piece\", \"Type\", \"SKU\", \"Designation\", \"Quantite\", \"Motif\", \"Prix unitaire\", \"Valeur\", \"Tiers\", \"Ville\", \"Note\"]];\n  E.mouvements.slice().sort(function(x, y){ return (x.date || \"\").localeCompare(y.date || \"\"); }).forEach(function(m){\n    var a = art(m.art);\n    var pu = a ? (m.type === \"entree\" ? n(a.achat) : n(a.vente)) : 0;\n    l.push([m.date, m.piece, m.type === \"entree\" ? \"Entree\" : m.type === \"sortie\" ? \"Sortie\" : \"Ajustement\",\n            a ? a.sku : \"\", a ? a.nom : \"\", m.qte, m.motif, pu, Math.abs(n(m.qte)) * pu, m.tiers, m.ville, m.note]);\n  });\n  telecharger(\"journal-flux-\" + aujourdhui() + \".csv\", csv(l));\n}\nfunction exportAlertes(){\n  var l = [[\"Priorite\", \"SKU\", \"Designation\", \"Variante\", \"Stock\", \"Seuil\", \"A commander\", \"Fournisseur\", \"Statut\"]];\n  articlesAlerte().forEach(function(a, i){\n    l.push([i + 1, a.sku, a.nom, a.variante, stock(a), seuilDe(a),\n            Math.max(0, seuilDe(a) * 4 - stock(a)), a.fournisseur, LIB[statut(a)]]);\n  });\n  telecharger(\"reapprovisionnement-\" + aujourdhui() + \".csv\", csv(l));\n}\nfunction exportJSON(){ telecharger(\"sauvegarde-rayon-\" + aujourdhui() + \".json\", JSON.stringify(E, null, 2)); }\n\nfunction importJSON(){\n  dlg.innerHTML = '\u003cdiv class=\"tete\">\u003ch3>Restaurer une sauvegarde\u003c/h3>\u003cbutton class=\"btn sm\" data-fermer>Fermer\u003c/button>\u003c/div>' +\n    '\u003cdiv class=\"corps\">\u003cdiv class=\"champ\">\u003clabel for=\"imp\">Collez ici le contenu du fichier JSON\u003c/label>' +\n    '\u003ctextarea id=\"imp\" style=\"min-height:180px;font-family:var(--fm);font-size:12px\">\u003c/textarea>' +\n    '\u003cspan class=\"aide\">Cette opération remplace la totalité des articles et des mouvements.\u003c/span>\u003c/div>\u003c/div>' +\n    '\u003cdiv class=\"pied\">\u003cbutton class=\"btn\" data-fermer>Annuler\u003c/button>' +\n    '\u003cbutton class=\"btn pri\" data-act-dlg=\"valider-import\">Restaurer\u003c/button>\u003c/div>';\n  dlg.showModal();\n}\n\n/* =======================================================================\n   15. ÉVÉNEMENTS\n   ===================================================================== */\ndocument.addEventListener(\"click\", function(e){\n  var t = e.target;\n  var b = t.closest ? t.closest(\"button\") : null;\n\n  var ouvrir = t.closest && t.closest(\"[data-ouvrir]\");\n  if(ouvrir && !b){ ouvrirArticle(ouvrir.dataset.ouvrir); return; }\n  if(!b) return;\n\n  if(b.hasAttribute(\"data-fermer\")){ dlg.close(); return; }\n\n  if(b.dataset.va){\n    if(b.dataset.va === \"stock-alerte\"){ filtreStatut = \"alerte\"; aller(\"stock\"); }\n    else aller(b.dataset.va);\n    return;\n  }\n  if(b.dataset.filtre){ filtreStatut = b.dataset.filtre; rendre(); return; }\n  if(b.hasAttribute(\"data-cat\")){ filtreCat = b.dataset.cat; rendre(); return; }\n  if(b.dataset.flux){ filtreFlux = b.dataset.flux; rendre(); return; }\n\n  if(b.dataset.rapide){\n    var a = art(b.dataset.id);\n    if(!a) return;\n    ajouterMouvement({art:a.id, type:b.dataset.rapide, qte:1, date:aujourdhui(),\n                      motif:b.dataset.rapide === \"entree\" ? \"Achat fournisseur\" : \"Vente\",\n                      piece:\"\", tiers:\"\", ville:\"\", note:\"Saisie rapide\"});\n    return;\n  }\n  if(b.dataset.enrArt !== undefined && b.hasAttribute(\"data-enr-art\")){ enregistrerArticle(b.dataset.enrArt); return; }\n  if(b.dataset.supprArt){\n    var aa = art(b.dataset.supprArt);\n    if(!aa) return;\n    if(!confirm(\"Supprimer « \" + nomComplet(aa) + \" » et ses \" + mouvementsDe(aa.id).length + \" mouvement(s) ?\")) return;\n    E.articles = E.articles.filter(function(x){ return x.id !== aa.id; });\n    E.mouvements = E.mouvements.filter(function(m){ return m.art !== aa.id; });\n    dlg.close(); modifier(); toast(\"good\", \"Article supprimé\", nomComplet(aa));\n    return;\n  }\n  if(b.dataset.supprMouv){\n    var m = E.mouvements.filter(function(x){ return x.id === b.dataset.supprMouv; })[0];\n    if(!m) return;\n    if(!confirm(\"Supprimer ce mouvement ? Le stock sera recalculé.\")) return;\n    E.mouvements = E.mouvements.filter(function(x){ return x.id !== m.id; });\n    modifier();\n    return;\n  }\n\n  var act = b.dataset.act;\n  if(act === \"nouvel-article\"){ ouvrirArticle(null); return; }\n  if(act === \"export-articles\"){ exportArticles(); return; }\n  if(act === \"export-mouvements\"){ exportMouvements(); return; }\n  if(act === \"export-alertes\"){ exportAlertes(); return; }\n  if(act === \"export-json\"){ exportJSON(); return; }\n  if(act === \"import-json\"){ importJSON(); return; }\n  if(act === \"vider-mouvements\"){\n    if(!confirm(\"Effacer les \" + E.mouvements.length + \" mouvements ? Les stocks reviendront au stock de départ.\")) return;\n    E.mouvements = []; modifier(); toast(\"good\", \"Journal effacé\", \"Les stocks sont revenus au stock de départ.\");\n    return;\n  }\n  if(act === \"tout-effacer\"){\n    if(!confirm(\"Supprimer tous les articles et tous les mouvements ?\")) return;\n    E.articles = []; E.mouvements = []; E.categories = []; E.fournisseurs = [];\n    modifier(); toast(\"good\", \"Données effacées\", \"Créez votre premier article depuis l'onglet Stock.\");\n    return;\n  }\n\n  if(b.dataset.actDlg === \"valider-import\"){\n    try{\n      var o = JSON.parse(document.getElementById(\"imp\").value);\n      if(!o || !Array.isArray(o.articles)) throw new Error(\"format\");\n      E.articles = o.articles; E.mouvements = o.mouvements || [];\n      E.boutique = o.boutique || E.boutique; E.devise = o.devise || E.devise;\n      E.seuil = o.seuil || E.seuil;\n      E.categories = o.categories || deduire(\"cat\");\n      E.fournisseurs = o.fournisseurs || deduire(\"fournisseur\");\n      dlg.close(); modifier();\n      toast(\"good\", \"Sauvegarde restaurée\", E.articles.length + \" article(s), \" + E.mouvements.length + \" mouvement(s).\");\n    }catch(err){\n      toast(\"crit\", \"Fichier illisible\", \"Le contenu collé n'est pas une sauvegarde valide.\");\n    }\n    return;\n  }\n});\n\ndocument.addEventListener(\"submit\", function(e){\n  if(e.target.id === \"f-mouv\"){\n    e.preventDefault();\n    var g = function(x){ return document.getElementById(x).value; };\n    var q = n(g(\"m-qte\"));\n    if(!g(\"m-art\")){ toast(\"crit\", \"Article manquant\", \"Choisissez l'article concerné.\"); return; }\n    if(g(\"m-type\") !== \"ajustement\" && q \u003c= 0){ toast(\"crit\", \"Quantité invalide\", \"Indiquez au moins une unité.\"); return; }\n    if(g(\"m-type\") === \"ajustement\" && q === 0){ toast(\"crit\", \"Écart nul\", \"Un ajustement doit être positif ou négatif.\"); return; }\n    ajouterMouvement({art:g(\"m-art\"), type:g(\"m-type\"), qte:q, date:g(\"m-date\"), motif:g(\"m-motif\"),\n                      piece:g(\"m-piece\"), tiers:g(\"m-tiers\"), ville:g(\"m-ville\"), note:g(\"m-note\")});\n    toast(\"good\", \"Mouvement enregistré\", \"Le stock a été recalculé.\");\n    return;\n  }\n  if(e.target.id === \"f-reglages\"){\n    e.preventDefault();\n    E.boutique = document.getElementById(\"r-boutique\").value.trim() || \"Ma boutique\";\n    E.devise = document.getElementById(\"r-devise\").value.trim() || \"MAD\";\n    E.seuil = Math.max(1, n(document.getElementById(\"r-seuil\").value) || 3);\n    modifier();\n    toast(\"good\", \"Réglages enregistrés\", \"Seuil d'alerte : \" + E.seuil + \" unités.\");\n    return;\n  }\n  if(e.target.id === \"f-article\"){ e.preventDefault(); }\n});\n\n/* la recherche ne redessine que la liste : le champ garde le focus et le clavier reste ouvert */\ndocument.addEventListener(\"input\", function(e){\n  if(e.target.id !== \"q\") return;\n  recherche = e.target.value;\n  var l = document.getElementById(\"liste-stock\");\n  var r = document.getElementById(\"stock-resume\");\n  if(l) l.innerHTML = listeStockHTML();\n  if(r) r.textContent = resumeStock();\n});\ndocument.addEventListener(\"change\", function(e){\n  if(e.target.id === \"m-type\") majMotifs();\n});\n\n/* =======================================================================\n   16. DÉMARRAGE\n   ===================================================================== */\nconstruireNav();\naller(onglet);\necrireLocal();\n})();\n\u003c/script>\n\n\u003c/body>\u003c/html>"},{"id":"registre","nom":"Registre WhatsApp","emoji":"💬","quoi":"Les commandes qui arrivent en discussion, extraites en tableau.","pont":true,"html":"\u003c!doctype html>\u003chtml>\u003chead>\u003cmeta charset=utf8>\u003cmeta name=viewport content=\"width=device-width,initial-scale=1\">\u003cstyle>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found]){display:none!important}\u003c/style>\u003c/head>\u003cbody>\n\u003cmeta charset=\"utf-8\">\n\u003ctitle>Registre WhatsApp\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n\u003clink rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap\">\n\n\u003cstyle>\n:root{\n  --bg:#F1F3F1;\n  --surface:#FFFFFF;\n  --surface-2:#E8EDEA;\n  --ink:#0F1613;\n  --ink-2:#4B5751;\n  --ink-3:#7D8A83;\n  --line:#D4DBD6;\n  --line-strong:#B9C4BE;\n  --accent:#0E6F5C;\n  --accent-ink:#FFFFFF;\n  --accent-soft:#DDEBE5;\n  --amber:#9C6214;\n  --amber-soft:#F4E7D3;\n  --good:#2E7D5B;\n  --crit:#A93B2C;\n  --shadow:0 1px 2px rgba(15,22,19,.06), 0 8px 24px -16px rgba(15,22,19,.28);\n  --radius:10px;\n  --f-display:\"Bricolage Grotesque\",\"Trebuchet MS\",sans-serif;\n  --f-body:\"Instrument Sans\",\"Segoe UI\",system-ui,sans-serif;\n  --f-mono:\"IBM Plex Mono\",ui-monospace,Consolas,monospace;\n}\n@media (prefers-color-scheme: dark){\n  :root:not([data-theme=\"light\"]){\n    --bg:#0E1412;\n    --surface:#151D1A;\n    --surface-2:#1D2724;\n    --ink:#E4EDE8;\n    --ink-2:#9DACA5;\n    --ink-3:#74837C;\n    --line:#26332E;\n    --line-strong:#36463F;\n    --accent:#46B893;\n    --accent-ink:#08201A;\n    --accent-soft:#173029;\n    --amber:#DFA45C;\n    --amber-soft:#33280F;\n    --good:#4FBE8E;\n    --crit:#E0705E;\n    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -18px rgba(0,0,0,.9);\n  }\n}\n:root[data-theme=\"dark\"]{\n  --bg:#0E1412;\n  --surface:#151D1A;\n  --surface-2:#1D2724;\n  --ink:#E4EDE8;\n  --ink-2:#9DACA5;\n  --ink-3:#74837C;\n  --line:#26332E;\n  --line-strong:#36463F;\n  --accent:#46B893;\n  --accent-ink:#08201A;\n  --accent-soft:#173029;\n  --amber:#DFA45C;\n  --amber-soft:#33280F;\n  --good:#4FBE8E;\n  --crit:#E0705E;\n  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -18px rgba(0,0,0,.9);\n}\n\n*{box-sizing:border-box}\n[hidden]{display:none!important}\nbody{\n  margin:0;\n  background:var(--bg);\n  color:var(--ink);\n  font-family:var(--f-body);\n  font-size:15px;\n  line-height:1.55;\n  -webkit-font-smoothing:antialiased;\n}\n.page{max-width:1180px;margin:0 auto;padding:28px 20px 140px}\n\n.masthead{display:flex;flex-direction:column;gap:8px;padding-bottom:22px;border-bottom:1px solid var(--line)}\n.brand{display:flex;align-items:center;gap:12px}\n.brand svg{flex:none}\nh1{font-family:var(--f-display);font-weight:700;font-size:28px;letter-spacing:-.02em;margin:0;text-wrap:balance}\n.tagline{margin:0;color:var(--ink-2);max-width:66ch}\n.tagline b{color:var(--ink);font-weight:600}\n\n.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}\n.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin:0 0 10px}\nbutton{font-family:inherit;font-size:14px}\n.btn{\n  display:inline-flex;align-items:center;gap:8px;justify-content:center;\n  border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);\n  padding:9px 15px;border-radius:8px;cursor:pointer;font-weight:500;\n  transition:background .15s ease,border-color .15s ease;\n}\n.btn:hover{background:var(--surface-2)}\n.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}\n.btn-primary:hover{background:var(--accent);filter:brightness(1.06)}\n.btn:disabled{opacity:.5;cursor:not-allowed}\n:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}\n\ninput[type=text],input[type=date],select{\n  font-family:inherit;font-size:14px;color:var(--ink);background:var(--surface);\n  border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px;min-width:0;\n}\nlabel.field{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--ink-3);font-weight:500}\n\n/* ---------- intake ---------- */\n#intake{margin-top:26px;display:grid;grid-template-columns:1.25fr 1fr;gap:16px;align-items:start}\n.slot{padding:26px 24px;text-align:center;border-style:dashed;border-width:1.5px;transition:border-color .15s ease,background .15s ease;height:100%}\n.slot.over{border-color:var(--accent);background:var(--accent-soft)}\n.slot .n{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:var(--accent);text-transform:uppercase}\n.slot h2{font-family:var(--f-display);font-weight:600;font-size:20px;margin:6px 0 6px;letter-spacing:-.01em}\n.slot p{margin:0 auto 18px;color:var(--ink-2);max-width:44ch;font-size:14px}\n.slot .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}\n.hint{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-3);margin-top:14px}\n.slot.done{border-style:solid;border-color:var(--accent)}\n.slot .ok{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--accent);font-weight:600;margin-bottom:12px}\n\n.transform{display:grid;grid-template-columns:1fr auto 1.15fr;gap:16px;align-items:center;margin:0 auto 22px;max-width:660px;text-align:left}\n.bubbles{display:flex;flex-direction:column;gap:7px}\n.bubble{background:var(--surface-2);border:1px solid var(--line);border-radius:12px 12px 12px 3px;padding:7px 11px;font-size:12.5px;color:var(--ink-2);font-family:var(--f-mono)}\n.bubble.me{border-radius:12px 12px 3px 12px;align-self:flex-end;background:var(--accent-soft);border-color:transparent;color:var(--ink)}\n.arrow{color:var(--accent);font-size:20px}\n.minigrid{border:1px solid var(--line);border-radius:6px;overflow:hidden;font-family:var(--f-mono);font-size:11.5px}\n.minigrid div{display:grid;grid-template-columns:1.6fr .8fr .9fr}\n.minigrid span{padding:6px 8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.minigrid div:last-child span{border-bottom:0}\n.minigrid span:last-child{border-right:0}\n.minigrid .head span{background:var(--surface-2);color:var(--ink-3);letter-spacing:.04em;text-transform:uppercase;font-size:10px}\n.minigrid .val{color:var(--amber)}\n\n.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-top:16px}\n.step{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;text-align:left}\n.step .n{font-family:var(--f-mono);font-size:11px;color:var(--accent);letter-spacing:.1em}\n.step h3{font-size:14px;margin:4px 0 4px;font-weight:600}\n.step p{margin:0;font-size:13px;color:var(--ink-2)}\n\n/* ---------- workspace ---------- */\n#workspace{margin-top:26px;display:flex;flex-direction:column;gap:18px}\n.filebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px}\n.filechip{font-family:var(--f-mono);font-size:12.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:5px 9px}\n.filechip.model{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:500}\n.filebar .spacer{flex:1}\n\n.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}\n.tile{padding:13px 15px;display:flex;flex-direction:column;gap:2px}\n.tile .k{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}\n.tile .v{font-family:var(--f-display);font-weight:600;font-size:25px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}\n.tile .s{font-size:12px;color:var(--ink-2)}\n.tile.flag .v{color:var(--amber)}\n.tile.small .v{font-size:16px;letter-spacing:0;line-height:1.35}\n\n.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;padding:14px 16px}\n\n.routing{padding:14px 16px;display:flex;flex-direction:column;gap:10px}\n.routing h3{margin:0;font-size:14px;font-weight:600}\n.routing .sub{margin:0;font-size:12.5px;color:var(--ink-2)}\n.routes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}\n.route{display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:8px;padding:7px 10px}\n.route .who{flex:1;font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n.route .cnt{font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}\n.route select{padding:5px 7px;font-size:12.5px}\n\n.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}\n.tab{border:0;background:none;color:var(--ink-2);padding:9px 14px;cursor:pointer;border-bottom:2px solid transparent;font-weight:500;white-space:nowrap}\n.tab .cnt{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);margin-left:6px}\n.tab .add{font-family:var(--f-mono);font-size:11px;color:var(--accent);margin-left:5px;font-weight:600}\n.tab[aria-selected=\"true\"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}\n.tab:hover{color:var(--ink)}\n\n.tablewrap{overflow-x:auto}\ntable{border-collapse:collapse;width:100%;font-size:13px}\nth,td{text-align:left;padding:7px 11px;border-bottom:1px solid var(--line);vertical-align:top}\nth{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:500;background:var(--surface-2);position:sticky;top:0;white-space:nowrap}\ntd.num,th.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--f-mono);font-size:12.5px}\ntd.mono{font-family:var(--f-mono);font-size:12.5px;white-space:nowrap}\ntd.msg{max-width:420px;min-width:220px}\ntd.pick{width:34px;padding-right:0}\ntbody tr:hover{background:var(--surface-2)}\ntr.old td{color:var(--ink-3)}\ntr.new td{background:var(--accent-soft)}\ntr.new:hover td{background:var(--accent-soft);filter:brightness(.98)}\ntr.off td{opacity:.42}\ntr.rowno td:first-child{color:var(--ink-3)}\n.rowref{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);white-space:nowrap}\n.pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;border:1px solid var(--line-strong);color:var(--ink-2);white-space:nowrap}\n.pill.media{background:var(--amber-soft);border-color:transparent;color:var(--amber)}\n.pill.sys{background:var(--surface-2);border-color:transparent;color:var(--ink-3)}\n.pill.del{background:var(--surface-2);border-color:transparent;color:var(--crit)}\n.pill.sent{background:var(--accent-soft);border-color:transparent;color:var(--accent)}\n.pill.add{background:var(--accent);border-color:transparent;color:var(--accent-ink);font-weight:600}\n.score{font-family:var(--f-mono);font-size:12px;color:var(--amber);font-weight:500}\n.tablefoot{padding:9px 14px;font-size:12.5px;color:var(--ink-3);border-top:1px solid var(--line)}\n.empty{padding:34px 20px;text-align:center;color:var(--ink-2)}\n.empty strong{display:block;color:var(--ink);font-weight:600;margin-bottom:5px}\n\n.exportbar{\n  position:sticky;bottom:0;margin-top:4px;padding:13px 16px;\n  display:flex;align-items:center;gap:14px;flex-wrap:wrap;\n  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);\n  box-shadow:0 -6px 24px -18px rgba(0,0,0,.5), var(--shadow);\n}\n.sheetpicks{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}\n.sheetpicks label{display:flex;align-items:center;gap:5px;cursor:pointer}\n.exportbar .spacer{flex:1}\n.note{font-size:12px;color:var(--ink-3)}\n\nfooter{margin-top:30px;padding-top:16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-3)}\nfooter b{color:var(--ink-2);font-weight:600}\n\n#toast{\n  position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(16px);\n  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:13.5px;\n  opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;z-index:50;max-width:80vw;text-align:center;\n}\n#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}\n@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}\n@media (max-width:860px){\n  #intake{grid-template-columns:1fr}\n  .transform{grid-template-columns:1fr;gap:12px}\n  .arrow{transform:rotate(90deg);text-align:center}\n  .page{padding:20px 14px 150px}\n  h1{font-size:24px}\n}\n\u003c/style>\n\n\u003cdiv class=\"page\">\n\n  \u003cheader class=\"masthead\">\n    \u003cdiv class=\"brand\">\n      \u003csvg width=\"30\" height=\"30\" viewBox=\"0 0 30 30\" fill=\"none\" aria-hidden=\"true\">\n        \u003cpath d=\"M2.6 3.2h9.6v7.4H6.4L2.6 13.4V3.2z\" stroke=\"var(--accent)\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/>\n        \u003crect x=\"15.6\" y=\"3.2\" width=\"5.6\" height=\"5.2\" stroke=\"var(--ink-3)\" stroke-width=\"1.4\"/>\n        \u003crect x=\"21.2\" y=\"3.2\" width=\"5.6\" height=\"5.2\" stroke=\"var(--ink-3)\" stroke-width=\"1.4\"/>\n        \u003crect x=\"15.6\" y=\"8.4\" width=\"5.6\" height=\"5.2\" stroke=\"var(--ink-3)\" stroke-width=\"1.4\"/>\n        \u003crect x=\"21.2\" y=\"8.4\" width=\"5.6\" height=\"5.2\" fill=\"var(--amber)\" fill-opacity=\".28\" stroke=\"var(--amber)\" stroke-width=\"1.4\"/>\n        \u003cpath d=\"M4 20.5h22M4 24.8h22\" stroke=\"var(--line-strong)\" stroke-width=\"1.4\" stroke-linecap=\"round\"/>\n        \u003cpath d=\"M10.5 18.2v8.6M18.5 18.2v8.6\" stroke=\"var(--line-strong)\" stroke-width=\"1.4\" stroke-linecap=\"round\"/>\n      \u003c/svg>\n      \u003ch1>Registre WhatsApp\u003c/h1>\n    \u003c/div>\n    \u003cp class=\"tagline\">Dépose la discussion et ton classeur : les dépenses annoncées dans les messages sont écrites \u003cb>dans ton fichier Excel, à sa structure\u003c/b> — mêmes feuilles, mêmes colonnes, à la suite des lignes existantes. Sans classeur, tu obtiens un rapport complet de la discussion. Tout est calculé dans ton navigateur.\u003c/p>\n  \u003c/header>\n\n  \u003csection id=\"intake\">\n    \u003cdiv class=\"card slot\" id=\"dropChat\">\n      \u003cdiv class=\"n\">Étape 1 · obligatoire\u003c/div>\n      \u003ch2>La discussion WhatsApp\u003c/h2>\n      \u003cdiv class=\"transform\" aria-hidden=\"true\">\n        \u003cdiv class=\"bubbles\">\n          \u003cdiv class=\"bubble\">70dh frais ghazala récupération BBU\u003c/div>\n          \u003cdiv class=\"bubble me\">900dhs reste electricien\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"arrow\">→\u003c/div>\n        \u003cdiv class=\"minigrid\">\n          \u003cdiv class=\"head\">\u003cspan>dépense\u003c/span>\u003cspan>Montant\u003c/span>\u003cspan>date\u003c/span>\u003c/div>\n          \u003cdiv>\u003cspan>70dh frais ghazala…\u003c/span>\u003cspan class=\"val\">70\u003c/span>\u003cspan>08-27-26\u003c/span>\u003c/div>\n          \u003cdiv>\u003cspan>900dhs reste electr…\u003c/span>\u003cspan class=\"val\">900\u003c/span>\u003cspan>09-02-26\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n      \u003cp>Le fichier \u003ccode>.txt\u003c/code> de l'export, ou directement le \u003ccode>.zip\u003c/code> tel que WhatsApp te l'envoie.\u003c/p>\n      \u003cdiv class=\"actions\">\n        \u003cbutton class=\"btn btn-primary\" id=\"pickChat\">Choisir la discussion\u003c/button>\n        \u003cbutton class=\"btn\" id=\"demo\">Voir un exemple\u003c/button>\n      \u003c/div>\n      \u003cinput type=\"file\" id=\"fileChat\" accept=\".txt,.zip,text/plain,application/zip\" hidden>\n      \u003cp class=\"hint\">Android et iPhone · français, anglais, arabe · chiffres arabes convertis\u003c/p>\n    \u003c/div>\n\n    \u003cdiv class=\"card slot\" id=\"dropModel\">\n      \u003cdiv class=\"n\">Étape 2 · facultatif\u003c/div>\n      \u003ch2>Le classeur à remplir\u003c/h2>\n      \u003cp>Ton \u003ccode>.xlsx\u003c/code> existant. L'app garde ses feuilles, ses colonnes, ses bordures et ses formats de date, et ajoute les lignes à la suite.\u003c/p>\n      \u003cdiv class=\"actions\">\n        \u003cbutton class=\"btn\" id=\"pickModel\">Choisir le classeur\u003c/button>\n      \u003c/div>\n      \u003cinput type=\"file\" id=\"fileModel\" accept=\".xlsx\" hidden>\n      \u003cp class=\"hint\">Sans classeur : rapport en 6 feuilles (messages, participants, activité, commandes)\u003c/p>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection id=\"steps\" class=\"steps\">\n    \u003cdiv class=\"step\">\n      \u003cdiv class=\"n\">EXPORT · 1\u003c/div>\n      \u003ch3>Ouvre la discussion\u003c/h3>\n      \u003cp>Dans WhatsApp, appuie sur le nom du contact ou du groupe en haut de la conversation.\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"step\">\n      \u003cdiv class=\"n\">EXPORT · 2\u003c/div>\n      \u003ch3>Exporter la discussion\u003c/h3>\n      \u003cp>Tout en bas de la fiche : « Exporter la discussion ». Sur Android c'est aussi dans le menu ⋮ → Plus.\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"step\">\n      \u003cdiv class=\"n\">EXPORT · 3\u003c/div>\n      \u003ch3>Sans les médias\u003c/h3>\n      \u003cp>Choisis « Sans médias » : le fichier reste léger et l'analyse ne perd rien. Envoie-le-toi, puis dépose-le ici.\u003c/p>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection id=\"workspace\" hidden>\n    \u003cdiv class=\"card filebar\">\n      \u003cspan class=\"filechip\" id=\"fileName\">—\u003c/span>\n      \u003cspan class=\"filechip model\" id=\"modelChip\" hidden>\u003c/span>\n      \u003cspan class=\"note\" id=\"fileMeta\">\u003c/span>\n      \u003cspan class=\"spacer\">\u003c/span>\n      \u003cbutton class=\"btn\" id=\"changeModel\">Classeur modèle\u003c/button>\n      \u003cbutton class=\"btn\" id=\"change\">Changer de discussion\u003c/button>\n    \u003c/div>\n\n    \u003cdiv class=\"tiles\" id=\"tiles\">\u003c/div>\n\n    \u003cdiv class=\"card routing\" id=\"routing\" hidden>\n      \u003ch3>Qui écrit dans quelle feuille\u003c/h3>\n      \u003cp class=\"sub\">Chaque message contenant un montant part dans la feuille de son auteur. Les virements repérés (« de X à Y », versement, 💵) vont dans la feuille des opérations.\u003c/p>\n      \u003cdiv class=\"routes\" id=\"routes\">\u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"card controls\">\n      \u003clabel class=\"field\">Format des dates\n        \u003cselect id=\"dateOrder\">\n          \u003coption value=\"auto\">Détecté automatiquement\u003c/option>\n          \u003coption value=\"dmy\">JJ/MM/AAAA\u003c/option>\n          \u003coption value=\"mdy\">MM/JJ/AAAA\u003c/option>\n          \u003coption value=\"ymd\">AAAA/MM/JJ\u003c/option>\n        \u003c/select>\n      \u003c/label>\n      \u003clabel class=\"field\">Mon compte (pour « envoyé / reçu »)\n        \u003cselect id=\"me\">\u003c/select>\n      \u003c/label>\n      \u003clabel class=\"field\">Mots-clés produits \u003cspan class=\"note\">séparés par des virgules\u003c/span>\n        \u003cinput type=\"text\" id=\"keywords\" placeholder=\"montre, coffret, abaya…\">\n      \u003c/label>\n      \u003clabel class=\"field\">Filtrer par auteur\n        \u003cselect id=\"fAuthor\">\u003c/select>\n      \u003c/label>\n      \u003clabel class=\"field\">Rechercher dans les messages\n        \u003cinput type=\"text\" id=\"fQuery\" placeholder=\"mot, numéro, ville…\">\n      \u003c/label>\n      \u003clabel class=\"field\">Du\n        \u003cinput type=\"date\" id=\"fFrom\">\n      \u003c/label>\n      \u003clabel class=\"field\">Au\n        \u003cinput type=\"date\" id=\"fTo\">\n      \u003c/label>\n    \u003c/div>\n\n    \u003cdiv class=\"card\">\n      \u003cdiv class=\"tabs\" id=\"tabs\" role=\"tablist\">\u003c/div>\n      \u003cdiv class=\"tablewrap\" id=\"preview\">\u003c/div>\n      \u003cdiv class=\"tablefoot\" id=\"previewFoot\">\u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"card exportbar\">\n      \u003cdiv class=\"sheetpicks\" id=\"sheetpicks\">\u003c/div>\n      \u003cspan class=\"spacer\">\u003c/span>\n      \u003cspan class=\"note\" id=\"exportNote\">\u003c/span>\n      \u003cbutton class=\"btn\" id=\"csv\">CSV de l'onglet\u003c/button>\n      \u003cbutton class=\"btn btn-primary\" id=\"xlsx\">Télécharger le classeur Excel\u003c/button>\n    \u003c/div>\n  \u003c/section>\n\n  \u003cfooter>\n    \u003cb>Rien ne sort de ton appareil.\u003c/b> Le fichier est lu et analysé par la page elle-même ; seul le classeur que tu télécharges quitte le navigateur. Ton classeur d'origine n'est jamais modifié : tu récupères une copie remplie. Les lignes déjà présentes ne sont pas réécrites, et une même dépense n'est jamais ajoutée deux fois.\n  \u003c/footer>\n\u003c/div>\n\n\u003cdiv id=\"toast\" role=\"status\" aria-live=\"polite\">\u003c/div>\n\n\u003cscript src=\"https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js\">\u003c/script>\n\u003cscript src=\"https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js\">\u003c/script>\n\u003cscript>\n(function(){\n\"use strict\";\n\n/* ============================================================\n   1. Lecture d'un export WhatsApp\n   ============================================================ */\n\nvar INVISIBLE = /[\\u200B-\\u200F\\u202A-\\u202E\\u2066-\\u2069\\uFEFF]/g;\n\nfunction normalize(text){\n  return text\n    .replace(/\\r\\n?/g, \"\\n\")\n    .replace(INVISIBLE, \"\")\n    .replace(/\\u00A0/g, \" \")\n    .replace(/[\\u0660-\\u0669]/g, function(d){ return String.fromCharCode(d.charCodeAt(0) - 0x0660 + 48); })\n    .replace(/[\\u06F0-\\u06F9]/g, function(d){ return String.fromCharCode(d.charCodeAt(0) - 0x06F0 + 48); });\n}\n\nvar LINE_RE = /^\\[?\\s*(\\d{1,4})[\\/.\\-](\\d{1,2})[\\/.\\-](\\d{2,4})[,\\s]+(\\d{1,2}):(\\d{2})(?::(\\d{2}))?\\s*(a\\.?\\s?m\\.?|p\\.?\\s?m\\.?|ص|م)?\\s*\\]?\\s*(?:[-–—]\\s+)?([\\s\\S]*)$/i;\nvar SENDER_RE = /^([^:\\n]{1,80}):\\s([\\s\\S]*)$/;\n\nvar MEDIA_RE = /(\u003c[^>]*(?:m[eé]dias?|media|attached|joint|مرفق)[^>]*>|\\b(?:image|images|photo|video|vid[eé]o|audio|sticker|autocollant|gif|document|carte de visite|contact card)\\s+(?:omitted|omis|omise|non inclus)|m[eé]dias? (?:omis|omitted)|تم حذف الوسائط)/i;\nvar DELETED_RE = /(ce message a [eé]t[eé] supprim[eé]|this message was deleted|you deleted this message|vous avez supprim[eé] ce message|تم حذف هذه الرسالة)/i;\nvar LINK_RE = /(https?:\\/\\/[^\\s]+|www\\.[^\\s]+)/gi;\n\nfunction detectDateOrder(rows){\n  var dmy = 0, mdy = 0, ymd = 0, i;\n  for(i = 0; i \u003c rows.length; i++){\n    if(rows[i][0].length === 4){ ymd++; continue; }\n    if(+rows[i][0] > 12) dmy++;\n    if(+rows[i][1] > 12) mdy++;\n  }\n  if(ymd > rows.length / 2) return \"ymd\";\n  if(dmy > 0 && mdy === 0) return \"dmy\";\n  if(mdy > 0 && dmy === 0) return \"mdy\";\n  return \"dmy\";\n}\n\nfunction makeDate(a, b, c, h, mi, s, ampm, order){\n  var y, m, d;\n  if(order === \"ymd\"){ y = +a; m = +b; d = +c; }\n  else if(order === \"mdy\"){ m = +a; d = +b; y = +c; }\n  else { d = +a; m = +b; y = +c; }\n  if(y \u003c 100) y += (y >= 70 ? 1900 : 2000);\n  var hh = +h;\n  if(ampm){\n    var p = ampm.toLowerCase().replace(/[.\\s]/g, \"\");\n    var pm = (p === \"pm\" || ampm === \"م\");\n    if(pm && hh \u003c 12) hh += 12;\n    if(!pm && hh === 12) hh = 0;\n  }\n  var dt = new Date(y, m - 1, d, hh, +mi, s ? +s : 0);\n  return isNaN(dt.getTime()) ? null : dt;\n}\n\nfunction extractPhones(t){\n  var out = [], re = /(?:\\+|00)?\\d[\\d\\s.\\-()]{7,19}\\d/g, m, d;\n  while((m = re.exec(t)) !== null){\n    d = m[0].replace(/\\D/g, \"\");\n    if(d.indexOf(\"00212\") === 0) d = \"0\" + d.slice(5);\n    else if(d.indexOf(\"212\") === 0 && d.length === 12) d = \"0\" + d.slice(3);\n    if(/^0[5-7]\\d{8}$/.test(d) && out.indexOf(d) \u003c 0) out.push(d);\n  }\n  return out;\n}\n\nfunction parseChat(text, orderPref){\n  var lines = normalize(text).split(\"\\n\");\n  var raw = [], i, m;\n  for(i = 0; i \u003c lines.length; i++){\n    m = LINE_RE.exec(lines[i]);\n    if(m){\n      raw.push([m[1], m[2], m[3], m[4], m[5], m[6], m[7], m[8]]);\n    } else if(raw.length){\n      raw[raw.length - 1][7] += \"\\n\" + lines[i];\n    }\n  }\n  var detected = detectDateOrder(raw);\n  var order = (orderPref && orderPref !== \"auto\") ? orderPref : detected;\n\n  var msgs = [], r, rest, sm, author, body, type, dt, n = 0;\n  for(i = 0; i \u003c raw.length; i++){\n    r = raw[i];\n    dt = makeDate(r[0], r[1], r[2], r[3], r[4], r[5], r[6], order);\n    if(!dt) continue;\n    rest = r[7].replace(/^\\s+/, \"\");\n    sm = SENDER_RE.exec(rest);\n    if(sm){\n      author = sm[1].replace(/^~\\s*/, \"\").trim();\n      body = sm[2];\n      type = \"texte\";\n      if(DELETED_RE.test(body)) type = \"supprimé\";\n      else if(MEDIA_RE.test(body) && body.length \u003c 160) type = \"média\";\n    } else {\n      author = \"\";\n      body = rest;\n      type = \"système\";\n    }\n    var links = body.match
