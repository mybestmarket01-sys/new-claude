sur le bras d&#x27;un parent : « عطيني التيليفون ». Parent excédé.\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"t\">3-7 s\u003c/td>\u003ctd class=\"b\">AGITATION\u003c/td>\u003ctd>Montage rapide : l&#x27;enfant scrolle, visage éteint, lumière bleue sur le visage.\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"t\">7-13 s\u003c/td>\u003ctd class=\"b\">REVELATION\u003c/td>\u003ctd>Le parent tend une petite boîte. L&#x27;enfant déballe l&#x27;appareil photo. Vrai sourire.\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"t\">13-21 s\u003c/td>\u003ctd class=\"b\">USAGE\u003c/td>\u003ctd>L&#x27;enfant court dehors, photographie un chat, sa sœur, une fleur. Plans réellement pris par l&#x27;appareil, un peu imparfaits — c&#x27;est ce qui fait vrai.\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"t\">21-25 s\u003c/td>\u003ctd class=\"b\">PREUVE SOLIDITE\u003c/td>\u003ctd>L&#x27;appareil tombe de la table sur le carrelage. On le ramasse, il marche. « سيليكون قوي »\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"t\">25-30 s\u003c/td>\u003ctd class=\"b\">CTA\u003c/td>\u003ctd>Prix 329 DH + « هدية الدخول المدرسي » + badge paiement à la livraison.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\r\n  \u003c/section>\r\n\r\n  \u003csection role=\"tabpanel\" data-p=\"fp\" hidden>\r\n   \u003cp class=\"promesse\">Un vrai appareil photo à lui : il photographie, il filme, il joue — et votre téléphone reste dans votre poche.\u003c/p>\r\n   \u003ch4>Bénéfices\u003c/h4>\u003cul class=\"ben\">\u003cli>Un appareil à lui : plus de négociation autour de votre téléphone\u003c/li>\u003cli>Photo et vidéo HD, avec filtres et cadres qui amusent vraiment les enfants\u003c/li>\u003cli>Jeux intégrés pour les trajets et les salles d&#x27;attente\u003c/li>\u003cli>Coque silicone antichoc : conçu pour tomber\u003c/li>\u003cli>Carte mémoire incluse et recharge USB : prêt à l&#x27;emploi dès l&#x27;ouverture\u003c/li>\u003c/ul>\r\n   \u003ch4>Objections traitées\u003c/h4>\u003cdiv class=\"obj\">\u003cp class=\"q\">« La qualité photo doit être mauvaise »\u003c/p>\u003cp>C&#x27;est un appareil d&#x27;enfant, pas un reflex. Les photos sont nettes en extérieur, et c&#x27;est exactement le but : qu&#x27;il crée, pas qu&#x27;il fasse de la photo d&#x27;art.\u003c/p>\u003c/div>\u003cdiv class=\"obj\">\u003cp class=\"q\">« Il va s&#x27;en lasser en une semaine »\u003c/p>\u003cp>Les jeux et les filtres relancent l&#x27;intérêt. Et contrairement à une tablette, il doit sortir et regarder autour de lui pour s&#x27;en servir.\u003c/p>\u003c/div>\u003cdiv class=\"obj\">\u003cp class=\"q\">« C&#x27;est pour quel âge ? »\u003c/p>\u003cp>3 à 12 ans. Avant 5 ans, l&#x27;enfant utilise surtout les filtres et les jeux.\u003c/p>\u003c/div>\u003cdiv class=\"obj\">\u003cp class=\"q\">« Et si ça ne marche pas ? »\u003c/p>\u003cp>Vous ouvrez le colis devant le livreur, vous testez, et vous ne payez que si ça fonctionne.\u003c/p>\u003c/div>\r\n   \u003ch4>Caractéristiques\u003c/h4>\u003ctable class=\"spec\">\u003ctr>\u003ctd>Âge\u003c/td>\u003ctd>3–12 ans\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Photo\u003c/td>\u003ctd>Capteur HD\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Vidéo\u003c/td>\u003ctd>Oui\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Jeux\u003c/td>\u003ctd>Intégrés\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Mémoire\u003c/td>\u003ctd>Carte incluse\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Batterie\u003c/td>\u003ctd>Rechargeable USB\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Protection\u003c/td>\u003ctd>Coque silicone\u003c/td>\u003c/tr>\u003c/table>\r\n   \u003ch4>FAQ\u003c/h4>\u003cdiv class=\"qa\">\u003cp class=\"q\">La carte mémoire est incluse ?\u003c/p>\u003cp>Oui, une carte est fournie dans la boîte.\u003c/p>\u003c/div>\u003cdiv class=\"qa\">\u003cp class=\"q\">Comment récupérer les photos ?\u003c/p>\u003cp>Par le câble USB sur un ordinateur, ou en sortant la carte mémoire.\u003c/p>\u003c/div>\u003cdiv class=\"qa\">\u003cp class=\"q\">Quelle autonomie ?\u003c/p>\u003cp>Environ 2 h d&#x27;utilisation continue, plusieurs jours en usage normal.\u003c/p>\u003c/div>\u003cdiv class=\"qa\">\u003cp class=\"q\">Disponible en plusieurs couleurs ?\u003c/p>\u003cp>Oui, précisez votre choix lors de la confirmation par téléphone.\u003c/p>\u003c/div>\r\n   \u003cp class=\"lpnote\">Landing page complète générée : \u003ccode>landing/photo.html\u003c/code>\r\n    — créas : \u003ccode>creas/photo-feed.png\u003c/code>, \u003ccode>creas/photo-story.png\u003c/code>\u003c/p>\r\n  \u003c/section>\r\n \u003c/div>\r\n\u003c/article>\r\n\u003carticle class=\"item\" id=\"tondeuse\">\r\n \u003cheader class=\"ih\">\r\n  \u003cdiv class=\"ihl\">\r\n   \u003cp class=\"eyebrow\">Extension Radar · jamla24.com\u003c/p>\r\n   \u003ch3>Tondeuse Professionnelle Sans Fil Lame en T — Le Barbier à la Maison\u003c/h3>\r\n   \u003cp class=\"ar-t\">طوندوز احترافية بلا فيل — الحلاق ف دارك\u003c/p>\r\n   \u003cp class=\"angle\">\u003cb>Angle —\u003c/b> Le coût cumulé du coiffeur : 60 DH x 2 fois par mois x 12 mois = 1440 DH par an\u003c/p>\r\n  \u003c/div>\r\n  \u003cdiv class=\"ihr\">\r\n   \u003cdiv class=\"pxbig\">229\u003csmall>DH\u003c/small>\u003c/div>\r\n   \r\n   \u003cdiv class=\"score\">\u003cdiv class=\"sbar\">\u003ci style=\"width:74%\">\u003c/i>\u003c/div>\u003cspan>74\u003csmall>/100\u003c/small>\u003c/span>\u003c/div>\r\n  \u003c/div>\r\n \u003c/header>\r\n \u003cdiv class=\"ev ev-moyenne\">\u003cspan class=\"dot\">\u003c/span>Preuve moyenne\u003cem>Capturé par l&#x27;extension Radar — score de fiche, pas de série de ventes\u003c/em>\u003c/div>\r\n \r\n \u003cdiv class=\"metrics\">\r\n  \u003cdiv>\u003cspan>Coût réel\u003c/span>\u003cb>100 DH\u003c/b>\u003ci>eGRO : Hair Clipper Grooming set 88–100 MAD\u003c/i>\u003c/div>\r\n  \u003cdiv>\u003cspan>Marge unitaire\u003c/span>\u003cb>129 DH\u003c/b>\u003c/div>\r\n  \u003cdiv>\u003cspan>Multiple\u003c/span>\u003cb>×2.29\u003c/b>\u003c/div>\r\n  \u003cdiv class=\"hi\">\u003cspan>CPA maximum\u003c/span>\u003cb>62.0 DH\u003c/b>\u003c/div>\r\n  \u003cdiv>\u003cspan>Net / livrée\u003c/span>\u003cb>88.6 DH\u003c/b>\u003c/div>\r\n \u003c/div>\r\n\r\n \u003cdiv class=\"tabs\" data-tabs>\r\n  \u003cnav role=\"tablist\">\r\n   \u003cbutton role=\"tab\" aria-selected=\"true\" data-p=\"meta\">Annonce Meta\u003c/button>\r\n   \u003cbutton role=\"tab\" aria-selected=\"false\" data-p=\"tk\">TikTok\u003c/button>\r\n   \u003cbutton role=\"tab\" aria-selected=\"false\" data-p=\"sc\">Script vidéo\u003c/button>\r\n   \u003cbutton role=\"tab\" aria-selected=\"false\" data-p=\"fp\">Fiche produit\u003c/button>\r\n  \u003c/nav>\r\n\r\n  \u003csection role=\"tabpanel\" data-p=\"meta\">\r\n   \u003cdiv class=\"fieldrow\">\u003clabel>Texte principal\u003c/label>\r\n    \u003cbutton class=\"cp\" type=\"button\" data-copy=\"m-tondeuse\">Copier\u003c/button>\u003c/div>\r\n   \u003cpre class=\"ar-b\" id=\"m-tondeuse\">60 درهم ف كل مرة عند الحلاق × جوج مرات ف الشهر × 12 شهر = 1440 درهم ف العام 💸\r\n\r\nو إلا عندك جوج ولاد؟ ضرب ف 3.\r\n\r\nطوندوز احترافية بلا فيل، بلامة T — نفس اللي كيخدم بيها الحلاق.\r\n\r\n⚡ لامة T ديال السطيل — كتقص قريب من الجلد بلا ما تقرص\r\n🔋 بطارية ليثيوم — 4 ساعات خدمة على شحنة وحدة\r\n📏 مجموعة ديال الأمشاط (1.5 مم حتى 12 مم)\r\n🔇 موتور هادي — الدراري ما كيخافوش منها\r\n💧 اللامة كتغسل بالما\r\n🎁 معاها: فرشة، زيت، شارجور USB، مشط\r\n\r\nالثمن: 229 درهم — كتخلصها ف 4 ديال الحلاقات\r\n\r\n🚚 الدفع عند الاستلام\r\n📦 توصيل لجميع المدن 👇\u003c/pre>\r\n   \u003cdiv class=\"two\">\r\n    \u003cdiv>\u003cdiv class=\"fieldrow\">\u003clabel>Titre\u003c/label>\r\n      \u003cbutton class=\"cp\" type=\"button\" data-copy=\"mh-tondeuse\">Copier\u003c/button>\u003c/div>\r\n     \u003cp class=\"mono\" id=\"mh-tondeuse\">Tondeuse Pro Lame en T — 229 DH\u003c/p>\u003c/div>\r\n    \u003cdiv>\u003cdiv class=\"fieldrow\">\u003clabel>Description\u003c/label>\r\n      \u003cbutton class=\"cp\" type=\"button\" data-copy=\"md-tondeuse\">Copier\u003c/button>\u003c/div>\r\n     \u003cp class=\"mono\" id=\"md-tondeuse\">Amortie en 4 coupes · Paiement à la livraison\u003c/p>\u003c/div>\r\n   \u003c/div>\r\n   \u003cdiv class=\"hookline\">\u003cspan>Hook\u003c/span>\u003cp class=\"ar-b\">شحال كتخسر عند الحلاق ف العام؟ حسبها معايا 💈\u003c/p>\u003c/div>\r\n  \u003c/section>\r\n\r\n  \u003csection role=\"tabpanel\" data-p=\"tk\" hidden>\r\n   \u003cdiv class=\"fieldrow\">\u003clabel>Légende\u003c/label>\r\n    \u003cbutton class=\"cp\" type=\"button\" data-copy=\"tk-tondeuse\">Copier\u003c/button>\u003c/div>\r\n   \u003cpre class=\"ar-b\" id=\"tk-tondeuse\">حسبت و لقيت كنخسر 1440 درهم ف العام عند الحلاق 💈 #حلاقة #المغرب #barber #cod #دارنا\u003c/pre>\r\n   \u003cdiv class=\"fieldrow\">\u003clabel>Hashtags\u003c/label>\r\n    \u003cbutton class=\"cp\" type=\"button\" data-copy=\"hs-tondeuse\">Copier\u003c/button>\u003c/div>\r\n   \u003cpre class=\"ar-b\" id=\"hs-tondeuse\">#المغرب #حلاقة #barber #الحلاق #رجال #maroc #codmaroc #tondeuse #barbershop\u003c/pre>\r\n  \u003c/section>\r\n\r\n  \u003csection role=\"tabpanel\" data-p=\"sc\" hidden>\r\n   \u003ctable class=\"sct\">\u003cthead>\u003ctr>\u003cth>Temps\u003c/th>\u003cth>Beat\u003c/th>\u003cth>Ce qu'on filme\u003c/th>\u003c/tr>\u003c/thead>\r\n   \u003ctbody>\u003ctr>\u003ctd class=\"t\">0-4 s\u003c/td>\u003ctd class=\"b\">HOOK CHIFFRE\u003c/td>\u003ctd>Calculatrice à l&#x27;écran : 60 × 2 × 12 = 1440. « شحال كتخسر عند الحلاق ف العام؟ »\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"t\">4-9 s\u003c/td>\u003ctd class=\"b\">AGITATION\u003c/td>\u003ctd>File d&#x27;attente chez le barbier, horloge qui tourne. « و الوقت اللي كتضيع؟ »\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"t\">9-18 s\u003c/td>\u003ctd class=\"b\">DEMO\u003c/td>\u003ctd>Vraie coupe filmée : dégradé sur la nuque, lame en T qui passe. Plans serrés, gestes lents et nets.\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"t\">18-23 s\u003c/td>\u003ctd class=\"b\">DETAIL QUI VEND\u003c/td>\u003ctd>On retire la lame, on la passe sous le robinet, on la remonte. « كتغسل بالما »\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"t\">23-27 s\u003c/td>\u003ctd class=\"b\">RESULTAT\u003c/td>\u003ctd>Le sujet se regarde dans la glace et passe la main sur la nuque. Sourire.\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"t\">27-30 s\u003c/td>\u003ctd class=\"b\">CTA\u003c/td>\u003ctd>229 DH + « كتخلصها ف 4 ديال الحلاقات » + paiement à la livraison.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\r\n  \u003c/section>\r\n\r\n  \u003csection role=\"tabpanel\" data-p=\"fp\" hidden>\r\n   \u003cp class=\"promesse\">Une tondeuse à lame en T, la même que celle du barbier, avec ses guides et sa batterie longue durée. Vous l&#x27;amortissez en quatre coupes.\u003c/p>\r\n   \u003ch4>Bénéfices\u003c/h4>\u003cul class=\"ben\">\u003cli>Lame en T en acier : la coupe de contour nette que font les barbiers\u003c/li>\u003cli>Amortie en quatre coupes — puis c&#x27;est gratuit, pour toute la famille\u003c/li>\u003cli>Batterie lithium 4 h : des semaines d&#x27;usage entre deux recharges\u003c/li>\u003cli>Jeu de guides de 1,5 à 12 mm pour le dégradé\u003c/li>\u003cli>Lame rinçable à l&#x27;eau, moteur silencieux : les enfants ne la craignent pas\u003c/li>\u003c/ul>\r\n   \u003ch4>Objections traitées\u003c/h4>\u003cdiv class=\"obj\">\u003cp class=\"q\">« Je ne sais pas couper les cheveux »\u003c/p>\u003cp>Commencez par le sabot 6 mm sur toute la tête : impossible de se rater. Le dégradé vient après, en deux ou trois essais.\u003c/p>\u003c/div>\u003cdiv class=\"obj\">\u003cp class=\"q\">« Les tondeuses pas chères tirent les cheveux »\u003c/p>\u003cp>C&#x27;est un problème de lame émoussée. La lame en T en acier de celle-ci coupe au lieu d&#x27;arracher, et elle se règle.\u003c/p>\u003c/div>\u003cdiv class=\"obj\">\u003cp class=\"q\">« La batterie va mourir »\u003c/p>\u003cp>Batterie lithium-ion rechargeable en USB. Elle s&#x27;utilise aussi branchée si elle est vide.\u003c/p>\u003c/div>\u003cdiv class=\"obj\">\u003cp class=\"q\">« Et le service après-vente ? »\u003c/p>\u003cp>Vous testez à la livraison avant de payer. La lame et les accessoires sont standard et se remplacent.\u003c/p>\u003c/div>\r\n   \u003ch4>Caractéristiques\u003c/h4>\u003ctable class=\"spec\">\u003ctr>\u003ctd>Lame\u003c/td>\u003ctd>Acier, forme T\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Batterie\u003c/td>\u003ctd>Lithium-ion, ~4 h\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Charge\u003c/td>\u003ctd>USB\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Sabots\u003c/td>\u003ctd>1,5 – 12 mm\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Entretien\u003c/td>\u003ctd>Lame rinçable\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Inclus\u003c/td>\u003ctd>Brosse, huile, peigne, câble\u003c/td>\u003c/tr>\u003c/table>\r\n   \u003ch4>FAQ\u003c/h4>\u003cdiv class=\"qa\">\u003cp class=\"q\">Elle coupe la barbe aussi ?\u003c/p>\u003cp>Oui, la lame en T est faite pour les contours de barbe et la nuque.\u003c/p>\u003c/div>\u003cdiv class=\"qa\">\u003cp class=\"q\">Combien de sabots ?\u003c/p>\u003cp>Un jeu complet de 1,5 mm à 12 mm, plus le peigne et la brosse de nettoyage.\u003c/p>\u003c/div>\u003cdiv class=\"qa\">\u003cp class=\"q\">Elle marche branchée ?\u003c/p>\u003cp>Oui, en filaire si la batterie est vide.\u003c/p>\u003c/div>\u003cdiv class=\"qa\">\u003cp class=\"q\">Livraison et paiement ?\u003c/p>\u003cp>24 à 72 h selon la ville, paiement en espèces au livreur.\u003c/p>\u003c/div>\r\n   \u003cp class=\"lpnote\">Landing page complète générée : \u003ccode>landing/tondeuse.html\u003c/code>\r\n    — créas : \u003ccode>creas/tondeuse-feed.png\u003c/code>, \u003ccode>creas/tondeuse-story.png\u003c/code>\u003c/p>\r\n  \u003c/section>\r\n \u003c/div>\r\n\u003c/article>\r\n\r\n\u003csection class=\"sect\">\r\n \u003ch2>Les cinq packs\u003c/h2>\r\n \u003cp class=\"sub\">Chaque pack relève le CPA maximum bien au-dessus de celui de ses composants : c'est\r\n  la seule raison valable de faire un pack en COD. Le panier moyen monte, le coût de livraison ne bouge pas.\u003c/p>\r\n\u003c/section>\r\n\r\n\u003carticle class=\"item\" id=\"pack-cuisine\">\r\n \u003cheader class=\"ih\">\r\n  \u003cdiv class=\"ihl\">\r\n   \u003cp class=\"eyebrow\">Composé · —\u003c/p>\r\n   \u003ch3>Pack Cuisine Organisée — 12 Bocaux + 12 Pots à Épices\u003c/h3>\r\n   \u003cp class=\"ar-t\">باك الكوزينة المرتبة — 12 بوكال + 12 ديال العطريات\u003c/p>\r\n   \u003cp class=\"angle\">\u003cb>Angle —\u003c/b> Ne pas régler la moitié du problème : les placards ET les épices, en une seule livraison\u003c/p>\r\n  \u003c/div>\r\n  \u003cdiv class=\"ihr\">\r\n   \u003cdiv class=\"pxbig\">399\u003csmall>DH\u003c/small>\u003c/div>\r\n   \u003cs>448 DH\u003c/s>\r\n   \r\n  \u003c/div>\r\n \u003c/header>\r\n \r\n \u003cul class=\"compo\">\u003cli>\u003cspan>Set 12 bocaux carrés 1700 ml\u003c/span>\u003cb>249 DH\u003c/b>\u003c/li>\u003cli>\u003cspan>Set 12 pots à épices + support\u003c/span>\u003cb>199 DH\u003c/b>\u003c/li>\u003cli class=\"tot\">\u003cspan>Valeur séparée\u003c/span>\u003cb>448 DH\u003c/b>\u003c/li>\u003c/ul>\r\n \u003cdiv class=\"metrics\">\r\n  \u003cdiv>\u003cspan>Coût estimé\u003c/span>\u003cb>285 DH\u003c/b>\u003c/div>\r\n  \u003cdiv>\u003cspan>Marge unitaire\u003c/span>\u003cb>114 DH\u003c/b>\u003c/div>\r\n  \u003cdiv>\u003cspan>Multiple\u003c/span>\u003cb>×1.4\u003c/b>\u003c/div>\r\n  \u003cdiv class=\"hi\">\u003cspan>CPA maximum\u003c/span>\u003cb>51.5 DH\u003c/b>\u003c/div>\r\n  \u003cdiv>\u003cspan>Net / livrée\u003c/span>\u003cb>73.6 DH\u003c/b>\u003c/div>\r\n \u003c/div>\r\n\r\n \u003cdiv class=\"tabs\" data-tabs>\r\n  \u003cnav role=\"tablist\">\r\n   \u003cbutton role=\"tab\" aria-selected=\"true\" data-p=\"meta\">Annonce Meta\u003c/button>\r\n   \u003cbutton role=\"tab\" aria-selected=\"false\" data-p=\"tk\">TikTok\u003c/button>\r\n   \u003cbutton role=\"tab\" aria-selected=\"false\" data-p=\"sc\">Script vidéo\u003c/button>\r\n   \u003cbutton role=\"tab\" aria-selected=\"false\" data-p=\"fp\">Fiche produit\u003c/button>\r\n  \u003c/nav>\r\n\r\n  \u003csection role=\"tabpanel\" data-p=\"meta\">\r\n   \u003cdiv class=\"fieldrow\">\u003clabel>Texte principal\u003c/label>\r\n    \u003cbutton class=\"cp\" type=\"button\" data-copy=\"m-pack-cuisine\">Copier\u003c/button>\u003c/div>\r\n   \u003cpre class=\"ar-b\" id=\"m-pack-cuisine\">حيت ترتيب نص الكوزينة ماشي ترتيب 🙃\r\n\r\nباك الكوزينة المرتبة — الجوج ديال المشاكل ف شحنة وحدة:\r\n\r\n📦 12 بوكال مربع 1700 مل — للرز، السكر، الدقيق، القطاني\r\n🧂 12 بوكال ديال العطريات + ستاند بلاصق — للكمون، الكركم، راس الحانوت\r\n\r\nبوحدهم: 448 درهم\r\nف الباك: 399 درهم — كتربح 49 درهم\r\n\r\n✅ مربعين = تربح ثلث البلاصة\r\n✅ غطا محكم ف الجوج\r\n✅ الستاند بلا ما تقب الحيط\r\n✅ إتيكيتات داخلين\r\n\r\n🚚 الدفع عند الاستلام\r\n📦 شحنة وحدة، توصيل وحد المرة 👇\u003c/pre>\r\n   \u003cdiv class=\"two\">\r\n    \u003cdiv>\u003cdiv class=\"fieldrow\">\u003clabel>Titre\u003c/label>\r\n      \u003cbutton class=\"cp\" type=\"button\" data-copy=\"mh-pack-cuisine\">Copier\u003c/button>\u003c/div>\r\n     \u003cp class=\"mono\" id=\"mh-pack-cuisine\">Pack Cuisine Organisée — 399 DH au lieu de 448\u003c/p>\u003c/div>\r\n    \u003cdiv>\u003cdiv class=\"fieldrow\">\u003clabel>Description\u003c/label>\r\n      \u003cbutton class=\"cp\" type=\"button\" data-copy=\"md-pack-cuisine\">Copier\u003c/button>\u003c/div>\r\n     \u003cp class=\"mono\" id=\"md-pack-cuisine\">24 contenants · Paiement à la livraison\u003c/p>\u003c/div>\r\n   \u003c/div>\r\n   \u003cdiv class=\"hookline\">\u003cspan>Hook\u003c/span>\u003cp class=\"ar-b\">رتبتي البلاكار و بقات العطريات مخلطين؟ دير الجوج مرة وحدة\u003c/p>\u003c/div>\r\n  \u003c/section>\r\n\r\n  \u003csection role=\"tabpanel\" data-p=\"tk\" hidden>\r\n   \u003cdiv class=\"fieldrow\">\u003clabel>Légende\u003c/label>\r\n    \u003cbutton class=\"cp\" type=\"button\" data-copy=\"tk-pack-cuisine\">Copier\u003c/button>\u003c/div>\r\n   \u003cpre class=\"ar-b\" id=\"tk-pack-cuisine\">رتبت الكوزينة كاملة ف نهار واحد 🤍 الباك ب 399 درهم #كوزينة #ترتيب #المغرب #cod\u003c/pre>\r\n   \u003cdiv class=\"fieldrow\">\u003clabel>Hashtags\u003c/label>\r\n    \u003cbutton class=\"cp\" type=\"button\" data-copy=\"hs-pack-cuisine\">Copier\u003c/button>\u003c/div>\r\n   \u003cpre class=\"ar-b\" id=\"hs-pack-cuisine\">#المغرب #كوزينة #ترتيب_الكوزينة #تنظيم #دارنا #maroc #codmaroc\u003c/pre>\r\n  \u003c/section>\r\n\r\n  \u003csection role=\"tabpanel\" data-p=\"sc\" hidden>\r\n   \u003ctable class=\"sct\">\u003cthead>\u003ctr>\u003cth>Temps\u003c/th>\u003cth>Beat\u003c/th>\u003cth>Ce qu'on filme\u003c/th>\u003c/tr>\u003c/thead>\r\n   \u003ctbody>\u003ctr>\u003ctd class=\"t\">0-3 s\u003c/td>\u003ctd class=\"b\">HOOK\u003c/td>\u003ctd>Plan large d&#x27;une cuisine : placard en vrac à gauche, tiroir d&#x27;épices en vrac à droite. « جوج مشاكل »\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"t\">3-8 s\u003c/td>\u003ctd class=\"b\">AGITATION\u003c/td>\u003ctd>Montage rapide des deux galères : sachet de riz qui se renverse, main qui cherche le cumin.\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"t\">8-20 s\u003c/td>\u003ctd class=\"b\">TRANSFORMATION\u003c/td>\u003ctd>Time-lapse en split-screen : à gauche les 12 bocaux se remplissent et s&#x27;empilent, à droite les 12 pots se clipsent sur le support.\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"t\">20-25 s\u003c/td>\u003ctd class=\"b\">RESULTAT\u003c/td>\u003ctd>Plan large final de la même cuisine, rangée. Silence, puis souffle satisfait.\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"t\">25-30 s\u003c/td>\u003ctd class=\"b\">CTA\u003c/td>\u003ctd>Carton : 448 DH barré → 399 DH. « الدفع عند الاستلام »\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\r\n  \u003c/section>\r\n\r\n  \u003csection role=\"tabpanel\" data-p=\"fp\" hidden>\r\n   \u003cp class=\"promesse\">Les deux moitiés du même problème réglées d&#x27;un coup : les provisions dans douze bocaux carrés, les épices dans douze pots au mur.\u003c/p>\r\n   \u003ch4>Bénéfices\u003c/h4>\u003cul class=\"ben\">\u003cli>24 contenants assortis : les provisions et les épices traitées d&#x27;un coup\u003c/li>\u003cli>49 DH d&#x27;économie par rapport aux deux achetés séparément\u003c/li>\u003cli>Une seule livraison, un seul paiement, un seul rendez-vous avec le livreur\u003c/li>\u003cli>Forme carrée pour les grands bocaux : un tiers de place gagnée\u003c/li>\u003cli>Support d&#x27;épices adhésif : aucun perçage, aucun outil\u003c/li>\u003c/ul>\r\n   \u003ch4>Objections traitées\u003c/h4>\u003cdiv class=\"obj\">\u003cp class=\"q\">« Je n&#x27;ai pas la place pour 24 contenants »\u003c/p>\u003cp>Les 12 bocaux tiennent dans un placard de 60 cm et les 12 pots à épices sont au mur ou dans la porte : ils ne prennent aucune place de rangement.\u003c/p>\u003c/div>\u003cdiv class=\"obj\">\u003cp class=\"q\">« Je préfère commencer par un seul »\u003c/p>\u003cp>Vous pouvez. Mais les deux arrivent ensemble pour 49 DH de moins et une seule livraison, alors que deux commandes séparées coûtent deux fois le déplacement.\u003c/p>\u003c/div>\u003cdiv class=\"obj\">\u003cp class=\"q\">« Comment je paie ? »\u003c/p>\u003cp>En espèces au livreur, après avoir ouvert et vérifié le colis.\u003c/p>\u003c/div>\r\n   \u003ch4>Caractéristiques\u003c/h4>\u003ctable class=\"spec\">\u003ctr>\u003ctd>Contenu\u003c/td>\u003ctd>12 bocaux 1700 ml + 12 pots 110 ml\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Support\u003c/td>\u003ctd>Adhésif 3M, 5 kg\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Accessoires\u003c/td>\u003ctd>12 cuillères + étiquettes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Lave-vaisselle\u003c/td>\u003ctd>Oui\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Colis\u003c/td>\u003ctd>Unique\u003c/td>\u003c/tr>\u003c/table>\r\n   \u003ch4>FAQ\u003c/h4>\u003cdiv class=\"qa\">\u003cp class=\"q\">Tout arrive en une seule fois ?\u003c/p>\u003cp>Oui, un seul colis et un seul paiement.\u003c/p>\u003c/div>\u003cdiv class=\"qa\">\u003cp class=\"q\">Les étiquettes sont fournies ?\u003c/p>\u003cp>Oui, pour les deux sets, en arabe et en français, plus des étiquettes vierges.\u003c/p>\u003c/div>\u003cdiv class=\"qa\">\u003cp class=\"q\">Lave-vaisselle ?\u003c/p>\u003cp>Oui, pour les bocaux comme pour les pots à épices.\u003c/p>\u003c/div>\u003cdiv class=\"qa\">\u003cp class=\"q\">Délai ?\u003c/p>\u003cp>24 à 48 h à Casablanca et Rabat, 48 à 72 h ailleurs.\u003c/p>\u003c/div>\r\n   \u003cp class=\"lpnote\">Landing page complète générée : \u003ccode>landing/pack-cuisine.html\u003c/code>\r\n    — créas : \u003ccode>creas/pack-cuisine-feed.png\u003c/code>, \u003ccode>creas/pack-cuisine-story.png\u003c/code>\u003c/p>\r\n  \u003c/section>\r\n \u003c/div>\r\n\u003c/article>\r\n\u003carticle class=\"item\" id=\"pack-detente\">\r\n \u003cheader class=\"ih\">\r\n  \u003cdiv class=\"ihl\">\r\n   \u003cp class=\"eyebrow\">Composé · —\u003c/p>\r\n   \u003ch3>Pack Détente Totale — Pistolet de Massage + Oreiller Massant Chauffant\u003c/h3>\r\n   \u003cp class=\"ar-t\">باك الاسترخاء الكامل — بيستوليه المساج + وسادة المساج السخونة\u003c/p>\r\n   \u003cp class=\"angle\">\u003cb>Angle —\u003c/b> Deux gestes complémentaires : le pistolet travaille en profondeur, l&#x27;oreiller entretient tous les soirs\u003c/p>\r\n  \u003c/div>\r\n  \u003cdiv class=\"ihr\">\r\n   \u003cdiv class=\"pxbig\">449\u003csmall>DH\u003c/small>\u003c/div>\r\n   \u003cs>548 DH\u003c/s>\r\n   \r\n  \u003c/div>\r\n \u003c/header>\r\n \r\n \u003cul class=\"compo\">\u003cli>\u003cspan>Pistolet de massage chaud/froid\u003c/span>\u003cb>349 DH\u003c/b>\u003c/li>\u003cli>\u003cspan>Oreiller massant U chauffant\u003c/span>\u003cb>199 DH\u003c/b>\u003c/li>\u003cli class=\"tot\">\u003cspan>Valeur séparée\u003c/span>\u003cb>548 DH\u003c/b>\u003c/li>\u003c/ul>\r\n \u003cdiv class=\"metrics\">\r\n  \u003cdiv>\u003cspan>Coût estimé\u003c/span>\u003cb>275 DH\u003c/b>\u003c/div>\r\n  \u003cdiv>\u003cspan>Marge unitaire\u003c/span>\u003cb>174 DH\u003c/b>\u003c/div>\r\n  \u003cdiv>\u003cspan>Multiple\u003c/span>\u003cb>×1.63\u003c/b>\u003c/div>\r\n  \u003cdiv class=\"hi\">\u003cspan>CPA maximum\u003c/span>\u003cb>93.5 DH\u003c/b>\u003c/div>\r\n  \u003cdiv>\u003cspan>Net / livrée\u003c/span>\u003cb>133.6 DH\u003c/b>\u003c/div>\r\n \u003c/div>\r\n\r\n \u003cdiv class=\"tabs\" data-tabs>\r\n  \u003cnav role=\"tablist\">\r\n   \u003cbutton role=\"tab\" aria-selected=\"true\" data-p=\"meta\">Annonce Meta\u003c/button>\r\n   \u003cbutton role=\"tab\" aria-selected=\"false\" data-p=\"tk\">TikTok\u003c/button>\r\n   \u003cbutton role=\"tab\" aria-selected=\"false\" data-p=\"sc\">Script vidéo\u003c/button>\r\n   \u003cbutton role=\"tab\" aria-selected=\"false\" data-p=\"fp\">Fiche produit\u003c/button>\r\n  \u003c/nav>\r\n\r\n  \u003csection role=\"tabpanel\" data-p=\"meta\">\r\n   \u003cdiv class=\"fieldrow\">\u003clabel>Texte principal\u003c/label>\r\n    \u003cbutton class=\"cp\" type=\"button\" data-copy=\"m-pack-detente\">Copier\u003c/button>\u003c/div>\r\n   \u003cpre class=\"ar-b\" id=\"m-pack-detente\">الظهر و الرقبة ما كيتعافاوش بجلسة وحدة ف الشهر 🙃\r\n\r\nباك الاسترخاء الكامل — جوج أجهزة كيكملو بعضياتهم:\r\n\r\n🔫 بيستوليه المساج بالسخون والبارد\r\n   6 سرعات، 4 روس — للجلسة اللي كتحل العقدة\r\n\r\n🛋️ وسادة المساج على شكل U بالسخانة\r\n   كتلبسها ف الرقبة و كتشوف التيليفزيون — 10 دقايق كل ليلة\r\n\r\nبوحدهم: 548 درهم\r\nف الباك: 449 درهم — كتربح 99 درهم\r\n\r\n🚚 الدفع عند الاستلام\r\n📦 توصيل لجميع المدن 👇\r\n\r\nملاحظة: أجهزة ديال الاسترخاء. إلا عندك مشكل صحي، شاور الطبيب.\u003c/pre>\r\n   \u003cdiv class=\"two\">\r\n    \u003cdiv>\u003cdiv class=\"fieldrow\">\u003clabel>Titre\u003c/label>\r\n      \u003cbutton class=\"cp\" type=\"button\" data-copy=\"mh-pack-detente\">Copier\u003c/button>\u003c/div>\r\n     \u003cp class=\"mono\" id=\"mh-pack-detente\">Pack Détente — 449 DH au lieu de 548\u003c/p>\u003c/div>\r\n    \u003cdiv>\u003cdiv class=\"fieldrow\">\u003clabel>Description\u003c/label>\r\n      \u003cbutton class=\"cp\" type=\"button\" data-copy=\"md-pack-detente\">Copier\u003c/button>\u003c/div>\r\n     \u003cp class=\"mono\" id=\"md-pack-detente\">Pistolet + oreiller chauffant · Paiement à la livraison\u003c/p>\u003c/div>\r\n   \u003c/div>\r\n   \u003cdiv class=\"hookline\">\u003cspan>Hook\u003c/span>\u003cp class=\"ar-b\">جلسة وحدة ما كتكفيش — خاصك شي حاجة كل نهار\u003c/p>\u003c/div>\r\n  \u003c/section>\r\n\r\n  \u003csection role=\"tabpanel\" data-p=\"tk\" hidden>\r\n   \u003cdiv class=\"fieldrow\">\u003clabel>Légende\u003c/label>\r\n    \u003cbutton class=\"cp\" type=\"button\" data-copy=\"tk-pack-detente\">Copier\u003c/button>\u003c/div>\r\n   \u003cpre class=\"ar-b\" id=\"tk-pack-detente\">الروتين ديالي ديال الليل ولا 10 دقايق 😮‍💨 #استرخاء #مساج #المغرب #cod #relax\u003c/pre>\r\n   \u003cdiv class=\"fieldrow\">\u003clabel>Hashtags\u003c/label>\r\n    \u003cbutton class=\"cp\" type=\"button\" data-copy=\"hs-pack-detente\">Copier\u003c/button>\u003c/div>\r\n   \u003cpre class=\"ar-b\" id=\"hs-pack-detente\">#المغرب #مساج #استرخاء #الرقبة #الظهر #maroc #codmaroc #relax\u003c/pre>\r\n  \u003c/section>\r\n\r\n  \u003csection role=\"tabpanel\" data-p=\"sc\" hidden>\r\n   \u003ctable class=\"sct\">\u003cthead>\u003ctr>\u003cth>Temps\u003c/th>\u003cth>Beat\u003c/th>\u003cth>Ce qu'on filme\u003c/th>\u003c/tr>\u003c/thead>\r\n   \u003ctbody>\u003ctr>\u003ctd class=\"t\">0-4 s\u003c/td>\u003ctd class=\"b\">HOOK\u003c/td>\u003ctd>Personne qui roule les épaules en grimaçant devant son écran. « كل ليلة نفس الشي »\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"t\">4-10 s\u003c/td>\u003ctd class=\"b\">ACTE 1 — LE PISTOLET\u003c/td>\u003ctd>Séance courte : tête chauffante sur le trapèze, LED rouge. « الجلسة اللي كتحل العقدة »\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"t\">10-18 s\u003c/td>\u003ctd class=\"b\">ACTE 2 — L&#x27;OREILLER\u003c/td>\u003ctd>La personne enfile l&#x27;oreiller en U, s&#x27;assoit devant la télé, ferme les yeux. Rouleaux visibles qui tournent.\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"t\">18-24 s\u003c/td>\u003ctd class=\"b\">COMPLEMENTARITE\u003c/td>\u003ctd>Split-screen des deux usages avec les libellés « الجلسة » et « كل ليلة ».\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"t\">24-30 s\u003c/td>\u003ctd class=\"b\">CTA\u003c/td>\u003ctd>548 DH barré → 449 DH, badge paiement à la livraison.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\r\n  \u003c/section>\r\n\r\n  \u003csection role=\"tabpanel\" data-p=\"fp\" hidden>\r\n   \u003cp class=\"promesse\">Le pistolet pour la séance qui débloque, l&#x27;oreiller en U pour les dix minutes du soir. L&#x27;un ne remplace pas l&#x27;autre.\u003c/p>\r\n   \u003ch4>Bénéfices\u003c/h4>\u003cul class=\"ben\">\u003cli>Deux usages différents : la séance profonde et l&#x27;entretien quotidien\u003c/li>\u003cli>99 DH d&#x27;économie sur le prix des deux séparés\u003c/li>\u003cli>Le pistolet cible dos, cuisses et épaules ; l&#x27;oreiller reste sur la nuque sans les mains\u003c/li>\u003cli>Chaleur sur les deux appareils : le muscle se relâche plus vite\u003c/li>\u003cli>Tous deux rechargeables, sans fil, utilisables devant la télévision\u003c/li>\u003c/ul>\r\n   \u003ch4>Objections traitées\u003c/h4>\u003cdiv class=\"obj\">\u003cp class=\"q\">« Deux appareils, c&#x27;est redondant »\u003c/p>\u003cp>Non : le pistolet demande de tenir et de viser, l&#x27;oreiller se porte les mains libres. On ne sort pas le pistolet tous les soirs, l&#x27;oreiller si.\u003c/p>\u003c/div>\u003cdiv class=\"obj\">\u003cp class=\"q\">« Ce sont des appareils médicaux ? »\u003c/p>\u003cp>Non, ce sont des appareils de bien-être et de relaxation musculaire. Pour une douleur persistante, consultez un médecin.\u003c/p>\u003c/div>\u003cdiv class=\"obj\">\u003cp class=\"q\">« 449 DH d&#x27;un coup, c&#x27;est beaucoup »\u003c/p>\u003cp>C&#x27;est une séance et demie chez un praticien. Et vous payez à la livraison, pas avant.\u003c/p>\u003c/div>\r\n   \u003ch4>Caractéristiques\u003c/h4>\u003ctable class=\"spec\">\u003ctr>\u003ctd>Pistolet\u003c/td>\u003ctd>6 vitesses, 4 têtes, 2500 mAh\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Oreiller\u003c/td>\u003ctd>Forme U, chauffant, rouleaux massants\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Alimentation\u003c/td>\u003ctd>USB rechargeable\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Arrêt auto\u003c/td>\u003ctd>Oui, sur l&#x27;oreiller\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Colis\u003c/td>\u003ctd>Unique\u003c/td>\u003c/tr>\u003c/table>\r\n   \u003ch4>FAQ\u003c/h4>\u003cdiv class=\"qa\">\u003cp class=\"q\">On peut les utiliser le même soir ?\u003c/p>\u003cp>Oui. L&#x27;usage courant est : pistolet 5 minutes, puis oreiller 10 minutes.\u003c/p>\u003c/div>\u003cdiv class=\"qa\">\u003cp class=\"q\">L&#x27;oreiller chauffe fort ?\u003c/p>\u003cp>Chaleur douce, autour de 40 °C, avec arrêt automatique.\u003c/p>\u003c/div>\u003cdiv class=\"qa\">\u003cp class=\"q\">Ils se rechargent comment ?\u003c/p>\u003cp>Les deux en USB, chargeurs fournis.\u003c/p>\u003c/div>\u003cdiv class=\"qa\">\u003cp class=\"q\">Le paiement ?\u003c/p>\u003cp>En espèces au livreur, après vérification du colis.\u003c/p>\u003c/div>\r\n   \u003cp class=\"lpnote\">Landing page complète générée : \u003ccode>landing/pack-detente.html\u003c/code>\r\n    — créas : \u003ccode>creas/pack-detente-feed.png\u003c/code>, \u003ccode>creas/pack-detente-story.png\u003c/code>\u003c/p>\r\n  \u003c/section>\r\n \u003c/div>\r\n\u003c/article>\r\n\u003carticle class=\"item\" id=\"pack-rentree\">\r\n \u003cheader class=\"ih\">\r\n  \u003cdiv class=\"ihl\">\r\n   \u003cp class=\"eyebrow\">Composé · —\u003c/p>\r\n   \u003ch3>Pack Rentrée Créative — Appareil Photo Enfant + Consommables\u003c/h3>\r\n   \u003cp class=\"ar-t\">باك الدخول المدرسي — أباري فوطو ديال الدراري + اللوازم\u003c/p>\r\n   \u003cp class=\"angle\">\u003cb>Angle —\u003c/b> Le cadeau de rentrée qui ne finit pas dans un tiroir : de quoi imprimer et transporter\u003c/p>\r\n  \u003c/div>\r\n  \u003cdiv class=\"ihr\">\r\n   \u003cdiv class=\"pxbig\">379\u003csmall>DH\u003c/small>\u003c/div>\r\n   \u003cs>408 DH\u003c/s>\r\n   \r\n  \u003c/div>\r\n \u003c/header>\r\n \r\n \u003cul class=\"compo\">\u003cli>\u003cspan>Appareil photo numérique enfant\u003c/span>\u003cb>329 DH\u003c/b>\u003c/li>\u003cli>\u003cspan>3 rouleaux papier thermique + housse\u003c/span>\u003cb>79 DH\u003c/b>\u003c/li>\u003cli class=\"tot\">\u003cspan>Valeur séparée\u003c/span>\u003cb>408 DH\u003c/b>\u003c/li>\u003c/ul>\r\n \u003cdiv class=\"metrics\">\r\n  \u003cdiv>\u003cspan>Coût estimé\u003c/span>\u003cb>175 DH\u003c/b>\u003c/div>\r\n  \u003cdiv>\u003cspan>Marge unitaire\u003c/span>\u003cb>204 DH\u003c/b>\u003c/div>\r\n  \u003cdiv>\u003cspan>Multiple\u003c/span>\u003cb>×2.17\u003c/b>\u003c/div>\r\n  \u003cdiv class=\"hi\">\u003cspan>CPA maximum\u003c/span>\u003cb>114.5 DH\u003c/b>\u003c/div>\r\n  \u003cdiv>\u003cspan>Net / livrée\u003c/span>\u003cb>163.6 DH\u003c/b>\u003c/div>\r\n \u003c/div>\r\n\r\n \u003cdiv class=\"tabs\" data-tabs>\r\n  \u003cnav role=\"tablist\">\r\n   \u003cbutton role=\"tab\" aria-selected=\"true\" data-p=\"meta\">Annonce Meta\u003c/button>\r\n   \u003cbutton role=\"tab\" aria-selected=\"false\" data-p=\"tk\">TikTok\u003c/button>\r\n   \u003cbutton role=\"tab\" aria-selected=\"false\" data-p=\"sc\">Script vidéo\u003c/button>\r\n   \u003cbutton role=\"tab\" aria-selected=\"false\" data-p=\"fp\">Fiche produit\u003c/button>\r\n  \u003c/nav>\r\n\r\n  \u003csection role=\"tabpanel\" data-p=\"meta\">\r\n   \u003cdiv class=\"fieldrow\">\u003clabel>Texte principal\u003c/label>\r\n    \u003cbutton class=\"cp\" type=\"button\" data-copy=\"m-pack-rentree\">Copier\u003c/button>\u003c/div>\r\n   \u003cpre class=\"ar-b\" id=\"m-pack-rentree\">أغلب الهدايا ديال الدخول المدرسي كيلعبو بيها 3 أيام و من بعد كتمشي ل الطيروار 🎒\r\n\r\nهاد الباك لا.\r\n\r\n📸 أباري فوطو نمريك ديال الدراري — تصوير، فيديو، ألعاب، فيلطرات\r\n🧾 3 ديال الرولوات ديال الورق — باش يطبع التصاور ديالو\r\n🎒 حقيبة ديال الحماية — يديها معاه ل المدرسة و ل الخرجة\r\n\r\nبوحدهم: 408 درهم\r\nف الباك: 379 درهم\r\n\r\nالفرق؟ ما غاديش يقلك « سالا الورق » من بعد نهارين.\r\n\r\n🚚 الدفع عند الاستلام\r\n📦 توصيل لجميع المدن 👇\u003c/pre>\r\n   \u003cdiv class=\"two\">\r\n    \u003cdiv>\u003cdiv class=\"fieldrow\">\u003clabel>Titre\u003c/label>\r\n      \u003cbutton class=\"cp\" type=\"button\" data-copy=\"mh-pack-rentree\">Copier\u003c/button>\u003c/div>\r\n     \u003cp class=\"mono\" id=\"mh-pack-rentree\">Pack Rentrée Créative — 379 DH\u003c/p>\u003c/div>\r\n    \u003cdiv>\u003cdiv class=\"fieldrow\">\u003clabel>Description\u003c/label>\r\n      \u003cbutton class=\"cp\" type=\"button\" data-copy=\"md-pack-rentree\">Copier\u003c/button>\u003c/div>\r\n     \u003cp class=\"mono\" id=\"md-pack-rentree\">Appareil + 3 rouleaux + housse · Paiement à la livraison\u003c/p>\u003c/div>\r\n   \u003c/div>\r\n   \u003cdiv class=\"hookline\">\u003cspan>Hook\u003c/span>\u003cp class=\"ar-b\">هدية الدخول المدرسي اللي ما غاديش تبقى ف الطيروار 🎒\u003c/p>\u003c/div>\r\n  \u003c/section>\r\n\r\n  \u003csection role=\"tabpanel\" data-p=\"tk\" hidden>\r\n   \u003cdiv class=\"fieldrow\">\u003clabel>Légende\u003c/label>\r\n    \u003cbutton class=\"cp\" type=\"button\" data-copy=\"tk-pack-rentree\">Copier\u003c/button>\u003c/div>\r\n   \u003cpre class=\"ar-b\" id=\"tk-pack-rentree\">هدية الدخول المدرسي اللي عجباتو بزاف 📸🎒 #الدخول_المدرسي #الدراري #هدية #المغرب #cod\u003c/pre>\r\n   \u003cdiv class=\"fieldrow\">\u003clabel>Hashtags\u003c/label>\r\n    \u003cbutton class=\"cp\" type=\"button\" data-copy=\"hs-pack-rentree\">Copier\u003c/button>\u003c/div>\r\n   \u003cpre class=\"ar-b\" id=\"hs-pack-rentree\">#المغرب #الدخول_المدرسي #الدراري #هدية #أطفال #maroc #codmaroc #rentree\u003c/pre>\r\n  \u003c/section>\r\n\r\n  \u003csection role=\"tabpanel\" data-p=\"sc\" hidden>\r\n   \u003ctable class=\"sct\">\u003cthead>\u003ctr>\u003cth>Temps\u003c/th>\u003cth>Beat\u003c/th>\u003cth>Ce qu'on filme\u003c/th>\u003c/tr>\u003c/thead>\r\n   \u003ctbody>\u003ctr>\u003ctd class=\"t\">0-4 s\u003c/td>\u003ctd class=\"b\">HOOK\u003c/td>\u003ctd>Tiroir qu&#x27;on ouvre : trois jouets de rentrée abandonnés. « كل عام نفس الشي »\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"t\">4-9 s\u003c/td>\u003ctd class=\"b\">PROMESSE\u003c/td>\u003ctd>On referme le tiroir, on pose le pack sur la table. Déballage : appareil, rouleaux, housse.\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"t\">9-18 s\u003c/td>\u003ctd class=\"b\">USAGE\u003c/td>\u003ctd>L&#x27;enfant photographie, imprime une photo, la colle sur son cahier. Plans réels.\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"t\">18-24 s\u003c/td>\u003ctd class=\"b\">TRANSPORT\u003c/td>\u003ctd>Il range l&#x27;appareil dans la housse, la glisse dans le cartable, part à l&#x27;école.\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"t\">24-30 s\u003c/td>\u003ctd class=\"b\">CTA\u003c/td>\u003ctd>408 DH barré → 379 DH + « الدفع عند الاستلام ».\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\r\n  \u003c/section>\r\n\r\n  \u003csection role=\"tabpanel\" data-p=\"fp\" hidden>\r\n   \u003cp class=\"promesse\">L&#x27;appareil photo, plus les trois rouleaux de papier et la housse : il peut créer dès le premier jour et emmener l&#x27;appareil partout.\u003c/p>\r\n   \u003ch4>Bénéfices\u003c/h4>\u003cul class=\"ben\">\u003cli>Trois rouleaux fournis : il crée pendant des semaines, pas deux jours\u003c/li>\u003cli>Housse de protection : l&#x27;appareil voyage dans le cartable sans casse\u003c/li>\u003cli>29 DH d&#x27;économie et surtout un seul achat, sans recommande de consommables\u003c/li>\u003cli>Photo, vidéo, filtres et jeux : l&#x27;intérêt tient dans la durée\u003c/li>\u003cli>Coque silicone antichoc sur l&#x27;appareil lui-même\u003c/li>\u003c/ul>\r\n   \u003ch4>Objections traitées\u003c/h4>\u003cdiv class=\"obj\">\u003cp class=\"q\">« Les rouleaux vont coûter cher ensuite »\u003c/p>\u003cp>Les trois fournis couvrent plusieurs centaines de tirages. Les recharges sont un consommable standard et bon marché.\u003c/p>\u003c/div>\u003cdiv class=\"obj\">\u003cp class=\"q\">« C&#x27;est pour quel âge ? »\u003c/p>\u003cp>3 à 12 ans. Les plus jeunes utilisent surtout les filtres et les jeux.\u003c/p>\u003c/div>\u003cdiv class=\"obj\">\u003cp class=\"q\">« Et si l&#x27;appareil ne plaît pas ? »\u003c/p>\u003cp>Vous ouvrez le colis devant le livreur et vous testez avant de payer.\u003c/p>\u003c/div>\r\n   \u003ch4>Caractéristiques\u003c/h4>\u003ctable class=\"spec\">\u003ctr>\u003ctd>Appareil\u003c/td>\u003ctd>Photo + vidéo HD, jeux, filtres\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Consommables\u003c/td>\u003ctd>3 rouleaux papier thermique\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Protection\u003c/td>\u003ctd>Housse de transport + coque silicone\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Mémoire\u003c/td>\u003ctd>Carte incluse\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Âge\u003c/td>\u003ctd>3–12 ans\u003c/td>\u003c/tr>\u003c/table>\r\n   \u003ch4>FAQ\u003c/h4>\u003cdiv class=\"qa\">\u003cp class=\"q\">Le papier d&#x27;impression est spécial ?\u003c/p>\u003cp>C&#x27;est du papier thermique, sans encre. Les rouleaux de rechange sont courants.\u003c/p>\u003c/div>\u003cdiv class=\"qa\">\u003cp class=\"q\">Il imprime en couleur ?\u003c/p>\u003cp>L&#x27;impression thermique est en noir et blanc ; les photos restent en couleur sur la carte mémoire.\u003c/p>\u003c/div>\u003cdiv class=\"qa\">\u003cp class=\"q\">La carte mémoire est incluse ?\u003c/p>\u003cp>Oui, dans la boîte.\u003c/p>\u003c/div>\u003cdiv class=\"qa\">\u003cp class=\"q\">Délai de livraison ?\u003c/p>\u003cp>24 à 72 h selon la ville, paiement à la réception.\u003c/p>\u003c/div>\r\n   \u003cp class=\"lpnote\">Landing page complète générée : \u003ccode>landing/pack-rentree.html\u003c/code>\r\n    — créas : \u003ccode>creas/pack-rentree-feed.png\u003c/code>, \u003ccode>creas/pack-rentree-story.png\u003c/code>\u003c/p>\r\n  \u003c/section>\r\n \u003c/div>\r\n\u003c/article>\r\n\u003carticle class=\"item\" id=\"pack-barbier\">\r\n \u003cheader class=\"ih\">\r\n  \u003cdiv class=\"ihl\">\r\n   \u003cp class=\"eyebrow\">Composé · —\u003c/p>\r\n   \u003ch3>Pack Barbier Maison — Tondeuse Pro + Kit Coiffure Complet\u003c/h3>\r\n   \u003cp class=\"ar-t\">باك الحلاق ف الدار — طوندوز احترافية + طقم الحلاقة\u003c/p>\r\n   \u003cp class=\"angle\">\u003cb>Angle —\u003c/b> La tondeuse seule ne suffit pas : sans cape ni peignes, on ne coupe pas, on bricole\u003c/p>\r\n  \u003c/div>\r\n  \u003cdiv class=\"ihr\">\r\n   \u003cdiv class=\"pxbig\">279\u003csmall>DH\u003c/small>\u003c/div>\r\n   \u003cs>318 DH\u003c/s>\r\n   \r\n  \u003c/div>\r\n \u003c/header>\r\n \r\n \u003cul class=\"compo\">\u003cli>\u003cspan>Tondeuse cheveux sans fil pro (lame T)\u003c/span>\u003cb>229 DH\u003c/b>\u003c/li>\u003cli>\u003cspan>Cape + 8 peignes + ciseaux + brosse\u003c/span>\u003cb>89 DH\u003c/b>\u003c/li>\u003cli class=\"tot\">\u003cspan>Valeur séparée\u003c/span>\u003cb>318 DH\u003c/b>\u003c/li>\u003c/ul>\r\n \u003cdiv class=\"metrics\">\r\n  \u003cdiv>\u003cspan>Coût estimé\u003c/span>\u003cb>130 DH\u003c/b>\u003c/div>\r\n  \u003cdiv>\u003cspan>Marge unitaire\u003c/span>\u003cb>149 DH\u003c/b>\u003c/div>\r\n  \u003cdiv>\u003cspan>Multiple\u003c/span>\u003cb>×2.15\u003c/b>\u003c/div>\r\n  \u003cdiv class=\"hi\">\u003cspan>CPA maximum\u003c/span>\u003cb>76.0 DH\u003c/b>\u003c/div>\r\n  \u003cdiv>\u003cspan>Net / livrée\u003c/span>\u003cb>108.6 DH\u003c/b>\u003c/div>\r\n \u003c/div>\r\n\r\n \u003cdiv class=\"tabs\" data-tabs>\r\n  \u003cnav role=\"tablist\">\r\n   \u003cbutton role=\"tab\" aria-selected=\"true\" data-p=\"meta\">Annonce Meta\u003c/button>\r\n   \u003cbutton role=\"tab\" aria-selected=\"false\" data-p=\"tk\">TikTok\u003c/button>\r\n   \u003cbutton role=\"tab\" aria-selected=\"false\" data-p=\"sc\">Script vidéo\u003c/button>\r\n   \u003cbutton role=\"tab\" aria-selected=\"false\" data-p=\"fp\">Fiche produit\u003c/button>\r\n  \u003c/nav>\r\n\r\n  \u003csection role=\"tabpanel\" data-p=\"meta\">\r\n   \u003cdiv class=\"fieldrow\">\u003clabel>Texte principal\u003c/label>\r\n    \u003cbutton class=\"cp\" type=\"button\" data-copy=\"m-pack-barbier\">Copier\u003c/button>\u003c/div>\r\n   \u003cpre class=\"ar-b\" id=\"m-pack-barbier\">الناس كيشريو الطوندوز بوحدها… و من بعد كيلقاو راسهم ناقصهم الكاب، الأمشاط، المقص 🤦\r\n\r\nباك الحلاق ف الدار — كلشي ف شحنة وحدة:\r\n\r\n💈 طوندوز احترافية بلامة T — بطارية 4 ساعات\r\n🧥 كاب ديال الحلاقة — الشعر ما كيطيحش ف الدار\r\n🪮 8 ديال الأمشاط (1.5 مم → 12 مم)\r\n✂️ مقص + فرشة + زيت + شارجور\r\n\r\nبوحدهم: 318 درهم\r\nف الباك: 279 درهم\r\n\r\n60 درهم ف كل حلاقة × 2 ف الشهر = كتخلص الباك ف أقل من 3 شهور، و من بعد كلشي فابور.\r\n\r\n🚚 الدفع عند الاستلام\r\n📦 توصيل لجميع المدن 👇\u003c/pre>\r\n   \u003cdiv class=\"two\">\r\n    \u003cdiv>\u003cdiv class=\"fieldrow\">\u003clabel>Titre\u003c/label>\r\n      \u003cbutton class=\"cp\" type=\"button\" data-copy=\"mh-pack-barbier\">Copier\u003c/button>\u003c/div>\r\n     \u003cp class=\"mono\" id=\"mh-pack-barbier\">Pack Barbier Maison — 279 DH au lieu de 318\u003c/p>\u003c/div>\r\n    \u003cdiv>\u003cdiv class=\"fieldrow\">\u003clabel>Description\u003c/label>\r\n      \u003cbutton class=\"cp\" type=\"button\" data-copy=\"md-pack-barbier\">Copier\u003c/button>\u003c/div>\r\n     \u003cp class=\"mono\" id=\"md-pack-barbier\">Tondeuse + cape + 8 peignes · Paiement à la livraison\u003c/p>\u003c/div>\r\n   \u003c/div>\r\n   \u003cdiv class=\"hookline\">\u003cspan>Hook\u003c/span>\u003cp class=\"ar-b\">شريتي طوندوز بوحدها؟ غادي تلقى راسك ناقصك كلشي 💈\u003c/p>\u003c/div>\r\n  \u003c/section>\r\n\r\n  \u003csection role=\"tabpanel\" data-p=\"tk\" hidden>\r\n   \u003cdiv class=\"fieldrow\">\u003clabel>Légende\u003c/label>\r\n    \u003cbutton class=\"cp\" type=\"button\" data-copy=\"tk-pack-barbier\">Copier\u003c/button>\u003c/div>\r\n   \u003cpre class=\"ar-b\" id=\"tk-pack-barbier\">ما بقيتش نمشي للحلاق 💈 الباك كامل ب 279 درهم #حلاقة #barber #المغرب #cod\u003c/pre>\r\n   \u003cdiv class=\"fieldrow\">\u003clabel>Hashtags\u003c/label>\r\n    \u003cbutton class=\"cp\" type=\"button\" data-copy=\"hs-pack-barbier\">Copier\u003c/button>\u003c/div>\r\n   \u003cpre class=\"ar-b\" id=\"hs-pack-barbier\">#المغرب #حلاقة #barber #الحلاق #رجال #maroc #codmaroc #barbershop\u003c/pre>\r\n  \u003c/section>\r\n\r\n  \u003csection role=\"tabpanel\" data-p=\"sc\" hidden>\r\n   \u003ctable class=\"sct\">\u003cthead>\u003ctr>\u003cth>Temps\u003c/th>\u003cth>Beat\u003c/th>\u003cth>Ce qu'on filme\u003c/th>\u003c/tr>\u003c/thead>\r\n   \u003ctbody>\u003ctr>\u003ctd class=\"t\">0-4 s\u003c/td>\u003ctd class=\"b\">HOOK\u003c/td>\u003ctd>Quelqu&#x27;un déballe une tondeuse seule, cherche autour de lui, ne trouve rien. « و الباقي فين؟ »\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"t\">4-9 s\u003c/td>\u003ctd class=\"b\">AGITATION\u003c/td>\u003ctd>Cheveux partout sur le carrelage, balai. « و شكون غادي يقم؟ »\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"t\">9-14 s\u003c/td>\u003ctd class=\"b\">LE PACK\u003c/td>\u003ctd>Déballage complet : tondeuse, cape, 8 peignes alignés, ciseaux, brosse, huile.\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"t\">14-23 s\u003c/td>\u003ctd class=\"b\">DEMO\u003c/td>\u003ctd>Vraie coupe : cape enfilée, sabot clipsé, dégradé sur la nuque. Plans serrés.\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"t\">23-27 s\u003c/td>\u003ctd class=\"b\">PROPRETE\u003c/td>\u003ctd>On retire la cape, on la secoue dehors : le sol est net.\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"t\">27-30 s\u003c/td>\u003ctd class=\"b\">CTA\u003c/td>\u003ctd>318 DH barré → 279 DH + paiement à la livraison.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\r\n  \u003c/section>\r\n\r\n  \u003csection role=\"tabpanel\" data-p=\"fp\" hidden>\r\n   \u003cp class=\"promesse\">La tondeuse à lame en T et tout ce qu&#x27;il faut autour : la cape, les huit peignes, les ciseaux et la brosse. Vous ouvrez et vous coupez.\u003c/p>\r\n   \u003ch4>Bénéfices\u003c/h4>\u003cul class=\"ben\">\u003cli>Tout ce qu&#x27;il faut d&#x27;un coup : plus de deuxième commande pour la cape ou les peignes\u003c/li>\u003cli>39 DH d&#x27;économie et une seule livraison\u003c/li>\u003cli>Huit guides de 1,5 à 12 mm : le dégradé devient possible\u003c/li>\u003cli>La cape évite le nettoyage après chaque coupe\u003c/li>\u003cli>Amorti en moins de trois mois pour un homme, bien plus vite pour une famille\u003c/li>\u003c/ul>\r\n   \u003ch4>Objections traitées\u003c/h4>\u003cdiv class=\"obj\">\u003cp class=\"q\">« Je ne sais pas couper »\u003c/p>\u003cp>Commencez au sabot 6 mm sur toute la tête : le résultat est régulier d&#x27;office. Le dégradé s&#x27;apprend en deux ou trois coupes.\u003c/p>\u003c/div>\u003cdiv class=\"obj\">\u003cp class=\"q\">« La tondeuse va tirer les cheveux »\u003c/p>\u003cp>La lame en T en acier coupe au lieu d&#x27;arracher, et elle est réglable.\u003c/p>\u003c/div>\u003cdiv class=\"obj\">\u003cp class=\"q\">« Les ciseaux sont de mauvaise qualité ? »\u003c/p>\u003cp>Ce sont des ciseaux d&#x27;appoint pour les finitions, pas des ciseaux de coiffeur professionnel. La tondeuse fait le travail principal.\u003c/p>\u003c/div>\u003cdiv class=\"obj\">\u003cp class=\"q\">« Je paie avant ? »\u003c/p>\u003cp>Non. Vous vérifiez le colis, vous testez la tondeuse, puis vous payez.\u003c/p>\u003c/div>\r\n   \u003ch4>Caractéristiques\u003c/h4>\u003ctable class=\"spec\">\u003ctr>\u003ctd>Tondeuse\u003c/td>\u003ctd>Lame T acier, lithium ~4 h\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Peignes\u003c/td>\u003ctd>8 guides, 1,5 – 12 mm\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Cape\u003c/td>\u003ctd>Lavable en machine\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Accessoires\u003c/td>\u003ctd>Ciseaux, brosse, huile, câble USB\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Colis\u003c/td>\u003ctd>Unique\u003c/td>\u003c/tr>\u003c/table>\r\n   \u003ch4>FAQ\u003c/h4>\u003cdiv class=\"qa\">\u003cp class=\"q\">La cape est lavable ?\u003c/p>\u003cp>Oui, en machine à froid.\u003c/p>\u003c/div>\u003cdiv class=\"qa\">\u003cp class=\"q\">La tondeuse marche branchée ?\u003c/p>\u003cp>Oui, en filaire si la batterie est vide.\u003c/p>\u003c/div>\u003cdiv class=\"qa\">\u003cp class=\"q\">Ça convient pour la barbe ?\u003c/p>\u003cp>Oui, la lame en T est conçue pour les contours.\u003c/p>\u003c/div>\u003cdiv class=\"qa\">\u003cp class=\"q\">Livraison ?\u003c/p>\u003cp>24 à 72 h selon la ville, paiement en espèces au livreur.\u003c/p>\u003c/div>\r\n   \u003cp class=\"lpnote\">Landing page complète générée : \u003ccode>landing/pack-barbier.html\u003c/code>\r\n    — créas : \u003ccode>creas/pack-barbier-feed.png\u003c/code>, \u003ccode>creas/pack-barbier-story.png\u003c/code>\u003c/p>\r\n  \u003c/section>\r\n \u003c/div>\r\n\u003c/article>\r\n\u003carticle class=\"item\" id=\"pack-foyer\">\r\n \u003cheader class=\"ih\">\r\n  \u003cdiv class=\"ihl\">\r\n   \u003cp class=\"eyebrow\">Composé · —\u003c/p>\r\n   \u003ch3>Pack Nouveau Foyer — Bocaux + Épices + Étendoir Mural\u003c/h3>\r\n   \u003cp class=\"ar-t\">باك الدار الجديدة — البوكالات + العطريات + النشارة\u003c/p>\r\n   \u003cp class=\"angle\">\u003cb>Angle —\u003c/b> Cadeau de mariage / emménagement : les trois achats que tout nouveau foyer fait dans le premier mois\u003c/p>\r\n  \u003c/div>\r\n  \u003cdiv class=\"ihr\">\r\n   \u003cdiv class=\"pxbig\">599\u003csmall>DH\u003c/small>\u003c/div>\r\n   \u003cs>697 DH\u003c/s>\r\n   \r\n  \u003c/div>\r\n \u003c/header>\r\n \r\n \u003cul class=\"compo\">\u003cli>\u003cspan>Set 12 bocaux carrés 1700 ml\u003c/span>\u003cb>249 DH\u003c/b>\u003c/li>\u003cli>\u003cspan>Set 12 pots à épices + support\u003c/span>\u003cb>199 DH\u003c/b>\u003c/li>\u003cli>\u003cspan>Étendoir mural pliable 80 cm\u003c/span>\u003cb>249 DH\u003c/b>\u003c/li>\u003cli class=\"tot\">\u003cspan>Valeur séparée\u003c/span>\u003cb>697 DH\u003c/b>\u003c/li>\u003c/ul>\r\n \u003cdiv class=\"metrics\">\r\n  \u003cdiv>\u003cspan>Coût estimé\u003c/span>\u003cb>375 DH\u003c/b>\u003c/div>\r\n  \u003cdiv>\u003cspan>Marge unitaire\u003c/span>\u003cb>224 DH\u003c/b>\u003c/div>\r\n  \u003cdiv>\u003cspan>Multiple\u003c/span>\u003cb>×1.6\u003c/b>\u003c/div>\r\n  \u003cdiv class=\"hi\">\u003cspan>CPA maximum\u003c/span>\u003cb>128.6 DH\u003c/b>\u003c/div>\r\n  \u003cdiv>\u003cspan>Net / livrée\u003c/span>\u003cb>183.6 DH\u003c/b>\u003c/div>\r\n \u003c/div>\r\n\r\n \u003cdiv class=\"tabs\" data-tabs>\r\n  \u003cnav role=\"tablist\">\r\n   \u003cbutton role=\"tab\" aria-selected=\"true\" data-p=\"meta\">Annonce Meta\u003c/button>\r\n   \u003cbutton role=\"tab\" aria-selected=\"false\" data-p=\"tk\">TikTok\u003c/button>\r\n   \u003cbutton role=\"tab\" aria-selected=\"false\" data-p=\"sc\">Script vidéo\u003c/button>\r\n   \u003cbutton role=\"tab\" aria-selected=\"false\" data-p=\"fp\">Fiche produit\u003c/button>\r\n  \u003c/nav>\r\n\r\n  \u003csection role=\"tabpanel\" data-p=\"meta\">\r\n   \u003cdiv class=\"fieldrow\">\u003clabel>Texte principal\u003c/label>\r\n    \u003cbutton class=\"cp\" type=\"button\" data-copy=\"m-pack-foyer\">Copier\u003c/button>\u003c/div>\r\n   \u003cpre class=\"ar-b\" id=\"m-pack-foyer\">كل واحد داير دار جديدة كيشري نفس 3 حوايج ف الشهر اللول 🏠\r\n\r\nقررنا نجمعوهم:\r\n\r\n📦 12 بوكال مربع 1700 مل — البلاكار مرتب من النهار اللول\r\n🧂 12 بوكال ديال العطريات + ستاند — بلا ما تقب الحيط\r\n👕 نشارة ديال الحيط كتطوى 80 سم — للبلكون ولا الحمام\r\n\r\nبوحدهم: 697 درهم\r\nف الباك: 599 درهم — كتربح 98 درهم\r\n\r\nهدية ديال العرس ولا ديال الدار الجديدة اللي كتخدم بصح.\r\n\r\n🚚 الدفع عند الاستلام\r\n📦 شحنة وحدة 👇\u003c/pre>\r\n   \u003cdiv class=\"two\">\r\n    \u003cdiv>\u003cdiv class=\"fieldrow\">\u003clabel>Titre\u003c/label>\r\n      \u003cbutton class=\"cp\" type=\"button\" data-copy=\"mh-pack-foyer\">Copier\u003c/button>\u003c/div>\r\n     \u003cp class=\"mono\" id=\"mh-pack-foyer\">Pack Nouveau Foyer — 599 DH au lieu de 697\u003c/p>\u003c/div>\r\n    \u003cdiv>\u003cdiv class=\"fieldrow\">\u003clabel>Description\u003c/label>\r\n      \u003cbutton class=\"cp\" type=\"button\" data-copy=\"md-pack-foyer\">Copier\u003c/button>\u003c/div>\r\n     \u003cp class=\"mono\" id=\"md-pack-foyer\">3 essentiels · Paiement à la livraison\u003c/p>\u003c/div>\r\n   \u003c/div>\r\n   \u003cdiv class=\"hookline\">\u003cspan>Hook\u003c/span>\u003cp class=\"ar-b\">داير دار جديدة؟ هادو 3 حوايج غادي تشريهم على كل حال 🏠\u003c/p>\u003c/div>\r\n  \u003c/section>\r\n\r\n  \u003csection role=\"tabpanel\" data-p=\"tk\" hidden>\r\n   \u003cdiv class=\"fieldrow\">\u003clabel>Légende\u003c/label>\r\n    \u003cbutton class=\"cp\" type=\"button\" data-copy=\"tk-pack-foyer\">Copier\u003c/button>\u003c/div>\r\n   \u003cpre class=\"ar-b\" id=\"tk-pack-foyer\">3 حوايج خاصك تشريهم ملي تدير دار جديدة 🏠 #دار_جديدة #عرس #هدية #المغرب #cod\u003c/pre>\r\n   \u003cdiv class=\"fieldrow\">\u003clabel>Hashtags\u003c/label>\r\n    \u003cbutton class=\"cp\" type=\"button\" data-copy=\"hs-pack-foyer\">Copier\u003c/button>\u003c/div>\r\n   \u003cpre class=\"ar-b\" id=\"hs-pack-foyer\">#المغرب #دار_جديدة #عرس #هدية #ترتيب #maroc #codmaroc #mariage\u003c/pre>\r\n  \u003c/section>\r\n\r\n  \u003csection role=\"tabpanel\" data-p=\"sc\" hidden>\r\n   \u003ctable class=\"sct\">\u003cthead>\u003ctr>\u003cth>Temps\u003c/th>\u003cth>Beat\u003c/th>\u003cth>Ce qu'on filme\u003c/th>\u003c/tr>\u003c/thead>\r\n   \u003ctbody>\u003ctr>\u003ctd class=\"t\">0-4 s\u003c/td>\u003ctd class=\"b\">HOOK\u003c/td>\u003ctd>Cartons de déménagement empilés dans un appartement vide. « داير دار جديدة؟ »\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"t\">4-10 s\u003c/td>\u003ctd class=\"b\">LISTE\u003c/td>\u003ctd>Trois cartons-titres qui apparaissent un par un : rangement, épices, séchage.\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"t\">10-22 s\u003c/td>\u003ctd class=\"b\">INSTALLATION\u003c/td>\u003ctd>Time-lapse : les bocaux remplissent le placard, le support d&#x27;épices se colle, l&#x27;étendoir se fixe au mur du balcon.\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"t\">22-26 s\u003c/td>\u003ctd class=\"b\">RESULTAT\u003c/td>\u003ctd>Plan large de l&#x27;appartement, maintenant fonctionnel. Linge qui sèche au balcon.\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"t\">26-30 s\u003c/td>\u003ctd class=\"b\">CTA\u003c/td>\u003ctd>697 DH barré → 599 DH + « الدفع عند الاستلام ».\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\r\n  \u003c/section>\r\n\r\n  \u003csection role=\"tabpanel\" data-p=\"fp\" hidden>\r\n   \u003cp class=\"promesse\">Les trois équipements qu&#x27;on finit toujours par acheter en emménageant, réunis dans un seul colis et à un seul prix.\u003c/p>\r\n   \u003ch4>Bénéfices\u003c/h4>\u003cul class=\"ben\">\u003cli>Les trois achats du premier mois d&#x27;emménagement en un colis\u003c/li>\u003cli>98 DH d&#x27;économie et une seule livraison au lieu de trois\u003c/li>\u003cli>Idéal comme cadeau de mariage : utile, visible, et qui sert tous les jours\u003c/li>\u003cli>L&#x27;étendoir se replie à plat : il disparaît quand il ne sert pas\u003c/li>\u003cli>Aucun outil requis pour le support d&#x27;épices, montage mural simple pour l&#x27;étendoir\u003c/li>\u003c/ul>\r\n   \u003ch4>Objections traitées\u003c/h4>\u003cdiv class=\"obj\">\u003cp class=\"q\">« 599 DH, c&#x27;est mon plus gros panier »\u003c/p>\u003cp>C&#x27;est trois produits. Pris séparément ils coûtent 697 DH plus trois livraisons. Et vous payez à la réception, pas avant.\u003c/p>\u003c/div>\u003cdiv class=\"obj\">\u003cp class=\"q\">« L&#x27;étendoir demande de percer ? »\u003c/p>\u003cp>Oui, deux chevilles pour l&#x27;étendoir mural — c&#x27;est le seul des trois qui demande une perceuse. Le support d&#x27;épices est adhésif.\u003c/p>\u003c/div>\u003cdiv class=\"obj\">\u003cp class=\"q\">« Comme cadeau, ça fait quoi ? »\u003c/p>\u003cp>Un colis unique, trois produits présentables. Beaucoup de clients le commandent pour un mariage.\u003c/p>\u003c/div>\r\n   \u003ch4>Caractéristiques\u003c/h4>\u003ctable class=\"spec\">\u003ctr>\u003ctd>Bocaux\u003c/td>\u003ctd>12 × 1700 ml\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Épices\u003c/td>\u003ctd>12 × 110 ml + support adhésif\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Étendoir\u003c/td>\u003ctd>Mural pliable 80 cm, ~10 kg\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Montage\u003c/td>\u003ctd>Adhésif + 2 chevilles\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Colis\u003c/td>\u003ctd>Unique\u003c/td>\u003c/tr>\u003c/table>\r\n   \u003ch4>FAQ\u003c/h4>\u003cdiv class=\"qa\">\u003cp class=\"q\">Tout arrive ensemble ?\u003c/p>\u003cp>Oui, un colis, un paiement.\u003c/p>\u003c/div>\u003cdiv class=\"qa\">\u003cp class=\"q\">L&#x27;étendoir supporte combien ?\u003c/p>\u003cp>Environ 10 kg de linge mouillé, replié à plat quand il ne sert pas.\u003c/p>\u003c/div>\u003cdiv class=\"qa\">\u003cp class=\"q\">On peut retirer un article du pack ?\u003c/p>\u003cp>Le pack est vendu tel quel. Les produits sont aussi disponibles à l&#x27;unité sur la boutique.\u003c/p>\u003c/div>\u003cdiv class=\"qa\">\u003cp class=\"q\">Délai ?\u003c/p>\u003cp>24 à 48 h grandes villes, 48 à 72 h ailleurs.\u003c/p>\u003c/div>\r\n   \u003cp class=\"lpnote\">Landing page complète générée : \u003ccode>landing/pack-foyer.html\u003c/code>\r\n    — créas : \u003ccode>creas/pack-foyer-feed.png\u003c/code>, \u003ccode>creas/pack-foyer-story.png\u003c/code>\u003c/p>\r\n  \u003c/section>\r\n \u003c/div>\r\n\u003c/article>\r\n\r\n\u003csection class=\"sect\">\u003ch2>Plan de lancement\u003c/h2>\u003c/section>\r\n\u003cdiv class=\"plan\">\r\n \u003col>\r\n  \u003cli>\u003cb>Vérifier les coûts d'abord.\u003c/b> Les coûts d'achat ci-dessus sont des estimations\r\n   (prix usine × 1,45 d'import, méthode du Comptoir COD). Faites chiffrer les cinq références\r\n   chez un grossiste de Derb Omar et sur 1688 avant d'engager le moindre dirham de publicité.\r\n   Si un coût réel dépasse l'estimation de plus de 20 %, le CPA maximum s'effondre.\u003c/li>\r\n  \u003cli>\u003cb>Tester trois produits, pas cinq.\u003c/b> Bocaux, pots à épices et appareil photo enfant\r\n   d'abord : ce sont les trois qui portent une vraie série de ventes. 150 DH par jour et par produit\r\n   pendant 4 jours, en CBO, une seule audience large.\u003c/li>\r\n  \u003cli>\u003cb>Un angle par créa.\u003c/b> Chaque produit a un hook darija et un script de 30 s. Lancez\r\n   trois créas par produit, coupez celles sous 1 % de CTR au bout de 48 h.\u003c/li>\r\n  \u003cli>\u003cb>Ne pas lancer les packs en acquisition.\u003c/b> Mettez-les en upsell sur la page de commande\r\n   et en relance WhatsApp. Un pack se vend à quelqu'un qui a déjà décidé d'acheter, pas à un inconnu\r\n   qui découvre la marque.\u003c/li>\r\n  \u003cli>\u003cb>Confirmer par téléphone sous 2 h.\u003c/b> Le taux de 85 % de confirmation retenu dans le calcul\r\n   n'est atteignable qu'avec un appel rapide. Passé 24 h, il tombe autour de 60 % et tous les CPA\r\n   maximum ci-dessus deviennent faux.\u003c/li>\r\n \u003c/ol>\r\n\u003c/div>\r\n\r\n\u003csection class=\"sect\">\u003ch2>Ce qui reste à vérifier\u003c/h2>\u003c/section>\r\n\u003cdiv class=\"warn\">\r\n \u003ch3>Les limites de ce dossier, sans enrobage\u003c/h3>\r\n \u003cul>\r\n  \u003cli>\u003cb>Aucun coût d'achat n'est vérifié.\u003c/b> Le champ coût est vide sur les 58 400 produits de la base :\r\n   les marges, multiples et CPA maximum reposent sur des estimations de sourcing, pas sur des devis.\r\n   C'est la première chose à corriger.\u003c/li>\r\n  \u003cli>\u003cb>Les ventes par jour ne sont pas comparables entre boutiques.\u003c/b> Elles sont estimées à partir\r\n   des ruptures de stock observées. justyol.com reçoit 250 000 visites par mois, gula.ma n'a pas de\r\n   classement Tranco : un même produit y affichera des chiffres très différents sans que la demande diffère.\u003c/li>\r\n  \u003cli>\u003cb>La fenêtre d'observation est courte\u003c/b> — du 1\u003csup>er\u003c/sup> au 4 septembre 2026, 11 jours de\r\n   séries au maximum. Assez pour repérer un mouvement, pas pour établir une tendance saisonnière.\u003c/li>\r\n  \u003cli>\u003cb>Les photos des créas sont celles des fournisseurs.\u003c/b> Deux créas utilisent les images\r\n   téléchargées par l'extension sur jamla24.com. À remplacer par vos propres packshots avant diffusion :\r\n   droits d'usage et différenciation.\u003c/li>\r\n  \u003cli>\u003cb>Le pistolet de massage est un produit de bien-être, pas un dispositif médical.\u003c/b>\r\n   Les textes évitent toute promesse thérapeutique — Meta refuse les annonces qui en font, et c'est aussi\r\n   la position honnête.\u003c/li>\r\n \u003c/ul>\r\n\u003c/div>\r\n\r\n\u003cfooter>\r\n Sources : base Espion COD (\u003ccode>espion.db\u003c/code>, 4 septembre 2026) et captures de l'extension\r\n Radar Produit Gagnant (\u003ccode>Downloads/COD search WEB\u003c/code>). Landing pages, créas et scripts générés\r\n dans \u003ccode>Documents/Lancement-COD-Sept2026\u003c/code>.\r\n\u003c/footer>\r\n\u003c/div>\r\n\r\n\u003cscript>\r\ndocument.querySelectorAll('[data-tabs]').forEach(function(box){\r\n var tabs=box.querySelectorAll('button[role=tab]');\r\n var panes=box.querySelectorAll('section[role=tabpanel]');\r\n tabs.forEach(function(t){\r\n  t.addEventListener('click',function(){\r\n   tabs.forEach(function(x){x.setAttribute('aria-selected','false')});\r\n   t.setAttribute('aria-selected','true');\r\n   panes.forEach(function(p){p.hidden = p.dataset.p !== t.dataset.p});\r\n  });\r\n });\r\n});\r\ndocument.querySelectorAll('.cp').forEach(function(b){\r\n b.addEventListener('click',function(){\r\n  var el=document.getElementById(b.dataset.copy); if(!el) return;\r\n  var done=function(){\r\n   var old=b.textContent; b.textContent='Copié'; b.classList.add('ok');\r\n   setTimeout(function(){b.textContent=old;b.classList.remove('ok')},1400);\r\n  };\r\n  if(navigator.clipboard&&navigator.clipboard.writeText){\r\n   navigator.clipboard.writeText(el.innerText).then(done,function(){});\r\n  } else {\r\n   var r=document.createRange(); r.selectNodeContents(el);\r\n   var s=getSelection(); s.removeAllRanges(); s.addRange(r);\r\n   try{document.execCommand('copy');done()}catch(e){}\r\n  }\r\n });\r\n});\r\n\u003c/script>\n\u003c/body>\u003c/html>"}];
</script>

<!-- Le moteur local : même contrat d'API que le serveur Node -->
<script>
/* =============================================================================
   L'API locale — l'édition HTML autonome.

   Le même contrat que le serveur Node (`/api/…`), mais tout se passe dans le
   navigateur : les données vivent dans localStorage, la chaîne tourne dans
   l'onglet, les livrables sont gardés en mémoire et proposés au téléchargement.

   L'interface (app.js) ne sait pas laquelle des deux répond. C'est ce qui
   permet d'avoir une seule interface pour les deux éditions.
   ========================================================================== */
(function (global) {
  "use strict";

  /* Le bundle injecte les modules partagés — les mêmes fichiers que le serveur
     utilise, sans une ligne réécrite. */
  const eco = require("./economics");
  const src = require("./sources");
  const hl = require("./horsligne");
  const radar = require("./data/radar.json");

  const PREFIXE = "poste-cod:";
  const TABLES = ["produits", "boutiques", "fournisseurs", "campagnes", "captures", "commandes"];

  const ETAPES = [
    { id: "recherche",    nom: "Recherche marché",      verbe: "Recherche en cours" },
    { id: "validation",   nom: "Validation produit",    verbe: "Validation économique" },
    { id: "fournisseurs", nom: "Fournisseurs en gros",  verbe: "Recherche fournisseurs" },
    { id: "adcopy",       nom: "Ad copies",             verbe: "Rédaction des annonces" },
    { id: "scripts",      nom: "Scripts vidéo",         verbe: "Écriture des scripts" },
    { id: "visuels",      nom: "Visuels publicitaires", verbe: "Production des créas" },
    { id: "landing",      nom: "Landing page",          verbe: "Construction de la page" },
    { id: "strategie",    nom: "Stratégie de campagne", verbe: "Plan de lancement" }
  ];

  /* ---------------------------------------------------------------------------
     Stockage — localStorage, avec repli en mémoire.

     Un navigateur peut refuser localStorage (navigation privée, cookies
     bloqués, page ouverte depuis un chemin exotique). Dans ce cas l'atelier
     doit rester utilisable pour la session en cours, et le dire.
     ------------------------------------------------------------------------ */
  const memoire = {};
  let stockagePersistant = true;

  (function testerStockage() {
    try {
      localStorage.setItem(PREFIXE + "test", "1");
      localStorage.removeItem(PREFIXE + "test");
    } catch (err) {
      stockagePersistant = false;
    }
  })();

  function lire(cle, defaut) {
    if (!stockagePersistant) return cle in memoire ? memoire[cle] : defaut;
    try {
      const brut = localStorage.getItem(PREFIXE + cle);
      return brut == null ? defaut : JSON.parse(brut);
    } catch (err) {
      return defaut;
    }
  }

  function ecrire(cle, valeur) {
    memoire[cle] = valeur;
    if (!stockagePersistant) return valeur;
    try {
      localStorage.setItem(PREFIXE + cle, JSON.stringify(valeur));
    } catch (err) {
      /* Quota dépassé : on fait de la place en jetant les livrables des plus
         vieilles campagnes, puis on réessaie une fois. Les données métier
         (produits, fournisseurs, commandes) ne sont jamais sacrifiées. */
      if (libererPlace()) {
        try { localStorage.setItem(PREFIXE + cle, JSON.stringify(valeur)); }
        catch (err2) { stockagePersistant = false; }
      } else {
        stockagePersistant = false;
      }
    }
    return valeur;
  }

  function libererPlace() {
    const campagnes = liste("campagnes").slice().sort((a, b) => (a.debut || "") < (b.debut || "") ? -1 : 1);
    let libere = false;
    for (const c of campagnes) {
      try {
        if (localStorage.getItem(PREFIXE + "livrables:" + c.id)) {
          localStorage.removeItem(PREFIXE + "livrables:" + c.id);
          libere = true;
          if (libere) break;   // une campagne à la fois, on réessaie ensuite
        }
      } catch (err) { /* rien à faire */ }
    }
    return libere;
  }

  const liste = t => { const v = lire(t, []); return Array.isArray(v) ? v : []; };
  const uid = p => (p || "id") + "-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  /* ---------------------------------------------------------------------------
     Réglages
     ------------------------------------------------------------------------ */
  function reglagesParDefaut() {
    return {
      boutique: "Ma boutique COD",
      marche: "MA", devise: "MAD", symbole: "DH",
      hypotheses: Object.assign({}, eco.DEFAUT),
      modele: "claude-opus-5",
      connecteurs: { make: {}, higgsfield: {} },
      creeLe: new Date().toISOString()
    };
  }

  function reglages() {
    const r = lire("reglages", {});
    const d = reglagesParDefaut();
    const f = Object.assign({}, d, r);
    f.hypotheses = Object.assign({}, d.hypotheses, r.hypotheses || {});
    f.connecteurs = {
      make: Object.assign({}, (r.connecteurs || {}).make || {}),
      higgsfield: Object.assign({}, (r.connecteurs || {}).higgsfield || {})
    };
    return f;
  }

  function majReglages(champs) {
    const a = reglages();
    const s = Object.assign({}, a, champs);
    if (champs && champs.hypotheses) s.hypotheses = Object.assign({}, a.hypotheses, champs.hypotheses);
    if (champs && champs.connecteurs) {
      s.connecteurs = {
        make: Object.assign({}, a.connecteurs.make, champs.connecteurs.make || {}),
        higgsfield: Object.assign({}, a.connecteurs.higgsfield, champs.connecteurs.higgsfield || {})
      };
    }
    return ecrire("reglages", s);
  }

  /* ---------------------------------------------------------------------------
     Livrables — gardés par campagne, servis en blob:
     ------------------------------------------------------------------------ */
  const urlsBlob = {};   // "campagne/fichier" -> blob URL déjà créée

  function livrablesDe(id) { return lire("livrables:" + id, {}); }

  function ecrireLivrable(id, fichier, contenu) {
    const m = livrablesDe(id);
    m[fichier] = contenu;
    ecrire("livrables:" + id, m);
    return { fichier, octets: contenu.length };
  }

  function listerLivrables(id) {
    const m = livrablesDe(id);
    return Object.keys(m).map(f => ({ fichier: f, octets: m[f].length }));
  }

  const TYPES = { ".svg": "image/svg+xml", ".html": "text/html", ".json": "application/json", ".txt": "text/plain" };

  function urlFichier(id, fichier) {
    const cle = id + "/" + fichier;
    if (urlsBlob[cle]) return urlsBlob[cle];
    const contenu = livrablesDe(id)[fichier];
    if (contenu == null) return "";
    const ext = fichier.slice(fichier.lastIndexOf("."));
    const blob = new Blob([contenu], { type: (TYPES[ext] || "application/octet-stream") + ";charset=utf-8" });
    urlsBlob[cle] = URL.createObjectURL(blob);
    return urlsBlob[cle];
  }

  /* ---------------------------------------------------------------------------
     La chaîne, dans l'onglet.

     Elle est découpée en tours d'événement pour que l'interface puisse
     redessiner entre deux étapes : sans ça, les huit étapes s'exécuteraient
     dans le même tour et l'écran ne montrerait que le résultat final.
     ------------------------------------------------------------------------ */
  const travaux = {};
  const abonnes = {};

  function abonner(id, fn) {
    (abonnes[id] = abonnes[id] || []).push(fn);
    return () => { abonnes[id] = (abonnes[id] || []).filter(f => f !== fn); };
  }

  function diffuser(id, ev) {
    (abonnes[id] || []).forEach(fn => { try { fn(ev); } catch (err) { /* abonné parti */ } });
  }

  const souffler = () => new Promise(r => setTimeout(r, 0));

  function resume(job) {
    return {
      id: job.id, cible: job.cible, type: job.type, statut: job.statut,
      mode: job.mode, debut: job.debut, fin: job.fin || null, erreur: job.erreur || null,
      etapes: job.etapes.map(e => ({
        id: e.id, nom: e.nom, verbe: e.verbe, statut: e.statut,
        duree: e.duree || null, note: e.note || null, erreur: e.erreur || null
      })),
      livrables: listerLivrables(job.id)
    };
  }

  function lancer(demande) {
    const d = demande || {};
    const r = reglages();
    const cible = String(d.cible || "").trim();
    if (!cible) throw new Error("Indiquez un produit ou une catégorie.");

    const job = {
      id: uid("camp"), cible,
      type: d.type === "categorie" ? "categorie" : "produit",
      prix: d.prix != null ? Number(d.prix) : null,
      cout: d.cout != null ? Number(d.cout) : null,
      boutique: r.boutique,
      whatsapp: r.whatsapp || "",
      hypotheses: r.hypotheses,
      devise: r.symbole || "DH",
      mode: "hors-ligne",
      statut: "en-cours",
      debut: new Date().toISOString(),
      etapes: ETAPES.map(e => Object.assign({ statut: "attente" }, e)),
      resultats: {}
    };

    travaux[job.id] = job;
    executer(job).catch(err => {
      job.statut = "echec";
      job.erreur = err.message;
      job.fin = new Date().toISOString();
      diffuser(job.id, { type: "fin", job: resume(job) });
    });
    return resume(job);
  }

  async function executer(job) {
    const majEtape = (id, champs) => {
      const e = job.etapes.find(x => x.id === id);
      if (!e) return;
      Object.assign(e, champs);
      diffuser(job.id, { type: "etape", etape: e, job: resume(job) });
    };

    const ctx = () => ({
      cible: job.cible, produitRetenu: job.produitRetenu,
      prix: job.prix, cout: job.cout, hypotheses: job.hypotheses,
      boutique: job.boutique, whatsapp: job.whatsapp, devise: job.devise,
      copy: job.copy, recherche: job.resultats.recherche,
      visuels: job.resultats.visuels, economie: job.economie,
      webhookUrl: (reglages().connecteurs.make || {}).webhook || ""
    });

    const suite = [
      ["recherche",    () => hl.recherche(ctx())],
      ["validation",   () => {
        const res = hl.validation(ctx());
        job.prix = res.prix; job.cout = res.cout; job.economie = res.economie;
        return res;
      }],
      ["fournisseurs", () => hl.fournisseurs(ctx())],
      ["adcopy",       () => { job.copy = hl.adcopy(ctx()); return job.copy; }],
      ["scripts",      () => hl.scripts()],
      ["visuels",      () => {
        const v = hl.visuels(ctx());
        v.jeu.forEach(c => ecrireLivrable(job.id, c.fichier, c.svg));
        return v.resume;
      }],
      ["landing",      () => {
        const r = hl.landingPage(ctx());
        ecrireLivrable(job.id, "landing.html", r.html);
        return r.resume;
      }],
      ["strategie",    () => hl.strategie(ctx())]
    ];

    for (const [id, fn] of suite) {
      const t0 = Date.now();
      majEtape(id, { statut: "en-cours" });
      await souffler();          // laisse l'interface redessiner
      try {
        const res = fn();
        job.resultats[id] = res;
        majEtape(id, { statut: "fait", duree: Date.now() - t0, note: res && res.note ? res.note : null });

        if (id === "validation" && res.verdict === "bloquant") {
          job.statut = "arrete";
          job.arret = res.raison;
          job.fin = new Date().toISOString();
          job.etapes.filter(e => e.statut === "attente")
            .forEach(e => majEtape(e.id, { statut: "sautee", note: "Arrêté à la validation" }));
          terminer(job);
          return;
        }
      } catch (err) {
        majEtape(id, { statut: "echec", duree: Date.now() - t0, erreur: err.message });
        job.resultats[id] = { echec: true, erreur: err.message };
      }
    }

    job.statut = "fini";
    job.fin = new Date().toISOString();
    terminer(job);
  }

  function terminer(job) {
    const dossier = {
      id: job.id, cible: job.cible, type: job.type, mode: job.mode,
      debut: job.debut, fin: job.fin, statut: job.statut, arret: job.arret || null,
      boutique: job.boutique, prix: job.prix, cout: job.cout,
      hypotheses: job.hypotheses, resultats: job.resultats
    };
    ecrireLivrable(job.id, "campagne.json", JSON.stringify(dossier, null, 1));

    const campagnes = liste("campagnes");
    campagnes.push({
      id: job.id, cible: job.cible, type: job.type, statut: job.statut,
      mode: job.mode, debut: job.debut, fin: job.fin,
      score: (job.resultats.validation || {}).score || null,
      verdict: (job.resultats.validation || {}).verdict || null,
      prix: job.prix, cout: job.cout
    });
    ecrire("campagnes", campagnes);

    envoyerMake(job);
    diffuser(job.id, { type: "fin", job: resume(job) });
  }

  /* Depuis un navigateur, on ne peut pas lire la réponse d'un webhook Make :
     il ne renvoie pas d'en-tête CORS. On envoie donc en « no-cors », ce qui
     part bien mais ne dit pas si c'est arrivé. L'interface le précise. */
  function envoyerMake(job) {
    const w = (reglages().connecteurs.make || {}).webhook;
    if (!w) return;
    const v = job.resultats.validation || {};
    const e = v.economie || {};
    try {
      fetch(w, {
        method: "POST", mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=UTF-8" },
        body: JSON.stringify({
          source: "poste-cod", edition: "html",
          type: job.statut === "arrete" ? "campagne.arretee" : "campagne.terminee",
          le: new Date().toISOString(),
          campagne: job.id, cible: job.cible, boutique: job.boutique,
          prix: job.prix, cout: job.cout,
          score: v.score != null ? v.score : null,
          cpaMax: e.cpaMax != null ? e.cpaMax : null,
          raisonArret: job.arret || null
        })
      }).catch(function () {});
    } catch (err) { /* rien à faire, l'envoi est sans retour */ }
  }

  function complet(id) {
    const job = travaux[id];
    if (job) {
      return Object.assign({}, resume(job), {
        prix: job.prix, cout: job.cout, hypotheses: job.hypotheses,
        resultats: job.resultats, arret: job.arret || null, sources: []
      });
    }
    /* Campagne d'une session précédente : on relit son dossier. */
    const brut = livrablesDe(id)["campagne.json"];
    if (!brut) return null;
    try {
      const d = JSON.parse(brut);
      d.livrables = listerLivrables(id);
      return d;
    } catch (err) { return null; }
  }

  /* ---------------------------------------------------------------------------
     Le routeur — mêmes chemins que le serveur
     ------------------------------------------------------------------------ */
  async function appel(chemin, options) {
    const o = options || {};
    const methode = (o.method || "GET").toUpperCase();
    const corps = o.body ? JSON.parse(o.body) : {};
    const seg = chemin.split("?")[0].split("/").filter(Boolean);

    if (seg[0] === "etat") {
      const r = reglages();
      const c = r.connecteurs;
      return {
        edition: "html",
        stockagePersistant,
        claude: {
          disponible: false, sdkInstalle: false, cleConfiguree: false, modele: r.modele,
          raison: "Édition HTML : la recherche web et la rédaction en darija demandent " +
            "l'édition Node, qui garde la clé API hors du navigateur."
        },
        connecteurs: {
          make: {
            actif: !!(c.make && c.make.webhook), webhook: !!(c.make && c.make.webhook),
            api: false, zone: (c.make && c.make.zone) || "eu2", source: "réglages",
            raison: (c.make && c.make.webhook)
              ? null
              : "Aucun webhook Make. Créez un webhook « Custom webhook » dans un scénario et collez son URL."
          },
          higgsfield: {
            actif: false, profil: "v2",
            raison: "Édition HTML : Higgsfield demande l'édition Node — sa clé ne doit pas vivre dans une page web."
          }
        },
        reglages: r,
        apps: (global.POSTE_COD_APPS || []).map(a => ({ id: a.id, nom: a.nom, emoji: a.emoji, quoi: a.quoi, url: "" })),
        etapes: ETAPES,
        compteurs: {
          produits: liste("produits").length,
          boutiques: liste("boutiques").length,
          fournisseurs: liste("fournisseurs").length,
          campagnes: liste("campagnes").length,
          captures: liste("captures").length,
          commandes: liste("commandes").length,
          catalogueRadar: radar.produits.length,
          sourcesComptoir: src.SOURCES.length
        }
      };
    }

    if (seg[0] === "reglages") {
      if (methode === "GET") return reglages();
      return majReglages(corps);
    }

    if (seg[0] === "catalogue") return { produits: radar.produits, marches: radar.marches };

    if (seg[0] === "comptoir") {
      return { sources: src.SOURCES, categories: src.CATEGORIES, types: src.TYPES, annuaires: src.ANNUAIRES };
    }

    if (seg[0] === "economie" && methode === "POST") {
      const hyp = Object.assign({}, reglages().hypotheses, corps.hypotheses || {});
      const note = eco.scoreProduit({ nom: corps.nom, prix: Number(corps.prix), cout: Number(corps.cout), criteres: corps.criteres }, hyp);
      return {
        score: note.score, verdict: note.verdict, detail: note.parts,
        economie: note.economie, budget: eco.planBudget(note.economie),
        correctifs: {
          prixMinimum: eco.prixPourCpa(Number(corps.cout), hyp.cplPlancher + 20, hyp),
          coutMaximum: eco.coutMaxPour(Number(corps.prix), hyp.cplPlancher + 20, hyp)
        }
      };
    }

    if (seg[0] === "sourcing" && methode === "POST") {
      const nom = String(corps.nom || "");
      const cat = corps.categorieId || src.categoriser(nom).id;
      const routes = src.routesAchat({ nom, requete: nom }, { categorieId: cat, marche: corps.marche });
      return {
        categorie: src.categoriser(nom),
        routes: src.estimerCouts(routes, corps.cout ? { sourceId: routes[0] && routes[0].id, cout: Number(corps.cout) } : null),
        pistesContact: src.pistesContact(nom, corps.ville),
        plafonds: src.plafondsPrix(nom),
        annuaires: src.ANNUAIRES
      };
    }

    if (seg[0] === "campagnes") {
      if (methode === "GET" && !seg[1]) {
        const enMemoire = Object.keys(travaux).map(k => resume(travaux[k]));
        const vus = {};
        enMemoire.forEach(j => { vus[j.id] = true; });
