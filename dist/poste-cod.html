S\", q => `https://www.amazon.es/s?k=${E_(q)}`),\n          S(\"Wallapop\",  q => `https://es.wallapop.com/app/search?keywords=${E_(q)}`)]},\n\n  {id:\"RO\", nom:\"Roumanie\", zone:\"Europe COD\", cur:\"RON\", sym:\"lei\", rate:4.5397, dec:0,\n   unit:10, charm:1, priceMult:1.05, landed:1.10, lang:\"en\", geo:\"RO\",\n   cod:\"~51 % des commandes\", refusTxt:\"8–14 %\",\n   note:\"Le meilleur taux de livraison réussie du panel : 90 à 95 % sur les compléments, 86 à 92 % en mode, 80 à 88 % sur l'électronique au-dessus de 200 €. Le COD y est le standard des media buyers, pas une option de repli.\",\n   econ:{conf:75, refus:10, livr:22, retour:16, cpl:16, pmin:89, pmax:399},\n   plats:[S(\"eMAG\",   q => `https://www.emag.ro/search/${E_(q)}`),\n          S(\"OLX RO\", q => `https://www.olx.ro/d/oferte/q-${E_(q)}/`)]},\n\n  {id:\"PL\", nom:\"Pologne\", zone:\"Europe COD\", cur:\"PLN\", sym:\"zł\", rate:3.6927, dec:0,\n   unit:10, charm:1, priceMult:1.10, landed:1.10, lang:\"en\", geo:\"PL\",\n   cod:\"standard régional\", refusTxt:\"8–15 %\",\n   note:\"Fait partie du bloc Serbie–Slovaquie–Tchéquie–Hongrie–Pologne où le taux de livraison réussie tient entre 85 et 92 %. L'appel de confirmation avant expédition gagne 4 à 7 points de livraison.\",\n   econ:{conf:72, refus:12, livr:18, retour:13, cpl:14, pmin:79, pmax:349},\n   plats:[S(\"Allegro\", q => `https://allegro.pl/listing?string=${E_(q)}`),\n          S(\"OLX PL\",  q => `https://www.olx.pl/oferty/q-${E_(q)}/`)]},\n\n  {id:\"XOF\", nom:\"Sénégal / Côte d'Ivoire\", zone:\"Afrique de l'Ouest\", cur:\"XOF\", sym:\"FCFA\", rate:562.8, dec:0,\n   unit:500, charm:100, priceMult:0.85, landed:1.25, lang:\"fr\", geo:\"CI\",\n   cod:\"~75 % (vente sociale)\", refusTxt:\"30–40 %\",\n   note:\"En Côte d'Ivoire, environ 75 % des transactions en ligne passent encore par des vendeurs sociaux informels qui encaissent en cash. Jumia Logistics facture 1 500 à 3 000 FCFA la livraison ; Glovo couvre Abidjan en express.\",\n   econ:{conf:55, refus:35, livr:2000, retour:1200, cpl:1800, pmin:9000, pmax:35000},\n   plats:[S(\"Jumia CI\",    q => `https://www.jumia.ci/catalog/?q=${E_(q)}`),\n          S(\"Jumia SN\",    q => `https://www.jumia.sn/catalog/?q=${E_(q)}`),\n          S(\"CoinAfrique\", q => `https://sn.coinafrique.com/recherche?keyword=${E_(q)}`)]},\n\n  {id:\"NG\", nom:\"Nigeria\", zone:\"Afrique de l'Ouest\", cur:\"NGN\", sym:\"₦\", rate:1347.2, dec:0,\n   unit:500, charm:100, priceMult:0.75, landed:1.30, lang:\"en\", geo:\"NG\",\n   cod:\"70 %+\", refusTxt:\"30–40 %\",\n   warn:\"Naira très volatil : recalcule la marge à chaque réassort, un mouvement de change peut effacer le bénéfice d'un lot entier.\",\n   note:\"Préférence COD au-dessus de 70 %. La logistique repose sur l'économie des livreurs à moto, et le problème d'adressage reste la première cause d'échec de livraison.\",\n   econ:{conf:55, refus:35, livr:2500, retour:1500, cpl:3500, pmin:15000, pmax:60000},\n   plats:[S(\"Jumia NG\", q => `https://www.jumia.com.ng/catalog/?q=${E_(q)}`),\n          S(\"Jiji NG\",  q => `https://jiji.ng/search?query=${E_(q)}`),\n          S(\"Konga\",    q => `https://www.konga.com/search?search=${E_(q)}`)]}\n];\nconst MK = id => MARKETS.find(m => m.id === id) || MARKETS[0];\nconst RATE_MA = 9.16;   // taux ayant servi à convertir le catalogue en base USD\n\nfunction linksFor(p, m){\n  const qLoc = m.lang === \"fr\" ? p.qFr : p.qEn;\n  return GLOBAL_PLATS.map(s => ({n:s.n, url:s.u(p.qEn)}))\n    .concat(m.plats.map(s => ({n:s.n, url:s.u(qLoc)})))\n    .concat([\n      {n:\"Meta Ad Library\", url:`https://www.facebook.com/ads/library/?active_status=active&ad_type=all&country=${m.geo}&media_type=all&q=${E_(qLoc)}`},\n      {n:\"Google Trends\",   url:`https://trends.google.com/trends/explore?geo=${m.geo}&q=${E_(qLoc)}`}\n    ]);\n}\n\n/* ============================================================\n   3. Hypothèses et poids\n   ============================================================ */\nconst ECON_FIELDS = [\n  {k:\"conf\",  l:\"Taux de confirmation\",        u:\"%\", min:20, max:100, step:1},\n  {k:\"refus\", l:\"Refus à la livraison\",        u:\"%\", min:0,  max:60,  step:1},\n  {k:\"livr\",  l:\"Frais de livraison encaissée\", cur:true},\n  {k:\"retour\",l:\"Frais sur commande refusée\",   cur:true},\n  {k:\"cpl\",   l:\"Coût par lead (pub)\",          cur:true},\n  {k:\"pmin\",  l:\"Bas de la zone d'impulsion\",   cur:true},\n  {k:\"pmax\",  l:\"Haut de la zone d'impulsion\",  cur:true}\n];\n/* Les curseurs en devise sont bornés relativement à la valeur par défaut du marché. */\nfunction bounds(f, m){\n  if(!f.cur) return {min:f.min, max:f.max, step:f.step};\n  const d = m.econ[f.k];\n  const max = Math.max(d * 3, d + 10);\n  const step = m.dec ? 0.5 : max > 20000 ? 500 : max > 2000 ? 100 : max > 200 ? 5 : 1;\n  return {min:0, max:Math.ceil(max / step) * step, step};\n}\nconst W_DEF = {marge:25, ads:15, wow:15, pb:12, conc:12, log:10, prix:6, nouv:5};\nconst W_FIELDS = [\n  {k:\"marge\",l:\"Marge nette après refus\"},\n  {k:\"ads\",  l:\"Preuve de demande publicitaire\"},\n  {k:\"wow\",  l:\"Effet wow / démo vidéo\"},\n  {k:\"pb\",   l:\"Résout un vrai problème\"},\n  {k:\"conc\", l:\"Concurrence locale faible\"},\n  {k:\"log\",  l:\"Léger, compact, incassable\"},\n  {k:\"prix\", l:\"Dans la zone d'impulsion\"},\n  {k:\"nouv\", l:\"Introuvable en magasin\"}\n];\n\n/* ============================================================\n   4. État\n   ============================================================ */\nconst LS = \"radar-cod-v2\";\nlet state = {market:\"MA\", econBy:{}, w:{...W_DEF}, custom:[], open:null,\n             q:\"\", cat:\"\", season:\"\", verdict:\"\", sort:\"score\"};\ntry{\n  const s = JSON.parse(localStorage.getItem(LS) || \"null\");\n  if(s){\n    state.market = MARKETS.some(m => m.id === s.market) ? s.market : \"MA\";\n    state.econBy = s.econBy || {}; state.w = {...W_DEF, ...s.w}; state.custom = s.custom || [];\n  }\n}catch(e){}\nconst save = () => { try{ localStorage.setItem(LS, JSON.stringify(\n  {market:state.market, econBy:state.econBy, w:state.w, custom:state.custom})); }catch(e){} };\nconst all = () => SEED.concat(state.custom);\nconst mkt = () => MK(state.market);\nconst econFor = m => ({...m.econ, ...(state.econBy[m.id] || {})});\n\n/* ============================================================\n   5. Calculs — prix et coûts dérivés d'une base USD commune\n   ============================================================ */\nconst clamp = (v,a,b) => Math.max(a, Math.min(b, v));\n\nfunction fmt(v, m){\n  m = m || mkt();\n  const n = m.dec\n    ? (Math.round(v * 100) / 100).toLocaleString(\"fr-FR\", {minimumFractionDigits:2, maximumFractionDigits:2})\n    : Math.round(v).toLocaleString(\"fr-FR\");\n  return n + \" \" + m.sym;\n}\nconst usd = v => \"$\" + (Math.round(v * 10) / 10).toLocaleString(\"fr-FR\", {maximumFractionDigits:1});\n\n/* prix psychologique : on arrondit à l'unité du marché puis on retranche le charme */\nfunction charmPrice(v, m){\n  const r = Math.max(m.unit, Math.round(v / m.unit) * m.unit) - m.charm;\n  return m.dec ? Math.round(r * 100) / 100 : Math.round(r);\n}\n/* saisie locale → base catalogue (équivalent MAD), pour que le produit se chiffre sur tous les marchés */\nconst toBase = (v, m, mult) => Math.round(v / m.rate / m[mult] * RATE_MA);\nconst priceIn = (p, m) => charmPrice(p.prix / RATE_MA * m.priceMult * m.rate, m);\nconst costIn  = (p, m) => {\n  const v = p.cout / RATE_MA * m.landed * m.rate;\n  return m.dec ? Math.round(v * 100) / 100 : Math.round(v);\n};\n\nfunction econOf(p, m){\n  m = m || mkt();\n  const E = econFor(m), leads = 100;\n  const prix = priceIn(p, m), cout = costIn(p, m);\n  const confirmed = leads * E.conf / 100;\n  const delivered = confirmed * (1 - E.refus / 100);\n  const returned  = confirmed - delivered;\n  const revenue   = delivered * prix;\n  const cogs      = delivered * cout;\n  const ship      = delivered * E.livr + returned * E.retour;\n  const adspend   = leads * E.cpl;\n  const net       = revenue - cogs - ship - adspend;\n  return {\n    m, prix, cout, leads, confirmed, delivered, returned, revenue, cogs, ship, adspend, net,\n    margeLivr: delivered ? net / delivered : 0,\n    margePct : revenue   ? net / revenue * 100 : 0,\n    cplMax   : (revenue - cogs - ship) / leads,\n    markup   : cout ? prix / cout : 0,\n    netUSD   : net / m.rate,\n    margeUSD : (delivered ? net / delivered : 0) / m.rate\n  };\n}\n\nfunction priceScore(prix, m){\n  const E = econFor(m);\n  if(prix >= E.pmin && prix \u003c= E.pmax) return 100;\n  if(prix \u003c E.pmin) return clamp(prix / E.pmin * 100, 0, 100);\n  return clamp(100 - (prix - E.pmax) / E.pmax * 140, 0, 100);\n}\n\n/* le seuil de bonne marge est ~16 USD par livraison, converti dans la devise du marché */\nfunction scoreOf(p, m){\n  m = m || mkt();\n  const e = econOf(p, m);\n  const parts = {\n    marge: clamp(e.margeUSD / 16.4 * 100, 0, 100),\n    ads  : p.ads  * 10,\n    wow  : p.wow  * 10,\n    pb   : p.pb   * 10,\n    conc : (10 - p.conc) * 10,\n    log  : p.log  * 10,\n    prix : priceScore(e.prix, m),\n    nouv : p.nouv * 10\n  };\n  const wsum = Object.values(state.w).reduce((a,b) => a + b, 0) || 1;\n  const total = Object.keys(parts).reduce((a,k) => a + parts[k] * state.w[k], 0) / wsum;\n  return {...e, parts, score: Math.round(total)};\n}\n\nconst verdictOf = s => s >= 75 ? {k:\"lancer\",    t:\"À lancer\"}\n                     : s >= 60 ? {k:\"tester\",    t:\"À tester\"}\n                     : s >= 45 ? {k:\"surveiller\",t:\"Surveiller\"}\n                     :           {k:\"ecarter\",   t:\"Écarter\"};\n\n/* ============================================================\n   6. Rendu\n   ============================================================ */\nconst $ = id => document.getElementById(id);\n\nfunction ring(score){\n  const r = 15, c = 2 * Math.PI * r;\n  const col = score >= 75 ? \"var(--good)\" : score >= 60 ? \"var(--accent)\"\n            : score >= 45 ? \"var(--warn)\" : \"var(--bad)\";\n  return `\u003csvg class=\"ring\" width=\"36\" height=\"36\" viewBox=\"0 0 36 36\" aria-hidden=\"true\">\n    \u003ccircle class=\"bg\" cx=\"18\" cy=\"18\" r=\"${r}\">\u003c/circle>\n    \u003ccircle cx=\"18\" cy=\"18\" r=\"${r}\" stroke=\"${col}\" stroke-linecap=\"round\"\n      stroke-dasharray=\"${c.toFixed(1)}\" stroke-dashoffset=\"${(c * (1 - score/100)).toFixed(1)}\"\n      transform=\"rotate(-90 18 18)\">\u003c/circle>\u003c/svg>`;\n}\n\nfunction rows(){\n  let list = all().map(p => ({p, m: scoreOf(p)}));\n  const q = state.q.trim().toLowerCase();\n  if(q)             list = list.filter(x => (x.p.nom + \" \" + x.p.cat + \" \" + x.p.note).toLowerCase().includes(q));\n  if(state.cat)     list = list.filter(x => x.p.cat === state.cat);\n  if(state.season)  list = list.filter(x => x.p.saison === state.season);\n  if(state.verdict) list = list.filter(x => verdictOf(x.m.score).k === state.verdict);\n  const key = state.sort;\n  list.sort((a,b) => key === \"nom\"  ? a.p.nom.localeCompare(b.p.nom,\"fr\")\n                   : key === \"prix\" ? b.m.prix - a.m.prix\n                   : key === \"score\"? b.m.score - a.m.score\n                   : b.m[key] - a.m[key]);\n  return list;\n}\n\nfunction renderKpis(list){\n  const n = list.length;\n  const lancer = list.filter(x => verdictOf(x.m.score).k === \"lancer\").length;\n  const tester = list.filter(x => verdictOf(x.m.score).k === \"tester\").length;\n  const best   = list[0];\n  const avgM   = n ? list.reduce((a,x) => a + x.m.margeLivr, 0) / n : 0;\n  const rent   = list.filter(x => x.m.net > 0).length;\n  $(\"kpis\").innerHTML = [\n    [\"Candidats affichés\", n, \"sur \" + all().length + \" au catalogue\"],\n    [\"À lancer\", lancer, \"score 75 et plus\"],\n    [\"À tester\", tester, \"score 60 à 74\"],\n    [\"Rentables aux hypothèses\", rent, rent ? Math.round(rent/n*100) + \"% du lot\" : \"revois tes coûts\"],\n    [\"Marge moyenne / livraison\", fmt(avgM), \"après pub et retours\"],\n    [\"Meilleur score\", best ? best.m.score : \"—\", best ? best.p.nom : \"\"]\n  ].map(([k,v,s]) => `\u003cdiv class=\"kpi\">\u003cdiv class=\"k\">${k}\u003c/div>\u003cdiv class=\"v\">${v}\u003c/div>\u003cdiv class=\"s\">${esc(String(s))}\u003c/div>\u003c/div>`).join(\"\");\n}\n\nfunction renderMarket(){\n  const m = mkt();\n  $(\"brandCur\").textContent = m.nom + \" · \" + m.cur;\n  $(\"mktcard\").innerHTML = `\n    \u003cdiv>\n      \u003cdiv class=\"zone\">${esc(m.zone)}\u003c/div>\n      \u003ch3>${esc(m.nom)}\u003c/h3>\n      \u003cp>${esc(m.note)}\u003c/p>\n      ${m.warn ? `\u003cp class=\"mktwarn\">\u003cb>À savoir :\u003c/b> ${esc(m.warn)}\u003c/p>` : \"\"}\n      ${m.id !== \"MA\" ? `\u003cp class=\"mktwarn\">\u003cb>Signal publicitaire :\u003c/b> les notes de demande du catalogue ont été relevées sur le marché marocain.\n        Sur ${esc(m.nom)}, revérifie chaque produit dans la Meta Ad Library du pays — le lien est dans le détail de chaque ligne.\u003c/p>` : \"\"}\n    \u003c/div>\n    \u003cdiv class=\"mktfacts\">\n      \u003cdiv>\u003cdiv class=\"k\">Part du COD\u003c/div>\u003cdiv class=\"v\">${esc(m.cod)}\u003c/div>\u003c/div>\n      \u003cdiv>\u003cdiv class=\"k\">Refus typique\u003c/div>\u003cdiv class=\"v\">${esc(m.refusTxt)}\u003c/div>\u003c/div>\n      \u003cdiv>\u003cdiv class=\"k\">Devise\u003c/div>\u003cdiv class=\"v\">${m.cur}\u003c/div>\u003c/div>\n      \u003cdiv>\u003cdiv class=\"k\">Taux / USD\u003c/div>\u003cdiv class=\"v\">${m.rate.toLocaleString(\"fr-FR\")}\u003c/div>\u003c/div>\n      \u003cdiv>\u003cdiv class=\"k\">Zone d'impulsion\u003c/div>\u003cdiv class=\"v\">${fmt(econFor(m).pmin, m)} – ${fmt(econFor(m).pmax, m)}\u003c/div>\u003c/div>\n    \u003c/div>`;\n}\n\nconst esc = s => String(s).replace(/[&\u003c>\"]/g, c => ({\"&\":\"&amp;\",\"\u003c\":\"&lt;\",\">\":\"&gt;\",\"\\\"\":\"&quot;\"}[c]));\n\nfunction detailHtml(p, m){\n  const crit = [\n    [\"Marge nette après refus\", m.parts.marge, state.w.marge],\n    [\"Demande publicitaire\",    m.parts.ads,   state.w.ads],\n    [\"Effet wow / démo\",        m.parts.wow,   state.w.wow],\n    [\"Résout un problème\",      m.parts.pb,    state.w.pb],\n    [\"Concurrence locale\",      m.parts.conc,  state.w.conc],\n    [\"Logistique COD\",          m.parts.log,   state.w.log],\n    [\"Zone d'impulsion\",        m.parts.prix,  state.w.prix],\n    [\"Nouveauté locale\",        m.parts.nouv,  state.w.nouv]\n  ].map(([l,v,w]) => `\u003cdiv class=\"crit-row\">\u003cspan>${l}\u003c/span>\n      \u003cspan class=\"bar\">\u003ci style=\"width:${v.toFixed(0)}%\">\u003c/i>\u003c/span>\n      \u003cspan class=\"n\">${v.toFixed(0)}\u003c/span>\u003c/div>\n      \u003cdiv class=\"crit-row\" style=\"margin-top:-5px\">\u003cspan class=\"hint\">poids ${w}\u003c/span>\u003cspan>\u003c/span>\u003cspan>\u003c/span>\u003c/div>`).join(\"\");\n\n  const line = (l,v,cls) => `\u003cdiv class=\"econ-l ${cls||\"\"}\">\u003cspan>${l}\u003c/span>\u003cb class=\"${cls===\"tot\"?(m.net>0?\"pos\":\"neg\"):\"\"}\">${v}\u003c/b>\u003c/div>`;\n  const econ = [\n    line(\"100 leads bruts\", \"100\"),\n    line(\"Confirmées\", m.confirmed.toFixed(0)),\n    line(\"Livrées et encaissées\", m.delivered.toFixed(0)),\n    line(\"Chiffre d'affaires\", fmt(m.revenue)),\n    line(\"Coût produit\", \"− \" + fmt(m.cogs)),\n    line(\"Livraison + retours\", \"− \" + fmt(m.ship)),\n    line(\"Budget publicitaire\", \"− \" + fmt(m.adspend)),\n    line(\"Résultat net\", fmt(m.net), \"tot\")\n  ].join(\"\");\n\n  const src = linksFor(p, mkt()).map(s =>\n    `\u003ca class=\"src\" href=\"${s.url}\" target=\"_blank\" rel=\"noopener nofollow\">\u003cspan class=\"d\">\u003c/span>${s.n}\u003c/a>`).join(\"\");\n\n  /* le même produit passé au modèle de chaque marché, classé par résultat en USD */\n  const cmp = MARKETS.map(mm => ({mm, e:econOf(p, mm), s:scoreOf(p, mm).score}))\n    .sort((a,b) => b.e.netUSD - a.e.netUSD)\n    .map(({mm,e,s}) => {\n      const v = verdictOf(s);\n      return `\u003ctr class=\"${mm.id === state.market ? \"here\" : \"\"}\">\n        \u003ctd style=\"text-align:left\">${esc(mm.nom)}\u003c/td>\n        \u003ctd style=\"text-align:left\">\u003cspan class=\"hint\">${esc(mm.zone)}\u003c/span>\u003c/td>\n        \u003ctd class=\"n\">${fmt(e.prix, mm)}\u003c/td>\n        \u003ctd class=\"n\">${fmt(e.cout, mm)}\u003c/td>\n        \u003ctd class=\"n ${e.margeLivr > 0 ? \"pos\" : \"neg\"}\">${fmt(e.margeLivr, mm)}\u003c/td>\n        \u003ctd class=\"n ${e.netUSD > 0 ? \"pos\" : \"neg\"}\">${usd(e.netUSD)}\u003c/td>\n        \u003ctd class=\"n\">${s}\u003c/td>\n        \u003ctd>\u003cspan class=\"verdict v-${v.k}\">${v.t}\u003c/span>\u003c/td>\u003c/tr>`;\n    }).join(\"\");\n\n  return `\u003cdiv class=\"detail-in\">\n    \u003cdiv>\u003ch4>Grille de notation\u003c/h4>\u003cdiv class=\"crit\">${crit}\u003c/div>\u003c/div>\n    \u003cdiv>\u003ch4>Test de 100 commandes — ${esc(mkt().nom)}\u003c/h4>${econ}\n      \u003cdiv class=\"note\">\u003cb>Plafond d'enchère :\u003c/b> au-delà de \u003cb>${fmt(m.cplMax)}\u003c/b> de coût par lead, ce produit passe en perte.\n      Markup actuel \u003cb>${m.markup.toFixed(1)}×\u003c/b>${m.markup \u003c 3 ? \" — sous le seuil de 3× recommandé en COD.\" : \".\"}\u003c/div>\u003c/div>\n    \u003cdiv>\u003ch4>Vérifier sur les sources — ${esc(mkt().nom)}\u003c/h4>\u003cdiv class=\"srcgrid\">${src}\u003c/div>\n      \u003cdiv class=\"note\">${esc(p.note)}\u003c/div>\n      ${p.seed ? \"\" : `\u003cdiv class=\"detail-actions\">\u003cbutton class=\"btn sm\" data-del=\"${p.id}\">Supprimer ce produit\u003c/button>\u003c/div>`}\n    \u003c/div>\n    \u003cdiv class=\"cmp\">\u003ch4>Ce produit sur les ${MARKETS.length} marchés — net d'un test de 100 leads, converti en USD\u003c/h4>\n      \u003cdiv class=\"wrapx\">\u003ctable>\u003cthead>\u003ctr>\n        \u003cth style=\"text-align:left\">Marché\u003c/th>\u003cth style=\"text-align:left\">Zone\u003c/th>\n        \u003cth>Prix\u003c/th>\u003cth>Coût rendu\u003c/th>\u003cth>Marge / livr.\u003c/th>\u003cth>Net / 100 leads\u003c/th>\u003cth>Score\u003c/th>\u003cth>Verdict\u003c/th>\n      \u003c/tr>\u003c/thead>\u003ctbody>${cmp}\u003c/tbody>\u003c/table>\u003c/div>\n      \u003cdiv class=\"note\">Chaque ligne applique les hypothèses propres à son marché (confirmation, refus, livraison, retour, CPL).\n      Le prix local est dérivé du prix marocain converti en USD, ajusté au pouvoir d'achat du marché, puis arrondi au prix psychologique de la devise.\u003c/div>\n    \u003c/div>\u003c/div>`;\n}\n\nfunction render(){\n  const list = rows();\n  renderKpis(list);\n  const tb = $(\"tbody\");\n  tb.innerHTML = list.map(({p,m},i) => {\n    const v = verdictOf(m.score);\n    const open = state.open === p.id;\n    return `\u003ctr class=\"row ${open?\"open\":\"\"}\" data-id=\"${p.id}\" tabindex=\"0\">\n      \u003ctd class=\"rank ${i\u003c3?\"top\":\"\"}\">${String(i+1).padStart(2,\"0\")}\u003c/td>\n      \u003ctd>\u003cdiv class=\"pname\">${esc(p.nom)}\u003c/div>\n          \u003cdiv class=\"pmeta\">\u003cspan class=\"tag\">${esc(p.cat)}\u003c/span>\n          ${p.saison !== \"Toute l'année\" ? `\u003cspan class=\"tag season\">${esc(p.saison)}\u003c/span>` : \"\"}\n          ${p.seed ? \"\" : `\u003cspan class=\"tag mine\">ajouté\u003c/span>`}\n          \u003cspan>${p.poids} g\u003c/span>\u003c/div>\u003c/td>\n      \u003ctd>\u003cdiv class=\"scorecell\">${ring(m.score)}\u003cspan class=\"scorenum\">${m.score}\u003c/span>\u003c/div>\u003c/td>\n      \u003ctd>\u003cspan class=\"verdict v-${v.k}\">${v.t}\u003c/span>\u003c/td>\n      \u003ctd class=\"n\">${fmt(m.prix)}\u003c/td>\n      \u003ctd class=\"n\">${fmt(m.cout)}\u003c/td>\n      \u003ctd class=\"n\" style=\"color:${m.markup\u003c3?\"var(--bad)\":\"var(--ink-2)\"}\">${m.markup.toFixed(1)}×\u003c/td>\n      \u003ctd class=\"n ${m.margeLivr>0?\"pos\":\"neg\"}\">${fmt(m.margeLivr)}\u003c/td>\n      \u003ctd class=\"n\">${m.margePct.toFixed(0)}%\u003c/td>\n      \u003ctd class=\"n\">${fmt(m.cplMax)}\u003c/td>\n      \u003ctd class=\"n ${m.net>0?\"pos\":\"neg\"}\">${fmt(m.net)}\u003c/td>\n    \u003c/tr>` + (open ? `\u003ctr class=\"detail\">\u003ctd colspan=\"11\">${detailHtml(p,m)}\u003c/td>\u003c/tr>` : \"\");\n  }).join(\"\");\n  $(\"empty\").hidden = list.length > 0;\n  renderMarket();\n}\n\n/* ============================================================\n   7. Contrôles\n   ============================================================ */\nfunction buildRail(){\n  const m = mkt(), E = econFor(m);\n  const show = f => f.cur ? fmt(E[f.k], m) : E[f.k] + \" \" + f.u;\n  $(\"econBox\").innerHTML = ECON_FIELDS.map(f => {\n    const b = bounds(f, m);\n    return `\u003cdiv class=\"field\">\n    \u003clabel for=\"e_${f.k}\">${f.l}\u003cspan class=\"val\" id=\"v_${f.k}\">${show(f)}\u003c/span>\u003c/label>\n    \u003cinput type=\"range\" id=\"e_${f.k}\" min=\"${b.min}\" max=\"${b.max}\" step=\"${b.step}\" value=\"${E[f.k]}\">\n  \u003c/div>`; }).join(\"\") + `\u003cp class=\"hint\">Hypothèses propres à \u003cb>${esc(m.nom)}\u003c/b> — chaque marché garde les siennes.\n  Le refus s'applique aux commandes confirmées&nbsp;; la marchandise refusée revient en stock, seuls les frais de retour sont perdus.\u003c/p>`;\n\n  $(\"wBox\").innerHTML = W_FIELDS.map(f => `\u003cdiv class=\"field\">\n    \u003clabel for=\"w_${f.k}\">${f.l}\u003cspan class=\"val\" id=\"wv_${f.k}\">${state.w[f.k]}\u003c/span>\u003c/label>\n    \u003cinput type=\"range\" id=\"w_${f.k}\" min=\"0\" max=\"30\" step=\"1\" value=\"${state.w[f.k]}\">\n  \u003c/div>`).join(\"\") + `\u003cp class=\"hint\">Les poids sont normalisés automatiquement : seul leur rapport compte.\u003c/p>`;\n\n  ECON_FIELDS.forEach(f => $(\"e_\" + f.k).addEventListener(\"input\", e => {\n    const mm = mkt();\n    (state.econBy[mm.id] = state.econBy[mm.id] || {})[f.k] = +e.target.value;\n    $(\"v_\" + f.k).textContent = f.cur ? fmt(+e.target.value, mm) : e.target.value + \" \" + f.u;\n    save(); render();\n  }));\n  W_FIELDS.forEach(f => $(\"w_\" + f.k).addEventListener(\"input\", e => {\n    state.w[f.k] = +e.target.value;\n    $(\"wv_\" + f.k).textContent = state.w[f.k];\n    save(); render();\n  }));\n}\n\nfunction buildMarketSelect(){\n  const zones = [...new Set(MARKETS.map(m => m.zone))];\n  $(\"market\").innerHTML = zones.map(z =>\n    `\u003coptgroup label=\"${esc(z)}\">` + MARKETS.filter(m => m.zone === z)\n      .map(m => `\u003coption value=\"${m.id}\"${m.id === state.market ? \" selected\" : \"\"}>${esc(m.nom)} · ${m.cur}\u003c/option>`).join(\"\")\n    + `\u003c/optgroup>`).join(\"\");\n}\n\nfunction buildFilters(){\n  const cats = [...new Set(all().map(p => p.cat))].sort((a,b)=>a.localeCompare(b,\"fr\"));\n  const seas = [...new Set(all().map(p => p.saison))];\n  $(\"fCat\").innerHTML    = `\u003coption value=\"\">Toutes catégories\u003c/option>` + cats.map(c => `\u003coption${c===state.cat?\" selected\":\"\"}>${esc(c)}\u003c/option>`).join(\"\");\n  $(\"fSeason\").innerHTML = `\u003coption value=\"\">Toutes saisons\u003c/option>` + seas.map(c => `\u003coption${c===state.season?\" selected\":\"\"}>${esc(c)}\u003c/option>`).join(\"\");\n  $(\"chips\").innerHTML = [[\"\",\"Tous\"],[\"lancer\",\"À lancer\"],[\"tester\",\"À tester\"],[\"surveiller\",\"Surveiller\"],[\"ecarter\",\"Écarter\"]]\n    .map(([k,t]) => `\u003cbutton class=\"chip\" data-v=\"${k}\" aria-pressed=\"${state.verdict===k}\">${t}\u003c/button>`).join(\"\");\n}\n\ndocument.addEventListener(\"click\", e => {\n  const chip = e.target.closest(\".chip\");\n  if(chip){ state.verdict = chip.dataset.v; buildFilters(); render(); return; }\n  const del = e.target.closest(\"[data-del]\");\n  if(del){ state.custom = state.custom.filter(p => p.id !== del.dataset.del); state.open = null; save(); buildFilters(); render(); toast(\"Produit supprimé\"); return; }\n  const row = e.target.closest(\"tr.row\");\n  if(row){ state.open = state.open === row.dataset.id ? null : row.dataset.id; render(); }\n});\ndocument.addEventListener(\"keydown\", e => {\n  if(e.key === \"Escape\" && !$(\"modal\").hidden) closeModal();\n  if((e.key === \"Enter\" || e.key === \" \") && e.target.classList && e.target.classList.contains(\"row\")){\n    e.preventDefault(); state.open = state.open === e.target.dataset.id ? null : e.target.dataset.id; render();\n  }\n});\n$(\"q\").addEventListener(\"input\", e => { state.q = e.target.value; render(); });\n$(\"fCat\").addEventListener(\"change\", e => { state.cat = e.target.value; render(); });\n$(\"fSeason\").addEventListener(\"change\", e => { state.season = e.target.value; render(); });\n$(\"sort\").addEventListener(\"change\", e => { state.sort = e.target.value; render(); });\n$(\"market\").addEventListener(\"change\", e => {\n  state.market = e.target.value; state.open = null; save(); buildRail(); render();\n});\n$(\"resetEcon\").addEventListener(\"click\", () => { delete state.econBy[state.market]; save(); buildRail(); render(); });\n$(\"resetW\").addEventListener(\"click\",    () => { state.w = {...W_DEF};              save(); buildRail(); render(); });\n\nlet toastT;\nfunction toast(msg){ const t = $(\"toast\"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2200); }\n\n/* ============================================================\n   8. Modales : ajout, import, export\n   ============================================================ */\nfunction openModal(html){ $(\"sheet\").innerHTML = html; $(\"modal\").hidden = false; }\nfunction closeModal(){ $(\"modal\").hidden = true; }\n$(\"modal\").addEventListener(\"click\", e => { if(e.target.id === \"modal\") closeModal(); });\n\nfunction csv(){\n  const m = mkt(), c = m.cur;\n  const cols = [\"Rang\",\"Produit\",\"Catégorie\",\"Saison\",\"Marché\",\"Score\",\"Verdict\",\n    \"Prix vente \" + c, \"Coût rendu \" + c, \"Markup\",\n    \"Marge par livraison \" + c, \"Marge %\", \"CPL max \" + c, \"Net pour 100 leads \" + c, \"Net pour 100 leads USD\",\n    \"Poids g\",\"Effet wow /10\",\"Problème /10\",\"Demande pub /10\",\"Concurrence /10\",\"Logistique /10\",\"Nouveauté /10\",\"Note\"]\n    .concat(linksFor(all()[0], m).map(s => \"Lien \" + s.n));\n  const q = v => `\"${String(v).replace(/\"/g,'\"\"')}\"`;\n  const r2 = v => m.dec ? (Math.round(v * 100) / 100) : Math.round(v);\n  const lines = [cols.map(q).join(\";\")];\n  rows().forEach(({p, m:e}, i) => {\n    lines.push([i+1, p.nom, p.cat, p.saison, m.nom, e.score, verdictOf(e.score).t,\n      r2(e.prix), r2(e.cout), e.markup.toFixed(2), r2(e.margeLivr), e.margePct.toFixed(1),\n      r2(e.cplMax), r2(e.net), Math.round(e.netUSD), p.poids,\n      p.wow, p.pb, p.ads, p.conc, p.log, p.nouv, p.note]\n      .concat(linksFor(p, m).map(s => s.url)).map(q).join(\";\"));\n  });\n  return lines.join(\"\\n\");\n}\n\n$(\"btnExport\").addEventListener(\"click\", () => {\n  const data = csv();\n  openModal(`\u003cdiv class=\"sheet-h\">\u003ch3>Exporter vers Excel\u003c/h3>\u003cbutton class=\"btn sm\" id=\"mClose\">Fermer\u003c/button>\u003c/div>\n  \u003cdiv class=\"sheet-b\">\n    \u003cp class=\"hint\">Le téléchargement direct est bloqué dans cette page publiée. Copie le bloc ci-dessous, colle-le dans une feuille Excel vierge,\n    puis \u003cb>Données → Convertir → Séparateur point-virgule\u003c/b>. Les colonnes de liens sources deviennent cliquables dans Excel.\u003cbr>\n    ${rows().length} lignes pour \u003cb>${esc(mkt().nom)}\u003c/b>, en ${mkt().cur}, filtres et tri actuels appliqués.\n    Change de marché en haut de page pour exporter une autre zone.\u003c/p>\n    \u003ctextarea id=\"csvOut\" readonly>${esc(data)}\u003c/textarea>\n  \u003c/div>\n  \u003cdiv class=\"sheet-f\">\u003cbutton class=\"btn\" id=\"mClose2\">Fermer\u003c/button>\u003cbutton class=\"btn primary\" id=\"mCopy\">Copier le tableau\u003c/button>\u003c/div>`);\n  $(\"mClose\").onclick = $(\"mClose2\").onclick = closeModal;\n  $(\"mCopy\").onclick = async () => {\n    const ta = $(\"csvOut\"); ta.select();\n    try{ await navigator.clipboard.writeText(data); }catch(e){ document.execCommand(\"copy\"); }\n    toast(\"Tableau copié — colle-le dans Excel\");\n  };\n});\n\n$(\"btnImport\").addEventListener(\"click\", () => {\n  openModal(`\u003cdiv class=\"sheet-h\">\u003ch3>Importer des produits\u003c/h3>\u003cbutton class=\"btn sm\" id=\"mClose\">Fermer\u003c/button>\u003c/div>\n  \u003cdiv class=\"sheet-b\">\n    \u003cp class=\"hint\">Une ligne par produit, séparateur point-virgule, sans en-tête&nbsp;:\u003cbr>\n    \u003cb>nom;catégorie;saison;prix;coût;poids g;wow;problème;demande pub;concurrence;logistique;nouveauté;requête FR;requête EN;note\u003c/b>\u003cbr>\n    Prix et coût en \u003cb>${mkt().cur}\u003c/b> (devise du marché affiché), convertis automatiquement pour les autres marchés.\n    Les six notes vont de 0 à 10. La concurrence se note à l'envers&nbsp;: 10 = marché saturé.\u003c/p>\n    \u003ctextarea id=\"csvIn\" placeholder=\"Masseur oculaire chauffant;Santé & Bien-être;Toute l'année;399;120;500;8;8;7;4;8;7;masseur yeux chauffant;heated eye massager;Repéré sur trois pages concurrentes\">\u003c/textarea>\n  \u003c/div>\n  \u003cdiv class=\"sheet-f\">\u003cbutton class=\"btn\" id=\"mClose2\">Fermer\u003c/button>\u003cbutton class=\"btn primary\" id=\"mDo\">Importer\u003c/button>\u003c/div>`);\n  $(\"mClose\").onclick = $(\"mClose2\").onclick = closeModal;\n  $(\"mDo\").onclick = () => {\n    let n = 0;\n    $(\"csvIn\").value.split(/\\r?\\n/).forEach(line => {\n      const c = line.split(\";\").map(s => s.trim());\n      if(c.length \u003c 12 || !c[0]) return;\n      const mm = mkt();\n      state.custom.push({id:\"u\" + Date.now() + \"_\" + (n++), nom:c[0], cat:c[1] || \"Divers\", saison:c[2] || \"Toute l'année\",\n        prix:toBase(+c[3] || 0, mm, \"priceMult\"), cout:toBase(+c[4] || 0, mm, \"landed\"), poids:+c[5] || 0,\n        wow:+c[6]||0, pb:+c[7]||0, ads:+c[8]||0, conc:+c[9]||0, log:+c[10]||0, nouv:+c[11]||0,\n        qFr:c[12] || c[0], qEn:c[13] || c[0], note:c[14] || \"Produit importé.\", seed:false});\n    });\n    save(); buildFilters(); render(); closeModal();\n    toast(n ? n + \" produit(s) importé(s)\" : \"Aucune ligne valide trouvée\");\n  };\n});\n\n$(\"btnAdd\").addEventListener(\"click\", () => {\n  const sl = (k,l) => `\u003cdiv class=\"field\">\u003clabel for=\"a_${k}\">${l}\u003cspan class=\"val\" id=\"av_${k}\">5\u003c/span>\u003c/label>\n    \u003cinput type=\"range\" id=\"a_${k}\" min=\"0\" max=\"10\" step=\"1\" value=\"5\">\u003c/div>`;\n  openModal(`\u003cdiv class=\"sheet-h\">\u003ch3>Ajouter un produit\u003c/h3>\u003cbutton class=\"btn sm\" id=\"mClose\">Fermer\u003c/button>\u003c/div>\n  \u003cdiv class=\"sheet-b\">\n    \u003cdiv class=\"field\">\u003clabel for=\"a_nom\">Nom du produit\u003c/label>\u003cinput type=\"text\" id=\"a_nom\" placeholder=\"Masseur oculaire chauffant\">\u003c/div>\n    \u003cdiv class=\"grid2\">\n      \u003cdiv class=\"field\">\u003clabel for=\"a_cat\">Catégorie\u003c/label>\u003cinput type=\"text\" id=\"a_cat\" value=\"Divers\">\u003c/div>\n      \u003cdiv class=\"field\">\u003clabel for=\"a_sai\">Saison\u003c/label>\n        \u003cselect id=\"a_sai\">\u003coption>Toute l'année\u003c/option>\u003coption>Hiver\u003c/option>\u003coption>Été\u003c/option>\u003coption>Rentrée\u003c/option>\u003c/select>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"grid2\">\n      \u003cdiv class=\"field\">\u003clabel for=\"a_prix\">Prix de vente (${mkt().cur})\u003c/label>\u003cinput type=\"number\" id=\"a_prix\" value=\"${Math.round(299 / RATE_MA * mkt().priceMult * mkt().rate)}\">\u003c/div>\n      \u003cdiv class=\"field\">\u003clabel for=\"a_cout\">Coût rendu (${mkt().cur})\u003c/label>\u003cinput type=\"number\" id=\"a_cout\" value=\"${Math.round(80 / RATE_MA * mkt().landed * mkt().rate)}\">\u003c/div>\n    \u003c/div>\n    \u003cp class=\"hint\">Saisis les montants dans la devise du marché affiché (${esc(mkt().nom)}). Ils sont convertis en base commune,\n    donc le produit apparaît correctement chiffré sur les ${MARKETS.length} marchés.\u003c/p>\n    \u003cdiv class=\"grid2\">\n      \u003cdiv class=\"field\">\u003clabel for=\"a_poids\">Poids (g)\u003c/label>\u003cinput type=\"number\" id=\"a_poids\" value=\"400\">\u003c/div>\n      \u003cdiv class=\"field\">\u003clabel for=\"a_qfr\">Requête FR (liens locaux)\u003c/label>\u003cinput type=\"text\" id=\"a_qfr\" placeholder=\"masseur yeux chauffant\">\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"field\">\u003clabel for=\"a_qen\">Requête EN (liens internationaux)\u003c/label>\u003cinput type=\"text\" id=\"a_qen\" placeholder=\"heated eye massager\">\u003c/div>\n    \u003cdiv class=\"sub\">Notation sur 10\u003c/div>\n    ${sl(\"wow\",\"Effet wow / démo vidéo\")}${sl(\"pb\",\"Résout un vrai problème\")}${sl(\"ads\",\"Preuve de demande publicitaire\")}\n    ${sl(\"conc\",\"Concurrence locale (10 = saturé)\")}${sl(\"log\",\"Léger, compact, incassable\")}${sl(\"nouv\",\"Introuvable en magasin\")}\n    \u003cdiv class=\"field\">\u003clabel for=\"a_note\">Note personnelle\u003c/label>\u003cinput type=\"text\" id=\"a_note\" placeholder=\"Où tu l'as repéré, quel angle tester…\">\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"sheet-f\">\u003cbutton class=\"btn\" id=\"mClose2\">Annuler\u003c/button>\u003cbutton class=\"btn primary\" id=\"mSave\">Ajouter au radar\u003c/button>\u003c/div>`);\n  [\"wow\",\"pb\",\"ads\",\"conc\",\"log\",\"nouv\"].forEach(k =>\n    $(\"a_\" + k).addEventListener(\"input\", e => $(\"av_\" + k).textContent = e.target.value));\n  $(\"mClose\").onclick = $(\"mClose2\").onclick = closeModal;\n  $(\"mSave\").onclick = () => {\n    const nom = $(\"a_nom\").value.trim();\n    if(!nom){ toast(\"Donne un nom au produit\"); return; }\n    const g = k => +$(\"a_\" + k).value, mm = mkt();\n    state.custom.push({id:\"u\" + Date.now(), nom, cat:$(\"a_cat\").value.trim() || \"Divers\", saison:$(\"a_sai\").value,\n      prix:toBase(g(\"prix\"), mm, \"priceMult\"), cout:toBase(g(\"cout\"), mm, \"landed\"), poids:g(\"poids\"),\n      wow:g(\"wow\"), pb:g(\"pb\"), ads:g(\"ads\"), conc:g(\"conc\"), log:g(\"log\"), nouv:g(\"nouv\"),\n      qFr:$(\"a_qfr\").value.trim() || nom, qEn:$(\"a_qen\").value.trim() || nom,\n      note:$(\"a_note\").value.trim() || \"Produit ajouté manuellement.\", seed:false});\n    save(); buildFilters(); render(); closeModal(); toast(\"Produit ajouté\");\n  };\n});\n\nbuildMarketSelect(); buildRail(); buildFilters(); render();\n\u003c/script>\n\n\u003c/body>\u003c/html>"},{"id":"comptoir","nom":"Comptoir COD","emoji":"🧭","quoi":"41 sources d'approvisionnement, du marché de Derb Omar à l'usine de Yiwu.","pont":true,"html":"\u003c!doctype html>\u003chtml>\u003chead>\u003cmeta charset=utf8>\u003cmeta name=viewport content=\"width=device-width,initial-scale=1\">\u003cstyle>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found]){display:none!important}\u003c/style>\u003c/head>\u003cbody>\n\u003cmeta charset=\"utf-8\">\n\u003ctitle>Comptoir COD\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n\u003clink rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap\">\n\u003cstyle id=\"app-css\">\n:root{\n  --paper:#F0F1EC; --surface:#FFFFFF; --surface-2:#F7F8F4; --ink:#141B18; --ink-2:#3A453F;\n  --muted:#5C6760; --line:#D5D9D0; --line-2:#E6E9E2;\n  --accent:#0E5A48; --accent-soft:#DCEBE4; --accent-ink:#0B4437;\n  --brass:#8C6A14; --brass-soft:#F2E9CE;\n  --good:#1C7A52; --warn:#96700A; --bad:#9E3226;\n  --shadow:0 1px 2px rgba(20,27,24,.06), 0 8px 24px -18px rgba(20,27,24,.5);\n  --r:3px;\n  --fs-xs:.71rem; --fs-sm:.82rem; --fs-base:.94rem; --fs-md:1.06rem; --fs-lg:1.35rem; --fs-xl:1.95rem;\n  color-scheme:light;\n}\n@media (prefers-color-scheme:dark){\n  :root:not([data-theme=\"light\"]){\n    --paper:#0E1513; --surface:#141D1A; --surface-2:#18231F; --ink:#E7ECE7; --ink-2:#C2CCC5;\n    --muted:#8B9791; --line:#26332E; --line-2:#1E2A26;\n    --accent:#43C2A0; --accent-soft:#12302A; --accent-ink:#8FE3CB;\n    --brass:#D3A73F; --brass-soft:#2C2413;\n    --good:#4FBF8A; --warn:#D6A93C; --bad:#E0776A;\n    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -20px rgba(0,0,0,.9);\n    color-scheme:dark;\n  }\n}\n:root[data-theme=\"dark\"]{\n  --paper:#0E1513; --surface:#141D1A; --surface-2:#18231F; --ink:#E7ECE7; --ink-2:#C2CCC5;\n  --muted:#8B9791; --line:#26332E; --line-2:#1E2A26;\n  --accent:#43C2A0; --accent-soft:#12302A; --accent-ink:#8FE3CB;\n  --brass:#D3A73F; --brass-soft:#2C2413;\n  --good:#4FBF8A; --warn:#D6A93C; --bad:#E0776A;\n  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -20px rgba(0,0,0,.9);\n  color-scheme:dark;\n}\n*{box-sizing:border-box}\n[hidden]{display:none!important}\nbody{margin:0;background:var(--paper);color:var(--ink);font-family:\"Public Sans\",-apple-system,BlinkMacSystemFont,\"Segoe UI\",sans-serif;font-size:var(--fs-base);line-height:1.55;-webkit-font-smoothing:antialiased}\nh1,h2,h3,h4{font-family:\"Bricolage Grotesque\",\"Public Sans\",sans-serif;margin:0;text-wrap:balance;letter-spacing:-.01em}\na{color:var(--accent-ink);text-decoration-thickness:1px;text-underline-offset:2px}\nbutton,input,select,textarea{font:inherit;color:inherit}\n:focus-visible{outline:2px solid var(--accent);outline-offset:2px}\n.mono{font-family:\"IBM Plex Mono\",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}\n.lbl{font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}\n\n/* ---- chrome ---- */\n.top{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--line)}\n.top-in{max-width:1180px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}\n.brand{display:flex;align-items:baseline;gap:9px;margin-right:auto}\n.brand b{font-family:\"Bricolage Grotesque\",sans-serif;font-size:1.12rem;font-weight:800;letter-spacing:-.02em}\n.brand span{font-size:var(--fs-xs);color:var(--muted);letter-spacing:.08em;text-transform:uppercase}\n.tabs{display:flex;gap:2px;flex-wrap:wrap}\n.tab{background:none;border:1px solid transparent;padding:6px 11px;border-radius:var(--r);cursor:pointer;font-size:var(--fs-sm);font-weight:500;color:var(--muted)}\n.tab:hover{color:var(--ink);background:var(--surface-2)}\n.tab[aria-selected=\"true\"]{background:var(--accent);border-color:var(--accent);color:#fff}\n:root[data-theme=\"dark\"] .tab[aria-selected=\"true\"],:root:not([data-theme=\"light\"]) .tab[aria-selected=\"true\"]{color:#0B1512}\n.icon-btn{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);width:32px;height:32px;cursor:pointer;color:var(--muted);display:grid;place-items:center}\n.icon-btn:hover{color:var(--ink);border-color:var(--muted)}\n.wrap{max-width:1180px;margin:0 auto;padding:22px 18px 90px}\n\n/* ---- console de recherche ---- */\n.console{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}\n.console-head{padding:14px 18px 0;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}\n.console-head h1{font-size:var(--fs-lg);font-weight:700}\n.console-head p{margin:0;color:var(--muted);font-size:var(--fs-sm)}\n.console-body{padding:14px 18px 18px;background:\n  repeating-linear-gradient(to bottom,transparent 0 31px,var(--line-2) 31px 32px);\n  background-position:0 8px}\n.row-q{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap}\n.q-field{flex:1 1 320px;display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--ink);border-radius:var(--r);padding:0 12px}\n.q-field input{flex:1;border:0;background:none;padding:13px 0;font-size:var(--fs-md);min-width:0}\n.q-field input:focus{outline:none}\n.q-field svg{flex:none;color:var(--muted)}\n.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:9px 14px;cursor:pointer;font-size:var(--fs-sm);font-weight:600;white-space:nowrap}\n.btn:hover{border-color:var(--muted)}\n.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}\n:root[data-theme=\"dark\"] .btn.primary,:root:not([data-theme=\"light\"]) .btn.primary{color:#0B1512}\n.btn.primary:hover{filter:brightness(1.08)}\n.btn.ghost{background:none}\n.btn.sm{padding:5px 9px;font-size:var(--fs-xs);font-weight:600}\n.btn:disabled{opacity:.5;cursor:not-allowed}\n.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}\n.seg button{background:none;border:0;border-right:1px solid var(--line);padding:9px 13px;cursor:pointer;font-size:var(--fs-sm);font-weight:500;color:var(--muted)}\n.seg button:last-child{border-right:0}\n.seg button[aria-pressed=\"true\"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}\n.row-opts{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;margin-top:14px}\n.field{display:flex;flex-direction:column;gap:4px}\n.field select,.field input{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px 10px;font-size:var(--fs-sm)}\n.hint{font-size:var(--fs-xs);color:var(--muted)}\n.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}\n.chip{border:1px solid var(--line);background:var(--surface);border-radius:100px;padding:4px 11px;font-size:var(--fs-xs);cursor:pointer;color:var(--muted);font-weight:500}\n.chip:hover{border-color:var(--muted);color:var(--ink)}\n.chip[aria-pressed=\"true\"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}\n\n/* ---- layout resultats ---- */\n.split{display:grid;grid-template-columns:232px 1fr;gap:22px;margin-top:22px;align-items:start}\n@media (max-width:860px){.split{grid-template-columns:1fr}}\n.rail{position:sticky;top:70px;display:flex;flex-direction:column;gap:18px}\n@media (max-width:860px){.rail{position:static}}\n.rail h3{font-size:var(--fs-sm);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700;padding-bottom:6px;border-bottom:1px solid var(--line)}\n.check{display:flex;align-items:center;gap:8px;font-size:var(--fs-sm);padding:3px 0;cursor:pointer;color:var(--ink-2)}\n.check input{accent-color:var(--accent);width:15px;height:15px}\n.result-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px}\n.result-head strong{font-family:\"Bricolage Grotesque\",sans-serif;font-size:var(--fs-md)}\n.list{display:flex;flex-direction:column;gap:9px}\n.sep{display:flex;align-items:center;gap:10px;margin:16px 0 3px}\n.sep:first-child{margin-top:0}\n.sep span{font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700;white-space:nowrap}\n.sep b{color:var(--accent-ink);font-weight:700}\n.sep::after{content:\"\";flex:1;height:1px;background:var(--line)}\n\n/* ---- carte source ---- */\n.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:grid;grid-template-columns:46px 1fr;overflow:hidden}\n.card:hover{border-color:var(--muted)}\n.card.best{border-color:var(--brass);box-shadow:inset 3px 0 0 var(--brass)}\n.rank{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:12px 0;border-right:1px solid var(--line-2);background:var(--surface-2)}\n.rank b{font-family:\"Bricolage Grotesque\",sans-serif;font-size:1.15rem;font-weight:700;line-height:1;color:var(--muted)}\n.card.best .rank b{color:var(--brass)}\n.card-body{padding:12px 14px 13px;min-width:0}\n.card-top{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}\n.card-top h4{font-size:var(--fs-md);font-weight:700}\n.tag{font-size:var(--fs-xs);border:1px solid var(--line);border-radius:2px;padding:1px 6px;color:var(--muted);font-weight:600;letter-spacing:.03em;text-transform:uppercase}\n.tag.ma{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft)}\n.tag.intl{border-color:var(--brass);color:var(--brass);background:var(--brass-soft)}\n.card-desc{color:var(--ink-2);font-size:var(--fs-sm);margin:6px 0 0}\n.metrics{display:flex;gap:18px;flex-wrap:wrap;margin-top:11px;padding-top:10px;border-top:1px dotted var(--line)}\n.metric{min-width:78px}\n.metric .lbl{display:block;margin-bottom:2px}\n.metric .val{font-size:var(--fs-sm);font-weight:600;font-family:\"IBM Plex Mono\",monospace;font-variant-numeric:tabular-nums}\n.gauge{display:flex;gap:2px;margin-top:3px}\n.gauge i{width:11px;height:7px;background:var(--line);border-radius:1px;display:block}\n.gauge i.on{background:var(--accent)}\n.gauge.price i.on{background:var(--brass)}\n.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}\n.est{font-family:\"IBM Plex Mono\",monospace;font-weight:600;color:var(--brass)}\n.empty{border:1px dashed var(--line);border-radius:var(--r);padding:34px 20px;text-align:center;color:var(--muted)}\n\n/* ---- panneaux / tableaux ---- */\n.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:18px}\n.panel > h2{font-size:var(--fs-md);font-weight:700;padding-bottom:9px;margin-bottom:14px;border-bottom:1px solid var(--ink);position:relative}\n.panel > h2::after{content:\"\";position:absolute;left:0;right:0;bottom:-4px;height:1px;background:var(--line)}\n.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}\ntable{border-collapse:collapse;width:100%;font-size:var(--fs-sm);min-width:620px}\nth{text-align:left;font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;padding:0 10px 7px;border-bottom:1px solid var(--line);white-space:nowrap}\ntd{padding:9px 10px;border-bo nction(v,max,cls){ var o=\"\"; for(var k=1;k\u003c=max;k++) o+='\u003ci class=\"'+(k\u003c=v?\"on\":\"\")+'\">\u003c/i>'; return '\u003cspan class=\"gauge '+(cls||\"\")+'\">'+o+'\u003c/span>'; };\n  var prixNiv = s.idx==null?0:Math.max(1,Math.min(5,Math.round(s.idx/0.7)));\n  return '\u003carticle class=\"card'+(best?\" best\":\"\")+'\">'\n   + '\u003cdiv class=\"rank\">\u003cb>'+(i+1)+'\u003c/b>'+(best?'\u003cspan class=\"lbl\" style=\"writing-mode:vertical-rl;margin-top:6px;color:var(--brass);font-size:.6rem\">MOINS CHER\u003c/span>':\"\")+'\u003c/div>'\n   + '\u003cdiv class=\"card-body\">'\n   + '\u003cdiv class=\"card-top\">\u003ch4>'+esc(s.n)+'\u003c/h4>'\n   +   '\u003cspan class=\"tag '+(s.m===\"ma\"?\"ma\":\"intl\")+'\">'+(s.m===\"ma\"?\"Maroc\":esc(s.pays))+'\u003c/span>'\n   +   '\u003cspan class=\"tag\">'+esc(typeName(s.t))+'\u003c/span>'\n   +   '\u003cspan class=\"hint\" style=\"margin-left:auto\">'+esc(s.ville)+'\u003c/span>\u003c/div>'\n   + '\u003cp class=\"card-desc\">'+esc(s.d)+'\u003c/p>'\n   + '\u003cdiv class=\"metrics\">'\n   +   '\u003cdiv class=\"metric\">\u003cspan class=\"lbl\">Niveau de prix\u003c/span>'+g(prixNiv,5,\"price\")\n   +     '\u003cdiv class=\"val\">'+(s.idx==null?\"—\":\"×\"+s.idx.toFixed(2))+(est?' \u003cspan class=\"est\">≈ '+fmt(est,0)+' MAD\u003c/span>':\"\")+'\u003c/div>\u003c/div>'\n   +   '\u003cdiv class=\"metric\">\u003cspan class=\"lbl\">Qualité type\u003c/span>'+g(s.qual,4)+'\u003cdiv class=\"val\">'+[\"\",\"à contrôler\",\"correcte\",\"bonne\",\"export\"][s.qual]+'\u003c/div>\u003c/div>'\n   +   '\u003cdiv class=\"metric\">\u003cspan class=\"lbl\">Délai\u003c/span>\u003cdiv class=\"val\">'+esc(s.delai)+'\u003c/div>\u003c/div>'\n   +   '\u003cdiv class=\"metric\">\u003cspan class=\"lbl\">Quantité mini\u003c/span>\u003cdiv class=\"val\">'+esc(s.moq)+'\u003c/div>\u003c/div>'\n   +   '\u003cdiv class=\"metric\">\u003cspan class=\"lbl\">Avis\u003c/span>\u003cdiv class=\"val\" style=\"font-weight:500;font-family:inherit 003c/th>\u003cth>Coût rendu MAD\u003c/th>\u003cth>Mini\u003c/th>\u003cth>Qualité\u003c/th>\u003cth>Fiabilité\u003c/th>\u003cth>Statut\u003c/th>\u003cth>\u003c/th>'\n    + '\u003c/tr>\u003c/thead>\u003ctbody>';\n  l.forEach(function(f){\n    var isBest = best[norm(f.produit||\"\")]===f;\n    var wa = f.tel ? (\"https://wa.me/\"+String(f.tel).replace(/[^0-9]/g,\"\")) : null;\n    h += '\u003ctr class=\"'+(isBest?\"best\":\"\")+'\">'\n      + '\u003ctd>\u003cstrong>'+esc(f.nom||\"—\")+'\u003c/strong>'+(isBest?' \u003cspan class=\"pill warn\">moins cher\u003c/span>':\"\")\n      +   '\u003cdiv class=\"hint\">'+esc(f.produit||\"\")+(f.ville?\" · \"+esc(f.ville):\"\")+(f.pays&&f.pays!==\"Maroc\"?\" · \"+esc(f.pays):\"\")+'\u003c/div>\u003c/td>'\n      + '\u003ctd>'+(f.tel?('\u003ca href=\"tel:'+esc(f.tel)+'\">'+esc(f.tel)+'\u003c/a>'):\"—\")\n      +   (wa?(' · \u003ca href=\"'+esc(wa)+'\" target=\"_blank\" rel=\"noopener\">WhatsApp\u003c/a>'):\"\")\n      +   (f.site?('\u003cdiv class=\"hint\">\u003ca href=\"'+esc(/^https?:/.test(f.site)?f.site:\"https://\"+f.site)+'\" target=\"_blank\" rel=\"noopener\">site\u003c/a>\u003c/div>'):\"\")\n      +   (f.adresse?('\u003cdiv class=\"hint\">\u003ca href=\"https://www.google.com/maps/search/'+encodeURIComponent(f.adresse)+'\" target=\"_blank\" rel=\"noopener\">'+esc(f.adresse)+'\u003c/a>\u003c/div>'):\"\")\n      + '\u003c/td>'\n      + '\u003ctd class=\"num\">'+fmt(num(f.prix),2)+' '+esc(f.devise||\"MAD\")+'\u003c/td>'\n      + '\u003ctd class=\"num\">\u003cstrong>'+fmt(coutRendu(f),2)+'\u003c/strong>\u003c/td>'\n      + '\u003ctd class=\"num\">'+esc(f.moq||\"—\")+'\u003c/td>'\n      + '\u003ctd>\u003cspan class=\"stars\">'+\"★\".repeat(clamp5(f.qualite))+\"☆\".repeat(5-clamp5(f.qualite))+'\u003c/span>\u003c/td>'\n      + '\u003ctd>\u003cspan class=\"stars\">'+\"★\".repeat(clamp5(f.fiabilite))+\"☆\".repeat(5-clamp5(f.fiabilite))+'\u003c/span>\u003c/td>'\n      + '\u003ctd>\u003cspan class=\"pill '+(f.statut===\"Validé\"?\"on\":(f.statut===\"Écarté\"?\"bad\":\"\"))+'\">'+esc(f.statut||\"À contacter\")+'\u003c/span>\u003c/td>'\n      + '\u003ctd style=\"white-space:nowrap\">\u003cbutton class=\"btn sm ghost\" data-act=\"edit\" data-v=\"'+f.id+'\">Modifier\u003c/button>\u003c/td>'\n      + '\u003c/tr>';\n    if(f.notes||f.avisUrl){\n      h += '\u003ctr>\u003ctd colspan=\"9\" style=\"padding-top:0\">\u003cdiv class=\"hint\">'+esc(f.notes||\"\")\n        + (f.avisUrl?(' · \u003ca href=\"'+esc(f.avisUrl)+'\" target=\"_blank\" rel=\"noopener\">avis / références\u003c/a>'):\"\")+'\u003c/div>\u003c/td>\u003c/tr>';\n    }\n  });\n  h += '\u003c/tbody>\u003c/table>\u003c/div>\u003c/section>';\n\n  var m=null, ref=null;\n  l.forEach(function(f){ var r=margeCOD(f); if(r && (!m || r.parRecue>m.parRecue)){ m=r; ref=f; } });\n  if(m){\n    h += '\u003csection class=\"panel\">\u003ch2>Meilleure combinaison actuelle\u003c/h2>\u003cdiv class=\"grid2\">'\n      + '\u003cdiv class=\"stat\">\u003cspan class=\"lbl\">Fournisseur\u003c/span>\u003cdiv class=\"v\" style=\"font-size:var(--fs-md)\">'+esc(ref.nom)+'\u003c/div>\u003c/div>'\n      + '\u003cdiv class=\"stat\">\u003cspan class=\"lbl\">Coût rendu\u003c/span>\u003cdiv class=\"v\">'+fmt(m.c,2)+' MAD\u003c/div>\u003c/div>'\n      + '\u003cdiv class=\"stat\">\u003cspan class=\"lbl\">Marge sur colis livré\u003c/span>\u003cdiv class=\"v '+(m.margeLivree>0?\"good\":\"bad\")+'\">'+fmt(m.margeLivree,0)+' MAD\u003c/div>\u003c/div>'\n      + '\u003cdiv class=\"stat\">\u003cspan class=\"lbl\">Reste par commande reçue\u003c/span>\u003cdiv class=\"v '+(m.parRecue>0?\"good\":\"bad\")+'\">'+fmt(m.parRecue,0)+' MAD\u003c/div>'\n      + '\u003cdiv class=\"hint\">C\\'est votre budget publicité maximum par commande.\u003c/div>\u003c/div>'\n      + '\u003c/div>\u003c/section>';\n  }\n  return h;\n}\n\n/* ---------- onglet coût rendu ---------- */\nfunction vueMarge(){\n  var c=state.calc||{prix:\"3.20\",devise:\"USD\",qte:\"100\",fret:\"1800\",douane:\"25\",divers:\"300\",pv:\"249\"};\n  state.calc=c;\n  var fx=state.reglages.fx[c.devise]||1;\n  var achat=num(c.prix)*fx*num(c.qte);\n  var douane=achat*(num(c.douane)/100);\n  var total=achat+douane+num(c.fret)+num(c.divers);\n  var unit=num(c.qte)?total/num(c.qte):0;\n  var L=num(state.reglages.tauxLiv)/100, liv=num(state.reglages.fraisLiv), ret=num(state.reglages.coutRetour);\n  var margeLivree=num(c.pv)-unit-liv;\n  var parRecue=L*margeLivree-(1-L)*ret;\n  var plancher=unit*num(state.reglages.marge)+liv;\n\n  function f(lbl,key,unit2,step){\n    return '\u003clabel>'+lbl+'\u003cinput type=\"number\" step=\"'+(step||\"1\")+'\" data-act=\"calc\" data-k=\"'+key+'\" value=\"'+esc(c[key])+'\">'\n      +(unit2?('\u003cspan class=\"hint\" style=\"text-transform:none;letter-spacing:0\">'+unit2+'\u003c/span>'):\"\")+'\u003c/label>';\n  }\n  return '\u003csection class=\"panel\">\u003ch2>Coût rendu &amp; prix plancher\u003c/h2>'\n   + '\u003cp class=\"hint\" style=\"margin:-8px 0 14px\">Un prix fournisseur ne veut rien dire tant que le fret, la douane et le taux de refus ne sont pas dedans. Ce calcul rend deux devis comparables, l\\'un de Derb Omar et l\\'autre de Chine.\u003c/p>'\n   + '\u003cdiv class=\"form-grid\">'\n   + '\u003clabel>Prix unitaire\u003cinput type=\"number\" step=\"0.01\" data-act=\"calc\" data-k=\"prix\" value=\"'+esc(c.prix)+'\">\u003c/label>'\n   + '\u003clabel>Devise\u003cselect data-act=\"calc\" data-k=\"devise\">'+[\"USD\",\"CNY\",\"EUR\",\"MAD\",\"AED\",\"TRY\"].map(function(d){return '\u003coption'+(c.devise===d?\" selected\":\"\")+'>'+d+'\u003c/option>';}).join(\"\")+'\u003c/select>\u003c/label>'\n   + f(\"Quantité\",\"qte\")\n   + f(\"Fret total (MAD)\",\"fret\")\n   + f(\"Droits de douane (%)\",\"douane\")\n   + f(\"Frais divers (MAD)\",\"divers\")\n   + f(\"Prix de vente COD (MAD)\",\"pv\")\n   + '\u003c/div>'\n   + '\u003cdiv class=\"grid2\" style=\"margin-top:18px\">'\n   +   '\u003cdiv class=\"stat\">\u003cspan class=\"lbl\">Marchandise\u003c/span>\u003cdiv class=\"v\">'+fmt(achat,0)+' MAD\u003c/div>\u003c/div>'\n   +   '\u003cdiv class=\"stat\">\u003cspan class=\"lbl\">Douane estimée\u003c/span>\u003cdiv class=\"v\">'+fmt(douane,0)+' MAD\u003c/div>\u003c/div>'\n   +   '\u003cdiv class=\"stat\">\u003cspan class=\"lbl\">Total posé au Maroc\u003c/span>\u003cdiv class=\"v\">'+fmt(total,0)+' MAD\u003c/div>\u003c/div>'\n   +   '\u003cdiv class=\"stat\">\u003cspan class=\"lbl\">Coût rendu unitaire\u003c/span>\u003cdiv class=\"v\" style=\"color:var(--brass)\">'+fmt(unit,2)+' MAD\u003c/div>\u003c/div>'\n   + '\u003c/div>'\n   + '\u003cdiv class=\"grid2\" style=\"margin-top:14px\">'\n   +   '\u003cdiv class=\"stat\">\u003cspan class=\"lbl\">Marge sur colis livré\u003c/span>\u003cdiv class=\"v '+(margeLivree>0?\"good\":\"bad\")+'\">'+fmt(margeLivree,0)+' MAD\u003c/div>'\n   +     '\u003cdiv class=\"hint\">prix de vente − coût rendu − '+fmt(liv,0)+' MAD de livraison\u003c/div>\u003c/div>'\n   +   '\u003cdiv class=\"stat\">\u003cspan class=\"lbl\">Reste par commande reçue\u003c/span>\u003cdiv class=\"v '+(parRecue>0?\"good\":\"bad\")+'\">'+fmt(parRecue,0)+' MAD\u003c/div>'\n   +     '\u003cdiv class=\"hint\">à '+fmt(L*100,0)+' % de livraison, refus compté à '+fmt(ret,0)+' MAD. C\\'est le plafond de votre coût publicitaire par commande.\u003c/div>\u003c/div>'\n   +   '\u003cdiv class=\"stat\">\u003cspan class=\"lbl\">Prix de vente plancher\u003c/span>\u003cdiv class=\"v\">'+fmt(plancher,0)+' MAD\u003c/div>'\n   +     '\u003cdiv class=\"hint\">coût rendu × '+state.reglages.marge+' + livraison\u003c/div>\u003c/div>'\n   +   '\u003cdiv class=\"stat\">\u003cspan class=\"lbl\">Trésorerie à sortir\u003c/span>\u003cdiv class=\"v\">'+fmt(total,0)+' MAD\u003c/div>'\n   +     '\u003cdiv class=\"hint\">immobilisée jusqu\\'à écoulement des '+fmt(num(c.qte),0)+' pièces\u003c/div>\u003c/div>'\n   + '\u003c/div>'\n   + '\u003cdiv class=\"note warn\" style=\"margin-top:16px\">Les droits de douane dépendent du code SH du produit et peuvent aller de 2,5 % à plus de 30 %, hors TVA à l\\'import. Faites confirmer le taux par votre transitaire avant d\\'engager une commande : c\\'est l\\'erreur qui coûte le plus cher sur une première importation.\u003c/div>'\n   + '\u003c/section>';\n}\n\n/* ---------- onglet méthode ---------- */\nfunction vueMethode(){\n  var etapes=[\n   [\"Cadrer le prix avant de chercher\",\"Partez du prix de vente COD visé (149-499 MAD) et divisez : le coût rendu doit tenir sous le tiers du prix de vente pour absorber la livraison, les refus et la publicité. Vous saurez alors si vous cherchez un produit à 15 MAD ou à 90 MAD.\"],\n   [\"Chercher au bon étage de la filière\",\"Le même article coûte 1 à l'usine chinoise, 1,5 à Cobo Calleja, 1,8 à Derb Omar, 2,4 chez un dropshipper local. Chaque étage achète du temps et de la souplesse. Pour un test : l'étage cher. Pour scaler : descendez.\"],\n   [\"Trois devis minimum\",\"Ne jamais s'arrêter au premier prix. Trois fournisseurs sur le même article, mêmes quantités, même délai : c'est le seul moyen de savoir si on vous a fait un prix ou un cadeau empoisonné.\"],\n   [\"Échantillon payé de sa poche\",\"Un fournisseur qui refuse de vendre un échantillon n'est pas un fournisseur. Commandez-le à votre adresse, ouvrez-le comme le ferait votre client, et testez-le une semaine.\"],\n   [\"Vérifier l'existence légale\",\"Au Maroc : demandez l'ICE et le numéro de registre du commerce, et exigez une facture. En Chine : nom légal de la société, licence d'exploitation, et paiement uniquement via la plateforme.\"],\n   [\"Négocier autre chose que le prix\",\"Le prix bouge peu. Le délai, le fractionnement des livraisons, l'emballage à votre marque, la reprise des invendus et le paiement à la livraison bougent beaucoup.\"],\n   [\"Commander petit, puis doubler\",\"Première commande : la quantité minimum, même si le prix est moins bon. La deuxième commande révèle le vrai fournisseur — celui qui livre pareil la deuxième fois.\"],\n   [\"Toujours garder un second fournisseur\",\"Un seul fournisseur sur un produit qui marche, c'est une boutique à l'arrêt le jour où il tombe en rupture. Gardez le deuxième au chaud, même 10 % plus cher.\"]\n  ];\n  var drapeaux=[\n   \"Un prix très en dessous du marché sur un produit de marque : c'est de la contrefaçon, saisissable en douane.\",\n   \"Demande de virement sur un compte personnel, ou paiement hors plateforme contre une remise.\",\n   \"Refus de donner une adresse physique ou de faire une vidéo en direct du stock.\",\n   \"Photos identiques à celles d'AliExpress, sans une seule photo réelle.\",\n   \"Pression sur le temps : « il ne reste que 3 cartons, décidez aujourd'hui ».\",\n   \"Fournisseur dropshipping qui facture un abonnement avant la première commande.\",\n   \"Compte Instagram ou Facebook créé il y a moins de six mois, sans historique de clients.\"\n  ];\n  var controles=[\n   [\"Alimentaire, cosmétique, complément\",\"Agrément ONSSA obligatoire pour la commercialisation, étiquetage en arabe et en français, numéro de lot et date de péremption lisibles.\"],\n   [\"Électrique et électronique\",\"Marquage CE, chargeur au bon voltage (220V, prise européenne), et test réel : c'est la première cause de refus et de retour.\"],\n   [\"Jouets et articles pour bébé\",\"Normes de sécurité, absence de petites pièces détachables, matière non toxique. Un incident sur ce segment vous coûte la boutique.\"],\n   [\"Textile\",\"Mesurer les tailles réelles, laver un échantillon avant de commander : le rétrécissement et le dégorgement sont les motifs de retour numéro un.\"]\n  ];\n  var h='\u003csection class=\"panel\">\u003ch2>La méthode, dans l\\'ordre\u003c/h2>'\n   + etapes.map(function(e,i){\n      return '\u003cdetails class=\"acc\"'+(i===0?\" open\":\"\")+'>\u003csummary>\u003cspan>\u003cspan class=\"mono\" style=\"color:var(--muted);margin-right:9px\">'+(i+1\u003c10?\"0\":\"\")+(i+1)+'\u003c/span>'+esc(e[0])+'\u003c/span>\u003c/summary>\u003cdiv class=\"acc-in\">'+esc(e[1])+'\u003c/div>\u003c/details>';\n     }).join(\"\")\n   + '\u003c/section>';\n  h += '\u003csection class=\"panel\">\u003ch2>Signaux d\\'alerte\u003c/h2>\u003cul class=\"ticks warn\">'\n    + drapeaux.map(function(d){ return '\u003cli>'+esc(d)+'\u003c/li>'; }).join(\"\") + '\u003c/ul>\u003c/section>';\n  h += '\u003csection class=\"panel\">\u003ch2>Contrôles obligatoires par famille de produit\u003c/h2>\u003cdiv class=\"grid2\">'\n    + controles.map(function(c){ return '\u003cdiv class=\"stat\">\u003cspan class=\"lbl\">'+esc(c[0])+'\u003c/span>\u003cp style=\"margin:6px 0 0;font-size:var(--fs-sm)\">'+esc(c[1])+'\u003c/p>\u003c/div>'; }).join(\"\")\n    + '\u003c/div>\u003c/section>';\n  h += '\u003csection class=\"panel\">\u003ch2>Où sont les avis, vraiment\u003c/h2>'\n    + '\u003cul class=\"ticks\">'\n    + '\u003cli>\u003cstrong>Marché physique\u003c/strong> — les avis Google Maps portent sur le marché, pas sur la boutique. La vraie réputation se demande aux vendeurs voisins et dans les groupes Facebook e-commerce.\u003c/li>'\n    + '\u003cli>\u003cstrong>Alibaba / Made-in-China\u003c/strong> — note du fournisseur, ancienneté, taux de réponse et historique de transactions. Une usine sérieuse a plusieurs années et des avis détaillés, pas cinq étoiles et trois avis.\u003c/li>'\n    + '\u003cli>\u003cstrong>AliExpress\u003c/strong> — les avis clients avec photos sont la meilleure source gratuite pour connaître les défauts d\\'un produit avant de l\\'acheter en gros.\u003c/li>'\n    + '\u003cli>\u003cstrong>Avito et réseaux sociaux\u003c/strong> — aucun système d\\'avis. Ancienneté du compte, cohérence des annonces et rencontre physique remplacent la note.\u003c/li>'\n    + '\u003cli>\u003cstrong>Votre propre note\u003c/strong> — la seule qui compte à terme : notez chaque fournisseur dans le carnet après chaque commande, sur la qualité et sur la fiabilité.\u003c/li>'\n    + '\u003c/ul>\u003c/section>';\n  return h;\n}\n\n/* ---------- onglet réglages ---------- */\nfunction vue es\" placeholder=\"Qui vous l\\'a recommandé, ce qu\\'il a promis, ce qu\\'il a livré.\">'+esc(f.notes||\"\")+'\u003c/textarea>\u003c/label>'\n   + '\u003c/div>\u003c/div>'\n   + '\u003cdiv class=\"modal-foot\">'\n   + (f.id?'\u003cbutton class=\"btn ghost\" data-act=\"del\" style=\"margin-right:auto;color:var(--bad)\">Supprimer\u003c/button>':\"\")\n   + '\u003cbutton class=\"btn\" data-act=\"close\">Annuler\u003c/button>\u003cbutton class=\"btn primary\" data-act=\"savef\">Enregistrer\u003c/button>\u003c/div>'\n   + '\u003c/div>\u003c/div>';\n}\n\nfunction modalDevis(){\n  var p=state.q||\"[produit]\";\n  var fr=\"Bonjour, je suis e-commerçant au Maroc et je cherche un fournisseur régulier pour : \"+p+\".\\n\\n\"\n   +\"Pouvez-vous me confirmer :\\n1. Le prix unitaire pour 50, 200 et 500 pièces\\n2. La quantité minimum de commande\\n\"\n   +\"3. Le délai de livraison à Casablanca\\n4. Si vous fournissez une facture avec ICE\\n5. Le prix d'un échantillon, que je paie\\n\\n\"\n   +\"Merci de m'envoyer une photo ou une vidéo réelle du stock disponible. Cordialement.\";\n  var en=\"Hello, I run an e-commerce store in Morocco and I am sourcing a regular supplier for: \"+p+\".\\n\\n\"\n   +\"Could you please confirm:\\n1. Unit price for 100 / 500 / 1000 pcs\\n2. MOQ\\n3. Sample cost and lead time\\n\"\n   +\"4. Production lead time and shipping options to Casablanca, Morocco\\n5. Certifications available (CE, RoHS, test report)\\n\\n\"\n   +\"Please send real photos or a short video of the product. Thank you.\";\n  var ar=\"السلام عليكم، عندي متجر إلكتروني في المغرب وكنقلب على مورد دائم لـ: \"+p+\".\\n\\n\"\n   +\"بغيت نعرف:\\n1. الثمن بالوحدة ل 50 و 200 و 500 قطعة\\n2. أقل كمية للطلب\\n3. مدة التوصيل للدار البيضاء\\n\"\n   +\"4. واش كتعطيو فاتورة ب ICE\\n5. ثمن العينة\\n\\nعافاك صيفط تصويرة ولا فيديو حقيقي للسلعة. شكرا.\";\n  function bloc(t,txt,id){\n    return '\u003ch4 class=\"lbl\" style=\"margin:14px 0 6px\">'+t+'\u003c/h4>'\n     + '\u003ctextarea id=\"'+id+'\" s ypes.push(v); render(); break;\n    case \"sansimport\": state.sansImport=!state.sansImport; render(); break;\n    case \"grosonly\": state.grosOnly=!state.grosOnly; render(); break;\n    case \"detail\": ui.modal=modalDetail(v); render(); break;\n    case \"devis\": ui.modal=modalDevis(); render(); break;\n    case \"copy\":\n      var ta=document.getElementById(v);\n      if(ta){\n        ta.select();\n        if(navigator.clipboard && navigator.clipboard.writeText){\n          navigator.clipboard.writeText(ta.value).then(function(){ toast(\"Texte copié\"); },\n            function(){ toast(\"Sélectionnez le texte puis copiez-le\"); });\n        } else {\n          try{ document.execCommand(\"copy\"); toast(\"Texte copié\"); }\n          catch(e){ toast(\"Sélectionnez le texte puis copiez-le\"); }\n        }\n      }\n      break;\n    case \"ajouter\":\n      var s=null; SRC.forEach(function(x){ if(x.id===v) s=x; });\n      ui.edit={produit:state.q, nom:\"\", type:(s&&s.t===\"usine\"?\"Fabricant\":(s&&s.t===\"hub\"?\"Grossiste\":\"Marketplace\")),\n        ville:s?s.ville:\"\", pays:s?s.pays:\"Maroc\", devise:s&&s.m===\"intl\"?\"USD\":\"MAD\",\n        douane:s&&s.m===\"intl\"?25:0, statut:\"À contacter\", notes:s?(\"Repéré via \"+s.n):\"\", avisUrl:s?s.av.u:\"\",\n        qualite:0, fiabilite:0};\n      ui.modal=modalEdit(ui.edit); render(); break;\n    case \"new\": ui.edit={produit:state.q,devise:\"MAD\",pays:\"Maroc\",statut:\"À contacter\",qualite:0,fiabilite:0,douane:0}; ui.modal=modalEdit(ui.edit); render(); break;\n    case \"edit\":\n      state.carnet.forEach(function(f){ if(f.id===v) ui.edit=JSON.parse(JSON.stringify(f)); });\n      ui.modal=modalEdit(ui.edit); render(); break;\n    case \"savef\":\n      if(!ui.edit) break;\n      if(!ui.edit.nom){ toast(\"Donnez au moins un nom au fournisseur\"); break; }\n      ui.edit.maj=new Date().toISOString();\n      if(ui.edit.id){ state.carnet=state.carnet.map(function(f){ return f.id===ui.edit.id?ui.edit:f; }); }\n      else { ui.edit.id=uid(); state.carnet.push(ui.edit); }\n      ui.modal=null; ui.edit=null; state.tab=\"carnet\"; persist(); render(); toast(\"Fournisseur enregistré\"); break;\n    case \"del\":\n      if(ui.edit&&ui.edit.id){ state.carnet=state.carnet.filter(function(f){ return f.id!==ui.edit.id; }); }\n      ui.modal=null; ui.edit=null; persist(); render(); toast(\"Supprimé\"); break;\n    case \"reset\":\n      if(state.carnet.length && window.confirm(\"Vider le carnet ? \"+state.carnet.length+\" fournisseur(s) seront supprimés.\")){\n        state.carnet=[]; persist(); render(); toast(\"Carnet vidé\"); }\n      break;\n    case \"csv\": exportCSV(); break;\n    case \"import\": var fi=document.getElementById(\"imp\"); if(fi) fi.click(); break;\n    case \"json\": exportJSON(); break;\n    case \"traduire\": traduire(); break;\n    case \"save\": sauver(); break;\n  }\n});\n\ndocument.addEventListener(\"input\", function(ev){\n  if(ev.target.id===\"q\"){\n    state.q=ev.target.value;\n    clearTimeout(window.__t); window.__t=setTimeout(rerenderResults,220);\n    return;\n  }\n  var el=ev.target.closest(\"[data-act]\"); if(!el) return;\n  var act=el.getAttribute(\"data-act\"), k=el.getAttribute(\"data-k\");\n  if(act===\"refprix\"){ state.ref.prix=el.value; rerenderResults(); return; }\n  if(act===\"f\" && ui.edit){ ui.edit[k]=el.value; return; }\n  if(act===\"calc\"){ state.calc[k]=el.value; render(); return; }\n  if(act===\"fx\"){ state.reglages.fx[k]=num(el.value); persist(); return; }\n  if(act===\"reg\"){ state.reglages[k]=num(el.value); persist(); return; }\n});\n\ndocument.addEventListener(\"change\", function(ev){\n  if(ev.target.id===\"imp\"){ importer(ev.target.files && ev.target.files[0]); ev.target.value=\"\"; return; }\n  var el=ev.target.closest(\"[data-act]\"); if(!el) return;\n  var act=el.getAttribute(\"data-act\"), k=el.getAttribute(\"data-k\");\n  if(act===\"cat\"){ state.cat=el.value; render(); }\n  else if(act===\"tri\"){ state.tri=el.value; render(); }\n  else if(act===\"refdev\"){ state.ref.devise=el.value; render(); }\n  else if(act===\"f\" && ui.edit){ ui.edit[k]=el.value; }\n  else if(act===\"calc\"){ state.calc[k]=el.value; render(); }\n});\n\n/* rerendu partiel pour ne pas perdre le focus du champ de recherche */\nfunction rerenderResults(){\n  if(state.tab!==\"recherche\") return;\n  var res=resultats();\n  var sel=document.querySelector('select[data-act=\"cat\"]');\n  if(sel && state.cat===\"detect\" && sel.options.length){\n    sel.options[0].textContent = \"Détection automatique\" + (res.cat ? (\" — \"+catName(res.cat)) : \"\");\n  }\n  var head=document.querySelector(\".result-head\");\n  var list=document.querySelector(\".list\")||document.querySelector(\".empty\");\n  if(head) head.innerHTML=enTeteResultats(res);\n  if(list){\n    if(!res.liste.length){ list.outerHTML='\u003cdiv class=\"empty\">Aucune source avec ces filtres. Élargissez la catégorie ou décochez un type.\u003c/div>'; }\n    else { list.outerHTML=listeHTML(res); }\n  }\n}\n\n/* ---------- traduction du mot-clé (capacité sample) ---------- */\nfunction traduire(){\n  var q=state.q.trim();\n  if(!q){ toast(\"Tapez d'abord un produit\"); return; }\n  if(state.trad[norm(q)]){ toast(\"Mot-clé déjà traduit\"); render(); return; }\n  toast(\"Traduction en cours…\");\n  useCap(\"sample\").then(function(sample){\n    if(!sample){ toast(ui.local===true ? \"Traduction disponible seulement dans la version en ligne\" : \"Traduction indisponible dans cette vue\"); return; }\n    return sample.json([{role:\"user\",content:\n      'Tu aides un e-commerçant marocain à chercher un fournisseur pour le produit : \"'+q+'\".\\n'\n      +'Réponds UNIQUEMENT par un objet JSON, sans texte autour, avec exactement ces clés :\\n'\n      +'{\"fr\":\"terme de recherche en français\",\"ar\":\"terme en arabe\",\"en\":\"terme de recherche commercial en anglais tel qu\\'utilisé sur Alibaba\",'\n      +'\"zh\":\"terme en chinois simplifié tel qu\\'utilisé sur 1688\",\"es\":\"terme en espagnol\",\"tr\":\"terme en turc\",'\n      +'\"conseil\":\"une phrase de 15 mots maximum sur le point de vigilance qualité de ce produit\"}\\n'\n      +\"N'invente aucun nom d'entreprise, aucun prix, aucun numéro de téléphone.\"}],\n      {modelTier:\"quick\"});\n  }).then(function(r){\n    if(!r) return;\n    state.trad[norm(q)]=r; persist(); render(); toast(\"Mot-clé traduit en 6 langues\");\n  }).catch(function(e){\n    toast(e && e.code===\"not_granted\" ? \"Traduction non autorisée ici\" : \"Traduction impossible pour le moment\");\n  });\n}\n\n/* ---------- exports ---------- */\nfunction csvCarnet(){\n  var cols=[\"produit\",\"nom\",\"type\",\"ville\",\"pays\",\"tel\",\"email\",\"site\",\"adresse\",\"prix\",\"devise\",\"fret\",\"douane\",\"moq\",\"delai\",\"pv\",\"qualite\",\"fiabilite\",\"statut\",\"avisUrl\",\"notes\"];\n  var head=[\"Produit\",\"Fournisseur\",\"Type\",\"Ville\",\"Pays\",\"Telephone\",\"Email\",\"Site\",\"Adresse\",\"Prix\",\"Devise\",\"Fret/piece\",\"Douane %\",\"Qte mini\",\"Delai\",\"Prix vente\",\"Qualite\",\"Fiabilite\",\"Statut\",\"Avis\",\"Notes\",\"Cout rendu MAD\"];\n  var lines=[head.join(\";\")];\n  carnetTrie().forEach(function(f){\n    var row=cols.map(function(c){ return '\"'+String(f[c]==null?\"\":f[c]).replace(/\"/g,'\"\"')+'\"'; });\n    row.push('\"'+coutRendu(f).toFixed(2)+'\"');\n    lines.push(row.join(\";\"));\n  });\n  return \"\\uFEFF\"+lines.join(\"\\r\\n\");\n}\nfunction telecharger(nom,data,mime){\n  useCap(\"downloads\").then(function(d){\n    if(d) return d.save({filename:nom,data:data}).then(function(){ toast(\"Fichier proposé au téléchargement\"); });\n    var b=new Blob([data],{type:mime||\"text/plain;charset=utf-8\"});\n    var a=document.createElement(\"a\"); a.href=URL.createObjectURL(b); a.download=nom;\n    document.body.appendChild(a); a.click(); a.remove(); toast(\"Fichier généré\");\n  }).catch(function(){ toast(\"Téléchargement refusé\"); });\n}\nfunction exportCSV(){\n  if(!state.carnet.length){ toast(\"Le carnet est vide\"); return; }\n  telecharger(\"carnet-fournisseurs.csv\", csvCarnet(), \"text/csv;charset=utf-8\");\n}\nfunction exportJSON(){ telecharger(\"comptoir-cod-sauvegarde.json\", JSON.stringify(state,null,2), \"application/json\"); }\nfunction importer(file){\n  if(!file) return;\n  var r=new FileReader();\n  r.onload=function(){\n    var d=null;\n    try{ d=JSON.parse(String(r.result)); }catch(e){}\n    if(!d || !d.v){ toast(\"Fichier illisible : attendu un export JSON de cette app\"); return; }\n    var n=(d.carnet||[]).length;\n    if(state.carnet.length && !window.confirm(\"Remplacer le carnet actuel (\"+state.carnet.length+\") par celui du fichier (\"+n+\") ?\")) return;\n    state.carnet = d.carnet || [];\n    if(d.reglages) Object.keys(d.reglages).forEach(function(k){ state.reglages[k]=d.reglages[k]; });\n    if(d.trad) state.trad=d.trad;\n    if(d.calc) state.calc=d.calc;\n    persist(); render();\n    toast(n+\" fournisseur\"+(n>1?\"s\":\"\")+\" import\"+(n>1?\"és\":\"é\"));\n  };\n  r.onerror=function(){ toast(\"Lecture du fichier impossible\"); };\n  r.readAsText(file);\n}\n\n/* ---------- publication ---------- */\nfunction buildDoc(){\n  var css=document.getElementById(\"app-css\").textContent;\n  var code=document.getElementById(\"app-code\").textContent;\n  var json=JSON.stringify(state).replace(/\u003c/g,\"\\\\u003c\");\n  return '\u003c!doctype html>\\n\u003chtml lang=\"fr\">\\n\u003chead>\\n\u003cmeta charset=\"utf-8\">\\n'\n   + '\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\\n'\n   + '\u003ctitle>Comptoir COD\u003c/title>\\n'\n   + '\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\\n'\n   + '\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\\n'\n   + '\u003clink rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Public+Sans:ital,wght@0,400;0,50 00;600&display=swap\">\n\u003cstyle id=\"app-css\">\n*,*::before,*::after{box-sizing:border-box}\n:root{\n  --ground:#e9edeb; --surface:#ffffff; --surface-2:#f2f6f4; --line:#d2dbd7; --line-2:#e2e9e6;\n  --ink:#111c1a; --ink-2:#3f524e; --ink-3:#6c7f7a;\n  --brand:#304f4f; --brand-2:#6b8e80; --brand-3:#a9c5bb;\n  --good:#1c7350; --warn:#8d530d; --bad:#96291f;\n  --good-bg:#e2f0ea; --warn-bg:#f5eadb; --bad-bg:#f6e3e1;\n  --shadow:0 1px 2px rgba(17,28,26,.06),0 8px 24px -16px rgba(17,28,26,.28);\n  --font-ui:'IBM Plex Sans Arabic',system-ui,-apple-system,Segoe UI,sans-serif;\n  --font-dis:'Bricolage Grotesque',Georgia,serif;\n  --font-num:'IBM Plex Mono',ui-monospace,Menlo,monospace;\n  --r:10px;\n}\n:root:not([data-theme=\"light\"]){}\n@media (prefers-color-scheme:dark){\n  :root:not([data-theme=\"light\"]){\n    --ground:#0e1615; --surface:#161f1d; --surface-2:#1c2724; --line:#2b3a36; --line-2:#232f2c;\n    --ink:#e7ede9; --ink-2:#a7b9b3; --ink-3:#7b8f89;\n    --brand:#7fb3a4; --brand-2:#5b8a7c; --brand-3:#33514a;\n    --good:#59bd91; --warn:#d99a45; --bad:#e5827a;\n    --good-bg:#15302a; --warn-bg:#332614; --bad-bg:#341f1d;\n    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -16px rgba(0,0,0,.8);\n  }\n}\n:root[data-theme=\"dark\"]{\n  --ground:#0e1615; --surface:#161f1d; --surface-2:#1c2724; --line:#2b3a36; --line-2:#232f2c;\n  --ink:#e7ede9; --ink-2:#a7b9b3; --ink-3:#7b8f89;\n  --brand:#7fb3a4; --brand-2:#5b8a7c; --brand-3:#33514a;\n  --good:#59bd91; --warn:#d99a45; --bad:#e5827a;\n  --good-bg:#15302a; --warn-bg:#332614; --bad-bg:#341f1d;\n  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -16px rgba(0,0,0,.8);\n}\nhtml,body{margin:0;padding:0}\nbody{background:var(--ground);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}\nh1,h2,h3{margin:0;font-family:var(--font-dis);font-weight:600;letter-spacing:-.01em;text-wrap:balance}\np{margin:0}\na{color:var(--brand)}\nbutton,input,select,textarea{font:inherit;color:i
